<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wuho.com · 우호</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#0d1117;--panel:#131922;--panel2:#18202b;--line:#232d3b;--ink:#d7dee8;--dim:#7d8a9c;--up:#16c784;--down:#ea3943;--accent:#f0b90b;--blue:#4aa3ff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-family:"DM Mono",-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,"Noto Sans KR","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--dim);font-size:13px;margin:0 0 12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 6px}

.app{display:grid;grid-template-rows:34px 42px minmax(0,1fr) 30px;grid-template-columns:44px minmax(0,1fr) var(--asideW,340px) 44px;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
#ctabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;align-self:stretch;align-items:flex-end}
.ctab{display:flex;align-items:center;gap:6px;padding:0 10px;height:28px;border-radius:6px 6px 0 0;color:var(--dim);font-size:12px;cursor:pointer;flex:none}
.ctab:hover{background:var(--panel2);color:var(--ink)}.ctab.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.ctab .x{opacity:.5;padding:0 2px}.ctab .x:hover{opacity:1;color:var(--down)}
#ctabAdd{color:var(--dim);padding:2px 8px;font-size:16px;flex:none}#ctabAdd:hover{color:var(--accent)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
#clock{font-size:12px;color:var(--dim)}
header{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
.symbtn{display:flex;align-items:baseline;gap:8px;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}.symbtn:hover{border-color:var(--accent)}
.symbtn .caret{color:var(--dim);font-size:10px}
header .right{margin-left:auto;display:flex;align-items:center;gap:6px}
#bbar{grid-column:2/3;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;font-size:12px}
#bbar>*{flex:none}#bbar .seg button,#bbar .hb{padding:3px 7px;font-size:12px}
#bbar .right{margin-left:auto;display:flex;align-items:center;gap:9px;padding-left:10px}
#bbar .stat{flex-direction:row;gap:5px;align-items:baseline}
#rail{grid-row:3/5;grid-column:4;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;scrollbar-width:none}
#rail button{width:36px;height:40px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--dim);font-size:9.5px;flex:none}
#rail button:hover{background:var(--panel2);color:var(--ink)}#rail button.on{background:var(--panel2);color:var(--accent)}
#rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#rail .tsep{width:24px;height:1px;background:var(--line);margin:4px 0}
#asideGrip{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}#asideGrip:hover,#asideGrip.on{background:var(--accent);opacity:.5}
#asideHead{padding:8px 12px;font-weight:600;border-bottom:1px solid var(--line);flex:none;display:flex;justify-content:space-between;align-items:center}
.sr-list{max-height:60vh;overflow:auto;margin-top:8px}.sr-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px 90px;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px}.sr-row:hover,.sr-row.on{background:var(--panel2)}
.sr-in{width:100%;padding:9px 10px;font:inherit;font-size:14px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;outline:none}.sr-in:focus{border-color:var(--accent)}
.ix{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;height:62vh}
.ix-cats{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding-right:8px}.ix-cats button{text-align:left;padding:8px 10px;border-radius:6px;color:var(--dim)}
.ix-cats button:hover{background:var(--panel2);color:var(--ink)}.ix-cats button.on{background:var(--panel2);color:var(--accent)}
.ix-main{display:flex;flex-direction:column;min-height:0;gap:8px}.ix-list{flex:1;overflow:auto}
.ix-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;cursor:pointer;font-size:13px}.ix-row:hover,.ix-row.on{background:var(--panel2)}
.ix-row b{font-weight:500;white-space:nowrap}.ix-desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.ix-row .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:1px 7px;white-space:nowrap}.ix-row .tag.on{color:var(--accent);border-color:var(--accent)}
.ix-row .fav{color:var(--line);font-size:14px}.ix-row .fav.on,.ix-row .fav:hover{color:#f0b90b}
.ix-row .dotc{width:10px;height:10px;border-radius:50%;flex:none}.ix-row.cur .dim{flex:1}.ix-act{display:flex;gap:2px}.ix-act button{width:26px;height:24px;border-radius:4px;color:var(--dim)}.ix-act button:hover{background:var(--line);color:var(--ink)}
@media(max-width:700px){.ix{grid-template-columns:1fr;height:auto}.ix-cats{flex-direction:row;flex-wrap:wrap;border:0}}
.cpick{display:inline-flex;align-items:center;gap:6px}.cpick input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
.cpick input[type=color]::-webkit-color-swatch-wrapper{padding:2px}.cpick input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
.cpick input[type=range]{width:64px;accent-color:var(--accent)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;font-size:13px;border-bottom:1px solid var(--line)}
.srow label{display:flex;align-items:center;gap:6px}.sctl{display:flex;align-items:center;gap:6px}.srow select{padding:3px 4px}
.inp.sm{width:70px;padding:3px 6px}
.st-pane{max-height:56vh;overflow:auto;padding-top:6px}.st-pane h6{margin:14px 0 2px;font-size:11px;color:var(--dim);font-weight:500}
.st-tabs{padding:0 0 6px;border-bottom:1px solid var(--line)}
.ctxm{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ctxm button{display:flex;justify-content:space-between;width:100%;padding:7px 10px;border-radius:5px;text-align:left;font-size:13px}.ctxm button:hover{background:var(--panel2)}
.ctxm small{color:var(--dim)}.ctxm hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.cv.no-ohlc .lg-o{display:none}.cv.no-vals .lgr .vals{display:none}.cv.no-cd .cv-cd{display:none}
.wh-head{padding:8px 10px 4px;font-size:12px}.wh-sum .imb-t{flex-wrap:wrap;gap:2px 10px}
header select{width:auto;max-width:84px}header .seg button{padding:5px 6px}.wh-sum .imb{padding:4px 10px 8px}
.frow.wh{grid-template-columns:minmax(0,1.4fr) 1fr 62px;cursor:pointer}.frow.wh .wh-2{grid-column:1/-1;margin-top:-2px}.frow.wh a{text-decoration:none}.frow.wh:hover{background:var(--panel2)}
.wh-feed{flex:1;overflow:auto}.pn[data-p=whale]{display:flex;flex-direction:column;height:100%}.pn[data-p=whale][hidden]{display:none}
header>*{flex:none}
.brand{font-weight:600;color:var(--accent);letter-spacing:.02em;font-size:16px}.brand small{font-size:11px;color:var(--dim);font-weight:400;margin-left:2px}
#errBar{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#ea3943;color:#fff;padding:10px 14px;font-size:13px;display:none;white-space:pre-wrap}
.sym{font-weight:600;font-size:15px}.last{font-size:17px;font-weight:500}.chg{font-size:13px}
.sep{width:1px;height:22px;background:var(--line)}
.seg{display:flex;gap:1px}
.seg button,.hb{padding:5px 8px;border-radius:4px;color:var(--dim);font-size:13px}
.seg button:hover,.hb:hover{background:var(--panel2);color:var(--ink)}
.seg button.on,.hb.on{color:var(--accent);background:var(--panel2)}
.stat{display:flex;flex-direction:column;font-size:11px;color:var(--dim);line-height:1.2}
.stat b{font-weight:500;color:var(--ink);font-size:12px}
.conn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down)}.dot.ok{background:var(--up);box-shadow:0 0 6px var(--up)}

#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;scrollbar-width:none}
#tools button{width:34px;height:32px;flex:none;border-radius:6px;display:grid;place-items:center;color:var(--dim)}
#tools button:hover{background:var(--panel2);color:var(--ink)}
#tools button.on{background:var(--panel2);color:var(--accent)}
#tools svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tsep{width:24px;height:1px;background:var(--line);margin:4px 0;flex:none}

.main{position:relative;min-height:0}
.views{position:absolute;inset:0;display:grid;gap:1px;background:var(--line)}
.views.l1{grid-template:minmax(0,1fr)/minmax(0,1fr)}
.views.l2h{grid-template:minmax(0,1fr)/repeat(2,minmax(0,1fr))}
.views.l2v{grid-template:repeat(2,minmax(0,1fr))/minmax(0,1fr)}
.views.l4{grid-template:repeat(2,minmax(0,1fr))/repeat(2,minmax(0,1fr))}
.cv{position:relative;background:var(--bg);min-height:0;overflow:hidden}
.views.multi .cv.active{box-shadow:inset 0 0 0 1px var(--accent)}
.cv-chart{position:absolute;inset:0}
.draw-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.cv.tool-on .cv-chart{cursor:crosshair}.cv.hover-draw .cv-chart{cursor:move}
.lg{position:absolute;left:8px;top:6px;z-index:4;font-size:12px;line-height:1.55;pointer-events:none;max-width:calc(100% - 90px)}
.lg1{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.lg1 b{font-weight:600}.lg1 i{font-style:normal;color:var(--dim);margin-right:2px}
.lgr{display:flex;gap:8px;align-items:center;pointer-events:auto;width:max-content;max-width:100%;padding:0 4px;margin-left:-4px;border-radius:4px}
.lgr:hover{background:rgba(24,32,43,.85)}
.lgr.off{opacity:.45}.lgr .vals{color:var(--ink)}
.views.l4 .lg-i{display:none}
.lgr .act{display:none;gap:2px}.lgr:hover .act{display:flex}
.lgr .act button{width:20px;height:20px;border-radius:3px;color:var(--dim);font-size:12px}
.lgr .act button:hover{background:var(--line);color:var(--ink)}
.cv-cd{position:absolute;right:72px;bottom:32px;z-index:3;font-size:11px;color:var(--dim);pointer-events:none}
.cv-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);z-index:3;pointer-events:none}
.cv-load[hidden]{display:none}
.sel-bar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:4px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.sel-bar .sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent}
.sel-bar .sw.on{border-color:#fff}
.sel-bar button:not(.sw){padding:2px 6px;border-radius:4px}.sel-bar button:not(.sw):hover{background:var(--line)}
.cv-replay{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:5px 8px;font-size:12px}
.cv-replay[hidden]{display:none}
.cv-replay button{padding:3px 8px;border-radius:4px;background:var(--line)}
.cv-replay .rp-t{color:var(--accent);font-weight:600}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:6px 12px;border-radius:6px;font-size:12px;z-index:8;display:none}
#hint.show{display:block}

aside{grid-row:3/5;grid-column:3;position:relative;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#asideTabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#asideTabs button{flex:1 0 auto;padding:10px 10px;color:var(--dim);font-weight:500;border-bottom:2px solid transparent;font-size:13px}
#asideTabs button.on{color:var(--ink);border-color:var(--accent)}
#asideBody{flex:1;min-height:0;position:relative}
.pn{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.pn[hidden]{display:none}
.sub-tabs{display:flex;gap:2px;padding:6px 8px 0;flex:none;flex-wrap:wrap}
.sub-tabs button{padding:5px 9px;border-radius:4px;color:var(--dim);font-size:12px}
.sub-tabs button.on{background:var(--panel2);color:var(--ink)}
.search{padding:8px;flex:none}
.inp,.search input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font:inherit;font-size:13px}
.lhead,.wrow{display:grid;grid-template-columns:22px minmax(0,1fr) 96px 66px;align-items:center;gap:4px;padding:0 10px}
.lhead{font-size:11px;color:var(--dim);padding-bottom:4px;border-bottom:1px solid var(--line);flex:none}
.lhead [data-s]{cursor:pointer}.lhead div:nth-child(n+3){text-align:right}
.list{overflow-y:auto;flex:1;min-height:0}
.wrow{height:40px;cursor:pointer;border-bottom:1px solid #1a222d}
.wrow:hover{background:var(--panel2)}.wrow.sel{background:#1d2633}
.wrow .nm{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .nm small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.wrow .px,.wrow .pc{text-align:right;font-size:12.5px}
.star{color:#3a4656;font-size:14px;width:22px;height:22px}.star.on{color:var(--accent)}
.flash-up{animation:fu .6s}.flash-down{animation:fd .6s}
@keyframes fu{from{background:rgba(22,199,132,.22)}to{background:transparent}}
@keyframes fd{from{background:rgba(234,57,67,.22)}to{background:transparent}}
.empty{padding:24px;color:var(--dim);text-align:center;font-size:13px}

.dim{color:var(--dim)}.pad{padding:0 10px;margin:8px 0}
.flow-ctl{display:flex;flex-wrap:wrap;gap:6px 10px;padding:8px 10px;font-size:12px;color:var(--dim);flex:none;border-bottom:1px solid var(--line)}
.flow-ctl label{display:flex;align-items:center;gap:4px}
.flow-ctl select,.flow-ctl input[type=number]{padding:2px 4px;font-size:12px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;width:auto}
.flow-ctl input[type=number]{width:56px}
.chk input{accent-color:var(--accent)}
.liq-chart{padding:6px 10px 4px;flex:none;border-bottom:1px solid var(--line)}
.liq-sum{font-size:11px;color:var(--dim);margin-top:2px}
.feed-head,.book-head{display:grid;grid-template-columns:1.3fr 1fr 64px;padding:6px 10px;font-size:11px;color:var(--dim);flex:none}
.feed-head span:nth-child(n+2),.book-head span:nth-child(n+2){text-align:right}
.feed{overflow-y:auto;flex:1;min-height:0;font-size:12px}
.frow{display:grid;grid-template-columns:1.3fr 1fr 64px;padding:3px 10px;gap:6px;align-items:center;border-bottom:1px solid #161d27}
.frow span:nth-child(n+2){text-align:right}
.frow.big{background:rgba(240,185,11,.08)}.frow.liq,.frow.mv{cursor:pointer}.frow.liq:hover,.frow.mv:hover{background:var(--panel2)}
.frow small{font-size:10px}
.book-ctl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12px;color:var(--dim);flex:none}
.book-head{grid-template-columns:1fr 1fr 1fr}
.book{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;font-size:12px}
.asks,.bids{flex:1;display:flex;flex-direction:column}.asks{justify-content:flex-end}
.brow{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;padding:1.5px 10px}
.brow i{position:absolute;right:0;top:0;bottom:0;opacity:.16}
.brow.ask i{background:var(--down)}.brow.bid i{background:var(--up)}
.brow.ask span:first-of-type{color:var(--down)}.brow.bid span:first-of-type{color:var(--up)}
.brow span{position:relative}.brow span:nth-of-type(n+2){text-align:right}
.mid{padding:6px 10px;border-block:1px solid var(--line);font-size:14px}.mid small{font-size:11px}
.imb{padding:8px 10px;flex:none}.imb-bar{height:6px;background:var(--down);border-radius:3px;overflow:hidden}.imb-bar i{display:block;height:100%;background:var(--up)}
.imb-t{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}
:root[data-theme=light]{--bg:#ffffff;--panel:#f4f6f9;--panel2:#e8ecf1;--line:#d6dce4;--ink:#18202c;--dim:#5d6878}
:root[data-theme=light] .wrow{border-color:#e3e7ec}:root[data-theme=light] .wrow.sel{background:#e2e8f0}:root[data-theme=light] .frow{border-color:#e6eaef}
.hchip{font-size:12px;color:var(--dim);padding:4px 8px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.hb.mk{color:var(--ink);border:1px solid var(--line)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--dim);font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--panel2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpis>div,.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpis small{display:block;color:var(--dim);font-size:12px}.kpis b{font-size:20px;font-weight:500}
.mk-tabs{padding:0 0 12px}
.heat-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.heat-ctl .muted{margin:0}
.heat{position:relative;height:min(62vh,560px)}
.tile{position:absolute;border-radius:3px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);line-height:1.2}
.tile:hover{outline:2px solid #fff;z-index:2}.tile b{font-weight:600}.tile span{font-size:11px}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.up{background:rgba(22,199,132,.18);color:var(--up)}.tag.down{background:rgba(234,57,67,.18);color:var(--down)}
.temp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card h4{margin:0 0 8px;font-size:14px}
.gauge{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.gauge b{font-size:34px;font-weight:500}
.bar-row{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.bar-row b{text-align:right;font-weight:500}

<script>
/* 공용 도구: 저장소, 포맷, 거래소 주소, 웹소켓, 소리, 알림창 */

const TF = [['1m','1분'],['3m','3분'],['5m','5분'],['15m','15분'],['30m','30분'],['1h','1시간'],['2h','2시간'],['4h','4시간'],['12h','12시간'],['1d','1일'],['1w','1주']];
const TFMS = {'1m':6e4,'3m':18e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'2h':72e5,'4h':144e5,'12h':432e5,'1d':864e5,'1w':6048e5};

const autoPrec = v => { v = Math.abs(v); return v>=1000?1 : v>=100?2 : v>=1?3 : v>=0.01?5 : 7 };
const fmtN = (v, d) => (v==null || isNaN(v)) ? '-' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPx = v => fmtN(v, autoPrec(v));
const fmtBig = v => { v = Number(v); const a = Math.abs(v);
  return a>=1e9 ? (v/1e9).toFixed(2)+'B' : a>=1e6 ? (v/1e6).toFixed(2)+'M' : a>=1e3 ? (v/1e3).toFixed(1)+'K' : v.toFixed(a<10?2:0) };
const fmtPct = v => (v>=0?'+':'') + Number(v).toFixed(2) + '%';
const pad = n => String(n).padStart(2,'0');
const fmtClock = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` };
const fmtDur = ms => { ms = Math.max(0, ms); const h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4), s = Math.floor(ms%6e4/1e3);
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}` };
async function getJSON(u){ const r = await fetch(u); if(!r.ok) throw new Error(r.status); return r.json() }

/* 자동 재연결 웹소켓. onOpen(ws)에서 구독 메시지를 보낼 수 있어요 */
function openWS(url, onMsg, onState, onOpen){
  let ws, closed = false, retry = 0, ping;
  const go = () => {
    ws = new WebSocket(url);
    ws.onopen = () => { retry = 0; onState && onState(true); onOpen && onOpen(ws) };
    ws.onmessage = e => { try{ onMsg(JSON.parse(e.data)) }catch(x){ console.error(x) } };
    ws.onclose = () => { onState && onState(false); if(!closed) setTimeout(go, Math.min(1e4, 1000 * 2 ** retry++)) };
    ws.onerror = () => ws.close();
  };
  go();
  return { close(){ closed = true; clearInterval(ping); try{ ws.close() }catch(e){} },
           send(m){ try{ ws.readyState === 1 && ws.send(typeof m === 'string' ? m : JSON.stringify(m)) }catch(e){} },
           keepAlive(msg, ms){ ping = setInterval(() => this.send(msg), ms) } };
}

let actx;
function beep(freq = 880, dur = 0.12, vol = 0.15){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; g.gain.value = vol; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur); o.stop(actx.currentTime + dur);
  }catch(e){}
}
function toast(msg, cls = '', ms = 5000){
  let box = $('toasts');
  if(!box){ box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box) }
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg;

  box.prepend(t); setTimeout(() => t.remove(), ms);
  while(box.children.length > 6) box.lastChild.remove();
}
function notify(title, body){
  toast(title + ' · ' + body, 'alert', 10000); beep(990, 0.18); setTimeout(() => beep(1320, 0.18), 200);

}

function modal(title, html, onMount, wide, onClose){

  const onKey = e => { if(e.key === 'Escape') close() };
  bg.addEventListener('mousedown', e => { if(e.target === bg) close() });
  bg.querySelector('.x').onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  onMount && onMount(bg.querySelector('.mb'), close);
  return close;
}
function download(name, href){ const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove() }

Object.assign(LC, { $, esc, store, TF, TFMS, EP, autoPrec, fmtN, fmtPx, fmtBig, fmtPct, pad, fmtClock, fmtDur, getJSON, openWS, beep, toast, notify, modal, download });
})();

<script>
/* 지표 계산과 목록. calc(candles, params, ctx)는 {키: [{time,value,color?}]}를 돌려줘요 */
(() => {
const sma = (vals, p) => { const out = new Array(vals.length).fill(null); let s = 0;
  for(let i=0;i<vals.length;i++){ s += vals[i]; if(i>=p) s -= vals[i-p]; if(i>=p-1) out[i] = s/p } return out };
const ema = (vals, p) => { const out = new Array(vals.length).fill(null); const k = 2/(p+1); let e = null, sum = 0, n = 0;
  for(let i=0;i<vals.length;i++){ const v = vals[i]; if(v==null) continue;
    if(e==null){ sum += v; n++; if(n===p){ e = sum/p; out[i] = e } } else { e = v*k + e*(1-k); out[i] = e } } return out };
/* 앞쪽 빈 값(null)을 건너뛰는 단순 이동평균 */
const smaN = (vals, p) => { const out = new Array(vals.length).fill(null); const w = []; let sum = 0;
  for(let i=0;i<vals.length;i++){ const v = vals[i]; if(v==null) continue; w.push(v); sum += v; if(w.length>p) sum -= w.shift(); if(w.length===p) out[i] = sum/p } return out };
const rma = (vals, p) => { const out = new Array(vals.length).fill(null); let r = null, s = 0, n = 0;
  for(let i=0;i<vals.length;i++){ const v = vals[i]; if(v==null) continue;
    if(r==null){ s += v; n++; if(n===p){ r = s/p; out[i] = r } } else { r = (r*(p-1)+v)/p; out[i] = r } } return out };
const stdev = (vals, p, mean) => vals.map((_, i) => { if(mean[i]==null) return null; let s = 0;
  for(let j=i-p+1;j<=i;j++) s += (vals[j]-mean[i])**2; return Math.sqrt(s/p) });
const src = (c, key) => c.map(b => key==='hl2' ? (b.high+b.low)/2 : key==='hlc3' ? (b.high+b.low+b.close)/3 : b[key]);
const toSeries = (c, vals) => { const out = []; for(let i=0;i<c.length;i++) if(vals[i]!=null && isFinite(vals[i])) out.push({time:c[i].time, value:vals[i]}); return out };
const rsiCalc = (vals, p) => { const g = [null], l = [null];
  for(let i=1;i<vals.length;i++){ const d = vals[i]-vals[i-1]; g.push(Math.max(d,0)); l.push(Math.max(-d,0)) }
  const ag = rma(g.slice(1),p), al = rma(l.slice(1),p);
  return [null, ...ag.map((a,i) => a==null ? null : al[i]===0 ? 100 : 100 - 100/(1 + a/al[i]))] };
const trueRange = c => c.map((b,i) => i===0 ? b.high-b.low : Math.max(b.high-b.low, Math.abs(b.high-c[i-1].close), Math.abs(b.low-c[i-1].close)));

const wma = (vals, p) => vals.map((_, i) => { if(i < p-1) return null; let s = 0, w = 0; for(let j = 0; j < p; j++){ const v = vals[i-j]; if(v == null) return null; s += v*(p-j); w += p-j } return s/w });
const hma = (vals, p) => { const h = Math.max(1, Math.round(p/2)), q = Math.max(1, Math.round(Math.sqrt(p))); const a = wma(vals, h), b = wma(vals, p); return wma(a.map((x,i) => x == null || b[i] == null ? null : 2*x - b[i]), q) };
const maBy = (type, v, p) => type === 'EMA' ? ema(v,p) : type === 'WMA' ? wma(v,p) : type === 'HMA' ? hma(v,p) : type === 'RMA' ? rma(v,p) : sma(v,p);
const hiN = (c, i, n, k='high') => { let m = -Infinity; for(let j = Math.max(0, i-n+1); j <= i; j++) m = Math.max(m, c[j][k]); return m };
const loN = (c, i, n, k='low') => { let m = Infinity; for(let j = Math.max(0, i-n+1); j <= i; j++) m = Math.min(m, c[j][k]); return m };
const UPC = '#16c784', DNC = '#ea3943';
const colorBars = (arr, upFn) => arr.map((d, i, a) => ({...d, color: upFn(d, i, a) ? 'rgba(22,199,132,.6)' : 'rgba(234,57,67,.6)'}));
const DEFS = {
  VOL:{ label:'거래량', overlay:true, params:{}, series:[{key:'v', type:'hist', scale:'vol'}],
    calc:c => ({ v: c.map(b => ({time:b.time, value:b.volume, color: b.close>=b.open ? 'rgba(22,199,132,.45)' : 'rgba(234,57,67,.45)'})) }) },
  MA:{ label:'이동평균선', overlay:true, params:{period:20, type:'SMA', source:'close'}, colors:['#f0b90b'], series:[{key:'m', type:'line'}],
    title:p => `${p.type} ${p.period}`,

  RIBBON:{ label:'이동평균 리본 (EMA 20·50·100·200)', overlay:true, params:{}, colors:['#f0b90b','#ff9f43','#e05bd6','#4aa3ff'],
    series:[{key:'a',type:'line',name:'EMA 20'},{key:'b',type:'line',name:'EMA 50'},{key:'c',type:'line',name:'EMA 100'},{key:'d',type:'line',name:'EMA 200'}], title:()=>'EMA 20 50 100 200',
    calc:c => { const v = src(c,'close'); return { a:toSeries(c,ema(v,20)), b:toSeries(c,ema(v,50)), c:toSeries(c,ema(v,100)), d:toSeries(c,ema(v,200)) } } },
  KC:{ label:'켈트너 채널', overlay:true, params:{period:20, mult:2}, colors:['#2ec4b6','#8aa0b8','#2ec4b6'], series:[{key:'u',type:'line',name:'위'},{key:'m',type:'line',dash:true,name:'중심'},{key:'l',type:'line',name:'아래'}],
    fill:{kind:'between', a:'u', b:'l', color:'rgba(46,196,182,0.07)'}, title:p=>`KC ${p.period} ${p.mult}`,
    calc:(c,p) => { const m = ema(src(c,'close'), +p.period), a = rma(trueRange(c), +p.period);

  DC:{ label:'돈치안 채널', overlay:true, params:{period:20}, colors:['#4aa3ff','#8aa0b8','#4aa3ff'], series:[{key:'u',type:'line',name:'최고'},{key:'m',type:'line',dash:true,name:'중간'},{key:'l',type:'line',name:'최저'}],

  ICHI:{ label:'일목균형표', overlay:true, params:{conv:9, base:26, span:52, disp:26}, colors:['#4aa3ff','#ea3943','#16c784','#f0a33b','#b38cff'],
    series:[{key:'t',type:'line',name:'전환선'},{key:'k',type:'line',name:'기준선'},{key:'a',type:'line',name:'선행스팬 1'},{key:'b',type:'line',name:'선행스팬 2'},{key:'g',type:'line',name:'후행스팬'}],
    fill:{kind:'between', a:'a', b:'b', color:'rgba(22,199,132,0.12)', color2:'rgba(234,57,67,0.12)'}, title:p=>`일목 ${p.conv} ${p.base} ${p.span}`,
    calc:(c,p) => { const mid = (i,n) => (hiN(c,i,n)+loN(c,i,n))/2, n = c.length, d = +p.disp, step = n > 1 ? c[n-1].time - c[n-2].time : 60;
      const T = i => i < n ? c[i].time : c[n-1].time + (i-n+1)*step;
      const t = [], k = [], a = [], b = [], g = [];
      for(let i = 0; i < n; i++){ const tv = i >= +p.conv-1 ? mid(i,+p.conv) : null, kv = i >= +p.base-1 ? mid(i,+p.base) : null;
        if(tv != null) t.push({time:c[i].time, value:tv}); if(kv != null) k.push({time:c[i].time, value:kv});
        if(tv != null && kv != null && i+d-1 >= 0){ a.push({time:T(i+d-1), value:(tv+kv)/2}) }
        if(i >= +p.span-1) b.push({time:T(i+d-1), value:mid(i,+p.span)});
        if(i-d+1 >= 0) g.push({time:c[i-d+1].time, value:c[i].close}) }
      const bt = new Set(b.map(x=>x.time)); const a2 = a.filter(x=>bt.has(x.time)), at = new Set(a2.map(x=>x.time));
      return { t, k, a:a2, b:b.filter(x=>at.has(x.time)), g } } },
  PSAR:{ label:'파라볼릭 SAR', overlay:true, params:{start:0.02, inc:0.02, max:0.2}, colors:['#f0b90b'], series:[{key:'s',type:'dots',name:'SAR'}], title:p=>`SAR ${p.start} ${p.inc} ${p.max}`,
    calc:(c,p) => { if(c.length < 3) return {s:[]}; let up = c[1].close >= c[0].close, af = +p.start, ep = up ? c[0].high : c[0].low, sar = up ? c[0].low : c[0].high; const out = [];
      for(let i = 1; i < c.length; i++){ const b = c[i]; sar = sar + af*(ep - sar);
        if(up){ sar = Math.min(sar, c[i-1].low, c[Math.max(0,i-2)].low); if(b.low < sar){ up = false; sar = ep; ep = b.low; af = +p.start } else if(b.high > ep){ ep = b.high; af = Math.min(af + +p.inc, +p.max) } }
        else { sar = Math.max(sar, c[i-1].high, c[Math.max(0,i-2)].high); if(b.high > sar){ up = true; sar = ep; ep = b.high; af = +p.start } else if(b.low < ep){ ep = b.low; af = Math.min(af + +p.inc, +p.max) } }
        out.push({time:b.time, value:sar, color: up ? UPC : DNC}) } return { s:out } } },
  PIVOT:{ label:'피벗 포인트 (일간)', overlay:true, params:{}, colors:['#f0b90b','#ea3943','#ea3943','#16c784','#16c784'],
    series:[{key:'p',type:'step',name:'P'},{key:'r1',type:'step',name:'R1'},{key:'r2',type:'step',name:'R2'},{key:'s1',type:'step',name:'S1'},{key:'s2',type:'step',name:'S2'}], title:()=>'Pivot (일간)',
    calc:c => { const o = {p:[],r1:[],r2:[],s1:[],s2:[]}; let day = -1, H = -Infinity, Lo = Infinity, C = null, cur = null;
      c.forEach(b => { const d = Math.floor((b.time+9*3600)/86400); if(d !== day){ if(C != null){ const P = (H+Lo+C)/3; cur = {p:P, r1:2*P-Lo, s1:2*P-H, r2:P+(H-Lo), s2:P-(H-Lo)} } day = d; H = -Infinity; Lo = Infinity }
        H = Math.max(H, b.high); Lo = Math.min(Lo, b.low); C = b.close; if(cur) Object.keys(o).forEach(k => o[k].push({time:b.time, value:cur[k]})) }); return o } },
  BB:{ label:'볼린저 밴드', overlay:true, params:{period:20, mult:2}, colors:['#4aa3ff','#8aa0b8','#4aa3ff'],

  VWAP:{ label:'VWAP (일간)', overlay:true, params:{}, colors:['#e05bd6'], series:[{key:'v',type:'line'}], title:()=>'VWAP',
    calc:c => { let day = -1, pv = 0, vv = 0; return { v: c.map(b => { const d = Math.floor(b.time/86400);
      if(d!==day){ day = d; pv = 0; vv = 0 } const tp = (b.high+b.low+b.close)/3; pv += tp*b.volume; vv += b.volume;
      return {time:b.time, value: vv ? pv/vv : tp} }) } } },
  ST:{ label:'슈퍼트렌드', overlay:true, params:{period:10, mult:3}, colors:['#16c784','#ea3943'], series:[{key:'s',type:'line'}], title:p=>`ST ${p.period} ${p.mult}`,
    calc:(c,p) => { const atr = rma(trueRange(c), +p.period); let up=null, dn=null, trend=1; const out = [];
      c.forEach((b,i) => { if(atr[i]==null) return; const hl = (b.high+b.low)/2;
        let nu = hl - p.mult*atr[i], nd = hl + p.mult*atr[i]; const pc = i ? c[i-1].close : b.close;
        if(up!=null && pc > up) nu = Math.max(nu, up); if(dn!=null && pc < dn) nd = Math.min(nd, dn);
        if(trend===1 && b.close < (up ?? nu)) trend = -1; else if(trend===-1 && b.close > (dn ?? nd)) trend = 1;

  RSI:{ label:'RSI', overlay:false, params:{period:14, ma:14}, colors:['#b38cff','#f0b90b'], series:[{key:'r',type:'line',name:'RSI'},{key:'m',type:'line',name:'RSI 이동평균'}], levels:[70,50,30],

  VWT:{ label:'거래량 가중 추세 띠', overlay:true, params:{period:30, mult:1.2}, colors:['#16c784'], series:[{key:'m',type:'line',name:'중심선'}],
    fill:{kind:'band', key:'_band', color:'rgba(22,199,132,0.5)', color2:'rgba(234,57,67,0.5)'}, width:2, title:p=>`추세 띠 ${p.period} ${p.mult}`,
    /* 거래량 가중 평균을 중심으로 ATR 폭의 띠를 두르고, 종가가 띠 위로 벗어나면 상승, 아래로 벗어나면 하락으로 색을 바꿔요 */
    calc:(c,p,st) => { const n = +p.period, atr = rma(trueRange(c), n), up = (st && st.fill.color) || 'rgba(22,199,132,0.5)', dn = (st && st.fill.color2) || 'rgba(234,57,67,0.5)';
      const solid = x => x.replace(/rgba\(([^,]+),([^,]+),([^,]+),[^)]+\)/, 'rgb($1,$2,$3)');
      let pv = 0, vv = 0, tr = 1; const m = [], band = [];
      c.forEach((b, i) => { pv += b.close*b.volume; vv += b.volume; if(i >= n){ pv -= c[i-n].close*c[i-n].volume; vv -= c[i-n].volume }
        if(i < n-1 || atr[i] == null) return; const w = vv ? pv/vv : b.close, hi = w + p.mult*atr[i], lo = w - p.mult*atr[i];
        if(b.close > hi) tr = 1; else if(b.close < lo) tr = -1;

  MACD:{ label:'MACD', overlay:false, params:{fast:12, slow:26, signal:9}, colors:['#4aa3ff','#f0a33b','#888'],

  STOCHRSI:{ label:'스토캐스틱 RSI', overlay:false, params:{rsi:14, stoch:14, k:3, d:3}, colors:['#4aa3ff','#f0a33b'],

  ADX:{ label:'ADX / DMI', overlay:false, params:{period:14}, colors:['#f0b90b','#16c784','#ea3943'], series:[{key:'a',type:'line',name:'ADX'},{key:'p',type:'line',name:'+DI'},{key:'m',type:'line',name:'−DI'}], levels:[25], title:p=>`ADX ${p.period}`,
    calc:(c,p) => { const n = +p.period, pd = [0], md = [0];

  STOCH:{ label:'스토캐스틱', overlay:false, params:{k:14, smooth:3, d:3}, colors:['#4aa3ff','#f0a33b'], series:[{key:'k',type:'line',name:'%K'},{key:'d',type:'line',name:'%D'}], levels:[80,20],

  CCI:{ label:'CCI', overlay:false, params:{period:20}, colors:['#2ec4b6'], series:[{key:'c',type:'line'}], levels:[100,0,-100], fill:{kind:'levels', a:0, b:2, color:'rgba(46,196,182,0.07)'}, title:p=>`CCI ${p.period}`,

  WR:{ label:'윌리엄스 %R', overlay:false, params:{period:14}, colors:['#b38cff'], series:[{key:'w',type:'line'}], levels:[-20,-50,-80], fill:{kind:'levels', a:0, b:2, color:'rgba(126,87,194,0.08)'}, title:p=>`%R ${p.period}`,

  MFI:{ label:'MFI (자금 흐름 지수)', overlay:false, params:{period:14}, colors:['#ff7aa8'], series:[{key:'m',type:'line'}], levels:[80,20], fill:{kind:'levels', a:0, b:1, color:'rgba(255,122,168,0.07)'}, title:p=>`MFI ${p.period}`,

  AROON:{ label:'아룬', overlay:false, params:{period:14}, colors:['#16c784','#ea3943'], series:[{key:'u',type:'line',name:'아룬 업'},{key:'d',type:'line',name:'아룬 다운'}], title:p=>`Aroon ${p.period}`,

  CHOP:{ label:'초피니스 (횡보 지수)', overlay:false, params:{period:14}, colors:['#8aa0b8'], series:[{key:'c',type:'line'}], levels:[61.8,38.2], fill:{kind:'levels', a:0, b:1, color:'rgba(138,160,184,0.08)'}, title:p=>`CHOP ${p.period}`,

  BBW:{ label:'볼린저 밴드 폭', overlay:false, params:{period:20, mult:2}, colors:['#4aa3ff'], series:[{key:'w',type:'line'}], title:p=>`BBW ${p.period}`,

  BBP:{ label:'볼린저 %B', overlay:false, params:{period:20, mult:2}, colors:['#4aa3ff'], series:[{key:'b',type:'line'}], levels:[1,0.5,0], fill:{kind:'levels', a:0, b:2, color:'rgba(74,163,255,0.07)'}, title:p=>`%B ${p.period}`,

  HV:{ label:'역사적 변동성 (연율 %)', overlay:false, params:{period:20}, colors:['#ff9f43'], series:[{key:'h',type:'line'}], title:p=>`HV ${p.period}`,
    calc:(c,p) => { const r = c.map((b,i) => i ? Math.log(b.close/c[i-1].close) : 0), n = +p.period, per = c.length > 1 ? (c[1].time-c[0].time) : 86400, ann = Math.sqrt(365*86400/per);

  CMF:{ label:'차이킨 자금 흐름', overlay:false, params:{period:20}, colors:['#16c784'], series:[{key:'c',type:'line'}], levels:[0], title:p=>`CMF ${p.period}`,

<script>
/* 차트 모양: 색 고르기 도구, 지표 띠 채우기, 차트 설정 창, 오른쪽 클릭 메뉴 */
(() => {
const { esc, store } = LC;
const L = LightweightCharts;

/* 색: '#rrggbb' 또는 'rgba(...)'를 {hex, a}로, 다시 문자열로 */
const parseColor = c => {
  c = (c || '#888888').trim(); let m;
  if((m = c.match(/^#([0-9a-f]{6})([0-9a-f]{2})?$/i))) return { hex:'#' + m[1], a: m[2] ? parseInt(m[2], 16)/255 : 1 };
  if((m = c.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i))) return { hex:'#' + m[1]+m[1]+m[2]+m[2]+m[3]+m[3], a:1 };
  if((m = c.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+))?\s*\)$/i)))
    return { hex:'#' + [m[1],m[2],m[3]].map(x => (+x).toString(16).padStart(2,'0')).join(''), a: m[4] == null ? 1 : +m[4] };
  return { hex:'#888888', a:1 };
};
const mkColor = (hex, a) => { if(a >= 0.999) return hex; const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${(+a).toFixed(2)})` };
/* 색 + 투명도 입력 한 묶음 */
const colorField = (key, val) => { const c = parseColor(val);
  return `<span class="cpick" data-ck="${esc(key)}"><input type="color" value="${c.hex}"><input type="range" min="0" max="100" value="${Math.round(c.a*100)}" title="불투명도"></span>` };
const readColor = el => mkColor(el.querySelector('[type=color]').value, el.querySelector('[type=range]').value/100);
LC.color = { parseColor, mkColor, colorField, readColor };
const DASH = [['0','실선'],['1','점선'],['2','파선'],['3','긴 파선']];
LC.DASH = DASH;

/* 지표 띠 채우기 (차트 안쪽, 봉 뒤에 그려요) */
class IndFill {
  constructor(v, ind){ this.v = v; this.ind = ind; const self = this;
    this.view = { zOrder(){ return 'bottom' }, renderer(){ return { draw(t){ try{ self.draw(t) }catch(e){} } } } } }
  attached(p){ this.p = p } detached(){ this.p = null }
  updateAllViews(){} paneViews(){ return [this.view] }
  draw(target){
    const ind = this.ind, F = ind.def.fill, st = ind.style.fill; if(!F || !st || !st.show || ind.hidden || !this.p) return;
    const se = this.p.series, ts = this.v.chart.timeScale();
    target.useBitmapCoordinateSpace(sc => {
      const ctx = sc.context, hr = sc.horizontalPixelRatio, vr = sc.verticalPixelRatio, W = sc.bitmapSize.width;
      const X = t => { const x = ts.timeToCoordinate(t); return x == null ? null : x * hr }, Y = p => { const y = se.priceToCoordinate(p); return y == null ? null : y * vr };
      if(F.kind === 'levels'){
        const lv = ind.style.levels, a = lv[F.a], b = lv[F.b]; if(!a || !b) return;
        const ya = Y(+a.v), yb = Y(+b.v); if(ya == null || yb == null) return;
        ctx.fillStyle = st.color; ctx.fillRect(0, Math.min(ya, yb), W, Math.abs(yb - ya)); return;
      }
      if(F.kind === 'between'){
        const A = ind.data[F.a] || [], B = ind.data[F.b] || []; if(!A.length || A.length !== B.length) return;
        const up = [], dn = []; for(let i = 0; i < A.length; i++){ const x = X(A[i].time); if(x == null || x < -50 || x > W + 50) continue; up.push([x, Y(A[i].value)]); dn.push([x, Y(B[i].value)]) }
        if(up.length < 2) return;
        if(st.color2){ /* 위·아래가 뒤바뀌면 다른 색 (일목 구름) */
          for(let i = 1; i < up.length; i++){ ctx.beginPath(); ctx.moveTo(up[i-1][0], up[i-1][1]); ctx.lineTo(up[i][0], up[i][1]); ctx.lineTo(dn[i][0], dn[i][1]); ctx.lineTo(dn[i-1][0], dn[i-1][1]); ctx.closePath();
            ctx.fillStyle = up[i][1] <= dn[i][1] ? st.color : st.color2; ctx.fill() } return }
        ctx.beginPath(); up.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); for(let i = dn.length-1; i >= 0; i--) ctx.lineTo(dn[i][0], dn[i][1]);
        ctx.closePath(); ctx.fillStyle = st.color; ctx.fill(); return;
      }
      if(F.kind === 'band'){
        const D = ind.data[F.key] || []; const pts = [];
        for(const d of D){ const x = X(d.time); if(x == null || x < -50 || x > W + 50) continue; pts.push({ x, u:Y(d.up), l:Y(d.lo), t:d.t }) }
        if(pts.length < 2) return;
        /* 같은 방향이 이어지는 구간마다 바깥 → 안쪽으로 겹겹이 칠해서 은은하게 빛나 보이게 */
        const layers = [[1, .35], [.66, .55], [.33, .8]];
        let i0 = 0;
        const run = (s, e) => { const col = parseColor(pts[s].t > 0 ? st.color : st.color2 || st.color);
          layers.forEach(([k, a]) => { ctx.beginPath();
            for(let i = s; i <= e; i++){ const p = pts[i], m = (p.u + p.l)/2, h = (p.l - p.u)/2*k; i === s ? ctx.moveTo(p.x, m - h) : ctx.lineTo(p.x, m - h) }
            for(let i = e; i >= s; i--){ const p = pts[i], m = (p.u + p.l)/2, h = (p.l - p.u)/2*k; ctx.lineTo(p.x, m + h) }
            ctx.closePath(); ctx.fillStyle = mkColor(col.hex, col.a * a); ctx.fill() }) };
        for(let i = 1; i <= pts.length; i++) if(i === pts.length || pts[i].t !== pts[i0].t){ run(i0, Math.min(i, pts.length - 1)); i0 = i }
      }
    });
  }
}
LC.IndFill = IndFill;

/* 차트 전체 설정 (모든 칸에 같이 적용, 바꾼 값만 저장) */
const DEF = theme => { const light = theme === 'light';
  return { upColor:'#16c784', downColor:'#ea3943', borderVisible:false, borderUp:'#16c784', borderDown:'#ea3943', wickVisible:true, wickUp:'#16c784', wickDown:'#ea3943',
    lineColor:'#4aa3ff', lineWidth:2,
    bgType:'solid', bg1: light ? '#ffffff' : '#0b0f15', bg2: light ? '#eef2f7' : '#121a26',
    vGrid:true, vGridColor: light ? 'rgba(0,0,0,0.06)' : 'rgba(35,45,59,0.6)', hGrid:true, hGridColor: light ? 'rgba(0,0,0,0.06)' : 'rgba(35,45,59,0.6)',
    crossMode:'0', crossColor: light ? '#7a8699' : '#5d6b80', crossStyle:'3',
    textColor: light ? '#4a5566' : '#8b97a8', fontSize:11, lastLine:true, lastLabel:true,
    watermark:false, legendOHLC:true, legendVals:true, countdown:true } };
const CS = LC.chartStyle = {
  user: store.get('chartStyle', {}),
  get(){ return { ...DEF(LC.app && LC.app.theme), ...this.user } },
  set(k, v){ this.user[k] = v; store.set('chartStyle', this.user); this.applyAll() },
  reset(){ this.user = {}; store.set('chartStyle', {}); this.applyAll() },
  applyAll(){ (LC.app ? LC.app.views : []).forEach(v => this.apply(v)) },
  mainOpts(type){ const S = this.get(), o = { priceLineVisible:S.lastLine, lastValueVisible:S.lastLabel };
    if(type === 'candle' || type === 'ha') Object.assign(o, { upColor:S.upColor, downColor:S.downColor, borderVisible:S.borderVisible, borderUpColor:S.borderUp, borderDownColor:S.borderDown,
      wickVisible:S.wickVisible, wickUpColor:S.wickUp, wickDownColor:S.wickDown });
    if(type === 'hollow') Object.assign(o, { upColor:'rgba(0,0,0,0)', downColor:S.downColor, borderVisible:true, borderUpColor:S.upColor, borderDownColor:S.downColor, wickVisible:S.wickVisible, wickUpColor:S.wickUp, wickDownColor:S.wickDown });
    if(type === 'bar') Object.assign(o, { upColor:S.upColor, downColor:S.downColor, thinBars:false });
    if(type === 'line') Object.assign(o, { color:S.lineColor, lineWidth:+S.lineWidth });
    if(type === 'area'){ const c = parseColor(S.lineColor); Object.assign(o, { lineColor:S.lineColor, lineWidth:+S.lineWidth, topColor:mkColor(c.hex, .35), bottomColor:mkColor(c.hex, 0) }) }
    return o },
  apply(v){
    const S = this.get(), light = LC.app && LC.app.theme === 'light', border = light ? '#d6dce4' : '#232d3b';
    const line = (c) => ({ color:c, style:+S.crossStyle, width:1, labelBackgroundColor: light ? '#5b6678' : '#2b3647' });
    v.chart.applyOptions({
      layout:{ background: S.bgType === 'gradient' ? { type:L.ColorType.VerticalGradient, topColor:S.bg1, bottomColor:S.bg2 } : { type:L.ColorType.Solid, color:S.bg1 },
        textColor:S.textColor, fontSize:+S.fontSize, fontFamily:LC.FONT, panes:{ separatorColor:border, separatorHoverColor: light ? '#b8c2cf' : '#3b4a5e' } },
      grid:{ vertLines:{ visible:S.vGrid, color:S.vGridColor }, horzLines:{ visible:S.hGrid, color:S.hGridColor } },
      crosshair:{ mode:+S.crossMode, vertLine:line(S.crossColor), horzLine:line(S.crossColor) },
      rightPriceScale:{ borderColor:border }, timeScale:{ borderColor:border } });
    v.series.applyOptions(this.mainOpts(v.type));
    v.box.classList.toggle('no-ohlc', !S.legendOHLC); v.box.classList.toggle('no-vals', !S.legendVals); v.box.classList.toggle('no-cd', !S.countdown);
    try{
      if(S.watermark && L.createTextWatermark){ const lines = [{ text:v.sym.replace(/USDT$/, '') + (v.market === 'futures' ? ' · 무기한' : ''), color: light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.05)', fontSize:64, fontFamily:LC.FONT, fontStyle:'700' }];
        if(v.wm) v.wm.applyOptions({ lines }); else v.wm = L.createTextWatermark(v.chart.panes()[0], { horzAlign:'center', vertAlign:'center', lines }) }
      else if(v.wm){ v.wm.detach(); v.wm = null }
    }catch(e){}
  },
  modal(){
    const S = this.get();
    const chk = (k, t) => `<label class="srow"><span>${t}</span><input type="checkbox" data-sk="${k}" ${S[k] ? 'checked' : ''}></label>`;
    const col = (k, t, ck) => `<label class="srow"><span>${ck ? `<input type="checkbox" data-sk="${ck}" ${S[ck] ? 'checked' : ''}> ` : ''}${t}</span>${colorField(k, S[k])}</label>`;
    const sel = (k, t, opts) => `<label class="srow"><span>${t}</span><select data-sk="${k}">${opts.map(([v, n]) => `<option value="${v}" ${String(S[k]) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
    const tabs = {
      '캔들':[ '<h6>몸통</h6>', col('upColor','상승'), col('downColor','하락'), '<h6>테두리</h6>', chk('borderVisible','테두리 보이기'), col('borderUp','상승'), col('borderDown','하락'),
        '<h6>꼬리</h6>', chk('wickVisible','꼬리 보이기'), col('wickUp','상승'), col('wickDown','하락'), '<h6>라인·영역 차트</h6>', col('lineColor','선 색'), sel('lineWidth','선 굵기', [['1','1'],['2','2'],['3','3'],['4','4']]) ],
      '배경·격자':[ sel('bgType','배경', [['solid','단색'],['gradient','위→아래 그라데이션']]), col('bg1','배경 색 (위)'), col('bg2','그라데이션 아래 색'),
        '<h6>격자</h6>', col('vGridColor','세로 격자', 'vGrid'), col('hGridColor','가로 격자', 'hGrid'), chk('watermark','차트 가운데 종목 이름 (워터마크)') ],
      '눈금·십자선':[ col('textColor','눈금 글자 색'), sel('fontSize','눈금 글자 크기', [['10','10'],['11','11'],['12','12'],['13','13'],['14','14']]),
        chk('lastLine','현재가 가로선'), chk('lastLabel','현재가 눈금 표시'), chk('countdown','봉 마감까지 남은 시간'),
        '<h6>십자선</h6>', sel('crossMode','움직임', [['0','자유롭게'],['1','봉 종가에 붙기']]), col('crossColor','색'), sel('crossStyle','선 모양', DASH) ],
      '범례·표시':[ chk('legendOHLC','시가·고가·저가·종가 보이기'), chk('legendVals','지표 값 보이기'), '<h6>차트 위 표시</h6>', '<label class="srow"><span>큰 체결·청산 동그라미</span><input type="checkbox" id="stBub"></label>' ]
    };
    const names = Object.keys(tabs);
    const html = `<div class="sub-tabs st-tabs">${names.map((n, i) => `<button data-t="${i}" class="${i ? '' : 'on'}">${n}</button>`).join('')}</div>
      ${names.map((n, i) => `<div class="st-pane" data-t="${i}" ${i ? 'hidden' : ''}>${tabs[n].join('')}</div>`).join('')}
      <div class="row-end"><button class="btn" id="stReset">기본값으로</button><button class="btn pri" id="stOk">닫기</button></div>`;
    LC.modal('차트 설정', html, (mb, close) => {
      const sync = () => { const s = this.get(); mb.querySelectorAll('[data-sk]').forEach(el => { if(el.type === 'checkbox') el.checked = !!s[el.dataset.sk]; else el.value = String(s[el.dataset.sk]) });
        mb.querySelectorAll('[data-ck]').forEach(el => { const c = parseColor(s[el.dataset.ck]); el.querySelector('[type=color]').value = c.hex; el.querySelector('[type=range]').value = Math.round(c.a*100) }) };
      mb.querySelector('.st-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return;
        mb.querySelectorAll('.st-tabs button').forEach(x => x.classList.toggle('on', x === b)); mb.querySelectorAll('.st-pane').forEach(p => p.hidden = p.dataset.t !== b.dataset.t) };
      mb.addEventListener('input', e => { const ck = e.target.closest('[data-ck]'); if(ck) return this.set(ck.dataset.ck, readColor(ck));
        const k = e.target.dataset.sk; if(k) this.set(k, e.target.type === 'checkbox' ? e.target.checked : e.target.value) });
      const F = LC.panels.find(p => p.id === 'flow'), bub = mb.querySelector('#stBub'); bub.checked = !!(F && F.cfg.bubbles);
      bub.onchange = e => { e.stopPropagation(); if(!F) return; F.cfg.bubbles = bub.checked; store.set('flowCfg', F.cfg); const c = F.el && F.el.querySelector('[data-c=bubbles]'); if(c) c.checked = bub.checked };
      mb.querySelector('#stReset').onclick = () => { this.reset(); sync() };
      mb.querySelector('#stOk').onclick = close;
    });
  }
};

/* 오른쪽 클릭 메뉴 */
LC.ctxMenu = (x, y, items) => {
  document.querySelectorAll('.ctxm').forEach(m => m.remove());
  const m = document.createElement('div'); m.className = 'ctxm';
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button data-i="${i}">${esc(it[0])}${it[2] ? `<small>${esc(it[2])}</small>` : ''}</button>`).join('');
  document.body.appendChild(m);
  const r = m.getBoundingClientRect(); m.style.left = Math.min(x, innerWidth - r.width - 6) + 'px'; m.style.top = Math.min(y, innerHeight - r.height - 6) + 'px';
  const off = e => { if(!m.contains(e.target)){ m.remove(); document.removeEventListener('mousedown', off, true) } };
  setTimeout(() => document.addEventListener('mousedown', off, true));
  m.onclick = e => { const b = e.target.closest('button'); if(!b) return; m.remove(); document.removeEventListener('mousedown', off, true); items[+b.dataset.i][1]() };
};
})();

</script>
<script>
/* 작도 엔진: 차트 위 캔버스에 선·도형을 그리고, 끌어서 옮기고, 종목별로 저장해요 */
(() => {
const FIB = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1, 1.272, 1.618];
const FIB_COL = ['#8a94a6','#ea3943','#f0a33b','#16c784','#2ec4b6','#4aa3ff','#8a94a6','#b38cff','#e05bd6'];
const COLORS = ['#f0b90b','#4aa3ff','#16c784','#ea3943','#e05bd6','#ffffff'];
const TWO = ['trend','ray','ext','rect','fib','pos','measure'];
const ONE = ['hline','hray','vline','text','alert'];
const DEFAULT_COLOR = {alert:'#ff9f1c', pos:'#16c784', text:'#d7dee8'};
const uid = () => Math.random().toString(36).slice(2, 9);

class Drawings {
  constructor(view){
    this.v = view; this.items = []; this.sel = null; this.draft = null; this.drag = null; this.undoStack = [];
    const cv = this.cv = document.createElement('canvas'); cv.className = 'draw-layer';
    view.box.appendChild(cv);
    this.ctx = cv.getContext('2d');
    this.bar = document.createElement('div'); this.bar.className = 'sel-bar'; view.box.appendChild(this.bar);
    const cap = {capture:true};
    ['pointerdown','mousedown','touchstart'].forEach(ev => view.box.addEventListener(ev, e => this.onDown(e), cap));
    view.box.addEventListener('mousemove', e => this.onHover(e));
    window.addEventListener('mousemove', e => this.onMove(e));
    window.addEventListener('mouseup', e => this.onUp(e));
    view.box.addEventListener('dblclick', e => this.onDbl(e), cap);
    const loop = () => { if(this.dead) return; try{ this.render() }catch(e){ console.error(e) } requestAnimationFrame(loop) };
    requestAnimationFrame(loop);
  }
  destroy(){ this.dead = true; this.cv.remove(); this.bar.remove() }
  get app(){ return LC.app }
  key(){ return 'dr_' + this.v.sym }
  load(){ this.items = LC.store.get(this.key(), []); this.sel = null; this.draft = null; this.undoStack = []; this.updateBar() }
  save(){ LC.store.set(this.key(), this.items); this.app && this.app.views.forEach(o => { if(o !== this.v && o.sym === this.v.sym) o.drawings.load() }) }
  snapshot(){ this.undoStack.push(JSON.stringify(this.items)); if(this.undoStack.length > 50) this.undoStack.shift() }
  undo(){ const s = this.undoStack.pop(); if(s){ this.items = JSON.parse(s); this.sel = null; this.save(); this.updateBar() } }
  clear(){ if(!this.items.length) return; this.snapshot(); this.items = []; this.sel = null; this.save(); this.updateBar() }
  remove(it){ this.snapshot(); this.items = this.items.filter(x => x !== it); if(this.sel === it) this.sel = null; this.save(); this.updateBar() }

  /* 좌표 변환: 시간(초) ↔ x, 가격 ↔ y */
  bars(){ return this.v.shown }
  tfSec(){ return LC.TFMS[this.v.tf] / 1000 }
  tToL(t){ const c = this.bars(); if(!c.length) return null; const n = c.length, sec = this.tfSec();
    if(t >= c[n-1].time) return n-1 + (t - c[n-1].time)/sec;
    if(t <= c[0].time) return (t - c[0].time)/sec;
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    return lo + (t - c[lo].time)/(c[hi].time - c[lo].time) }
  /* 지표 칸이 다른 시간 점을 더할 수 있어서, 봉 시각 → 화면 좌표를 직접 이어 계산해요 */
  spacing(){ const ts = this.v.chart.timeScale(); const a = ts.logicalToCoordinate(0), b = ts.logicalToCoordinate(1); return (a != null && b != null && b !== a) ? b - a : 6 }
  tToX(t){ const c = this.bars(); if(!c.length) return null; const ts = this.v.chart.timeScale(), n = c.length, sec = this.tfSec();
    if(t >= c[n-1].time){ const xl = ts.timeToCoordinate(c[n-1].time); return xl == null ? null : xl + (t - c[n-1].time)/sec * this.spacing() }
    if(t <= c[0].time){ const x0 = ts.timeToCoordinate(c[0].time); return x0 == null ? null : x0 + (t - c[0].time)/sec * this.spacing() }
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    const x0 = ts.timeToCoordinate(c[lo].time); if(x0 == null || t === c[lo].time) return x0;
    const x1 = ts.timeToCoordinate(c[hi].time); return x1 == null ? x0 : x0 + (x1 - x0) * (t - c[lo].time)/(c[hi].time - c[lo].time) }
  xToT(x){ const c = this.bars(); if(!c.length) return null; const ts = this.v.chart.timeScale(), n = c.length, sec = this.tfSec(), sp = this.spacing();
    const xl = ts.timeToCoordinate(c[n-1].time), x0 = ts.timeToCoordinate(c[0].time);
    if(xl != null && x > xl + sp/2) return c[n-1].time + Math.round((x - xl)/sp) * sec;
    if(x0 != null && x < x0 - sp/2) return c[0].time + Math.round((x - x0)/sp) * sec;
    const t = ts.coordinateToTime(x); if(t == null) return null;
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    return Math.abs(c[hi].time - t) < Math.abs(t - c[lo].time) ? c[hi].time : c[lo].time }
  pToY(p){ return this.v.series.priceToCoordinate(p) }
  yToP(y){ return this.v.series.coordinateToPrice(y) }
  area(){ const ch = this.v.chart; return { w: ch.timeScale().width(), h: ch.panes()[0].getHeight() } }
  snap(t, p, y){
    if(!this.app || !this.app.magnet) return p;
    const c = this.bars(); const l = Math.round(this.tToL(t)); const b = c[l]; if(!b) return p;
    let best = p, bd = 1e9; [b.open, b.high, b.low, b.close].forEach(v => { const d = Math.abs(this.pToY(v) - y); if(d < bd){ bd = d; best = v } });
    return bd < 40 ? best : p;
  }
  pos(e){ const r = this.v.box.getBoundingClientRect(); const pt = e.touches ? e.touches[0] : e; return { x: pt.clientX - r.left, y: pt.clientY - r.top } }
  ptAt(x, y){ const t = this.xToT(x); let p = this.yToP(y); if(t == null || p == null) return null; p = this.snap(t, p, y); return { t, p } }

  /* 마우스 */
  onDown(e){
    if(e.type === 'touchstart' || e.button > 0) return;
    if(e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
    if(e.type === 'mousedown' && this._handled){ this._handled = false; e.stopPropagation(); e.preventDefault(); return }
    const {x, y} = this.pos(e); const A = this.area();
    if(x > A.w || (y > A.h && !this.draft)) return;
    this.app && this.app.setActive(this.v);
    const tool = this.app ? this.app.tool : 'cross';
    const stop = () => { e.stopPropagation(); e.preventDefault(); if(e.type === 'pointerdown') this._handled = true };
    if(tool !== 'cross'){
      const pt = this.ptAt(x, y); if(!pt){ stop(); return }
      if(this.draft){ this.finishDraft(pt); stop(); return }
      if(ONE.includes(tool)){
        if(tool === 'text'){ this.askText(txt => { if(!txt) return; this.add({type:'text', pts:[pt], text:txt}) }); stop(); return }
        this.add({type:tool, pts:[pt]}); stop(); return;
      }
      this.draft = { id:uid(), type:tool, pts:[pt, {...pt}], color: DEFAULT_COLOR[tool] || COLORS[0] };
      stop(); return;
    }
    if(this.app && this.app.drawLocked) return;
    const hit = this.hitTest(x, y);
    if(hit){
      this.sel = hit.item; this.updateBar();
      if(!hit.item.locked){ this.snapshot(); this.drag = { item: hit.item, handle: hit.handle, start: this.ptAt(x, y), orig: JSON.parse(JSON.stringify(hit.item.pts)), moved:false } }
      stop();
    } else if(this.sel){ this.sel = null; this.updateBar() }
  }
  onHover(e){
    const {x, y} = this.pos(e);
    if(this.draft){ const pt = this.ptAt(x, y); if(pt) this.draft.pts[1] = pt; return }
    if(this.drag) return;
    const tool = this.app ? this.app.tool : 'cross';
    const hit = tool === 'cross' && !(this.app && this.app.drawLocked) ? this.hitTest(x, y) : null;
    this.v.box.classList.toggle('hover-draw', !!hit);
    this.v.box.classList.toggle('tool-on', tool !== 'cross');
  }
  onMove(e){
    if(!this.drag) return;
    const {x, y} = this.pos(e); const pt = this.ptAt(x, y); if(!pt || !this.drag.start) return;
    const d = this.drag, it = d.item; d.moved = true;
    if(d.handle == null){
      const dt = pt.t - d.start.t, dp = pt.p - d.start.p;
      it.pts = d.orig.map(o => ({ t: ['hline','alert'].includes(it.type) ? o.t : o.t + dt, p: it.type === 'vline' ? o.p : o.p + dp }));
      if(it.type === 'alert') it.fired = false;
    } else if(it.type === 'pos' && d.handle > 0){
      it.pts[d.handle] = { t: it.pts[d.handle].t, p: pt.p };
      if(d.handle === 1) it.pts[1].t = pt.t;
    } else {
      it.pts[d.handle] = pt;
      if(it.type === 'pos' && d.handle === 0){ const dp = pt.p - d.orig[0].p; it.pts[1].p = d.orig[1].p + dp; it.pts[2].p = d.orig[2].p + dp }
    }
  }
  onUp(){ if(this.drag){ if(this.drag.moved) this.save(); else this.undoStack.pop(); this.drag = null } }
  onDbl(e){ const {x, y} = this.pos(e); const hit = this.hitTest(x, y);
    if(hit && hit.item.type === 'text'){ e.stopPropagation(); this.askText(t => { if(t){ this.snapshot(); hit.item.text = t; this.save() } }, hit.item.text) } }
  finishDraft(pt){
    const d = this.draft; d.pts[1] = pt; this.draft = null;
    if(d.type === 'measure'){ this.measure = d; setTimeout(() => { if(this.measure === d) this.measure = null }, 8000); this.app && this.app.setTool('cross'); return }
    if(d.type === 'pos'){ const e = d.pts[0].p, s = d.pts[1].p; d.pts[2] = { t: d.pts[1].t, p: e + 2*(e - s) } }
    this.add(d);
  }
  add(it){
    this.snapshot(); it.id = it.id || uid(); it.color = it.color || DEFAULT_COLOR[it.type] || COLORS[0];
    this.items.push(it); this.sel = it; this.save(); this.updateBar();
    if(this.app && !this.app.keepTool) this.app.setTool('cross');
  }
  askText(cb, cur = ''){
    LC.modal('글자 넣기', `<input class="inp" id="txtIn" maxlength="120" value="${LC.esc(cur)}" placeholder="차트에 적을 글자"><div class="row-end"><button class="btn pri" id="txtOk">넣기</button></div>`, (mb, close) => {
      const i = mb.querySelector('#txtIn'); i.focus();
      const ok = () => { const v = i.value.trim(); close(); cb(v) };
      mb.querySelector('#txtOk').onclick = ok; i.onkeydown = e => { if(e.key === 'Enter') ok() };
    });
  }

  /* 선택된 개체 도구 막대 */
  updateBar(){
    const it = this.sel;
    if(!it){ this.bar.style.display = 'none'; return }
    this.bar.style.display = 'flex';
    this.bar.innerHTML = COLORS.map(c => `<button class="sw ${it.color===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="색 ${c}"></button>`).join('')
      + `<button data-a="lock" title="잠그기">${it.locked ? '🔒' : '🔓'}</button><button data-a="del" title="지우기 (Delete)">🗑</button>`;
    this.bar.onmousedown = e => e.stopPropagation();
    this.bar.onclick = e => { const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.c){ this.snapshot(); it.color = b.dataset.c; this.save(); this.updateBar() }
      else if(b.dataset.a === 'lock'){ it.locked = !it.locked; this.save(); this.updateBar() }
      else if(b.dataset.a === 'del') this.remove(it) };
  }

  /* 맞춤 검사 */
  hitTest(x, y){
    if(this.app && this.app.drawHidden) return null;
    const A = this.area(); const TOL = 6;
    const segD = (px, py, x1, y1, x2, y2) => { const dx = x2-x1, dy = y2-y1; const L = dx*dx+dy*dy; let t = L ? ((px-x1)*dx+(py-y1)*dy)/L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px-x1-t*dx, py-y1-t*dy) };
    const list = this.sel ? [this.sel, ...this.items.filter(i => i !== this.sel).reverse()] : [...this.items].reverse();
    for(const it of list){
      const P = it.pts.map(p => ({x: this.tToX(p.t), y: this.pToY(p.p)}));
      if(P.some(p => p.x == null || p.y == null)) continue;
      if(it === this.sel) for(let i=0;i<P.length;i++) if(Math.hypot(P[i].x-x, P[i].y-y) < 8) return {item:it, handle:i};
      const [a, b] = P; let hit = false;
      switch(it.type){
        case 'trend': case 'measure': hit = segD(x,y,a.x,a.y,b.x,b.y) < TOL; break;
        case 'ray': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); const ex = b.x >= a.x ? A.w : 0; hit = segD(x,y,a.x,a.y,ex,a.y+k*(ex-a.x)) < TOL; break }
        case 'ext': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); hit = segD(x,y,0,a.y-k*a.x,A.w,a.y+k*(A.w-a.x)) < TOL; break }
        case 'hline': case 'alert': hit = Math.abs(y-a.y) < TOL; break;
        case 'hray': hit = Math.abs(y-a.y) < TOL && x >= a.x - TOL; break;
        case 'vline': hit = Math.abs(x-a.x) < TOL; break;
        case 'rect': { const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x), t = Math.min(a.y,b.y), bo = Math.max(a.y,b.y); hit = x>=l-TOL && x<=r+TOL && y>=t-TOL && y<=bo+TOL; break }
        case 'fib': { const l = Math.min(a.x,b.x); hit = x >= l-TOL && FIB.some(f => Math.abs(y - this.pToY(it.pts[1].p + (it.pts[0].p-it.pts[1].p)*f)) < TOL); break }
        case 'pos': { const c = P[2]; const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x); const ys = [a.y,b.y,c.y]; hit = x>=l && x<=r && y>=Math.min(...ys)-TOL && y<=Math.max(...ys)+TOL; break }
        case 'text': { this.ctx.font = '13px "DM Mono", "Noto Sans KR", sans-serif'; const w = this.ctx.measureText(it.text||'').width; hit = x>=a.x-4 && x<=a.x+w+8 && y>=a.y-18 && y<=a.y+6; break }
      }
      if(hit) return {item:it, handle:null};
    }
    return null;
  }

  /* 그리기 */
  render(){
    const cv = this.cv, ctx = this.ctx, dpr = window.devicePixelRatio || 1;
    const W = this.v.box.clientWidth, H = this.v.box.clientHeight;
    if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.width = W+'px'; cv.style.height = H+'px' }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    if(!this.bars().length) return;
    const A = this.area();
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,A.w,A.h); ctx.clip();
    if(this.v.bubbles) this.v.bubbles.draw(ctx, this, A);
    (LC.overlays || []).forEach(o => { try{ o.draw(ctx, this, A) }catch(e){} });
    const hidden = this.app && this.app.drawHidden;
    const list = hidden ? [] : [...this.items];
    if(this.draft) list.push(this.draft);
    if(this.measure) list.push(this.measure);
    for(const it of list) this.drawItem(ctx, it, A);
    ctx.restore();
    if(this.sel && !hidden && this.items.includes(this.sel)){
      const a = this.sel.pts.map(p => ({x:this.tToX(p.t), y:this.pToY(p.p)}));
      a.forEach(p => { if(p.x==null||p.y==null) return; ctx.beginPath(); ctx.arc(p.x,p.y,4.5,0,7); ctx.fillStyle = '#0d1117'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = this.sel.color; ctx.stroke() });
    }
  }
  label(ctx, txt, x, y, bg, fg = '#0d1117', align = 'left'){
    ctx.font = '11px "DM Mono", "Noto Sans KR", sans-serif'; const w = ctx.measureText(txt).width + 8;
    const lx = align === 'right' ? x - w : align === 'center' ? x - w/2 : x;
    ctx.fillStyle = bg; ctx.fillRect(lx, y-9, w, 18); ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(txt, lx+4, y);
  }
  drawItem(ctx, it, A){
    const P = it.pts.map(p => ({x:this.tToX(p.t), y:this.pToY(p.p)}));
    if(P.some(p => p.x == null || p.y == null)) return;
    const [a, b] = P; const col = it.color || '#f0b90b'; const prec = this.v.prec;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    const line = (x1,y1,x2,y2) => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke() };
    switch(it.type){
      case 'trend': line(a.x,a.y,b.x,b.y); break;
      case 'ray': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); const ex = b.x >= a.x ? A.w : 0; line(a.x,a.y,ex,a.y+k*(ex-a.x)); break }
      case 'ext': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); line(0,a.y-k*a.x,A.w,a.y+k*(A.w-a.x)); break }
      case 'hline': line(0,a.y,A.w,a.y); this.label(ctx, LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, col, '#0d1117', 'right'); break;
      case 'hray': line(a.x,a.y,A.w,a.y); this.label(ctx, LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, col, '#0d1117', 'right'); break;
      case 'vline': line(a.x,0,a.x,A.h); break;
      case 'alert': { const fired = it.fired; ctx.setLineDash([6,4]); ctx.strokeStyle = fired ? '#5b6676' : col; line(0,a.y,A.w,a.y); ctx.setLineDash([]);
        this.label(ctx, (fired ? '✓ ' : '🔔 ') + LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, fired ? '#5b6676' : col, '#0d1117', 'right'); break }
      case 'rect': { ctx.globalAlpha = 0.12; ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        ctx.strokeRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); break }
      case 'fib': { const l = Math.min(a.x,b.x); const p0 = it.pts[0].p, p1 = it.pts[1].p;
        ctx.setLineDash([4,3]); ctx.strokeStyle = '#5b6676'; ctx.lineWidth = 1; line(a.x,a.y,b.x,b.y); ctx.setLineDash([]);
        FIB.forEach((f,i) => { const pr = p1 + (p0-p1)*f; const y = this.pToY(pr); if(y == null) return;
          ctx.strokeStyle = FIB_COL[i]; line(l,y,A.w,y); ctx.font = '11px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = FIB_COL[i]; ctx.textBaseline = 'bottom';
          ctx.fillText(`${f} (${LC.fmtN(pr, prec)})`, l+4, y-2) }); break }
      case 'pos': { const e = it.pts[0].p, s = it.pts[1].p, t = it.pts[2] ? it.pts[2].p : e + 2*(e - s); const long = t > e;
        const c = {x:b.x, y:this.pToY(t)}; if(c.y == null) break; const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x), w = Math.max(r-l, 30);
        ctx.globalAlpha = 0.18; ctx.fillStyle = '#16c784'; ctx.fillRect(l, Math.min(a.y,c.y), w, Math.abs(c.y-a.y));
        ctx.fillStyle = '#ea3943'; ctx.fillRect(l, Math.min(a.y,b.y), w, Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        ctx.strokeStyle = '#d7dee8'; ctx.lineWidth = 1; line(l,a.y,l+w,a.y);
        const rr = Math.abs(t-e)/Math.abs(e-s || 1e-9);
        this.label(ctx, `${long?'롱':'숏'} 목표 ${LC.fmtN(t,prec)} (${LC.fmtPct((t-e)/e*100)})`, l+w/2, c.y + (long?-11:11), '#16c784', '#0d1117', 'center');
        this.label(ctx, `손절 ${LC.fmtN(s,prec)} (${LC.fmtPct((s-e)/e*100)})`, l+w/2, b.y + (long?11:-11), '#ea3943', '#fff', 'center');
        this.label(ctx, `진입 ${LC.fmtN(e,prec)} · 손익비 ${rr.toFixed(2)}`, l+w/2, a.y, '#d7dee8', '#0d1117', 'center');
        if(this.v.last){ const lp = this.v.last.close; const pnl = (long ? lp-e : e-lp)/e*100;
          this.label(ctx, `지금 ${LC.fmtPct(pnl)}`, l+w+4, a.y, pnl>=0?'#16c784':'#ea3943', '#0d1117') }
        break }
      case 'measure': { const up = b.y < a.y; ctx.globalAlpha = 0.15; ctx.fillStyle = up ? '#4aa3ff' : '#ea3943';
        ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        const p0 = it.pts[0].p, p1 = it.pts[1].p; const bars = Math.round(this.tToL(it.pts[1].t) - this.tToL(it.pts[0].t));
        const secs = Math.abs(it.pts[1].t - it.pts[0].t);
        const dur = secs >= 86400 ? (secs/86400).toFixed(1)+'일' : secs >= 3600 ? (secs/3600).toFixed(1)+'시간' : Math.round(secs/60)+'분';
        this.label(ctx, `${LC.fmtN(p1-p0, prec)} (${LC.fmtPct((p1-p0)/p0*100)}) · ${bars}봉 · ${dur}`, (a.x+b.x)/2, b.y + (up?-14:14), up ? '#4aa3ff' : '#ea3943', '#fff', 'center'); break }
      case 'text': { ctx.font = '13px "DM Mono", "Noto Sans KR", sans-serif'; ctx.textBaseline = 'alphabetic'; const w = ctx.measureText(it.text||'').width;
        ctx.globalAlpha = 0.85; ctx.fillStyle = '#131922'; ctx.fillRect(a.x-4, a.y-17, w+8, 22); ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.fillText(it.text||'', a.x, a.y); break }
    }
  }
}
LC.Drawings = Drawings;
LC.DRAW_TOOLS = { TWO, ONE };
})();
