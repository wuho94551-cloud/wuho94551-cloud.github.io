      sh.innerHTML = `<div class="ms-in"><div class="ms-h"><b>그리기</b><small class="dim">고른 뒤 차트를 눌러 점을 찍거나 끌어서 그려요</small></div>
        <div class="ms-g">${LIST.map(k => `<button data-k="${k}">${svg(T[k][2])}<span>${esc(T[k][1].replace(/ \(.*$/, ''))}</span></button>`).join('')}</div>
        <div class="ms-f"><button data-a="magnet" class="${this.magnet ? 'on' : ''}">자석 ${this.magnet ? '켬' : '끔'}</button><button data-a="erase">지우개</button><button data-a="undo">되돌리기</button><button data-a="list">작도 목록</button><button data-a="close">닫기</button></div></div>`;
      document.body.appendChild(sh);
      sh.onclick = e => { const k = e.target.closest('[data-k]'), a = e.target.closest('[data-a]');
        if(e.target === sh || (a && a.dataset.a === 'close')) return sh.remove();
        if(k){ sh.remove(); this.setTool(k.dataset.k); this.hint('차트를 눌러 점을 찍거나, 손가락으로 끌어서 그려요'); return }
        if(!a || !this.v) return; const D = this.v.drawings;
        if(a.dataset.a === 'magnet'){ this.magnet = !this.magnet; store.set('magnet', this.magnet); this.syncTools(); a.classList.toggle('on', this.magnet); a.textContent = '자석 ' + (this.magnet ? '켬' : '끔') }
        if(a.dataset.a === 'undo') D.undo();
        if(a.dataset.a === 'erase'){ sh.remove(); this.eraser(true); this.hint('지울 작도를 누르거나 손가락으로 지나가세요') }
        if(a.dataset.a === 'list'){ sh.remove(); D.listModal() } };
    };
    this.mDrawSync();
  },
  syncTools(){
    this.mDrawSync && this.mDrawSync(); document.querySelectorAll('#tools [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === this.tool));
    document.querySelectorAll('#tools [data-x]').forEach(b => b.classList.toggle('on', !!this[b.dataset.x]));
    const eb = document.querySelector('#tools [data-act="clear"]'); if(eb) eb.classList.toggle('on', this.tool === 'eraser');
    if(this.tool !== 'eraser' && this._erOn) this.hint(''); this._erOn = this.tool === 'eraser';
    const mb = document.querySelector('#tools [data-act="memo"]'); if(mb && this.v) mb.classList.toggle('has', !!store.get('memo_' + this.v.sym, '')) },
  /* 종목 메모: 종목마다 한 장씩, 적어 두면 버튼에 점이 생겨요 */
  memo(){ const v = this.v; if(!v) return; const k = 'memo_' + v.sym;
    LC.modal(`메모 · ${v.sym}`, `<textarea class="inp memo-ta" id="memoTa" maxlength="4000" placeholder="이 종목에 대한 생각, 진입 계획, 주의할 점…">${esc(store.get(k, ''))}</textarea><p class="muted" style="margin:6px 0 0">적는 대로 저장돼요. 동기화를 켜 두면 다른 기기에서도 보여요.</p>`, mb => {
      const ta = mb.querySelector('#memoTa'); ta.focus(); ta.oninput = () => { store.set(k, ta.value); this.syncTools() } }, 'mid') },
  /* 지우개: 켜면 누르는 작도가 지워져요. 다시 누르거나 Esc로 꺼요 */
  eraser(on){ this.setTool(on ? 'eraser' : 'cross'); if(on){ this.hint('지울 작도를 누르거나 끌어서 지나가세요 · 다 지우려면 지우개를 오른쪽 클릭 · Esc 끝') } else this.hint('') },
  clearMenu(x, y){ const D = this.v && this.v.drawings; if(!D) return;
    LC.ctxMenu(x, y, [[this.tool === 'eraser' ? '지우개 끄기' : '지우개 켜기', () => this.eraser(this.tool !== 'eraser'), '누른 작도만 지워요'], '-', ['이 종목 작도 모두 지우기', () => D.clear()],
      ['알림선은 남기고 지우기', () => { D.snapshot(); D.items = D.items.filter(i => i.type === 'alert'); D.sel = null; D.save(); D.updateBar() }],
      ['되돌리기  Ctrl+Z', () => D.undo()]]) },
  setTool(t){
    const G = {trend:'line',ray:'line',ext:'line',arrow:'line',hline:'line',hray:'line',vline:'line',channel:'chan',fib:'chan',rect:'shape',ellipse:'shape'};
    if(G[t] && this.groupPick && this.groupPick[G[t]] !== t && document.querySelector(`#tools .tg[data-g="${G[t]}"]`)){ this.groupPick[G[t]] = t; store.set('toolPick', this.groupPick); this.buildTools() }
    this.tool = t; this.views.forEach(v => { v.drawings.draft = null; v.box.classList.toggle('tool-on', t !== 'cross') }); this.syncTools() },

  onKey(e){
    const tag = (e.target.tagName || '').toLowerCase(); if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    const v = this.v;
    if(e.key === 'Escape'){ this.setTool('cross'); this.hint(''); if(v){ v.replayPick = false; v.drawings.sel = null; v.drawings.updateBar() } }
    else if((e.key === 'Delete' || e.key === 'Backspace') && v && v.drawings.sel){ v.drawings.remove(v.drawings.sel); e.preventDefault() }
    else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && v){ v.drawings.undo(); e.preventDefault() }
    else if(e.altKey && !e.ctrlKey){ const m = {t:'trend', h:'hline', v:'vline', f:'fib', a:'alert', r:'rect'}[e.key.toLowerCase()]; if(m){ this.setTool(m); e.preventDefault() } }
    else if(e.shiftKey && e.key === 'ArrowRight' && v && v.replay){ v.replayStep(); e.preventDefault() }
    else if(e.key === '/' && !e.ctrlKey){ this.symSearch(); e.preventDefault() }
    else if(e.key === '?' && !e.ctrlKey && !document.querySelector('.modal-bg')){ this.keysHelp(); e.preventDefault() }
    else if(/^[1-9]$/.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey && v && !document.querySelector('.modal-bg')){
      const f = store.get('tfFav', ['1m','5m','15m','1h','4h','1d']), tf = f[+e.key - 1]; if(tf){ v.setTf(tf); this.syncHeader(); e.preventDefault() } }
  },
  keysHelp(){
    const K = [['/', '종목 찾기'], ['?', '이 단축키 안내'], ['Esc', '그리기 취소 · 선택 풀기 · 창 닫기'], ['1 ~ 9', '위에 보이는 시간 단위 차례로 (1분, 5분…)'], ['Del', '고른 그림 지우기'], ['Ctrl + Z', '그리기 되돌리기'],
      ['Alt + T', '추세선'], ['Alt + H', '수평선'], ['Alt + V', '수직선'], ['Alt + R', '네모'], ['Alt + F', '피보나치'], ['Alt + A', '가격 알림선'],
      ['Shift + →', '리플레이에서 한 봉 앞으로'], ['마우스 휠', '차트 확대·축소'], ['오른쪽 클릭', '차트 설정']];
    LC.modal('단축키', `<div class="kh">${K.map(([k, d]) => `<div><span>${k.split(' + ').map(x => `<kbd>${esc(x)}</kbd>`).join(' + ')}</span><em>${d}</em></div>`).join('')}</div>`);
  },
  /* 처음 온 사람에게 3단계로 화면을 짚어 줘요 */
  tour(force){
    if(!force && store.get('tourDone', false)) return;
    const S = [['#tfs', '시간 단위', '자주 쓰는 시간 단위가 여기 있어요. ▾를 누르면 다른 단위를 고르고 즐겨찾기를 바꿀 수 있어요. 지표는 옆의 지표 버튼에서 넣어요.'],
      ['aside', '종목 목록', '오른쪽 목록에서 종목을 눌러 차트를 바꿔요. ☆을 누르면 내 목록에 담겨요. 키보드 / 를 눌러도 찾을 수 있어요.'],
      ['#btnAl', '알림', '가격선, 급등락, 펀딩비, 거래대금 알림을 한곳에서 관리해요. 텔레그램을 이어 두면 창을 닫아도 휴대폰으로 받아요.']];
    let i = 0; const ov = document.createElement('div'); ov.className = 'tour'; document.body.appendChild(ov);
    const end = () => { ov.remove(); store.set('tourDone', true); removeEventListener('resize', show) };
    const show = () => { const [sel, t, d] = S[i], el = document.querySelector(sel), r = el && el.offsetParent ? el.getBoundingClientRect() : null;
      const hole = r ? `left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px` : 'left:50%;top:40%;width:0;height:0';
      const bw = 300, bx = r ? Math.max(12, Math.min(innerWidth - bw - 12, r.left + r.width/2 - bw/2)) : innerWidth/2 - bw/2;
      const by = r ? (r.bottom + 180 < innerHeight ? r.bottom + 14 : Math.max(12, r.top - 170)) : innerHeight * .4;
      ov.innerHTML = `<div class="tour-hole" style="${hole}"></div><div class="tour-box" style="left:${bx}px;top:${by}px;width:${bw}px"><small>${i+1} / ${S.length}</small><b>${t}</b><p>${d}</p>
        <div class="tour-b"><button class="tour-skip">건너뛰기</button><button class="tour-next">${i < S.length-1 ? '다음' : '시작하기'}</button></div></div>`;
      ov.querySelector('.tour-skip').onclick = end; ov.querySelector('.tour-next').onclick = () => { if(++i >= S.length) end(); else show() } };
    addEventListener('resize', show); show();
  },

  /* 지표 고르기 */
  /* 지표 찾기 창: 검색, 분류, 즐겨찾기, 지금 차트에 있는 지표 */
  indModal(){
    const v = this.v; if(!v) return;
    const D = LC.IND.DEFS, CATS = ['전체','즐겨찾기','지금 차트','추세','모멘텀','변동성','거래량','선물 데이터','우호 전용'];
    let cat = store.get('indCat', '전체'), favs = store.get('indFav', []);
    const html = `<div class="ix"><div class="ix-cats">${CATS.map(c => `<button data-c="${c}">${c}</button>`).join('')}</div>
      <div class="ix-main"><input class="sr-in" id="ixQ" placeholder="지표 이름으로 찾기 (예: RSI, 일목, 볼린저, 펀딩)" autocomplete="off"><div class="ix-list" id="ixL"></div></div></div>
      <p class="muted" style="margin:10px 0 0">누르면 바로 차트에 들어가고 창은 열려 있어요. 들어간 지표는 범례에서 이름을 두 번 누르거나 ⚙를 눌러 모양을 바꿔요.</p>`;
    LC.modal('지표', html, (mb) => {
      const q = mb.querySelector('#ixQ'), L = mb.querySelector('#ixL'); let sel = 0, rows = [];
      const count = k => v.inds.filter(i => i.key === k).length;
      const draw = () => {
        mb.querySelectorAll('.ix-cats button').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
        if(cat === '지금 차트' && !q.value.trim()){
          L.innerHTML = v.inds.length ? v.inds.map(i => `<div class="ix-row cur" data-id="${i.id}"><span class="dotc" style="background:${LC.color.parseColor(i.color||'#888888').hex}"></span><b>${esc(i.def.title ? i.def.title(i.params) : i.def.label)}</b><span class="dim">${esc(i.def.cat||'')}</span>
            <span class="ix-act"><button data-a="eye" title="보이기/숨기기">${i.hidden ? '◌' : '◉'}</button><button data-a="set" title="설정">⚙</button><button data-a="del" title="지우기">✕</button></span></div>`).join('') : '<div class="empty">아직 넣은 지표가 없어요</div>';
          rows = []; return }
        const k = q.value.trim().toLowerCase();
        rows = Object.keys(D).filter(key => { const d = D[key];
          if(k) return (d.label + ' ' + key + ' ' + (d.desc||'') + ' ' + (d.cat||'')).toLowerCase().includes(k);
          return cat === '전체' || (cat === '즐겨찾기' ? favs.includes(key) : d.cat === cat) });
        sel = Math.max(0, Math.min(sel, rows.length - 1));
        L.innerHTML = rows.map((key, i) => { const d = D[key], n = count(key);
          return `<div class="ix-row ${i === sel ? 'on' : ''}" data-k="${key}"><button class="fav ${favs.includes(key) ? 'on' : ''}" data-fav="${key}" title="즐겨찾기">★</button>
            <b>${esc(d.label)}</b><span class="dim ix-desc">${esc(d.desc||'')}</span><span class="tag">${d.overlay ? '차트 위' : '아래 칸'}${d.futuresOnly ? ' · 선물' : ''}</span>${n ? `<span class="tag on">${n}개 있음</span>` : ''}</div>` }).join('')
          || '<div class="empty">' + (cat === '즐겨찾기' ? '★를 눌러 자주 쓰는 지표를 모아 두세요' : '찾는 지표가 없어요') + '</div>';
      };
      const add = key => { if(D[key].futuresOnly && v.market !== 'futures') return LC.toast('선물 차트에서만 쓸 수 있는 지표예요'); v.addInd(key); LC.toast(`${D[key].label} 넣었어요`); draw() };
      mb.querySelector('.ix-cats').onclick = e => { const b = e.target.closest('button'); if(!b) return; cat = b.dataset.c; store.set('indCat', cat); q.value = ''; sel = 0; draw() };
      q.oninput = () => { sel = 0; draw() };
      q.onkeydown = e => { if(e.key === 'ArrowDown'){ sel = Math.min(sel + 1, rows.length - 1); draw(); e.preventDefault() } else if(e.key === 'ArrowUp'){ sel = Math.max(sel - 1, 0); draw(); e.preventDefault() } else if(e.key === 'Enter' && rows[sel]) add(rows[sel]) };
      L.onclick = e => {
        const f = e.target.closest('[data-fav]'); if(f){ const k = f.dataset.fav; favs = favs.includes(k) ? favs.filter(x => x !== k) : [...favs, k]; store.set('indFav', favs); draw(); return }
        const cur = e.target.closest('.ix-row.cur'); if(cur){ const ind = v.inds.find(i => i.id === cur.dataset.id); const a = e.target.closest('[data-a]'); if(!ind || !a) return;
          if(a.dataset.a === 'set') return v.editInd(ind); v.onLegendClick({ target:v.q(`.lgr[data-id="${ind.id}"] [data-a="${a.dataset.a}"]`) }); draw(); return }
        const r = e.target.closest('[data-k]'); if(r) add(r.dataset.k) };
      draw(); q.focus();
    }, true);
  },

  /* 오른쪽 창 */
  buildAside(){
    this.panels.sort((a, b) => { const i = ORDER.indexOf(a.id), j = ORDER.indexOf(b.id); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) });
    const body = $('asideBody'), rail = $('rail'), svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
    this.railHide = store.get('railHide', ['paper','pf']);
    const GRP = { list:0, ind:0, flow:1, book:1, move:1, journal:1, arb:2, news:2, x:2, whale:3, paper:3, pf:3 };
    const btn = p => { const r = RAIL[p.id] || [p.label, null]; return `<button data-p="${p.id}" title="${esc(p.label)}">${svg(p.icon || r[1] || '<circle cx="12" cy="12" r="6"/>')}<span>${esc(r[0])}</span></button>` };
    this.drawRail = () => { let g = -1, h = '';
      this.panels.filter(p => !this.railHide.includes(p.id)).forEach(p => { const k = GRP[p.id] ?? 4; if(g >= 0 && k !== g) h += '<span class="tsep"></span>'; g = k; h += btn(p) });
      rail.innerHTML = h + '<span class="tsep"></span><button data-x="more" title="더 보기 · 아이콘 고르기">' + svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>') + '<span>더보기</span></button>'
        + '<button data-x="market" title="위젯 · 시장 자료">' + svg('<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="5"/><rect x="13" y="10" width="8" height="11"/><rect x="3" y="13" width="8" height="8"/>') + '<span>위젯</span></button>';
      rail.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === this.panelId && !this.asideHidden));
      const mb = rail.querySelector('[data-x=more]'); mb.classList.toggle('on', this.railHide.includes(this.panelId) && !this.asideHidden) };
    this.drawRail();
    const pickIcons = () => LC.modal('오른쪽 아이콘 고르기', `<p class="muted">줄에 늘 보일 칸을 골라요. 뺀 칸은 "더보기"에서 열 수 있어요.</p>${this.panels.map(p => `<label class="srow"><span><input type="checkbox" data-rp="${p.id}" ${this.railHide.includes(p.id) ? '' : 'checked'}> ${esc(p.label)}</span></label>`).join('')}`, mb => {
      mb.addEventListener('change', e => { const c = e.target.closest('[data-rp]'); if(!c) return; const id = c.dataset.rp;
        this.railHide = c.checked ? this.railHide.filter(x => x !== id) : [...this.railHide, id]; store.set('railHide', this.railHide); this.drawRail() }) });
    body.innerHTML = this.panels.map(p => `<div class="pn" data-p="${p.id}" hidden></div>`).join('');
    this.panels.forEach(p => p.mount(body.querySelector(`.pn[data-p="${p.id}"]`), this));
    rail.onclick = e => { const b = e.target.closest('button'); if(!b) return; if(b.dataset.x === 'market') return LC.widgets.menu(b);
      if(b.dataset.x === 'more'){ const r = b.getBoundingClientRect(), hid = this.panels.filter(p => this.railHide.includes(p.id));
        return LC.ctxMenu(r.left - 210, r.top, [...hid.map(p => [p.label, () => { this.toggleAside(false); this.showPanel(p.id) }]), ...(hid.length ? ['-'] : []), ['아이콘 고르기…', pickIcons], ['알림 목록…', () => LC.srv.alerts()], ['내 서버 · 텔레그램 · 동기화…', () => LC.srv.open()], ['단축키 보기  ?', () => this.keysHelp()], ['처음 안내 다시 보기', () => this.tour(true)], [this.asideHidden ? '오른쪽 창 열기' : '오른쪽 창 닫기', () => this.toggleAside(!this.asideHidden)]]) }
      if(b.dataset.p === this.panelId && !this.asideHidden) return this.toggleAside(true); this.toggleAside(false); this.showPanel(b.dataset.p) };
    /* 왼쪽 가장자리를 끌어 너비 조절 */
    const app = document.querySelector('.app'), grip = $('asideGrip');
    const setW = w => { w = Math.max(260, Math.min(720, w)); app.style.setProperty('--asideW', w + 'px'); return w };
    setW(store.get('asideW', 340));
    grip.onmousedown = e => { e.preventDefault(); grip.classList.add('on'); const x0 = e.clientX, w0 = $('asideBody').offsetWidth; let w = w0;
      const mv = ev => { w = setW(w0 + x0 - ev.clientX); this.views.forEach(v => v.resize && v.resize()) };
      const up = () => { grip.classList.remove('on'); store.set('asideW', w); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); window.dispatchEvent(new Event('resize')) };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up) };
    this.asideReady = true;
    this.showPanel(store.get('panel', this.panels[0] && this.panels[0].id));
    if(store.get('asideHidden', false)) this.toggleAside(true);
    if(this.v) this.panels.forEach(p => p.onSymbol && p.onSymbol(this.v));
    this.renderTabs();
  },
  toggleAside(hide){ this.asideHidden = hide; store.set('asideHidden', hide); document.querySelector('aside').style.display = hide ? 'none' : ''; document.querySelector('.app').classList.toggle('aside-off', hide);
    document.querySelector('.app').style.setProperty('--asideW', hide ? '0px' : store.get('asideW', 340) + 'px');
    this.drawRail && this.drawRail(); window.dispatchEvent(new Event('resize')) },
  /* 탭을 30초 넘게 안 봤다가 다시 보면, 그 사이 빠졌을 수 있는 봉을 채워요 */
  watchWake(){ let hidAt = 0; document.addEventListener('visibilitychange', () => { if(document.hidden){ hidAt = Date.now(); return } if(hidAt && Date.now() - hidAt > 30000) this.views.forEach(v => v.backfill()) });
    let tick = Date.now(); setInterval(() => { const now = Date.now(); if(now - tick > 60000) this.views.forEach(v => v.backfill()); tick = now }, 15000) },
  showPanel(id){
    if(!this.panels.find(p => p.id === id)) id = this.panels[0].id;
    this.panelId = id; const P = this.panels.find(p => p.id === id);
    $('asideHead').innerHTML = `<span>${esc(P.label)}</span><button class="hb" title="창 접기" id="asideClose">›</button>`;
    $('asideClose').onclick = () => this.toggleAside(true);
    this.drawRail && this.drawRail();
    document.querySelectorAll('#asideBody .pn').forEach(el => el.hidden = el.dataset.p !== id);
    this.panels.forEach(p => p.onShow && p.onShow(p.id === id)); store.set('panel', id);
  }
};
window.addEventListener('DOMContentLoaded', () => app.init());
})();

</script>
