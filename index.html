<script>
/* 간단 백테스트: 지금 차트에 불러온 봉으로 정해진 규칙을 돌려서 승률·손익·최대 낙폭을 보여 줘요.
   신호는 봉이 닫힐 때 보고, 진입은 다음 봉 시가로 해요. 손절·목표는 봉 안에서 닿으면 그 값으로 나가고,
   한 봉에서 둘 다 닿으면 손절로 쳐요 (보수적으로). 수수료는 진입·청산 때 한 번씩 빼요. */
(() => {
const { esc, store } = LC;
const sma = (v, p) => { const o = new Array(v.length).fill(null); let s = 0; for(let i = 0; i < v.length; i++){ s += v[i]; if(i >= p) s -= v[i - p]; if(i >= p - 1) o[i] = s / p } return o };
const ema = (v, p) => { const o = new Array(v.length).fill(null), k = 2 / (p + 1); let e = null; for(let i = 0; i < v.length; i++){ if(i < p - 1) continue; if(e == null){ let s = 0; for(let j = i - p + 1; j <= i; j++) s += v[j]; e = s / p } else e = v[i] * k + e * (1 - k); o[i] = e } return o };
const rsi = (v, p) => { const o = new Array(v.length).fill(null); let g = 0, l = 0;
  for(let i = 1; i < v.length; i++){ const d = v[i] - v[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if(i <= p){ g += up; l += dn; if(i === p){ g /= p; l /= p; o[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l) } }
    else { g = (g * (p - 1) + up) / p; l = (l * (p - 1) + dn) / p; o[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l) } } return o };
const sd = (v, p, m) => v.map((_, i) => { if(m[i] == null) return null; let s = 0; for(let j = i - p + 1; j <= i; j++) s += (v[j] - m[i]) ** 2; return Math.sqrt(s / p) });

/* 전략: 각 봉이 닫힐 때 +1(롱 신호) / -1(숏 신호) / 0 */
const STRATS = {
  ma:  { name:'이평선 교차', desc:'빠른 이평이 느린 이평을 위로 뚫으면 롱, 아래로 뚫으면 숏', params:[['fast','빠른 이평', 9], ['slow','느린 이평', 21], ['type','종류', 'EMA', ['EMA','SMA']]],
    sig(c, p){ const cl = c.map(b => b.close), f = p.type === 'SMA' ? sma(cl, +p.fast) : ema(cl, +p.fast), s = p.type === 'SMA' ? sma(cl, +p.slow) : ema(cl, +p.slow);
      return c.map((_, i) => i && f[i] != null && s[i] != null && f[i - 1] != null && s[i - 1] != null ? (f[i - 1] <= s[i - 1] && f[i] > s[i] ? 1 : f[i - 1] >= s[i - 1] && f[i] < s[i] ? -1 : 0) : 0) } },
  rsi: { name:'RSI 되돌림', desc:'RSI가 과매도 선을 아래에서 위로 넘으면 롱, 과매수 선을 위에서 아래로 넘으면 숏', params:[['len','기간', 14], ['lo','과매도', 30], ['hi','과매수', 70]],
    sig(c, p){ const r = rsi(c.map(b => b.close), +p.len); return c.map((_, i) => i && r[i] != null && r[i - 1] != null ? (r[i - 1] < +p.lo && r[i] >= +p.lo ? 1 : r[i - 1] > +p.hi && r[i] <= +p.hi ? -1 : 0) : 0) } },
  brk: { name:'N봉 돌파', desc:'종가가 앞선 N봉 최고가를 넘으면 롱, 최저가 아래로 내려가면 숏', params:[['n','봉 수', 20]],
    sig(c, p){ const n = +p.n; return c.map((b, i) => { if(i < n) return 0; let hi = -Infinity, lo = Infinity; for(let j = i - n; j < i; j++){ hi = Math.max(hi, c[j].high); lo = Math.min(lo, c[j].low) } return b.close > hi ? 1 : b.close < lo ? -1 : 0 }) } },
  bb:  { name:'볼린저 밴드 반등', desc:'종가가 아래 밴드 밖에서 안으로 들어오면 롱, 위 밴드 밖에서 안으로 들어오면 숏', params:[['len','기간', 20], ['k','폭 (표준편차)', 2]],
    sig(c, p){ const cl = c.map(b => b.close), m = sma(cl, +p.len), s = sd(cl, +p.len, m), k = +p.k;
      return c.map((b, i) => { if(!i || m[i] == null || m[i - 1] == null) return 0; const lo0 = m[i - 1] - k * s[i - 1], lo1 = m[i] - k * s[i], hi0 = m[i - 1] + k * s[i - 1], hi1 = m[i] + k * s[i];
        return cl[i - 1] < lo0 && cl[i] >= lo1 ? 1 : cl[i - 1] > hi0 && cl[i] <= hi1 ? -1 : 0 }) } },
};

/* 돌리기 */
function run(c, cfg){
  const S = STRATS[cfg.s], P = { ...Object.fromEntries(S.params.map(x => [x[0], x[2]])), ...(cfg.p || {}) }, sig = S.sig(c, P);
  const side = cfg.side || 'both', sl = +cfg.sl || 0, tp = +cfg.tp || 0, fee = Math.max(0, +cfg.fee || 0);
  const ok = d => side === 'both' || (side === 'long' ? d > 0 : d < 0);
  const T = []; let pos = null;
  const close = (j, px, why) => { const pct = ((px / pos.entry) - 1) * pos.d * 100 - 2 * fee; T.push({ ...pos, j, t1: c[j].time, exit: px, pct, why }); pos = null };
  const open = (j, d) => { const e = c[j].open; pos = { d, i: j, t0: c[j].time, entry: e, stop: sl ? e * (1 - d * sl / 100) : null, tgt: tp ? e * (1 + d * tp / 100) : null } };
  for(let i = 0; i < c.length; i++){
    const b = c[i];
    if(pos){ /* 봉 안에서 손절·목표 */
      if(pos.stop != null && (pos.d > 0 ? b.low <= pos.stop : b.high >= pos.stop)) close(i, pos.d > 0 ? Math.min(b.open, pos.stop) : Math.max(b.open, pos.stop), '손절');
      else if(pos.tgt != null && (pos.d > 0 ? b.high >= pos.tgt : b.low <= pos.tgt)) close(i, pos.d > 0 ? Math.max(b.open, pos.tgt) : Math.min(b.open, pos.tgt), '목표');
    }
    const s = sig[i]; if(!s || i + 1 >= c.length) continue;
    if(pos && pos.d !== s){ close(i + 1, c[i + 1].open, '반대 신호'); }
    if(!pos && ok(s)) open(i + 1, s);
  }
  let openT = null; if(pos){ const L = c[c.length - 1]; openT = { ...pos, t1: L.time, exit: L.close, pct: ((L.close / pos.entry) - 1) * pos.d * 100 - fee, open: true } }
  /* 통계 */
  let eq = 1, peak = 1, dd = 0; const curve = [0];
  T.forEach(t => { eq *= 1 + t.pct / 100; peak = Math.max(peak, eq); dd = Math.min(dd, eq / peak - 1); curve.push((eq - 1) * 100) });
  const W = T.filter(t => t.pct > 0), Lo = T.filter(t => t.pct <= 0), sum = a => a.reduce((s, t) => s + t.pct, 0);
  const bh = (c[c.length - 1].close / c[0].open - 1) * 100, sec = c.length > 1 ? c[1].time - c[0].time : 60;
  return { P, T, openT, n: T.length, win: T.length ? W.length / T.length * 100 : 0, total: (eq - 1) * 100, avg: T.length ? sum(T) / T.length : 0,
    pf: Lo.length ? sum(W) / Math.abs(sum(Lo)) : W.length ? Infinity : 0, dd: dd * 100, bh, curve, hold: T.length ? T.reduce((s, t) => s + (t.j - t.i), 0) / T.length : 0, sec,
    from: c[0].time, to: c[c.length - 1].time };
}

const fP = v => v == null || !isFinite(v) ? '-' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const kst = (s, o) => new Date(s * 1000).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', hour12:false, ...o });
const dur = sec => sec >= 86400 ? (sec / 86400).toFixed(1).replace(/\.0$/, '') + '일' : sec >= 3600 ? (sec / 3600).toFixed(1).replace(/\.0$/, '') + '시간' : Math.round(sec / 60) + '분';

const BT = LC.bt = { run, STRATS,
  res: null, key: '',
  cfg(){ return Object.assign({ s:'ma', p:{}, side:'both', sl:0, tp:0, fee:0.05, show:true }, store.get('btCfg', {})) },
  open(){
    const v = LC.app && LC.app.v; if(!v || !v.candles || v.candles.length < 50) return LC.toast('차트 봉이 아직 다 안 불러와졌어요. 잠시 뒤 다시 눌러 주세요.', '', 3000);
    const c0 = this.cfg();
    LC.modal(`백테스트 · ${esc(v.sym)} ${esc((LC.TF.find(x => x[0] === v.tf) || [, v.tf])[1])}`, `<div class="bt">
      <div class="bt-f"><label>전략<select class="inp" id="btS">${Object.entries(STRATS).map(([k, s]) => `<option value="${k}" ${c0.s === k ? 'selected' : ''}>${s.name}</option>`).join('')}</select></label>
        <span id="btP" class="bt-p"></span>
        <label>방향<select class="inp" id="btSd">${[['both','롱·숏 모두'],['long','롱만'],['short','숏만']].map(([k, n]) => `<option value="${k}" ${c0.side === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label>손절 %<input class="inp num" type="number" step="0.1" min="0" id="btSl" value="${c0.sl || ''}" placeholder="없음"></label>
        <label>목표 %<input class="inp num" type="number" step="0.1" min="0" id="btTp" value="${c0.tp || ''}" placeholder="없음"></label>
        <label title="진입·청산 때 각각 빠지는 수수료">수수료 %<input class="inp num" type="number" step="0.01" min="0" id="btFee" value="${c0.fee}"></label></div>
      <p class="dim bt-desc" id="btD"></p>
      <div id="btR"></div>
      <div class="row-end"><label class="chk"><input type="checkbox" id="btShow" ${c0.show ? 'checked' : ''}> 차트에 진입·청산 표시</label><span style="flex:1"></span><button class="btn" id="btCmp">전략 4개 한 번에 비교</button></div>
      <p class="muted bt-note">불러온 봉 ${v.candles.length.toLocaleString()}개로 계산해요 (차트를 왼쪽으로 넘기면 더 불러와져요). 레버리지와 미끄러짐은 빼고, 수수료만 넣었어요. 지난 결과가 앞으로도 같다는 뜻은 아니에요.</p></div>`, (mb, close) => {
      const q = s => mb.querySelector(s);
      const params = () => { const s = q('#btS').value, saved = (this.cfg().s === s ? this.cfg().p : {}) || {};
        q('#btP').innerHTML = STRATS[s].params.map(([k, n, d, opts]) => `<label>${n}${opts ? `<select class="inp" data-k="${k}">${opts.map(o => `<option ${(saved[k] ?? d) === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`
          : `<input class="inp num" type="number" min="1" step="${k === 'k' ? 0.1 : 1}" data-k="${k}" value="${saved[k] ?? d}">`}</label>`).join('');
        q('#btD').textContent = STRATS[s].desc };
      const read = () => { const p = {}; mb.querySelectorAll('#btP [data-k]').forEach(x => { p[x.dataset.k] = x.tagName === 'SELECT' ? x.value : (+x.value || STRATS[q('#btS').value].params.find(y => y[0] === x.dataset.k)[2]) });
        const c = { s: q('#btS').value, p, side: q('#btSd').value, sl: +q('#btSl').value || 0, tp: +q('#btTp').value || 0, fee: Math.max(0, +q('#btFee').value || 0), show: q('#btShow').checked };
        store.set('btCfg', c); return c };
      const go = () => { const vv = LC.app.v, c = read(); if(c.s === 'ma' && +c.p.fast >= +c.p.slow){ q('#btR').innerHTML = '<div class="empty">빠른 이평 기간이 느린 이평보다 작아야 해요</div>'; return }
        this.res = run(vv.candles, c); this.key = vv.sym + '|' + vv.market + '|' + vv.tf; this.show = c.show; q('#btR').innerHTML = this.html(this.res) };
      let tm; const later = () => { clearTimeout(tm); tm = setTimeout(go, 150) };
      q('#btS').onchange = () => { params(); go() }; mb.addEventListener('input', e => { if(e.target.id !== 'btS') later() }); mb.addEventListener('change', e => { if(e.target.id !== 'btS') later() });
      q('#btCmp').onclick = () => { clearTimeout(tm); const vv = LC.app.v, c = read();
        const rows = Object.keys(STRATS).map(k => ({ k, r: run(vv.candles, { ...c, s: k, p: k === c.s ? c.p : {} }) })).sort((a, b) => b.r.total - a.r.total);
        q('#btR').innerHTML = `<h6>전략 비교 <small class="dim">각 전략 기본값 (고른 전략은 지금 값) · 같은 방향·손절·목표·수수료</small></h6><div class="jt bt-cmp"><div class="jt-h"><span>전략</span><span>횟수</span><span>승률</span><span>누적</span><span>최대 낙폭</span></div>
          ${rows.map(({ k, r }) => `<div class="jt-r" data-pick="${k}"><span>${STRATS[k].name}</span><span class="num">${r.n}</span><span class="num">${r.win.toFixed(0)}%</span><span class="num ${cls(r.total)}">${fP(r.total)}</span><span class="num down">${r.dd.toFixed(1)}%</span></div>`).join('')}</div>
          <p class="dim" style="margin:6px 0 0;font-size:12px">줄을 누르면 그 전략으로 자세히 봐요 · 그냥 들고 있었다면 ${fP(rows[0].r.bh)}</p>` };
      q('#btR').addEventListener('click', e => { const pk = e.target.closest('[data-pick]'); if(pk){ q('#btS').value = pk.dataset.pick; params(); go(); return }
        const tr = e.target.closest('[data-t0]'); if(tr) this.goto(+tr.dataset.t0, +tr.dataset.t1) });
      params(); go();
    }, 'wide');
  },
  html(r){
    if(!r.n && !r.openT) return '<div class="empty">이 기간에는 신호가 한 번도 안 나왔어요. 기간 값을 바꾸거나 다른 시간 단위로 봐 주세요.</div>';
    const k = (n, v, c, s) => `<div class="jk"><small>${n}</small><b class="num ${c || ''}">${v}</b>${s ? `<small class="dim">${s}</small>` : ''}</div>`;
    const W = 300, H = 70, lo = Math.min(0, ...r.curve), hi = Math.max(0, ...r.curve), y = p => (H - (p - lo) / ((hi - lo) || 1) * (H - 6) - 3).toFixed(1);
    const pts = r.curve.map((p, i) => `${(i / (r.curve.length - 1 || 1) * W).toFixed(1)},${y(p)}`).join(' ');
    const L = [...r.T, ...(r.openT ? [r.openT] : [])].slice(-40).reverse();
    return `<div class="jks">${k('누적 결과', fP(r.total), cls(r.total), `그냥 들고 있었다면 ${fP(r.bh)}`)}${k('매매 수', r.n + '번', '', r.openT ? '지금 진행 중 1개 따로' : '')}
        ${k('승률', r.win.toFixed(0) + '%', '', `평균 ${fP(r.avg)}`)}${k('수익 ÷ 손실', isFinite(r.pf) ? r.pf.toFixed(2) : '∞', r.pf >= 1.3 ? 'up' : r.pf < 1 ? 'down' : '', '1보다 크면 번 쪽이 많아요')}
        ${k('최대 낙폭', r.dd.toFixed(1) + '%', r.dd < -20 ? 'down' : '', '고점 대비 가장 많이 줄었을 때')}${k('평균 보유', dur(r.hold * r.sec), '', `${kst(r.from, { month:'numeric', day:'numeric' })} ~ ${kst(r.to, { month:'numeric', day:'numeric' })}`)}</div>
      <h6>누적 결과 <small class="dim">매매가 끝날 때마다 · 수수료 뺀 값</small></h6><svg class="jr-eq" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="var(--${r.total >= 0 ? 'up' : 'down'})" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
      <h6>매매 목록 <small class="dim">최근 40개 · 누르면 차트에서 그 구간을 보여 줘요</small></h6>
      <div class="bt-list">${L.map(t => `<div class="bt-row" data-t0="${t.t0}" data-t1="${t.t1}"><i class="jr-side ${t.d > 0 ? 'long' : 'short'}">${t.d > 0 ? '롱' : '숏'}</i>
        <span class="num dim">${kst(t.t0, { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span><span class="num">${LC.fmtPx(t.entry)} → ${LC.fmtPx(t.exit)}</span>
        <small class="dim">${t.open ? '진행 중' : esc(t.why)}</small><b class="num ${cls(t.pct)}">${fP(t.pct)}</b></div>`).join('')}</div>`;
  },
  goto(t0, t1){ const v = LC.app.v; if(!v) return; const d = v.drawings, a = d.tToL(t0), b = d.tToL(t1); if(a == null) return; const pad = Math.max(20, (b - a) * 0.8);
    v.chart.timeScale().setVisibleLogicalRange({ from: a - pad, to: b + pad }) },
  /* 차트에 진입 ▲▼ · 청산 ● · 잇는 점선 */
  drawOn(ctx, d, A){
    const r = this.res, v = d.v; if(!r || !this.show || !v || v.replay || this.key !== v.sym + '|' + v.market + '|' + v.tf) return;
    const L = [...r.T, ...(r.openT ? [r.openT] : [])]; ctx.save();
    L.forEach(t => { const x0 = d.tToX(t.t0), y0 = d.pToY(t.entry), x1 = d.tToX(t.t1), y1 = d.pToY(t.exit); if(x0 == null || y0 == null || x1 == null || y1 == null) return;
      if(Math.max(x0, x1) < 0 || Math.min(x0, x1) > A.w) return;
      const col = t.open ? '#f0b90b' : t.pct > 0 ? '#5b9cf6' : '#f0616d';
      ctx.strokeStyle = col; ctx.globalAlpha = .7; ctx.setLineDash([3, 3]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.fillStyle = t.d > 0 ? '#26a69a' : '#ef5350'; ctx.beginPath();
      if(t.d > 0){ ctx.moveTo(x0, y0 + 2); ctx.lineTo(x0 - 5, y0 + 10); ctx.lineTo(x0 + 5, y0 + 10) } else { ctx.moveTo(x0, y0 - 2); ctx.lineTo(x0 - 5, y0 - 10); ctx.lineTo(x0 + 5, y0 - 10) } ctx.fill();
      if(!t.open){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x1, y1, 3.5, 0, 7); ctx.fill() } });
    ctx.restore();
  },
};
LC.overlays = LC.overlays || []; LC.overlays.push({ draw: (ctx, d, A) => BT.drawOn(ctx, d, A) });
})();

</script>
<script>
/* 호가 벽: 바이낸스·바이비트·OKX 호가를 10초마다 합쳐서, 지금가 근처에 유난히 두꺼운 가격대(벽)를 찾아요.
   두 번 넘게 연달아 보이면 벽으로 치고, 차트에 빗금 띠와 크기·버틴 시간·거리를 그려요.
   가격이 닿지 않았는데 사라지면 "빠짐"(✕), 가격이 지나가며 사라지면 "체결"로 남겨요. */
(() => {
const { store, esc } = LC;
const POLL = 10000, KEEP = 40;
const cfg = () => Object.assign({ on:true, alNear:true, alNew:false, alPull:true, nearPct:0.25, newPct:1, min:0 }, store.get('wallCfg', {}));
const fmtU = v => '$' + (v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : (v / 1e3).toFixed(0) + 'K');
const ago = ms => { const m = Math.floor(ms / 6e4); return m < 1 ? '방금' : m < 60 ? m + '분째' : Math.floor(m / 60) + '시간 ' + (m % 60) + '분째' };
const nice = x => { const e = 10 ** Math.floor(Math.log10(x)), f = x / e; return (f < 1.5 ? 1 : f < 3.5 ? 2.5 : f < 7.5 ? 5 : 10) * e };
const okxCt = {};

const W = LC.walls = {
  key: '', active: [], hist: {}, mid: 0, step: 0, src: [], err: '',
  cfg,
  /* 지금 보고 있는 차트 종목의 호가를 세 거래소에서 받아 합쳐요 */
  async books(sym, m){
    const fut = m === 'futures', base = sym.replace(/USDT$/, ''), out = [], jobs = [];
    jobs.push(LC.getJSON(`${LC.EP[m].rest}/depth?symbol=${sym}&limit=${fut ? 1000 : 1000}`).then(d => out.push({ ex:'Binance', b:d.bids, a:d.asks, k:1 })).catch(() => {}));
    jobs.push(LC.getJSON(`https://api.bybit.com/v5/market/orderbook?category=${fut ? 'linear' : 'spot'}&symbol=${sym}&limit=${fut ? 500 : 200}`)
      .then(d => d.result && d.result.b && out.push({ ex:'Bybit', b:d.result.b, a:d.result.a, k:1 })).catch(() => {}));
    if(!/^\d/.test(base)){ const id = fut ? `${base}-USDT-SWAP` : `${base}-USDT`;
      jobs.push((async () => { let k = 1;
        if(fut){ if(okxCt[id] == null){ const r = await LC.getJSON(`https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId=${id}`); const cv = r.data && r.data[0] ? +r.data[0].ctVal * (+r.data[0].ctMult || 1) : 0; if(cv > 0) okxCt[id] = cv } k = okxCt[id] }
        if(!k) return; const d = await LC.getJSON(`https://www.okx.com/api/v5/market/books?instId=${id}&sz=400`); const x = d.data && d.data[0]; if(x) out.push({ ex:'OKX', b:x.bids, a:x.asks, k }) })().catch(() => {})) }
    await Promise.all(jobs); return out;
  },
  /* 호가를 가격 칸으로 묶고, 둘레보다 훨씬 두꺼운 칸을 벽 후보로 */
  find(books){
    const B = books.find(x => x.ex === 'Binance') || books[0]; if(!B || !B.b.length || !B.a.length) return null;
    const mid = (+B.b[0][0] + +B.a[0][0]) / 2, step = nice(mid * 0.0005), lim = mid * 0.03;
    const agg = { b:new Map(), a:new Map() };
    books.forEach(bk => ['b', 'a'].forEach(s => bk[s].forEach(r => { const p = +r[0], q = +r[1] * bk.k; if(!(p > 0 && q > 0) || Math.abs(p - mid) > lim) return;
      const c = Math.round(p / step) * step; agg[s].set(c, (agg[s].get(c) || 0) + p * q) })));
    const all = [...agg.b.values(), ...agg.a.values()].sort((x, y) => x - y), med = all.length ? all[Math.floor(all.length / 2)] : 0;
    const c = cfg(), thr = Math.max(c.min || 0, med * 6, 2e5), out = [];
    ['b', 'a'].forEach(s => [...agg[s].entries()].filter(([p, u]) => u >= thr && (s === 'b' ? p < mid : p > mid)).sort((x, y) => y[1] - x[1]).slice(0, 3)
      .forEach(([p, usd]) => out.push({ side: s === 'b' ? 'bid' : 'ask', p, usd })));
    return { mid, step, list: out, src: books.map(x => x.ex) };
  },
  async poll(){
    const app = LC.app, v = app && app.v; if(!v || !cfg().on || document.hidden && Date.now() - (this.at || 0) < 60000) return;
    if(v.market === 'hl' || (LC.assets && LC.assets.group(v.sym, v.market) !== 'coin')){ this.key = ''; this.active = []; return }
    const key = v.sym + '|' + v.market; if(this.busy) return; this.busy = true;
    try{ const r = this.find(await this.books(v.sym, v.market)); if(!r || (LC.app.v && LC.app.v.sym + '|' + LC.app.v.market) !== key) return;
      if(key !== this.key){ this.key = key; this.active = [] }
      this.at = Date.now(); this.mid = r.mid; this.step = r.step; this.src = r.src; this.track(r, v);
    }catch(e){} finally{ this.busy = false } },
  /* 앞선 결과와 이어 붙여서 버틴 시간을 재고, 사라진 벽은 빠짐/체결로 남겨요 */
  track(r, v){
    const now = Date.now(), seen = new Set(), C = cfg(), H = this.hist[this.key] = this.hist[this.key] || [];
    r.list.forEach(w => { const a = this.active.find(x => x.side === w.side && Math.abs(x.p - w.p) <= r.step * 1.01 && !seen.has(x));
      if(a){ seen.add(a); Object.assign(a, { p:w.p, usd:w.usd, seen:now, miss:0, n:a.n + 1, peak:Math.max(a.peak, w.usd) }) }
      else { const n = { id: Math.random().toString(36).slice(2, 8), side:w.side, p:w.p, usd:w.usd, peak:w.usd, t0:now, seen:now, n:1, miss:0 }; this.active.push(n); seen.add(n) } });
    this.active.forEach(a => { if(seen.has(a)) return; a.miss++ });
    const dist = a => (a.p / r.mid - 1) * 100;
    this.active.forEach(a => { if(a.n === 2 && !a.ok){ a.ok = true; if(C.alNew && Math.abs(dist(a)) <= C.newPct) this.alert(a, 'new', r) }
      if(a.ok && !a.nearDone && C.alNear && Math.abs(dist(a)) <= C.nearPct){ a.nearDone = true; this.alert(a, 'near', r) } });
    const gone = this.active.filter(a => a.miss >= 2); this.active = this.active.filter(a => a.miss < 2);
    gone.forEach(a => { if(!a.ok) return; const since = (v.candles || []).filter(b => b.time * 1000 >= a.t0 - 6e4);
      const hit = a.side === 'ask' ? since.some(b => b.high >= a.p - r.step / 2) : since.some(b => b.low <= a.p + r.step / 2);
      const h = { ...a, t1: a.seen, end: hit ? 'filled' : 'pulled' }; H.push(h); if(H.length > KEEP) H.shift();
      if(!hit && C.alPull && Math.abs(dist(a)) <= Math.max(C.nearPct * 3, 0.6)) this.alert(h, 'pull', r) });
  },
  alert(a, kind, r){
    const ask = a.side === 'ask', name = ask ? '매도벽' : '매수벽', d = (a.p / r.mid - 1) * 100;
    const title = kind === 'near' ? `${name} ${fmtU(a.usd)} 가까이` : kind === 'new' ? `${name} ${fmtU(a.usd)} 생김` : `${name} ${fmtU(a.peak)} 빠짐`;
    const sub = `${r.src.join('·')} 합산 · ${kind === 'pull' ? '가격이 닿기 전에 사라졌어요' : kind === 'new' ? '방금 생겼어요' : ago(Date.now() - a.t0) + ' 그대로'} · 지금가에서 ${d > 0 ? '+' : ''}${d.toFixed(2)}%`;
    LC.bigAlert({ tag:'호가 벽', title, sub, dir: ask ? 'down' : 'up', dirText: ask ? '▼ 하락 쪽' : '▲ 상승 쪽', tone: kind === 'pull' ? 'pull' : ask ? 'down' : 'up' });
  },
  /* 차트 그리기 */
  drawOn(ctx, d, A){
    const v = d.v; if(!cfg().on || !v || v.replay || this.key !== v.sym + '|' + v.market) return;
    const H = this.hist[this.key] || [], now = Date.now(), col = s => s === 'ask' ? '240,97,109' : '38,198,218';
    const X = ms => { const x = d.tToX(Math.floor(ms / 1000)); return x == null ? null : x };
    ctx.save(); ctx.font = '600 11px "Noto Sans KR",system-ui,sans-serif'; ctx.textBaseline = 'middle';
    /* 지난 벽: 체결은 옅은 빗금, 빠짐은 ✕ 줄 */
    H.forEach(h => { const y = d.pToY(h.p); let x0 = X(h.t0), x1 = X(h.t1); if(y == null || x0 == null || x1 == null) return; x0 = Math.max(0, x0); x1 = Math.min(A.w, Math.max(x1, x0 + 10)); if(x1 <= 0 || x0 >= A.w) return;
      if(h.end === 'pulled'){ ctx.strokeStyle = `rgba(${col(h.side)},.85)`; ctx.lineWidth = 1.2; for(let x = x0 + 4; x < x1; x += 9){ ctx.beginPath(); ctx.moveTo(x - 3, y - 3); ctx.lineTo(x + 3, y + 3); ctx.moveTo(x + 3, y - 3); ctx.lineTo(x - 3, y + 3); ctx.stroke() } }
      else this.hatch(ctx, x0, x1, y, col(h.side), .35) });
    /* 지금 벽: 빗금 띠 + 오른쪽 라벨 */
    this.active.filter(a => a.ok).forEach(a => { const y = d.pToY(a.p); if(y == null || y < -10 || y > A.h + 10) return; let x0 = X(a.t0); x0 = x0 == null ? 0 : Math.max(0, x0);
      this.hatch(ctx, x0, A.w, y, col(a.side), .9);
      ctx.strokeStyle = `rgba(${col(a.side)},.55)`; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(x0, y); ctx.stroke(); ctx.setLineDash([]);
      const t = `${a.side === 'ask' ? '매도벽' : '매수벽'} ${fmtU(a.usd)} · ${ago(now - a.t0)} · ${a.p > this.mid ? '+' : ''}${((a.p / this.mid - 1) * 100).toFixed(2)}%`, w = ctx.measureText(t).width + 12, lx = A.w - w - 6, ly = y + (a.side === 'ask' ? -14 : 14);
      ctx.fillStyle = 'rgba(11,12,15,.82)'; ctx.strokeStyle = `rgba(${col(a.side)},.9)`; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(lx, ly - 9, w, 18, 4) : ctx.rect(lx, ly - 9, w, 18); ctx.fill(); ctx.stroke();
      ctx.fillStyle = `rgb(${col(a.side)})`; ctx.fillText(t, lx + 6, ly + .5) });
    ctx.restore();
  },
  hatch(ctx, x0, x1, y, rgb, alpha){ const h = 7; ctx.save(); ctx.beginPath(); ctx.rect(x0, y - h / 2, x1 - x0, h); ctx.clip();
    ctx.fillStyle = `rgba(${rgb},${alpha * .12})`; ctx.fillRect(x0, y - h / 2, x1 - x0, h);
    ctx.strokeStyle = `rgba(${rgb},${alpha})`; ctx.lineWidth = 1.4; ctx.beginPath(); for(let x = x0 - h; x < x1 + h; x += 6){ ctx.moveTo(x, y + h / 2); ctx.lineTo(x + h, y - h / 2) } ctx.stroke(); ctx.restore() },
  modal(){ const c = cfg();
    LC.modal('호가 벽', `<p class="muted" style="margin:0 0 10px">바이낸스·바이비트·OKX 호가를 10초마다 합쳐서, 지금가 ±3% 안에서 주변보다 6배 넘게 두꺼운 가격대를 벽으로 표시해요. 20초 넘게 버틴 것만 벽으로 쳐요.</p>
      <div class="wl-set">
        <label class="chk"><input type="checkbox" id="wlOn" ${c.on ? 'checked' : ''}> 차트에 호가 벽 표시</label>
        <label class="chk"><input type="checkbox" id="wlNear" ${c.alNear ? 'checked' : ''}> 가격이 벽에 가까워지면 알림 (<input class="inp num wl-n" type="number" step="0.05" min="0.05" id="wlNearP" value="${c.nearPct}">% 안)</label>
        <label class="chk"><input type="checkbox" id="wlPull" ${c.alPull ? 'checked' : ''}> 가까운 벽이 닿기 전에 빠지면 알림</label>
        <label class="chk"><input type="checkbox" id="wlNew" ${c.alNew ? 'checked' : ''}> 새 벽이 생기면 알림 (<input class="inp num wl-n" type="number" step="0.1" min="0.1" id="wlNewP" value="${c.newPct}">% 안)</label>
        <label>최소 크기 (USD, 0이면 자동)<input class="inp num" type="number" min="0" step="100000" id="wlMin" value="${c.min || 0}"></label>
      </div>
      <div class="row-end"><button class="btn" id="wlTest">알림 미리 보기</button><span style="flex:1"></span><button class="btn pri" id="wlOk">저장</button></div>`, (mb, close) => {
      const q = s => mb.querySelector(s);
      q('#wlTest').onclick = () => LC.bigAlert({ tag:'호가 벽', title:'매도벽 $12.20M 가까이', sub:'Binance·Bybit·OKX 합산 · 14분째 그대로 · 지금가에서 +0.19%', dir:'down', dirText:'▼ 하락 쪽', tone:'down' });
      q('#wlOk').onclick = () => { store.set('wallCfg', { on:q('#wlOn').checked, alNear:q('#wlNear').checked, alPull:q('#wlPull').checked, alNew:q('#wlNew').checked,
        nearPct: Math.max(0.05, +q('#wlNearP').value || 0.25), newPct: Math.max(0.1, +q('#wlNewP').value || 1), min: Math.max(0, +q('#wlMin').value || 0) }); close(); this.poll() } }, 'mid') },
};
LC.overlays = LC.overlays || []; LC.overlays.push({ draw: (ctx, d, A) => W.drawOn(ctx, d, A) });
const start = () => { if(!LC.app || !LC.app.v){ setTimeout(start, 1000); return } W.poll(); setInterval(() => W.poll(), POLL) };
setTimeout(start, 2500);
})();

<script>
/* 하이퍼리퀴드: 고래 포지션, 고래 움직임, 청산 감지, 청산 지도 */
(() => {
const { esc, store } = LC;
const API = 'https://api.hyperliquid.xyz/info';
const N_WHALES = 120, POLL_MS = 45000;
const post = body => LC.fetchT(API, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) }, 10000).then(r => { if(!r.ok) throw new Error(r.status); return r.json() });
const toCoin = sym => { const b = sym.replace(/USDT$/, ''); return /^1000/.test(b) ? 'k' + b.slice(4) : b };
const toSym = coin => (/^k[A-Z]/.test(coin) ? '1000' + coin.slice(1) : coin) + 'USDT';
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const HL = LC.hl = {
  whales: [], pos: {}, marks: {}, moves: [], liqs: [], ready: false, lastPoll: 0,
  async start(){
    if(this.started) return; this.started = true;
    try{ await this.loadWhales() }catch(e){ this.err = '하이퍼리퀴드 순위표를 못 불러왔어요'; LC.bus.emit('hl', 'err'); return }
    this.loadMarks(); setInterval(() => { if(!document.hidden) this.loadMarks() }, 15000);
    this.poll(); setInterval(() => { if(!document.hidden || Date.now() - this.lastPoll > 180000) this.poll() }, POLL_MS);
    /* 탭을 다시 보면 밀린 조회를 바로 해요 */
    document.addEventListener('visibilitychange', () => { if(!document.hidden){ this.loadMarks(); if(Date.now() - this.lastPoll > POLL_MS) this.poll() } });
  },
  /* 순위표에서 계좌 규모가 큰 활동 계정 120개를 골라요 (6시간마다 새로) */
  async loadWhales(){
    const c = store.get('hlWhales', null);
    if(c && Date.now() - c.t < 6*36e5 && c.list.length){ this.whales = c.list; return }
    const lb = await LC.getJSON('https://stats-data.hyperliquid.xyz/Mainnet/leaderboard');
    const perf = (r, w) => { const x = r.windowPerformances.find(p => p[0] === w); return x ? x[1] : {pnl:0, vlm:0} };
    this.whales = lb.leaderboardRows.filter(r => +r.accountValue > 1e6 && +perf(r, 'month').vlm > 0)
      .sort((a, b) => b.accountValue - a.accountValue).slice(0, N_WHALES)
      .map(r => ({ a:r.ethAddress, av:+r.accountValue, mp:+perf(r, 'month').pnl, name:r.displayName || '' }));
    store.set('hlWhales', { t:Date.now(), list:this.whales });
  },
  async loadMarks(){
    try{ const [meta, ctx] = await post({type:'metaAndAssetCtxs'}); meta.universe.forEach((u, i) => { this.marks[u.name] = +ctx[i].markPx }) }catch(e){}
  },
  async poll(){
    if(this.polling) return; this.polling = true;
    const list = [...this.whales]; let i = 0;
    const worker = async () => { while(i < list.length){ const w = list[i++]; try{ await this.check(w) }catch(e){} await sleep(120) } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    this.polling = false; this.ready = true; this.lastPoll = Date.now(); LC.bus.emit('hl', 'poll');
  },
  async check(w){
    const st = await post({ type:'clearinghouseState', user:w.a });
    const now = Date.now(), prev = this.pos[w.a];
    const cur = (st.assetPositions || []).map(x => { const p = x.position;
      return { coin:p.coin, szi:+p.szi, entry:+p.entryPx, val:+p.positionValue, upnl:+p.unrealizedPnl, liq: p.liquidationPx ? +p.liquidationPx : null, lev: p.leverage ? +p.leverage.value : null } });
    this.pos[w.a] = { t:now, list:cur, av:+(st.marginSummary || {}).accountValue || w.av };
    if(!prev) return;
    /* 이전과 비교해서 고래 움직임과 청산을 찾아요 */
    for(const p of prev.list){
      const n = cur.find(x => x.coin === p.coin && Math.sign(x.szi) === Math.sign(p.szi));
      const was = Math.abs(p.szi), now2 = n ? Math.abs(n.szi) : 0, mark = this.marks[p.coin] || p.entry;
      if(now2 < was * 0.7){
        const long = p.szi > 0, nearLiq = p.liq && (long ? mark <= p.liq * 1.02 : mark >= p.liq * 0.98);
        let liqFill = null;
        if(nearLiq){ try{ const f = await post({ type:'userFillsByTime', user:w.a, startTime:prev.t - 5000, endTime:now + 1000 }); liqFill = f.find(x => x.coin === p.coin && x.liquidation) }catch(e){} }
        const usd = (was - now2) * (liqFill ? +liqFill.px : mark);
        if(liqFill) this.addLiq({ coin:p.coin, a:w.a, long, usd, px:+liqFill.px, T:+liqFill.time });
        else if(usd >= 2e5) this.addMove({ kind: now2 ? '줄임' : '종료', coin:p.coin, a:w.a, long, usd, px:mark, T:now });
      }
    }
    for(const n of cur){
      const p = prev.list.find(x => x.coin === n.coin && Math.sign(x.szi) === Math.sign(n.szi));
      const add = (Math.abs(n.szi) - (p ? Math.abs(p.szi) : 0)) * (this.marks[n.coin] || n.entry);
      if(add >= 2e5) this.addMove({ kind: p ? '늘림' : '진입', coin:n.coin, a:w.a, long:n.szi > 0, usd:add, px:this.marks[n.coin] || n.entry, T:now });
    }
  },
  addMove(m){ this.moves.unshift(m); this.moves = this.moves.slice(0, 200); LC.bus.emit('hl', 'move');
    if(m.usd >= 1e6) LC.toast(`고래 ${m.long ? '롱' : '숏'} ${m.kind} · ${m.coin} $${LC.fmtBig(m.usd)}`, m.long ? 'up' : 'down', 6000) },
  addLiq(l){
    this.liqs.unshift(l); this.liqs = this.liqs.slice(0, 200); LC.bus.emit('hl', 'liq');
    const F = LC.panels.find(p => p.id === 'flow'); if(F && F.onLiq) F.onLiq({ ex:'Hyperliquid', s:toSym(l.coin), long:l.long, p:l.px, usd:l.usd, T:l.T });
    LC.toast(`하이퍼리퀴드 고래 ${l.long ? '롱' : '숏'} 청산 · ${l.coin} $${LC.fmtBig(l.usd)}`, 'alert', 8000); LC.beep(l.long ? 300 : 900, 0.2);
  },
  /* 한 코인의 고래 포지션 전체 */
  positions(coin){
    const out = [];
    Object.entries(this.pos).forEach(([a, s]) => s.list.forEach(p => { if(!coin || p.coin === coin) out.push({ ...p, a }) }));
    return out.sort((x, y) => y.val - x.val);
  }
};

/* 차트 위 청산 지도: 고래 포지션의 청산가를 가격대별로 모아 오른쪽에 막대로 */
const MAP = {
  draw(ctx, dr, A){
    const P = LC.panels.find(p => p.id === 'whale'); if(!P || !P.cfg.map) return;
    const v = dr.v; if(v.market !== 'futures') return;
    const list = HL.positions(toCoin(v.sym)).filter(p => p.liq); if(!list.length) return;
    const top = v.series.coordinateToPrice(0), bot = v.series.coordinateToPrice(A.h); if(top == null || bot == null) return;
    const bins = 60, step = (top - bot) / bins, buck = new Array(bins).fill(null).map(() => ({l:0, s:0}));
    list.forEach(p => { const i = Math.floor((top - p.liq) / step); if(i >= 0 && i < bins) buck[i][p.szi > 0 ? 'l' : 's'] += p.val });
    const max = Math.max(...buck.map(b => b.l + b.s)); if(!max) return;
    const h = A.h / bins, W = Math.min(160, A.w * 0.25);
    buck.forEach((b, i) => { if(!b.l && !b.s) return; const y = i * h;
      const wl = b.l / max * W, ws = b.s / max * W;
      ctx.fillStyle = 'rgba(240,97,109,.55)'; ctx.fillRect(A.w - wl, y + 1, wl, h - 2);
      ctx.fillStyle = 'rgba(91,156,246,.55)'; ctx.fillRect(A.w - wl - ws, y + 1, ws, h - 2);
      if(b.l + b.s >= max * 0.35){ ctx.font = '10px  "Noto Sans KR", sans-serif'; ctx.fillStyle = '#e8eef6'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText('$' + LC.fmtBig(b.l + b.s), A.w - wl - ws - 4, y + h/2); ctx.textAlign = 'left' } });
    if(P.cfg.entries) list.slice(0, 12).forEach(p => { const y = dr.pToY(p.entry); if(y == null) return;
      ctx.strokeStyle = p.szi > 0 ? 'rgba(91,156,246,.8)' : 'rgba(240,97,109,.8)'; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(A.w - 220, y); ctx.lineTo(A.w, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '10px  "Noto Sans KR", sans-serif'; ctx.fillStyle = ctx.strokeStyle; ctx.fillText(`${p.szi > 0 ? '롱' : '숏'} $${LC.fmtBig(p.val)}`, A.w - 218, y - 3) });
  }
};
LC.overlays = LC.overlays || []; LC.overlays.push(MAP);

/* 오른쪽 창: 고래 */
const W = {
  id:'whale', label:'고래', icon:'<path d="M3 13c2-4 7-6 11-5 3 .7 5 3 7 2-1 3-3 5-6 5H9l-3 3v-3c-2-.5-3-1-3-2z"/><circle cx="15" cy="11" r=".8"/>',
  tab:'coin', cfg: Object.assign({ map:true, entries:false }, store.get('whaleCfg', {})),
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="sub-tabs"><button data-t="coin" class="on">이 종목</button><button data-t="all">전체</button><button data-t="moves">움직임</button><button data-t="liqs">청산</button></div>
      <div class="flow-ctl"><label class="chk"><input type="checkbox" data-c="map" ${this.cfg.map?'checked':''}>차트에 청산 지도</label>
        <label class="chk"><input type="checkbox" data-c="entries" ${this.cfg.entries?'checked':''}>고래 진입가</label><span class="dim wh-st"></span></div>
      <div class="wh-sum"></div><div class="feed wh-feed"></div>`;
    el.querySelector('.sub-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.tab = b.dataset.t;
      el.querySelectorAll('.sub-tabs button').forEach(x => x.classList.toggle('on', x === b)); this.render() };
    el.querySelector('.flow-ctl').onchange = e => { const k = e.target.dataset.c; if(k){ this.cfg[k] = e.target.checked; store.set('whaleCfg', this.cfg) } };
    el.querySelector('.wh-feed').onclick = e => { const r = e.target.closest('[data-s]'); if(r && !e.target.closest('a')) app.openSymbol(r.dataset.s, 'futures') };
    LC.bus.on('hl', () => { if(!this.el.hidden) this.render() });
    HL.start();
    setInterval(() => { if(!this.el.hidden) this.status() }, 1000);
  },
  onSymbol(){ if(!this.el.hidden) this.render() },
  onShow(on){ if(on) this.render() },
  status(){ const s = this.el.querySelector('.wh-st');
    s.textContent = HL.err ? HL.err : !HL.ready ? `고래 ${HL.whales.length}명 불러오는 중…` : `고래 ${HL.whales.length}명 · ${Math.round((Date.now() - HL.lastPoll)/1000)}초 전` },
  row(p){ const long = p.szi > 0, mark = HL.marks[p.coin], dist = p.liq && mark ? (p.liq/mark - 1)*100 : null;
    return `<div class="frow wh" data-s="${esc(toSym(p.coin))}"><span><b class="${long?'up':'down'}">${long?'롱':'숏'}</b> ${this.tab === 'all' ? `<b>${esc(p.coin)}</b> ` : ''}<a class="dim" href="https://hypurrscan.io/address/${esc(p.a)}" target="_blank" rel="noopener">${short(p.a)}</a></span>
      <span class="num">$${LC.fmtBig(p.val)}${p.lev ? ` <small class="dim">${p.lev}x</small>` : ''}</span><span class="num ${p.upnl >= 0 ? 'up' : 'down'}">${p.upnl >= 0 ? '+' : ''}${LC.fmtBig(p.upnl)}</span>
      <small class="num dim wh-2">진입 ${LC.fmtPx(p.entry)} · 청산 ${p.liq ? LC.fmtPx(p.liq) + (dist != null ? ` (${LC.fmtPct(dist)})` : '') : '없음'}</small></div>` },
  render(){
    this.status();
    const sum = this.el.querySelector('.wh-sum'), feed = this.el.querySelector('.wh-feed'), v = this.app.v;
    if(!HL.ready){ sum.innerHTML = ''; feed.innerHTML = '<div class="empty">하이퍼리퀴드 큰 계정들의 포지션을 모으는 중이에요. 처음엔 1분쯤 걸려요.</div>'; return }
    if(this.tab === 'coin' || this.tab === 'all'){
      const coin = v ? toCoin(v.sym) : 'BTC', list = HL.positions(this.tab === 'coin' ? coin : null).slice(0, 80);
      const L = list.filter(p => p.szi > 0), S = list.filter(p => p.szi < 0), sv = a => a.reduce((s, p) => s + p.val, 0);
      const avg = a => { const q = a.reduce((s, p) => s + Math.abs(p.szi), 0); return q ? a.reduce((s, p) => s + p.entry*Math.abs(p.szi), 0) / q : null };
      const lv = sv(L), svv = sv(S), r = lv + svv ? lv / (lv + svv) * 100 : 50;
      sum.innerHTML = this.tab === 'coin' ? `<div class="wh-head"><b>${esc(coin)}</b> 고래 ${list.length}명 <span class="dim">(하이퍼리퀴드 계좌 상위 ${HL.whales.length}명 중)</span></div>
        <div class="imb"><div class="imb-bar"><i style="width:${r.toFixed(1)}%"></i></div><div class="imb-t num"><span class="up">롱 $${LC.fmtBig(lv)} · 평단 ${avg(L) ? LC.fmtPx(avg(L)) : '-'}</span><span class="down">숏 $${LC.fmtBig(svv)} · 평단 ${avg(S) ? LC.fmtPx(avg(S)) : '-'}</span></div></div>` : '<div class="wh-head">모든 코인에서 가장 큰 고래 포지션</div>';
      feed.innerHTML = list.length ? list.map(p => this.row(p)).join('') : '<div class="empty">이 코인에 포지션을 가진 고래가 없어요</div>';
    } else if(this.tab === 'moves'){
      sum.innerHTML = '<div class="wh-head">고래가 $20만 이상 들어가거나 줄이거나 끝낸 기록 <span class="dim">(45초마다 확인)</span></div>';
      feed.innerHTML = HL.moves.length ? HL.moves.map(m => `<div class="frow wh" data-s="${esc(toSym(m.coin))}"><span><b class="${m.long?'up':'down'}">${m.long?'롱':'숏'} ${m.kind}</b> <b>${esc(m.coin)}</b> <a class="dim" href="https://hypurrscan.io/address/${esc(m.a)}" target="_blank" rel="noopener">${short(m.a)}</a></span>
        <span class="num">$${LC.fmtBig(m.usd)}</span><span class="num dim">${LC.fmtClock(m.T)}</span></div>`).join('') : '<div class="empty">아직 기록이 없어요. 켜 두면 쌓여요.</div>';
    } else {
      sum.innerHTML = '<div class="wh-head">고래 계정의 실제 청산 <span class="dim">(포지션이 청산가 근처에서 사라지면 체결 기록으로 확인해요)</span></div>';
      feed.innerHTML = HL.liqs.length ? HL.liqs.map(l => `<div class="frow wh" data-s="${esc(toSym(l.coin))}"><span><b class="${l.long?'down':'up'}">${l.long?'롱 청산':'숏 청산'}</b> <b>${esc(l.coin)}</b> <a class="dim" href="https://hypurrscan.io/address/${esc(l.a)}" target="_blank" rel="noopener">${short(l.a)}</a></span>
        <span class="num">$${LC.fmtBig(l.usd)}</span><span class="num dim">${LC.fmtClock(l.T)}</span></div>`).join('') : '<div class="empty">아직 고래 청산이 없어요. 생기면 소리와 함께 여기와 체결·청산 탭에 떠요.</div>';
    }
  }
};
LC.panels.push(W);
})();

<script>
/* 하이퍼리퀴드 주식·원자재 시장(HIP-3: xyz, flx, km 등) 시세와 봉. 차트에서 market 'hl', 종목 이름은 'xyz:NVDA' 꼴 */
(() => {
const API = 'https://api.hyperliquid.xyz/info', WS = 'wss://api.hyperliquid.xyz/ws';
const post = b => fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(b) }).then(r => { if(!r.ok) throw new Error(r.status); return r.json() });
const SKIP_DEX = new Set(['hyna']);   /* 코인만 있는 거래소 */
const H = LC.hlm = {
  dexes: {}, ready: false, at: 0,
  async load(){
    if(this.busy) return; this.busy = true;
    try{
      if(!this.dexList){ const d = await post({ type:'perpDexs' }); this.dexList = d.filter(Boolean).filter(x => !SKIP_DEX.has(x.name)); this.dexList.forEach(x => this.dexes[x.name] = x.fullName || x.name) }
      const T = LC.app.tickers.hl = LC.app.tickers.hl || {}, I = LC.app.info.hl = LC.app.info.hl || {};
      const coinSet = new Set(Object.values(LC.app.info.futures || {}).filter(x => x.ut === 'COIN').map(x => x.base));
      await Promise.all(this.dexList.map(async dx => { try{ const [m, c] = await post({ type:'metaAndAssetCtxs', dex:dx.name });
        m.universe.forEach((u, i) => { const x = c[i]; if(!x || u.isDelisted) return; const name = u.name.split(':')[1] || u.name;
          if(coinSet.has(name) || coinSet.has(name.replace(/^k/, ''))) return;
          const px = +(x.midPx || x.markPx), prev = +x.prevDayPx; if(!px) return;
          T[u.name] = { c:px, P: prev ? (px/prev - 1)*100 : 0, q:+x.dayNtlVlm || 0, h:null, l:null };
          if(!I[u.name]) I[u.name] = { prec: Math.max(0, Math.min(6 - u.szDecimals, LC.autoPrec(px) + 1)), base:name, dex:dx.name } }) }catch(e){} }));
      this.ready = true; this.at = Date.now(); LC.bus && LC.bus.emit('hlTick');
    }catch(e){} finally{ this.busy = false }
  },
  start(){ if(this.timer) return; this.load(); this.timer = setInterval(() => { if(!document.hidden) this.load() }, 15000); document.addEventListener('visibilitychange', () => { if(!document.hidden && Date.now() - (this.at || 0) > 15000) this.load() }) },
  label(sym){ const d = sym.split(':')[0]; return 'HL·' + (d.length <= 4 ? d.toUpperCase() : d) },
  async klines(sym, tf, endMs){ const ms = LC.TFMS[tf] || 6e4, end = endMs || Date.now();
    const r = await post({ type:'candleSnapshot', req:{ coin:sym, interval:tf, startTime:end - 1000*ms, endTime:end } });
    return r.map(k => ({ time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, tbv:0 })) },
  stream(sym, tf, onBar, onState){
    const ws = LC.openWS(WS, m => { if(m.channel !== 'candle' || !m.data || m.data.s !== sym || m.data.i !== tf) return; const k = m.data;
      onBar({ time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, tbv:0 }) }, onState,
      w => w.send(JSON.stringify({ method:'subscribe', subscription:{ type:'candle', coin:sym, interval:tf } })));
    ws.keepAlive({ method:'ping' }, 45000); return ws }
};
})();

<script>
/* 내 도우미 서버(Cloudflare Workers) 연결: 텔레그램 가격 알림, 영어 뉴스 번역, 설정 동기화, 막힌 거래소 공지 */
(() => {
const { store, esc } = LC;
LC.bus = LC.bus || { h:{}, on(k, f){ (this.h[k] = this.h[k] || []).push(f) }, emit(k, d){ (this.h[k] || []).forEach(f => { try{ f(d) }catch(e){ console.error(e) } }) } };
const NOSYNC = /^lc_(newsSeen|cgMeta|trCache|srv|jrImg)/;   /* 일지 그림은 커서 이 기기에만 */
/* 동기화 합치기: 일지와 작도는 통째로 덮어쓰지 않고 기록(id) 단위로 합쳐요.
   지운 기록은 lc_tomb에 지운 시각을 남겨서, 다른 기기의 옛 자료 때문에 되살아나지 않게 해요 (90일 보관) */
const MERGEABLE = k => k === 'lc_journal' || k.startsWith('lc_dr_');
const parse = (s, d) => { try{ const v = JSON.parse(s); return v == null ? d : v }catch(e){ return d } };

/* 서버 자료를 이 기기에 반영. prefer 'remote'(받기): 설정은 서버 것으로, 'local'(올리기 전): 설정은 그대로 두고 일지·작도만 합쳐요 */

  const put = (k, v) => { if(localStorage.getItem(k) === v) return; try{ localStorage.setItem(k, v); changed = true }catch(e){} };
  put('lc_tomb', JSON.stringify(T));
  Object.keys(data).forEach(k => { if(!k.startsWith('lc_') || NOSYNC.test(k) || k === 'lc_tomb') return;

/* 지운 기록 표시: 일지·작도를 저장할 때 이전에 있던 id가 빠졌으면 남기고, 되돌리기로 돌아오면 지워요 */
function tombTrack(k, v){ if(!Array.isArray(v)) return; const old = store.get(k, []); if(!Array.isArray(old)) return;

  /* 자동 동기화: 바뀐 설정은 잠시 뒤 올리고, 열 때 다른 기기에서 바뀐 게 있으면 받아요 */

  /* 설정 창 */

      $('#sv-up1').onchange = $('#sv-nw').onchange = $('#sv-wk').onchange = $('#sv-cal').onchange = opt;

      else { $('#sv-up1').checked = $('#sv-nw').checked = $('#sv-wk').checked = $('#sv-cal').checked = true }
      $('#sv-test').onclick = run('#sv-tgst', async () => { await this.api('/tg/test', { method: 'POST', body: { code: this.code } }); return '보냈어요. 텔레그램을 확인해 보세요' });
      $('#sv-tr').onchange = e => { store.set('srvTr', e.target.checked); LC.news && LC.news.items.length && (e.target.checked ? this.translate(LC.news.items, () => LC.bus && LC.bus.emit && LC.bus.emit('newsTr')) : (LC.news.items.forEach(x => delete x.ko), LC.bus && LC.bus.emit && LC.bus.emit('newsTr'))) };
      paint(); if(this.on) this.check().then(paint, () => say('#sv-st', '서버에 닿지 않아요. 주소를 확인해 주세요', true)).then(tgStatus);
    }, 'mid');
  }
};
if(LC.Drawings){ const o = LC.Drawings.prototype.save; LC.Drawings.prototype.save = function(){ this.items.forEach(x => { if(x.type === 'alert' && !x.id) x.id = S.newId() }); o.call(this); if(this.items.some(x => x.type === 'alert') || this._hadAlert) S.pushAlerts(); this._hadAlert = this.items.some(x => x.type === 'alert') } }
{ const set0 = store.set.bind(store); store.set = (k, v) => { if(k === 'journal' || k.startsWith('dr_')) tombTrack(k, v); const ok = set0(k, v); if(!/^(srv|newsSeen|cgMeta|trCache)/.test(k)) S.autoQueue(k); return ok } }
S._merge = { mergeArr, applyRemote, tombTrack };
if(S.on){ S.check().then(i => { if(oldV(i) && Date.now() - store.get('srvOldWarn', 0) > 864e5){ store.set('srvOldWarn', Date.now());
    setTimeout(() => LC.toast(`내 서버가 옛 버전(v${i.v || '?'})이에요. 새 서버 코드(v${NEED_V})를 Cloudflare에 붙여넣으면 경제 일정과 주간 복기가 켜져요.`, 'alert', 12000), 3000) } }).catch(() => {}); S.autoPull(); if(LC.Drawings){ setTimeout(() => S.pull(), 4000); setInterval(() => S.pull(), 60000) } } else S.ready = true;
})();

<script>
/* 경제 일정: 이번 주·다음 주 미국 주요 지표 발표 (FOMC, CPI, 고용…)
   내 서버가 켜져 있으면 서버에서, 아니면 공개 일정 파일에서 바로 받아요. */
(() => {
const { esc, store } = LC;
const KO = [
  [/^Core CPI/i, '근원 소비자물가 (CPI)'], [/^CPI/i, '소비자물가 (CPI)'], [/^Core PPI/i, '근원 생산자물가 (PPI)'], [/^PPI/i, '생산자물가 (PPI)'],
  [/^Core PCE/i, '근원 PCE 물가'], [/^PCE Price/i, 'PCE 물가'], [/^Non-Farm Employment Change/i, '비농업 고용'], [/^ADP Non-Farm/i, 'ADP 민간 고용'],
  [/^ADP Weekly/i, 'ADP 주간 고용'], [/^Unemployment Rate/i, '실업률'], [/^Unemployment Claims/i, '신규 실업수당 청구'], [/^Average Hourly Earnings/i, '시간당 임금'],
  [/^Federal Funds Rate/i, '기준금리 발표 (FOMC)'], [/^FOMC Statement/i, 'FOMC 성명'], [/^FOMC Press Conference/i, 'FOMC 기자회견'], [/^FOMC Meeting Minutes/i, 'FOMC 의사록'],
  [/^FOMC Economic Projections/i, 'FOMC 경제 전망'], [/^Fed Chair .* Speaks/i, '연준 의장 연설'], [/^FOMC Member (.+) Speaks/i, (m) => `FOMC 위원 연설 (${m[1]})`],
  [/GDP q\/q/i, 'GDP 성장률'], [/^Retail Sales/i, '소매판매'], [/^Core Retail Sales/i, '근원 소매판매'], [/^ISM Manufacturing PMI/i, 'ISM 제조업 지수'],
  [/^ISM Services PMI/i, 'ISM 서비스업 지수'], [/^Flash Manufacturing PMI/i, '제조업 PMI 예비치'], [/^Flash Services PMI/i, '서비스업 PMI 예비치'],
  [/^JOLTS Job Openings/i, '구인 건수 (JOLTS)'], [/^CB Consumer Confidence/i, '소비자신뢰지수'], [/UoM Consumer Sentiment/i, '미시간대 소비자심리'],
  [/UoM Inflation Expectations/i, '미시간대 기대 인플레이션'], [/^Durable Goods Orders/i, '내구재 주문'], [/^Core Durable Goods/i, '근원 내구재 주문'],
  [/^Pending Home Sales/i, '미결 주택 판매'], [/^New Home Sales/i, '신규 주택 판매'], [/^Existing Home Sales/i, '기존 주택 판매'], [/^Building Permits/i, '건축 허가'],
  [/^Crude Oil Inventories/i, '원유 재고'], [/^Empire State Manufacturing/i, '뉴욕 제조업 지수'], [/^Philly Fed Manufacturing/i, '필라델피아 제조업 지수'],
  [/^Trade Balance/i, '무역수지'], [/^Prelim GDP/i, 'GDP 잠정치'], [/^Bank Holiday/i, '미국 휴장']];
const ko = t => { for(const [re, k] of KO){ const m = t.match(re); if(m) return typeof k === 'function' ? k(m) : k } return t };
const kst = (ms, o) => new Date(ms).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', hour12:false, ...o });
const left = ms => { const d = ms - Date.now(), a = Math.abs(d), mins = Math.round(a / 6e4), h = Math.floor(mins / 60), m = mins % 60;
  if(d < 0) return a < 30 * 6e4 ? '방금 발표' : '발표됨'; if(a < 6e4) return '곧 발표'; return (h >= 24 ? Math.floor(h / 24) + '일 ' + (h % 24) + '시간' : h ? h + '시간 ' + m + '분' : m + '분') + ' 뒤' };

const CAL = {
  list: (store.get('calCache', null) || {}).list || [], at: (store.get('calCache', null) || {}).at || 0,
  async load(force){
    if(!force && this.list.length && Date.now() - this.at < 30 * 6e4) return this.list;
    let rows = null;
    if(LC.srv && LC.srv.on){ try{ const d = await LC.srv.api('/calendar'); if(d && Array.isArray(d.list)) rows = d.list }catch(e){} }
    this.need = !rows && !this.list.length;
    if(rows){ this.list = rows.filter(x => x.country === 'USD' && ['High','Medium','Holiday'].includes(x.impact))
        .map(x => ({ t: Date.parse(x.date), title: x.title, ko: ko(x.title), imp: x.impact === 'High' ? 3 : x.impact === 'Medium' ? 2 : 0, fc: x.forecast || '', pv: x.previous || '', act: x.actual || '' }))
        .filter(x => isFinite(x.t)).sort((a, b) => a.t - b.t);
      this.at = Date.now(); store.set('calCache', { at:this.at, list:this.list }) }
    LC.bus && LC.bus.emit('cal', this.list); return this.list;
  },
  next(minImp = 3){ const now = Date.now(); return this.list.find(x => x.imp >= minImp && x.t > now - 30 * 6e4) },
  left, kst,
  /* 날짜별 목록 */
  html(opt = {}){
    const now = Date.now(), L = this.list.filter(x => x.imp >= (opt.min || 2));
    if(!L.length) return `<div class="empty">${this.at ? '이번 주 큰 일정이 없어요' : this.need ? '경제 일정은 우호 서버(v1.3 이상)를 거쳐 받아와요. 서버 코드를 새 버전으로 바꾸면 보여요.' : '일정을 불러오는 중이에요'}</div>`;
    let day = '';
    return L.map(x => { const d = kst(x.t, { month:'numeric', day:'numeric', weekday:'short' }), past = x.t < now - 30 * 6e4, soon = !past && x.t - now < 3 * 36e5;
      const h = d !== day ? `<div class="cal-d">${esc(d)}</div>` : ''; day = d;
      return h + `<div class="cal-r ${past ? 'past' : ''} ${soon ? 'soon' : ''}"><span class="num cal-t">${kst(x.t, { hour:'2-digit', minute:'2-digit' })}</span>
        <span class="cal-i i${x.imp}" title="${x.imp === 3 ? '영향 큼' : x.imp === 2 ? '영향 중간' : '휴장'}">${x.imp === 3 ? '★★★' : x.imp === 2 ? '★★' : '휴장'}</span>
        <span class="cal-n"><b>${esc(x.ko)}</b>${x.ko !== x.title ? `<small class="dim">${esc(x.title)}</small>` : ''}</span>
        <span class="cal-v num">${x.act ? `<b>${esc(x.act)}</b>` : ''}${x.fc ? `<small>예상 ${esc(x.fc)}</small>` : ''}${x.pv ? `<small class="dim">이전 ${esc(x.pv)}</small>` : ''}${!past ? `<small class="cal-l">${left(x.t)}</small>` : ''}</span></div>` }).join('');
  },
  modal(){
    LC.modal('경제 일정 · 미국', `<div class="cal-top"><label class="chk"><input type="checkbox" id="calHi" ${store.get('calHi', false) ? 'checked' : ''}> 영향 큰 것만</label>
      ${LC.app ? `<label class="chk"><input type="checkbox" id="calLn" ${store.get('calLines', true) ? 'checked' : ''}> 차트에 세로선 표시</label>` : ''}<span class="dim" style="margin-left:auto;font-size:11.5px">한국 시간 · 이번 주</span></div><div class="cal-list" id="calL"></div>`, mb => {
      const draw = () => { mb.querySelector('#calL').innerHTML = this.html({ min: store.get('calHi', false) ? 3 : 2 }) };
      mb.querySelector('#calHi').onchange = e => { store.set('calHi', e.target.checked); draw() };
      const ln = mb.querySelector('#calLn'); if(ln) ln.onchange = e => store.set('calLines', e.target.checked);
      draw(); this.load().then(draw) }, 'mid');
  },
  /* 차트: 영향 큰 일정에 세로 점선 */
  drawOn(ctx, d, A){
    if(!store.get('calLines', true) || !d.v || d.v.replay || (LC.TFMS[d.v.tf] || 0) > 4 * 36e5) return;
    const c = d.bars(); if(!c.length) return; const t0 = c[0].time, t1 = c[c.length - 1].time + 50 * d.tfSec();
    ctx.save(); ctx.font = '10.5px ' + (LC.FONT || 'sans-serif');
    this.list.filter(x => x.imp === 3 && x.t / 1000 >= t0 && x.t / 1000 <= t1).forEach(x => { const X = d.tToX(x.t / 1000); if(X == null || X < 0 || X > A.w) return;
      ctx.strokeStyle = 'rgba(240,185,11,.55)'; ctx.setLineDash([3, 4]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X, 18); ctx.lineTo(X, A.h); ctx.stroke(); ctx.setLineDash([]);
      const txt = x.ko.replace(/ \(.*\)$/, ''), w = ctx.measureText(txt).width + 8; ctx.fillStyle = 'rgba(240,185,11,.9)'; ctx.fillRect(X - w / 2, A.h - 18, w, 15);
      ctx.fillStyle = '#111'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(txt, X, A.h - 10.5); ctx.textAlign = 'left' });
    ctx.restore();
  },
  /* 차트 아래 막대: 다음 큰 일정까지 남은 시간 */
  chip(){
    const b = document.getElementById('calChip'); if(!b) return; const n = this.next();
    b.innerHTML = n ? `<span>📅</span><b>${esc(n.ko.replace(/ \(.*\)$/, ''))}</b><span class="num">${left(n.t)}</span>` : '<span>📅</span>경제 일정';
    b.title = n ? `${n.ko} · ${kst(n.t, { month:'numeric', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit' })} (한국 시간)${n.fc ? ' · 예상 ' + n.fc : ''}` : '이번 주 미국 경제 일정';
    b.classList.toggle('soon', !!n && n.t - Date.now() < 36e5 && n.t > Date.now() - 30 * 6e4);
  },
  init(){
    LC.overlays = LC.overlays || []; LC.overlays.push({ draw:(ctx, d, A) => this.drawOn(ctx, d, A) });
    const b = document.getElementById('calChip'); if(b) b.onclick = () => this.modal();
    const box = document.getElementById('calBox'), draw = () => { if(box) box.innerHTML = this.html({ min:2 }) };
    this.load().then(() => { this.chip(); draw() }).catch(() => {});
    setInterval(() => { this.chip(); draw() }, 30000); setInterval(() => this.load(true).then(() => { this.chip(); draw() }), 30 * 6e4);
    this.chip(); draw();
  }
};
LC.cal = CAL;
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(() => CAL.init(), 1200)); else setTimeout(() => CAL.init(), 1200);
})();

</script>
<script>
/* 뉴스 모으기·분류: 공개 RSS(rss2json 경유) + 거래소 공지 API. 섹션, 중요도(★), 상태(속보·전개중·확인·정정)를 제목으로 판단해요 */

const STOP = new Set('the a an of to in on for and or with by is are at as from its it this that be was were will has have after over new says said than into up out more amid how why what 등 및 위해 대한 관련 통해 이후 지난 올해 오늘 기자 뉴스 대해 가장 위한 것으로 있는 없는 한다 했다 밝혀 전망 분석 기대 경신 가능성 예상 소식 오전 오후 하루 이번 지금 최근 사상 최대 역대 까지 just new daily week report price prices market markets crypto happened today here whats could would should about january february march april may june july august september october november december jan feb mar apr jun jul aug sep sept oct nov dec monday tuesday wednesday thursday friday saturday sunday group first second third year years month months million billion trillion record top big high low back still set plans plan now may deal update updates latest live users firm firms company companies inc ltd ceo amid against while before during despite since under within week weeks day days hours time times other another some many most much very also been being had does did get gets got make makes made take takes took see sees one two three four five next last early late major key global news analysis exclusive breaking 이날 지난해 내년 이달 다음 처음 당시 현재 이상 이하 가운데 따르면 따라 경우 정도 위원 관계자 업계'.split(' '));

const words = t => (t.match(/[A-Za-z][A-Za-z0-9.]{2,}|[가-힣]{2,}/g) || []).map(w => { w = w.toLowerCase(); if(/[가-힣]/.test(w) && w.length > 2) w = w.replace(JOSA, ''); return w }).filter(w => w.length >= 2 && !STOP.has(w));

const NC = LC.news = {

  classify(it){
    const t = it.title;
    it.secs = SECTIONS.filter(s => s[3].test(t)).map(s => s[0]);
    it.stars = BIG.test(t) ? 3 : MID.test(t) ? 2 : 1;
    it.words = words(t);
    return it;
  },
  /* 비슷한 제목끼리 묶어서 몇 곳이 같은 걸 다뤘는지 세고, 상태를 정해요 */
  cluster(){
    const L = this.items; L.forEach(x => { x.cl = null });
    for(let i = 0; i < L.length; i++){ const a = L[i]; if(a.cl) continue; a.cl = a; a.clN = 1; a.clSrc = new Set([a.src]); const A = new Set(a.words); if(A.size < 2) continue;
      for(let j = i + 1; j < L.length; j++){ const b = L[j]; if(b.cl || Math.abs(a.t - b.t) > 12*36e5) continue; const B = b.words; let hit = 0; B.forEach(w => A.has(w) && hit++);
        if(hit >= 3 && hit / Math.min(A.size, B.length) >= 0.5){ b.cl = a; a.clN++; a.clSrc.add(b.src) } } }
    const now = Date.now();
    L.forEach(x => { const head = x.cl || x, n = head.clSrc ? head.clSrc.size : 1; x.srcN = n;
      if(n >= 3 && x.stars < 3) x.stars = Math.min(3, x.stars + 1);
      x.status = /정정|correction|corrected|clarif/i.test(x.title) ? 'fix' : (x.secs.includes('flash') && now - x.t < 36e5) ? 'flash' : (n >= 3 || now - x.t > 6*36e5) ? 'ok' : 'dev' });

  async load(){

    const all = []; let ok = 0; r.forEach(x => { if(x.status === 'fulfilled'){ ok++; all.push(...x.value) } });
    const seen = new Set(), now = Date.now();
    this.items = all.filter(x => { const k = x.title.slice(0, 36); if(seen.has(k)) return false; seen.add(k); return now - x.t < 4*864e5 }).sort((a, b) => b.t - a.t).map(x => this.classify(x));
    this.items.forEach(x => { if(!this.seenAt[x.link]) this.seenAt[x.link] = now; x.first = this.seenAt[x.link] });
    const keep = {}; this.items.forEach(x => keep[x.link] = this.seenAt[x.link]); this.seenAt = keep; LC.store.set('newsSeen', keep);
    this.cluster(); this.ok = ok; this.at = Date.now();
    if(LC.srv && LC.srv.on) LC.srv.translate(this.items, () => LC.bus && LC.bus.emit('newsTr'));
    return this.items;
  },
  isNew(x){ return Date.now() - x.t < 15*6e4 },
  trending(){
    const now = Date.now(), cnt = {}, prev = {};
    /* 같은 이야기 묶음은 한 번만 세서, 여러 이야기에 걸쳐 나오는 낱말만 뜨게 해요 */
    const per = new Map(); this.items.forEach(x => { const age = now - x.t, k = age < 3*36e5 ? 'c' : age < 6*36e5 ? 'p' : null; if(!k) return; const h = x.cl || x; if(!per.has(h)) per.set(h, { k, w:new Set() }); x.words.forEach(w => per.get(h).w.add(w)) });
    per.forEach(({ k, w }) => w.forEach(x => { const tgt = k === 'c' ? cnt : prev; tgt[x] = (tgt[x] || 0) + 1 }));
    return Object.entries(cnt).filter(([w, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([w, n]) => ({ w, n, isNew: !prev[w], up: (prev[w] || 0) < n }));
  },
  /* 거래소 공지: 바이낸스·바이비트·비트겟 공개 API */
  async loadNotices(){
    const kind = t => /delist|removal|상장\s?폐지|폐지|cease|terminate/i.test(t) ? 'delist' : /new listing|will list|lists?\b|listing|상장|launchpool|launch/i.test(t) ? 'list' : /maintenance|점검|suspend|upgrade|일시\s?중지/i.test(t) ? 'maint'
      : /caution|monitoring|warning|유의|주의/i.test(t) ? 'warn' : /campaign|event|promo|tournament|airdrop|reward|bonanza|giveaway|arena|이벤트|competition/i.test(t) ? 'event' : 'notice';
    const jobs = [
      (async () => { const d = await getJSON('https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=15');
        const out = []; d.data.catalogs.forEach(c => (c.articles || []).forEach(a => out.push({ ex:'Binance', title:a.title, t:a.releaseDate, link:`https://www.binance.com/en/support/announcement/detail/${a.code}` }))); return out })(),
      (async () => { const d = await getJSON('https://api.bybit.com/v5/announcements/index?locale=en-US&limit=30'); return d.result.list.map(a => ({ ex:'Bybit', title:a.title, t:+a.publishTime || +a.dateTimestamp, link:a.url })) })(),
      (async () => { const d = await getJSON('https://api.bitget.com/api/v2/public/annoucements?language=en_US'); return d.data.map(a => ({ ex:'Bitget', title:a.annTitle, t:+a.cTime, link:a.annUrl })) })(),
      /* 업비트·OKX는 브라우저에서 막혀 있어서 내 서버가 있을 때만 가져와요 */
      LC.srv && LC.srv.on ? LC.srv.notices() : Promise.resolve([])
    ];
    const r = await Promise.allSettled(jobs), all = []; r.forEach(x => x.status === 'fulfilled' && all.push(...x.value));
    this.notices = all.filter(x => x.title).map(x => ({ ...x, kind:kind(x.title) })).sort((a, b) => b.t - a.t).slice(0, 120); return this.notices;
  }
};

const I = p => `<svg viewBox="0 0 24 24">${p}</svg>`;

  ['m:kimp', '김치 프리미엄', '업비트·빗썸과 바이낸스 가격 차이', I('<path d="M12 3v18M5 8h14M7 16h10"/>')],
  ['m:temp', '시장 온도·공포 탐욕', '지금 BTC가 평소보다 얼마나 뜨거운지', I('<path d="M12 3v11"/><circle cx="12" cy="17" r="3"/>')],

];

    m.innerHTML = ITEMS.map(it => it === '-' ? '<hr>' : `<button data-w="${it[0]}">${it[3]}<span><b>${esc(it[1])}</b><small>${esc(it[2])}</small></span></button>`).join('');
    document.body.appendChild(m); const r = btn.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
    m.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + 'px'; m.style.top = Math.max(8, Math.min(r.bottom + 4, innerHeight - mh - 8)) + 'px';
    const off = e => { if(!m.contains(e.target) && e.target !== btn){ m.remove(); document.removeEventListener('mousedown', off, true) } };
    setTimeout(() => document.addEventListener('mousedown', off, true));

    const name = ITEMS.find(x => x[0] === w)[1];
    LC.modal(name + ' · 하이퍼리퀴드 고래', `<div class="wg-top"><span class="dim wg-st"></span><span style="flex:1"></span>${w === 'coins' ? '' : '<input class="inp sm wg-coin" style="width:110px" placeholder="코인 (예: ETH)">'}</div>
      <div class="wg-box"><canvas></canvas><div class="tip" hidden></div></div><div class="wg-foot"></div>`, (mb) => {
      const cv = mb.querySelector('canvas'), inp = mb.querySelector('.wg-coin'); let coin = toCoin(LC.app.v ? LC.app.v.sym : 'BTCUSDT');
      if(inp){ inp.value = coin; inp.onchange = () => { coin = inp.value.trim().toUpperCase() || 'BTC'; draw() } }
      const draw = () => { if(!document.body.contains(cv)) return clearInterval(t);
        const st = mb.querySelector('.wg-st'); st.textContent = LC.hl.ready ? `계좌 상위 ${LC.hl.whales.length}명 · ${Math.round((Date.now() - LC.hl.lastPoll)/1000)}초 전 갱신 · 45초마다 새로` : '고래 포지션을 모으는 중이에요 (처음엔 1분쯤)';
        try{ this[w](cv, coin, mb) }catch(e){ console.error(e) } };
      const t = setInterval(draw, 3000); setTimeout(draw, 50);
      LC.bus.on('hl', () => draw());
    }, true);
  },
  ctx(cv){ const r = cv.parentElement.getBoundingClientRect(), dpr = devicePixelRatio || 1; cv.width = r.width*dpr; cv.height = r.height*dpr; cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height); return [c, r.width, r.height] },
  css(k){ return getComputedStyle(document.documentElement).getPropertyValue(k).trim() },
  empty(c, W, H, t){ c.fillStyle = this.css('--dim'); c.font = '13px ' + LC.FONT; c.textAlign = 'center'; c.fillText(t, W/2, H/2); c.textAlign = 'left' },
  /* 청산 차트: 가격대별 고래 청산 금액 (롱은 아래, 숏은 위) + 누적선 */
  liq(cv, coin, mb){
    const [c, W, H] = this.ctx(cv), mark = LC.hl.marks[coin], L = LC.hl.positions(coin).filter(p => p.liq && p.liq > 0);
    if(!LC.hl.ready) return this.empty(c, W, H, '고래 포지션을 모으는 중이에요…');
    if(!L.length || !mark) return this.empty(c, W, H, `${coin}에 청산가가 있는 고래 포지션이 없어요`);
    const S = LC.chartStyle.get(), upC = S.borderUp, dnC = S.borderDown, dim = this.css('--dim'), line = this.css('--line'), ink = this.css('--ink');
    const near = L.filter(p => Math.abs(p.liq/mark - 1) < 0.35), lo = mark*0.7, hi = mark*1.3, bins = 70, step = (hi - lo)/bins, B = Array.from({length:bins}, () => ({l:0, s:0}));
    near.forEach(p => { const i = Math.floor((p.liq - lo)/step); if(i >= 0 && i < bins) B[i][p.szi > 0 ? 'l' : 's'] += p.val });
    const pad = {l:60, r:20, t:20, b:34}, X = v => pad.l + (v - lo)/(hi - lo)*(W - pad.l - pad.r), max = Math.max(...B.map(b => b.l + b.s), 1);
    let cumL = 0, cumS = 0; const cl = [], cs = []; for(let i = bins-1; i >= 0; i--){ cumL += B[i].l; cl[i] = cumL } for(let i = 0; i < bins; i++){ cumS += B[i].s; cs[i] = cumS }
    const cmax = Math.max(cumL, cumS, 1), Y = v => H - pad.b - v/max*(H - pad.t - pad.b)*0.92, YC = v => H - pad.b - v/cmax*(H - pad.t - pad.b)*0.92;
    c.font = '10px ' + LC.FONT; c.strokeStyle = line; c.fillStyle = dim;
    for(let k = 0; k <= 4; k++){ const y = H - pad.b - k/4*(H - pad.t - pad.b)*0.92; c.globalAlpha = .5; c.beginPath(); c.moveTo(pad.l, y); c.lineTo(W - pad.r, y); c.stroke(); c.globalAlpha = 1; c.fillText('$' + LC.fmtBig(max*k/4), 4, y + 3) }
    const bw = (W - pad.l - pad.r)/bins;
    B.forEach((b, i) => { const x = pad.l + i*bw; if(b.l){ c.fillStyle = LC.color.mkColor(LC.color.parseColor(dnC).hex, .75); c.fillRect(x + 1, Y(b.l), bw - 2, H - pad.b - Y(b.l)) }
      if(b.s){ c.fillStyle = LC.color.mkColor(LC.color.parseColor(upC).hex, .75); c.fillRect(x + 1, Y(b.l + b.s), bw - 2, Y(b.l) - Y(b.l + b.s)) } });
    c.lineWidth = 1.6; c.strokeStyle = dnC; c.beginPath(); cl.forEach((v, i) => { const x = pad.l + (i+.5)*bw; i ? c.lineTo(x, YC(v)) : c.moveTo(x, YC(v)) }); c.stroke();
    c.strokeStyle = upC; c.beginPath(); cs.forEach((v, i) => { const x = pad.l + (i+.5)*bw; i ? c.lineTo(x, YC(v)) : c.moveTo(x, YC(v)) }); c.stroke(); c.lineWidth = 1;

    c.fillStyle = '#f0b90b'; c.textAlign = 'center'; c.fillText('지금 ' + LC.fmtPx(mark), mx, pad.t - 6);
