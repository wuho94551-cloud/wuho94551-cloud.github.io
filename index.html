<script>
/* 지표 계산과 목록. calc(candles, params, ctx)는 {키: [{time,value,color?}]}를 돌려줘요 */
(() => {
const sma = (vals, p) => { const out = new Array(vals.length).fill(null); let s = 0;
  for(let i=0;i<vals.length;i++){ s += vals[i]; if(i>=p) s -= vals[i-p]; if(i>=p-1) out[i] = s/p } return out };
const ema = (vals, p) => { const out = new Array(vals.length).fill(null); const k = 2/(p+1); let e = null, sum = 0, n = 0;
  for(let i=0;i<vals.length;i++){ const v = vals[i]; if(v==null) continue;
    if(e==null){ sum += v; n++; if(n===p){ e = sum/p; out[i] = e } } else { e = v*k + e*(1-k); out[i] = e } } return out };
/* 앞쪽 빈 값(null)을 건너뛰는 단순 이동평균 */
const smaN = (vals, p) => { const out = new Array(vals.length).fill(null); const w = []; let sum = 0;
  for(let i=0;i<vals.length;i++){ const v = vals[i]; if(v==null) continue; w.push(v); sum += v; if(w.length>p) sum -= w.shift(); if(w.length===p) out[i] = sum/p } return out };
const rma = (vals, p) => { const out = new Array(vals.length).fill(null); let r = null, s = 0, n = 0;
  for(let i=0;i<vals.length;i++){ const v = vals[i]; if(v==null) continue;
    if(r==null){ s += v; n++; if(n===p){ r = s/p; out[i] = r } } else { r = (r*(p-1)+v)/p; out[i] = r } } return out };
const stdev = (vals, p, mean) => vals.map((_, i) => { if(mean[i]==null) return null; let s = 0;
  for(let j=i-p+1;j<=i;j++) s += (vals[j]-mean[i])**2; return Math.sqrt(s/p) });
const src = (c, key) => c.map(b => key==='hl2' ? (b.high+b.low)/2 : key==='hlc3' ? (b.high+b.low+b.close)/3 : b[key]);
const toSeries = (c, vals) => { const out = []; for(let i=0;i<c.length;i++) if(vals[i]!=null && isFinite(vals[i])) out.push({time:c[i].time, value:vals[i]}); return out };
const rsiCalc = (vals, p) => { const g = [null], l = [null];
  for(let i=1;i<vals.length;i++){ const d = vals[i]-vals[i-1]; g.push(Math.max(d,0)); l.push(Math.max(-d,0)) }
  const ag = rma(g.slice(1),p), al = rma(l.slice(1),p);
  return [null, ...ag.map((a,i) => a==null ? null : al[i]===0 ? 100 : 100 - 100/(1 + a/al[i]))] };
const trueRange = c => c.map((b,i) => i===0 ? b.high-b.low : Math.max(b.high-b.low, Math.abs(b.high-c[i-1].close), Math.abs(b.low-c[i-1].close)));

const wma = (vals, p) => vals.map((_, i) => { if(i < p-1) return null; let s = 0, w = 0; for(let j = 0; j < p; j++){ const v = vals[i-j]; if(v == null) return null; s += v*(p-j); w += p-j } return s/w });
const hma = (vals, p) => { const h = Math.max(1, Math.round(p/2)), q = Math.max(1, Math.round(Math.sqrt(p))); const a = wma(vals, h), b = wma(vals, p); return wma(a.map((x,i) => x == null || b[i] == null ? null : 2*x - b[i]), q) };
const maBy = (type, v, p) => type === 'EMA' ? ema(v,p) : type === 'WMA' ? wma(v,p) : type === 'HMA' ? hma(v,p) : type === 'RMA' ? rma(v,p) : sma(v,p);
const hiN = (c, i, n, k='high') => { let m = -Infinity; for(let j = Math.max(0, i-n+1); j <= i; j++) m = Math.max(m, c[j][k]); return m };
const loN = (c, i, n, k='low') => { let m = Infinity; for(let j = Math.max(0, i-n+1); j <= i; j++) m = Math.min(m, c[j][k]); return m };

const colorBars = (arr, upFn) => arr.map((d, i, a) => ({...d, color: upFn(d, i, a) ? U(.6) : D(.6)}));
/* 지표의 오름/내림 색은 차트 캔들 색(경계선)을 따라가요 */
const U = a => { const S = LC.chartStyle ? LC.chartStyle.get() : null; return S ? LC.color.mkColor(LC.color.parseColor(S.borderVisible ? S.borderUp : S.upColor).hex, a) : `rgba(91,156,246,${a})` };
const D = a => { const S = LC.chartStyle ? LC.chartStyle.get() : null; return S ? LC.color.mkColor(LC.color.parseColor(S.borderVisible ? S.borderDown : S.downColor).hex, a) : `rgba(209,212,220,${a})` };
/* VWT 설정 묶음 [기간, 배수]과 색 묶음 */
const VWT_PRE = { '빠르게':[50, 1.2], '기본':[100, 1.5], '느리게':[200, 2] };
const vwtCols = (p, st) => p.theme === '클래식' ? ['#26a69a', '#ef5350'] : p.theme === '차트색' ? [U(1), D(1)]
  : p.theme === '직접' ? [(st && st.opts && st.opts.bull) || '#00ffbb', (st && st.opts && st.opts.bear) || '#ff1744'] : ['#00ffbb', '#ff1744'];
const DEFS = {
  VOL:{ label:'거래량', overlay:true, params:{}, series:[{key:'v', type:'hist', scale:'vol'}],
    calc:c => ({ v: c.map(b => ({time:b.time, value:b.volume, color: b.close>=b.open ? U(.45) : D(.45)})) }) },
  MA:{ label:'이동평균선', overlay:true, params:{period:20, type:'SMA', source:'close'}, colors:['#f0b90b'], series:[{key:'m', type:'line'}],
    title:p => `${p.type} ${p.period}`,
    calc:(c,p) => { const v = src(c,p.source); return { m: toSeries(c, maBy(p.type, v, +p.period)) } } },
  MAS:{ label:'이동평균선 묶음', overlay:true, params:{source:'close', t1:'SMA', p1:7, t2:'SMA', p2:25, t3:'SMA', p3:99, t4:'EMA', p4:0, t5:'SMA', p5:0, t6:'SMA', p6:0, t7:'SMA', p7:0, t8:'SMA', p8:0}, colors:['#f0b90b', '#e05bd6', '#5b9cf6', '#ff9f43', '#2ec4b6', '#c38bff', '#f0616d', '#9aa4b2'], series:[{key:'m1',type:'line',name:'1번'},{key:'m2',type:'line',name:'2번'},{key:'m3',type:'line',name:'3번'},{key:'m4',type:'line',name:'4번'},{key:'m5',type:'line',name:'5번'},{key:'m6',type:'line',name:'6번'},{key:'m7',type:'line',name:'7번'},{key:'m8',type:'line',name:'8번'}],
    /* 기간을 0으로 두면 그 줄은 꺼져요. 한 지표에 최대 8줄 */
    title:p => 'MA ' + [1,2,3,4,5,6,7,8].filter(i => +p['p'+i] > 0).map(i => (p['t'+i] !== 'SMA' ? p['t'+i][0] : '') + p['p'+i]).join(' '),
    calc:(c,p) => { const v = src(c,p.source), o = {}; for(let i = 1; i <= 8; i++) o['m'+i] = +p['p'+i] > 0 ? toSeries(c, maBy(p['t'+i], v, +p['p'+i])) : []; return o } },
  RIBBON:{ label:'이동평균 리본 (EMA 20·50·100·200)', overlay:true, params:{}, colors:['#f0b90b','#ff9f43','#e05bd6','#5b9cf6'],
    series:[{key:'a',type:'line',name:'EMA 20'},{key:'b',type:'line',name:'EMA 50'},{key:'c',type:'line',name:'EMA 100'},{key:'d',type:'line',name:'EMA 200'}], title:()=>'EMA 20 50 100 200',
    calc:c => { const v = src(c,'close'); return { a:toSeries(c,ema(v,20)), b:toSeries(c,ema(v,50)), c:toSeries(c,ema(v,100)), d:toSeries(c,ema(v,200)) } } },
  KC:{ label:'켈트너 채널', overlay:true, params:{period:20, mult:2}, colors:['#2ec4b6','#8aa0b8','#2ec4b6'], series:[{key:'u',type:'line',name:'위'},{key:'m',type:'line',dash:true,name:'중심'},{key:'l',type:'line',name:'아래'}],
    fill:{kind:'between', a:'u', b:'l', color:'rgba(46,196,182,0.07)'}, title:p=>`KC ${p.period} ${p.mult}`,
    calc:(c,p) => { const m = ema(src(c,'close'), +p.period), a = rma(trueRange(c), +p.period);
      return { m:toSeries(c,m), u:toSeries(c,m.map((x,i)=>x==null||a[i]==null?null:x+p.mult*a[i])), l:toSeries(c,m.map((x,i)=>x==null||a[i]==null?null:x-p.mult*a[i])) } } },
  DC:{ label:'돈치안 채널', overlay:true, params:{period:20}, colors:['#5b9cf6','#8aa0b8','#5b9cf6'], series:[{key:'u',type:'line',name:'최고'},{key:'m',type:'line',dash:true,name:'중간'},{key:'l',type:'line',name:'최저'}],
    fill:{kind:'between', a:'u', b:'l', color:'rgba(91,156,246,0.06)'}, title:p=>`DC ${p.period}`,
    calc:(c,p) => { const n = +p.period, u = c.map((b,i) => i < n-1 ? null : hiN(c,i,n)), l = c.map((b,i) => i < n-1 ? null : loN(c,i,n));
      return { u:toSeries(c,u), l:toSeries(c,l), m:toSeries(c,u.map((x,i)=>x==null?null:(x+l[i])/2)) } } },
  ENV:{ label:'엔벨로프', overlay:true, params:{period:20, pct:2}, colors:['#ff9f43','#8aa0b8','#ff9f43'], series:[{key:'u',type:'line',name:'위'},{key:'m',type:'line',dash:true,name:'중심'},{key:'l',type:'line',name:'아래'}],
    title:p=>`ENV ${p.period} ${p.pct}%`, calc:(c,p) => { const m = sma(src(c,'close'), +p.period);
      return { m:toSeries(c,m), u:toSeries(c,m.map(x=>x==null?null:x*(1+p.pct/100))), l:toSeries(c,m.map(x=>x==null?null:x*(1-p.pct/100))) } } },
  ICHI:{ label:'일목균형표', overlay:true, params:{conv:9, base:26, span:52, disp:26}, colors:['#5b9cf6',D(1),U(1),'#f0a33b','#b38cff','#4caf50','#ef5350'],
    series:[{key:'t',type:'line',name:'전환선'},{key:'k',type:'line',name:'기준선'},{key:'a',type:'line',name:'선행 스팬 A'},{key:'b',type:'line',name:'선행 스팬 B'},{key:'g',type:'line',name:'래깅 스팬'},

    /* 최근 N개 봉의 거래량을 가격 줄마다 나눠 쌓아요. 봉이 걸친 가격 폭만큼 나눠 담고, 가장 많은 줄이 POC, POC에서 양옆으로 넓혀 거래량 va%를 담는 구간이 가치 영역이에요 */

    calc:(c,p) => { const n = Math.max(2, Math.round(+p.len)), P = [];

        const add = (t, price) => { const L = P[P.length - 1]; if(L && L.t === t){ if(t > 0 ? price > L.p : price < L.p){ L.p = price; L.i = i } return } P.push({ t, p:price, i }) };

  WR:{ label:'윌리엄스 %R', overlay:false, params:{period:14}, colors:['#b38cff'], series:[{key:'w',type:'line'}], levels:[-20,-50,-80], fill:{kind:'levels', a:0, b:2, color:'rgba(126,87,194,0.08)'}, title:p=>`%R ${p.period}`,

  AO:{ label:'오썸 오실레이터', overlay:false, params:{}, colors:[U(1)], series:[{key:'a',type:'hist'}], levels:[0], title:()=>'AO',

    calc:(c,p) => { const n = +p.period, u = [], d = []; c.forEach((b,i) => { if(i < n) return; let hi = i, lo = i; for(let j=i-n;j<=i;j++){ if(c[j].high >= c[hi].high) hi = j; if(c[j].low <= c[lo].low) lo = j }

  lock: SV('<rect x="4" y="8" width="10" height="7.5" rx="1.5"/><path d="M6 8V6a3 3 0 016 0v2"/>'), unlock: SV('<rect x="4" y="8" width="10" height="7.5" rx="1.5"/><path d="M6 8V6a3 3 0 015.6-1.5"/>'),
  gear: SV('<circle cx="9" cy="9" r="2.3"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2M4 4l1.4 1.4M12.6 12.6L14 14M4 14l1.4-1.4M12.6 5.4L14 4"/>'),
  trash: SV('<path d="M3.5 5h11M7 5V3h4v2M5 5l.8 10h6.4L13 5"/>'), more: '<svg viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="9" r="1.4"/></svg>',
  book: SV('<path d="M4 3h9.5a1 1 0 011 1v11a1 1 0 01-1 1H4z"/><path d="M7 7h5M7 10h5"/>'),
  eye: SV('<path d="M1.5 9S4.5 4 9 4s7.5 5 7.5 5-3 5-7.5 5S1.5 9 1.5 9z"/><circle cx="9" cy="9" r="2.2"/>'), eyeOff: SV('<path d="M1.5 9S4.5 4 9 4s7.5 5 7.5 5-3 5-7.5 5S1.5 9 1.5 9z"/><path d="M3 15L15 3"/>') };
const uid = () => Math.random().toString(36).slice(2, 9);

class Drawings {
  constructor(view){
    this.v = view; this.items = []; this.sel = null; this.draft = null; this.drag = null; this.undoStack = [];
    const cv = this.cv = document.createElement('canvas'); cv.className = 'draw-layer';
    view.box.appendChild(cv);
    this.ctx = cv.getContext('2d');
    this.bar = document.createElement('div'); this.bar.className = 'sel-bar'; view.box.appendChild(this.bar);
    const cap = {capture:true};
    ['pointerdown','mousedown','touchstart'].forEach(ev => view.box.addEventListener(ev, e => this.onDown(e), { capture:true, passive:false }));
    /* 손가락: 끌어서 그리기·옮기기 */
    /* 마우스: pointerdown을 막으면 브라우저가 mousemove·mouseup을 안 보내요. 그래서 끌기·지우개는 pointer로도 받아요 */
    const W = this._win = [], on = (t, f) => { window.addEventListener(t, f); W.push([t, f]) };
    on('pointermove', e => { if(e.pointerType === 'mouse'){ if(this.drag || this._erase) this.onMove(e); return }
      if(this.draft){ const {x, y} = this.pos(e), pt = this.ptAt(x, y); if(pt) this.draft.pts[this.draft.pts.length-1] = pt; if(this._tDraft && Math.hypot(e.clientX - this._tDraft.x, e.clientY - this._tDraft.y) > 12) this._tDraft.moved = true }
      else this.onMove(e) });
    on('pointerup', e => { if(e.pointerType === 'mouse'){ this.onUp(e); return }
      if(this.draft && this._tDraft && this._tDraft.moved){ const d = this.draft; if(d.pts.length >= (NEED[d.type] || 2)) this.finishDraft(); else d.pts.push({...d.pts[d.pts.length-1]}) }
      this._tDraft = null; this.onUp() });
    view.box.addEventListener('mousemove', e => this.onHover(e));
    on('mousemove', e => this.onMove(e));
    on('mouseup', e => this.onUp(e));
    view.box.addEventListener('dblclick', e => this.onDbl(e), cap);
    const loop = () => { if(this.dead) return; try{ this.render() }catch(e){ console.error(e) } requestAnimationFrame(loop) };
    requestAnimationFrame(loop);
  }
  destroy(){ this.dead = true; (this._win || []).forEach(([t, f]) => window.removeEventListener(t, f)); this._win = []; this.cv.remove(); this.bar.remove() }
  get app(){ return LC.app }
  key(){ return 'dr_' + this.v.sym }
  load(){ this.items = LC.store.get(this.key(), []); this.sel = null; this.draft = null; this.undoStack = []; this.updateBar() }
  save(){ LC.store.set(this.key(), this.items); this.app && this.app.views.forEach(o => { if(o !== this.v && o.sym === this.v.sym) o.drawings.load() }) }
  snapshot(){ this.undoStack.push(JSON.stringify(this.items)); if(this.undoStack.length > 50) this.undoStack.shift() }
  undo(){ const s = this.undoStack.pop(); if(s){ this.items = JSON.parse(s); this.sel = null; this.save(); this.updateBar() } }
  clear(){ if(!this.items.length) return; this.snapshot(); this.items = []; this.sel = null; this.save(); this.updateBar() }
  remove(it){ this.snapshot(); this.items = this.items.filter(x => x !== it); if(this.sel === it) this.sel = null; this.save(); this.updateBar() }

  /* 좌표 변환: 시간(초) ↔ x, 가격 ↔ y */
  bars(){ return this.v.shown }
  tfSec(){ return LC.TFMS[this.v.tf] / 1000 }
  tToL(t){ const c = this.bars(); if(!c.length) return null; const n = c.length, sec = this.tfSec();
    if(t >= c[n-1].time) return n-1 + (t - c[n-1].time)/sec;
    if(t <= c[0].time) return (t - c[0].time)/sec;
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    return lo + (t - c[lo].time)/(c[hi].time - c[lo].time) }
  /* 지표 칸이 다른 시간 점을 더할 수 있어서, 봉 시각 → 화면 좌표를 직접 이어 계산해요 */
  spacing(){ const ts = this.v.chart.timeScale(); const a = ts.logicalToCoordinate(0), b = ts.logicalToCoordinate(1); return (a != null && b != null && b !== a) ? b - a : 6 }
  tToX(t){ const c = this.bars(); if(!c.length) return null; const ts = this.v.chart.timeScale(), n = c.length, sec = this.tfSec();
    if(t >= c[n-1].time){ const xl = ts.timeToCoordinate(c[n-1].time); return xl == null ? null : xl + (t - c[n-1].time)/sec * this.spacing() }
    if(t <= c[0].time){ const x0 = ts.timeToCoordinate(c[0].time); return x0 == null ? null : x0 + (t - c[0].time)/sec * this.spacing() }
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    const x0 = ts.timeToCoordinate(c[lo].time); if(x0 == null || t === c[lo].time) return x0;
    const x1 = ts.timeToCoordinate(c[hi].time); return x1 == null ? x0 : x0 + (x1 - x0) * (t - c[lo].time)/(c[hi].time - c[lo].time) }
  xToT(x){ const c = this.bars(); if(!c.length) return null; const ts = this.v.chart.timeScale(), n = c.length, sec = this.tfSec(), sp = this.spacing();
    const xl = ts.timeToCoordinate(c[n-1].time), x0 = ts.timeToCoordinate(c[0].time);
    if(xl != null && x > xl + sp/2) return c[n-1].time + Math.round((x - xl)/sp) * sec;
    if(x0 != null && x < x0 - sp/2) return c[0].time + Math.round((x - x0)/sp) * sec;
    const t = ts.coordinateToTime(x); if(t == null) return null;
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    return Math.abs(c[hi].time - t) < Math.abs(t - c[lo].time) ? c[hi].time : c[lo].time }
  pToY(p){ return this.v.series.priceToCoordinate(p) }
  yToP(y){ return this.v.series.coordinateToPrice(y) }
  area(){ const ch = this.v.chart; return { w: ch.timeScale().width(), h: ch.panes()[0].getHeight() } }
  snap(t, p, y){
    if(!this.app || !this.app.magnet) return p;
    const c = this.bars(); const l = Math.round(this.tToL(t)); const b = c[l]; if(!b) return p;
    let best = p, bd = 1e9; [b.open, b.high, b.low, b.close].forEach(v => { const d = Math.abs(this.pToY(v) - y); if(d < bd){ bd = d; best = v } });
    return bd < 40 ? best : p;
  }
  pos(e){ const r = this.v.box.getBoundingClientRect(); const pt = e.touches ? e.touches[0] : e; return { x: pt.clientX - r.left, y: pt.clientY - r.top } }
  ptAt(x, y){ const t = this.xToT(x); let p = this.yToP(y); if(t == null || p == null) return null; p = this.snap(t, p, y); return { t, p } }

  /* 마우스 */
  onDown(e){
    if(this.bar.contains(e.target)) return;
    if(e.type === 'touchstart'){ if(this._tStop){ this._tStop = false; e.stopPropagation(); if(e.cancelable) e.preventDefault() } return }
    if(e.type === 'pointerdown') this._handled = false;
    if(e.button > 0) return;
    const touch = e.type === 'pointerdown' && e.pointerType !== 'mouse'; this._tStop = false;
    if(e.type === 'mousedown' && this._handled){ this._handled = false; e.stopPropagation(); e.preventDefault(); return }
    const {x, y} = this.pos(e); const A = this.area();
    if(x > A.w || (y > A.h && !this.draft)) return;
    this.app && this.app.setActive(this.v);
    const tool = this.app ? this.app.tool : 'cross';
    const stop = () => { e.stopPropagation(); e.preventDefault(); if(e.type === 'pointerdown') this._handled = true; if(touch) this._tStop = true };
    /* 지우개: 누른 작도를 지우고, 누른 채 끌면 지나가는 작도도 지워요 */
    if(tool === 'eraser'){ const h = this.hitTest(x, y); if(h) this.remove(h.item); this._erase = true; stop(); return }
    if(tool !== 'cross'){
      const pt = this.ptAt(x, y); if(!pt){ stop(); return }
      if(this.draft){ const d = this.draft; d.pts[d.pts.length-1] = pt; if(d.pts.length >= (NEED[d.type] || 2)) this.finishDraft(); else { d.pts.push({...pt}); if(touch) this._tDraft = { x:e.clientX, y:e.clientY, moved:false } } stop(); return }
      if(ONE.includes(tool)){
        if(tool === 'text'){ this.askText(txt => { if(!txt) return; this.add({type:'text', pts:[pt], text:txt}) }); stop(); return }
        this.add({type:tool, pts:[pt]}); stop(); return;
      }
      this.draft = { id:uid(), type:tool, pts:[pt, {...pt}], ...defOf(tool) }; if(touch) this._tDraft = { x:e.clientX, y:e.clientY, moved:false };
      stop(); return;
    }
    if(this.app && this.app.drawLocked) return;
    const hit = this.hitTest(x, y);
    if(hit){
      this.sel = hit.item; this.updateBar();
      if(!hit.item.locked){ this.snapshot(); this.drag = { item: hit.item, handle: hit.handle, start: this.ptAt(x, y), orig: JSON.parse(JSON.stringify(hit.item.pts)), moved:false } }
      stop();
    } else if(this.sel){ this.sel = null; this.updateBar() }
  }
  onHover(e){
    const {x, y} = this.pos(e);
    if(this.draft){ const pt = this.ptAt(x, y); if(pt) this.draft.pts[this.draft.pts.length-1] = pt; return }
    if(this.drag) return;
    const tool = this.app ? this.app.tool : 'cross';
    const er = tool === 'eraser', hit = (tool === 'cross' && !(this.app && this.app.drawLocked)) || er ? this.hitTest(x, y) : null;
    this.v.box.classList.toggle('hover-draw', !!hit && !er); this.v.box.classList.toggle('erase-hit', !!hit && er); this.hoverErase = er && hit ? hit.item : null;
    this.v.box.classList.toggle('tool-on', tool !== 'cross');
  }
  onMove(e){
    if(this._erase){ if(!e.buttons && e.pointerType !== 'touch'){ this._erase = false; return } const {x, y} = this.pos(e), h = this.hitTest(x, y); if(h) this.remove(h.item); return }
    if(!this.drag) return;
    const {x, y} = this.pos(e); const pt = this.ptAt(x, y); if(!pt || !this.drag.start) return;
    const d = this.drag, it = d.item; d.moved = true;
    if(d.handle == null){
      const dt = pt.t - d.start.t, dp = pt.p - d.start.p;
      it.pts = d.orig.map(o => ({ t: ['hline','alert'].includes(it.type) ? o.t : o.t + dt, p: it.type === 'vline' ? o.p : o.p + dp }));
      if(it.type === 'alert'){ it.fired = false; it.id = null; delete it.dir }
    } else if(it.type === 'pos' && d.handle > 0){
      it.pts[d.handle] = { t: it.pts[d.handle].t, p: pt.p };
      if(d.handle === 1) it.pts[1].t = pt.t;
    } else {
      it.pts[d.handle] = pt;
      if(it.type === 'pos' && d.handle === 0){ const dp = pt.p - d.orig[0].p; it.pts[1].p = d.orig[1].p + dp; it.pts[2].p = d.orig[2].p + dp }
    }
  }
  onUp(){ this._erase = false; if(this.drag){ if(this.drag.moved) this.save(); else this.undoStack.pop(); this.drag = null } }
  onDbl(e){ const {x, y} = this.pos(e); const hit = this.hitTest(x, y);
    if(!hit) return; e.stopPropagation(); e.preventDefault();
    if(hit.item.type === 'text') this.askText(t => { if(t){ this.snapshot(); hit.item.text = t; this.save() } }, hit.item.text);
    else { this.sel = hit.item; this.updateBar(); this.settings(hit.item) } }
  finishDraft(){
    const d = this.draft; this.draft = null;
    if(d.type === 'zoom'){ this.zoomTo(d); this.app && this.app.setTool('cross'); return }
    if(d.type === 'measure'){ this.measure = d; setTimeout(() => { if(this.measure === d) this.measure = null }, 8000); this.app && this.app.setTool('cross'); return }
    if(d.type === 'pos'){ const e = d.pts[0].p, s = d.pts[1].p; d.pts[2] = { t: d.pts[1].t, p: e + 2*(e - s) } }
    this.add(d);
  }
  add(it){
    this.snapshot(); it.id = it.id || uid(); Object.assign(it, { ...defOf(it.type), ...it });
    this.items.push(it); this.sel = it; this.save(); this.updateBar();
    if(this.app && !this.app.keepTool) this.app.setTool('cross');
  }
  askText(cb, cur = ''){
    LC.modal('글자 넣기', `<input class="inp" id="txtIn" maxlength="120" value="${LC.esc(cur)}" placeholder="차트에 적을 글자"><div class="row-end"><button class="btn pri" id="txtOk">넣기</button></div>`, (mb, close) => {
      const i = mb.querySelector('#txtIn'); i.focus();
      const ok = () => { const v = i.value.trim(); close(); cb(v) };
      mb.querySelector('#txtOk').onclick = ok; i.onkeydown = e => { if(e.key === 'Enter') ok() };
    });
  }

  /* 선택된 개체 도구 막대: 끌어서 옮길 수 있고, 색·굵기·선 모양·설정·잠금·지우기·더보기 */
  remember(it){ const all = LC.store.get('drawDef', {}) || {}; all[it.type] = { color:it.color, width:it.width, dash:it.dash, ...(it.type === 'text' ? { size:it.size } : {}) }; LC.store.set('drawDef', all) }
  change(it, f){ if(!this._chg || this._chg !== it){ this.snapshot(); this._chg = it; clearTimeout(this._chgT) } this._chgT = setTimeout(() => this._chg = null, 1200); f(it); this.save(); this.remember(it) }
  placeBar(){ const b = this.bar, pos = LC.store.get('selBarPos', null), W = this.v.box.clientWidth, H = this.v.box.clientHeight;
    if(pos){ b.style.right = 'auto'; b.style.left = Math.max(4, Math.min(W - b.offsetWidth - 4, pos.x)) + 'px'; b.style.top = Math.max(4, Math.min(H - b.offsetHeight - 4, pos.y)) + 'px' }
    else { b.style.left = 'auto'; b.style.right = '74px'; b.style.top = '8px' } }
  updateBar(){
    const it = this.sel;
    if(!it || !this.items.includes(it)){ this.bar.style.display = 'none'; document.querySelectorAll('.cpop.for-draw').forEach(p => p.close ? p.close() : p.remove()); return }
    const txt = it.type === 'text', W = it.width || 1.5, Dd = +it.dash || 0, bs = ['solid','dotted','dashed','dashed'][Dd];
    this.bar.style.display = 'flex';
    this.bar.innerHTML = `<span class="sb-grip" title="끌어서 옮기기 (두 번 누르면 제자리)">${BI.grip}</span>
      <button data-a="color" title="색">${txt ? BI.T : BI.pen}<i class="sb-cu" style="background:${LC.esc(it.color)}"></i></button>
      ${txt ? `<button data-a="size" class="sb-w" title="글자 크기"><span class="sb-px num">${it.size || 13}px</span></button>`
        : `<button data-a="width" class="sb-w" title="선 굵기"><i class="sb-ln" style="border-top-width:${Math.max(1, Math.round(W))}px"></i><span class="sb-px num">${W}px</span></button>
      <button data-a="dash" class="sb-w" title="선 모양: ${DASH_N[Dd]}"><i class="sb-ln wide" style="border-top-style:${bs}"></i></button>`}
      ${it.type === 'pos' && LC.journal ? `<span class="sb-sep"></span><button data-a="jr" class="sb-jr ${it.jid ? 'on' : ''}" title="매매 일지에 기록 (진입·손절·목표가 채워져요)">${BI.book}<span class="sb-px">${it.jid ? '일지 ✓' : '일지'}</span></button>` : ''}
      <span class="sb-sep"></span>
      <button data-a="set" title="설정">${BI.gear}</button>
      <button data-a="lock" class="${it.locked ? 'on' : ''}" title="${it.locked ? '잠금 풀기' : '잠그기 (움직이지 않게)'}">${it.locked ? BI.lock : BI.unlock}</button>
      <button data-a="del" title="지우기 (Delete)">${BI.trash}</button>
      <button data-a="more" title="더 보기">${BI.more}</button>`;
    this.placeBar();
    this.bar.onmousedown = e => e.stopPropagation();
    this.bar.onpointerdown = e => { e.stopPropagation(); const g = e.target.closest('.sb-grip'); if(!g) return; e.preventDefault();
      const br = this.v.box.getBoundingClientRect(), r0 = this.bar.getBoundingClientRect(), dx = e.clientX - r0.left, dy = e.clientY - r0.top;
      const mv = ev => { LC.store.set('selBarPos', { x: ev.clientX - br.left - dx, y: ev.clientY - br.top - dy }); this.placeBar() };
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up) };
      addEventListener('pointermove', mv); addEventListener('pointerup', up) };
    this.bar.ondblclick = e => { if(e.target.closest('.sb-grip')){ LC.store.set('selBarPos', null); this.placeBar() } };
    this.bar.onclick = e => { const b = e.target.closest('button'); if(!b) return; const r = b.getBoundingClientRect(), a = b.dataset.a;
      if(a === 'color'){ const open = document.querySelector('.cpop.for-draw'); if(open){ open.close(); return }
        const pop = LC.color.pick(b, it.color, v => { this.change(it, x => x.color = v); b.querySelector('.sb-cu').style.background = v }); pop.classList.add('for-draw') }
      else if(a === 'width') LC.ctxMenu(r.left, r.bottom + 4, WIDTHS.map(w => [`${w === W ? '✓ ' : '　'}${w}px`, () => { this.change(it, x => x.width = w); this.updateBar() }]));
      else if(a === 'dash') LC.ctxMenu(r.left, r.bottom + 4, DASH_N.map((n, k) => [`${k === Dd ? '✓ ' : '　'}${n}`, () => { this.change(it, x => x.dash = k); this.updateBar() }]));
      else if(a === 'size') LC.ctxMenu(r.left, r.bottom + 4, SIZES.map(z => [`${z === (it.size || 13) ? '✓ ' : '　'}${z}px`, () => { this.change(it, x => x.size = z); this.updateBar() }]));
      else if(a === 'set') this.settings(it);
      else if(a === 'jr') LC.journal.fromPos(it, this.v);
      else if(a === 'lock'){ it.locked = !it.locked; this.save(); this.updateBar() }
      else if(a === 'del') this.remove(it);
      else if(a === 'more') LC.ctxMenu(r.right - 190, r.bottom + 4, [['복제', () => this.clone(it)], ['맨 앞으로', () => this.order(it, 1)], ['맨 뒤로', () => this.order(it, -1)],
        ['숨기기', () => { it.hidden = true; this.sel = null; this.save(); this.updateBar() }], '-', ['작도 목록…', () => this.listModal()], ['이 종목 작도 모두 지우기', () => this.clear()]]);
    };
  }
  clone(it){ const c = JSON.parse(JSON.stringify(it)), sh = 5 * this.tfSec(); c.id = null; c.fired = false; delete c.dir; c.pts.forEach(p => p.t += sh); this.add(c) }
  order(it, d){ this.snapshot(); this.items = this.items.filter(x => x !== it); d > 0 ? this.items.push(it) : this.items.unshift(it); this.save() }
  /* 확대 도구: 끌어서 고른 시간만큼 크게. 축소 버튼은 바로 전 화면으로 돌아가요 */
  zoomTo(d){ const ts = this.v.chart.timeScale(), a = this.tToL(d.pts[0].t), b = this.tToL(d.pts[1].t); if(a == null || b == null || Math.abs(b - a) < 3) return;
    (this.v.zoomStack = this.v.zoomStack || []).push(ts.getVisibleLogicalRange()); ts.setVisibleLogicalRange({ from:Math.min(a, b), to:Math.max(a, b) }) }
  zoomOut(){ const ts = this.v.chart.timeScale(), z = this.v.zoomStack && this.v.zoomStack.pop();
    if(z) return ts.setVisibleLogicalRange(z); const r = ts.getVisibleLogicalRange(); if(r){ const w = r.to - r.from; ts.setVisibleLogicalRange({ from:r.from - w/2, to:r.to + w/2 }) } }

  /* 작도 설정 창: 모양 / 좌표 (바꾸면 바로 보여요, 취소하면 되돌려요) */
  settings(it){
    const C = LC.color, snap = JSON.stringify(it), prec = this.v.prec, txt = it.type === 'text', W = it.width || 1.5, Dd = +it.dash || 0;
    const PN = it.type === 'pos' ? ['진입','손절','목표'] : it.type === 'xabcd' ? ['X','A','B','C','D'] : it.type === 'channel' ? ['점 1','점 2','폭'] : it.pts.length > 1 ? ['시작','끝'] : ['가격'];
    const tstr = t => new Date(t * 1000).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', hour12:false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    const html = `<div class="sub-tabs st-tabs"><button data-t="0" class="on">모양</button>${it.type === 'vline' ? '' : '<button data-t="1">좌표</button>'}</div>
      <div class="st-pane ds" data-t="0">
        <div class="srow"><label>색</label><span class="sctl">${C.colorField('dc', it.color)}</span></div>

          <div class="srow"><label>글자 크기</label><span class="sctl"><select id="dsSize">${SIZES.map(z => `<option ${z === (it.size || 13) ? 'selected' : ''}>${z}</option>`).join('')}</select></span></div>

            <select id="dsD" title="선 모양">${DASH_N.map((n, k) => `<option value="${k}" ${k === Dd ? 'selected' : ''}>${n}</option>`).join('')}</select></span></div>`}
        ${FILLED.includes(it.type) ? `<div class="srow"><label>채우기 진하기</label><span class="sctl"><input type="range" id="dsF" min="0" max="60" value="${Math.round((it.fill != null ? it.fill : .12) * 100)}"><b class="num" id="dsFv">${Math.round((it.fill != null ? it.fill : .12) * 100)}%</b></span></div>` : ''}
        ${['hline','hray'].includes(it.type) ? `<div class="srow"><label><input type="checkbox" id="dsLab" ${it.noLabel ? '' : 'checked'}> 오른쪽에 가격 표시</label></div>` : ''}

          <div class="srow"><label>내 계좌 (USDT)</label><span class="sctl"><input class="inp num" type="number" step="any" min="0" id="dsAc" value="${rc.acct || ''}" placeholder="예: 5000"></span></div>
          <div class="srow"><label>한 번에 잃어도 되는 %</label><span class="sctl"><input class="inp num" type="number" step="any" min="0" id="dsRk" value="${rc.pct || 1}"></span></div>
          <p class="muted" style="margin:6px 0 0">넣어 두면 진입 이름표에 손절 폭에 맞춘 권장 규모가 보여요.</p>` })() : ''}
      </div>

        <span class="sctl"><input class="inp num" type="number" step="any" data-pi="${i}" value="${+p.p.toFixed(prec)}"></span></div>`).join('')}</div>
      <div class="row-end"><button class="btn" id="dsDef">이 모양을 기본으로</button><button class="btn" id="dsCancel">취소</button><button class="btn pri" id="dsOk">확인</button></div>`;

        this.save(); this.updateBar() };

  }
  /* 작도 목록: 이 종목에 그린 것들을 한눈에 (숨기기·잠그기·지우기) */
  listModal(){
    const prec = this.v.prec;
    const body = () => this.items.length ? this.items.map((it, i) => `<div class="dl-row ${it.hidden ? 'off' : ''}" data-i="${i}"><i class="dl-c" style="background:${LC.esc(it.color)}"></i>
        <span class="dl-n">${NAMES[it.type] || it.type}${it.type === 'text' ? ` <small class="dim">${LC.esc((it.text || '').slice(0, 20))}</small>` : ''}</span><span class="dl-p num dim">${LC.fmtN(it.pts[0].p, prec)}</span>
        <button data-a="eye" title="${it.hidden ? '보이기' : '숨기기'}">${it.hidden ? BI.eyeOff : BI.eye}</button><button data-a="lock" class="${it.locked ? 'on' : ''}" title="잠그기">${it.locked ? BI.lock : BI.unlock}</button><button data-a="del" title="지우기">${BI.trash}</button></div>`).reverse().join('')
      : '<div class="empty">이 종목에 그린 게 없어요</div>';
    LC.modal(`작도 목록 · ${this.v.sym}`, `<div class="dl">${body()}</div><div class="row-end"><button class="btn" id="dlShow">모두 보이기</button><button class="btn" id="dlUndo">되돌리기</button></div>`, mb => {
      const L = mb.querySelector('.dl'), re = () => { L.innerHTML = body() };
      L.onclick = e => { const r = e.target.closest('.dl-row'); if(!r) return; const it = this.items[+r.dataset.i], a = (e.target.closest('button') || {}).dataset?.a; if(!it) return;
        if(a === 'eye'){ it.hidden = !it.hidden; if(it.hidden && this.sel === it) this.sel = null; this.save() }
        else if(a === 'lock'){ it.locked = !it.locked; this.save() }
        else if(a === 'del') this.remove(it);
        else if(!it.hidden){ this.sel = it; this.app && this.app.setTool('cross') }
        this.updateBar(); re() };
      mb.querySelector('#dlShow').onclick = () => { this.items.forEach(i => i.hidden = false); this.save(); re() };
      mb.querySelector('#dlUndo').onclick = () => { this.undo(); re() };
    });
  }

  /* 맞춤 검사 */
  hitTest(x, y){
    if(this.app && this.app.drawHidden) return null;
    const A = this.area();
    const segD = (px, py, x1, y1, x2, y2) => { const dx = x2-x1, dy = y2-y1; const L = dx*dx+dy*dy; let t = L ? ((px-x1)*dx+(py-y1)*dy)/L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px-x1-t*dx, py-y1-t*dy) };
    const list = this.sel ? [this.sel, ...this.items.filter(i => i !== this.sel).reverse()] : [...this.items].reverse();
    for(const it of list){
      if(it.hidden) continue;
      const P = it.pts.map(p => ({x: this.tToX(p.t), y: this.pToY(p.p)}));
      if(P.some(p => p.x == null || p.y == null)) continue;
      const TOL = Math.max(6, (it.width || 1.5) / 2 + 4);
      if(it === this.sel) for(let i=0;i<P.length;i++) if(Math.hypot(P[i].x-x, P[i].y-y) < 8) return {item:it, handle:i};
      const [a, b] = P; let hit = false;
      switch(it.type){
        case 'trend': case 'measure': case 'arrow': hit = segD(x,y,a.x,a.y,b.x,b.y) < TOL; break;
        case 'ellipse': { const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2, rx = Math.abs(b.x-a.x)/2 || 1, ry = Math.abs(b.y-a.y)/2 || 1; hit = ((x-cx)/(rx+TOL))**2 + ((y-cy)/(ry+TOL))**2 <= 1; break }
        case 'prange': { const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x, l+30); hit = x>=l-TOL && x<=r+TOL && y>=Math.min(a.y,b.y)-TOL && y<=Math.max(a.y,b.y)+TOL; break }
        case 'channel': { const c = P[2] || b, k = (b.y-a.y)/((b.x-a.x)||1e-9), dy = c.y - (a.y + k*(c.x-a.x));
          hit = segD(x,y,a.x,a.y,b.x,b.y) < TOL || segD(x,y,a.x,a.y+dy,b.x,b.y+dy) < TOL || segD(x,y,a.x,a.y+dy/2,b.x,b.y+dy/2) < TOL; break }
        case 'xabcd': for(let i = 1; i < P.length; i++) if(segD(x,y,P[i-1].x,P[i-1].y,P[i].x,P[i].y) < TOL) hit = true; break;
        case 'ray': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); const ex = b.x >= a.x ? A.w : 0; hit = segD(x,y,a.x,a.y,ex,a.y+k*(ex-a.x)) < TOL; break }
        case 'ext': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); hit = segD(x,y,0,a.y-k*a.x,A.w,a.y+k*(A.w-a.x)) < TOL; break }
        case 'hline': case 'alert': hit = Math.abs(y-a.y) < TOL; break;
        case 'hray': hit = Math.abs(y-a.y) < TOL && x >= a.x - TOL; break;
        case 'vline': hit = Math.abs(x-a.x) < TOL; break;
        case 'rect': { const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x), t = Math.min(a.y,b.y), bo = Math.max(a.y,b.y); hit = x>=l-TOL && x<=r+TOL && y>=t-TOL && y<=bo+TOL; break }
        case 'fib': { const l = Math.min(a.x,b.x); hit = x >= l-TOL && FIB.some(f => Math.abs(y - this.pToY(it.pts[1].p + (it.pts[0].p-it.pts[1].p)*f)) < TOL); break }
        case 'pos': { const c = P[2]; const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x); const ys = [a.y,b.y,c.y]; hit = x>=l && x<=r && y>=Math.min(...ys)-TOL && y<=Math.max(...ys)+TOL; break }
        case 'text': { const fs = it.size || 13; this.ctx.font = fs + 'px  "Noto Sans KR", sans-serif'; const w = this.ctx.measureText(it.text||'').width; hit = x>=a.x-4 && x<=a.x+w+8 && y>=a.y-fs-5 && y<=a.y+6; break }
      }
      if(hit) return {item:it, handle:null};
    }
    return null;
  }

  /* 그리기 */
  render(){
    const cv = this.cv, ctx = this.ctx, dpr = window.devicePixelRatio || 1;
    const W = this.v.box.clientWidth, H = this.v.box.clientHeight;
    if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.width = W+'px'; cv.style.height = H+'px' }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    if(!this.bars().length) return;
    const A = this.area();
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,A.w,A.h); ctx.clip();
    if(this.v.bubbles) this.v.bubbles.draw(ctx, this, A);
    (LC.overlays || []).forEach(o => { try{ o.draw(ctx, this, A) }catch(e){} });
    const hidden = this.app && this.app.drawHidden;
    const list = hidden ? [] : this.items.filter(i => !i.hidden);
    if(this.draft) list.push(this.draft);
    if(this.measure) list.push(this.measure);
    for(const it of list) this.drawItem(ctx, it, A);
    ctx.restore();
    if(this.sel && !hidden && this.items.includes(this.sel)){
      const a = this.sel.pts.map(p => ({x:this.tToX(p.t), y:this.pToY(p.p)}));
      a.forEach(p => { if(p.x==null||p.y==null) return; ctx.setLineDash([]); ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fillStyle = '#0b0c0f'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = LC.color.parseColor(this.sel.color).hex; ctx.stroke() });
    }
  }
  label(ctx, txt, x, y, bg, fg = '#0b0c0f', align = 'left'){
    ctx.font = '11px  "Noto Sans KR", sans-serif'; const w = ctx.measureText(txt).width + 8;
    const lx = align === 'right' ? x - w : align === 'center' ? x - w/2 : x;
    ctx.fillStyle = bg; ctx.fillRect(lx, y-9, w, 18); ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(txt, lx+4, y);
  }
  drawItem(ctx, it, A){
    const P = it.pts.map(p => ({x:this.tToX(p.t), y:this.pToY(p.p)}));
    if(P.some(p => p.x == null || p.y == null)) return;
    const [a, b] = P; const col = it.color || '#f0b90b'; const prec = this.v.prec;
    const lw = it.width || 1.5, dash = (DASHES[+it.dash || 0] || []).map(v => v * Math.max(1, lw * .8)), fa = it.fill != null ? it.fill : 0.12;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash);
    const line = (x1,y1,x2,y2) => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke() };
    const lab = (txt, x, y, al) => { if(!it.noLabel) this.label(ctx, txt, x, y, col, '#0b0c0f', al) };
    switch(it.type){
      case 'trend': line(a.x,a.y,b.x,b.y); break;
      case 'arrow': { line(a.x,a.y,b.x,b.y); const ang = Math.atan2(b.y-a.y, b.x-a.x), hl = 9 + lw*2; ctx.setLineDash([]); ctx.beginPath();
        ctx.moveTo(b.x - hl*Math.cos(ang-0.45), b.y - hl*Math.sin(ang-0.45)); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x - hl*Math.cos(ang+0.45), b.y - hl*Math.sin(ang+0.45)); ctx.stroke(); break }
      case 'ellipse': { const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2; ctx.beginPath(); ctx.ellipse(cx, cy, Math.abs(b.x-a.x)/2, Math.abs(b.y-a.y)/2, 0, 0, 7);
        ctx.globalAlpha = fa; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); break }
      case 'prange': { const l = Math.min(a.x,b.x), w = Math.max(Math.abs(b.x-a.x), 30), cx = l + w/2, up = b.y < a.y, d = it.pts[1].p - it.pts[0].p;
        ctx.globalAlpha = fa; ctx.fillRect(l, Math.min(a.y,b.y), w, Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        line(l,a.y,l+w,a.y); line(l,b.y,l+w,b.y); ctx.setLineDash([]); line(cx,a.y,cx,b.y);
        ctx.beginPath(); ctx.moveTo(cx-5, b.y + (up?6:-6)); ctx.lineTo(cx, b.y); ctx.lineTo(cx+5, b.y + (up?6:-6)); ctx.stroke();
        this.label(ctx, `${d >= 0 ? '+' : ''}${LC.fmtN(d, prec)} (${LC.fmtPct(d/it.pts[0].p*100)})`, cx, b.y + (up?-13:13), col, '#0b0c0f', 'center'); break }
      case 'channel': { const c = P[2]; line(a.x,a.y,b.x,b.y); if(!c) break; const k = (b.y-a.y)/((b.x-a.x)||1e-9), dy = c.y - (a.y + k*(c.x-a.x));
        line(a.x,a.y+dy,b.x,b.y+dy); ctx.globalAlpha = fa; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(b.x,b.y+dy); ctx.lineTo(a.x,a.y+dy); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = .55; ctx.setLineDash([4,4]); ctx.lineWidth = 1; line(a.x,a.y+dy/2,b.x,b.y+dy/2); ctx.globalAlpha = 1; break }
      case 'xabcd': { const L = 'XABCD', pp = it.pts;
        ctx.globalAlpha = fa; [[0,1,2],[2,3,4]].forEach(tr => { if(P[tr[2]]){ ctx.beginPath(); tr.forEach((i, j) => j ? ctx.lineTo(P[i].x,P[i].y) : ctx.moveTo(P[i].x,P[i].y)); ctx.closePath(); ctx.fill() } }); ctx.globalAlpha = 1;
        ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
        const ratio = (i, j, m, n, txt) => { if(!P[j] || !P[n]) return; const r = Math.abs(pp[j].p - pp[i].p) / (Math.abs(pp[n].p - pp[m].p) || 1e-9);
          ctx.save(); ctx.globalAlpha = .6; ctx.setLineDash([3,3]); ctx.lineWidth = 1; line(P[j-2].x, P[j-2].y, P[j].x, P[j].y); ctx.restore();
          const a0 = P[j-2]; this.label(ctx, r.toFixed(3), (a0.x+P[j].x)/2, (a0.y+P[j].y)/2, 'rgba(19,25,34,.9)', '#e6e8ec', 'center') };
        ratio(1, 2, 0, 1); ratio(2, 3, 1, 2); ratio(3, 4, 2, 3);
        P.forEach((p, i) => { const nb = P[i+1] || P[i-1], top = !nb || p.y <= nb.y; this.label(ctx, L[i], p.x, p.y + (top ? -14 : 14), col, '#0b0c0f', 'center') }); break }
      case 'ray': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); const ex = b.x >= a.x ? A.w : 0; line(a.x,a.y,ex,a.y+k*(ex-a.x)); break }
      case 'ext': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); line(0,a.y-k*a.x,A.w,a.y+k*(A.w-a.x)); break }
      case 'hline': line(0,a.y,A.w,a.y); lab(LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, 'right'); break;
      case 'hray': line(a.x,a.y,A.w,a.y); lab(LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, 'right'); break;
      case 'vline': line(a.x,0,a.x,A.h); break;
      case 'alert': { const fired = it.fired; ctx.setLineDash([6,4]); ctx.strokeStyle = fired ? '#5d6069' : col; line(0,a.y,A.w,a.y); ctx.setLineDash([]);
        this.label(ctx, (fired ? '✓ ' : '🔔 ') + LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, fired ? '#5d6069' : col, '#0b0c0f', 'right'); break }
      case 'rect': { ctx.globalAlpha = fa; ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        ctx.strokeRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); break }
      case 'fib': { const l = Math.min(a.x,b.x); const p0 = it.pts[0].p, p1 = it.pts[1].p;
        ctx.setLineDash([4,3]); ctx.strokeStyle = '#5d6069'; ctx.lineWidth = 1; line(a.x,a.y,b.x,b.y); ctx.setLineDash(dash); ctx.lineWidth = lw;
        FIB.forEach((f,i) => { const pr = p1 + (p0-p1)*f; const y = this.pToY(pr); if(y == null) return;
          ctx.strokeStyle = FIB_COL[i]; line(l,y,A.w,y); ctx.font = '11px  "Noto Sans KR", sans-serif'; ctx.fillStyle = FIB_COL[i]; ctx.textBaseline = 'bottom';
          ctx.fillText(`${f} (${LC.fmtN(pr, prec)})`, l+4, y-2) }); break }
      case 'pos': { const e = it.pts[0].p, s = it.pts[1].p, t = it.pts[2] ? it.pts[2].p : e + 2*(e - s); const long = t > e;
        const c = {x:b.x, y:this.pToY(t)}; if(c.y == null) break; const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x), w = Math.max(r-l, 30);
        ctx.globalAlpha = 0.18; ctx.fillStyle = '#5b9cf6'; ctx.fillRect(l, Math.min(a.y,c.y), w, Math.abs(c.y-a.y));
        ctx.fillStyle = '#f0616d'; ctx.fillRect(l, Math.min(a.y,b.y), w, Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        ctx.strokeStyle = '#e6e8ec'; ctx.lineWidth = 1; line(l,a.y,l+w,a.y);
        const rr = Math.abs(t-e)/Math.abs(e-s || 1e-9);

        this.label(ctx, `손절 ${LC.fmtN(s,prec)} (${LC.fmtPct((s-e)/e*100)})`, l+w/2, b.y + (long?11:-11), '#f0616d', '#fff', 'center');
        const sz = LC.riskSize ? LC.riskSize(e, s) : null;
        this.label(ctx, `진입 ${LC.fmtN(e,prec)} · 손익비 ${rr.toFixed(2)}${sz ? ` · 권장 $${sz >= 1e4 ? LC.fmtBig(sz) : sz.toFixed(0)}` : ''}`, l+w/2, a.y, '#e6e8ec', '#0b0c0f', 'center');

        const secs = Math.abs(it.pts[1].t - it.pts[0].t);
        const dur = secs >= 86400 ? (secs/86400).toFixed(1)+'일' : secs >= 3600 ? (secs/3600).toFixed(1)+'시간' : Math.round(secs/60)+'분';
        this.label(ctx, `${LC.fmtN(p1-p0, prec)} (${LC.fmtPct((p1-p0)/p0*100)}) · ${bars}봉 · ${dur}`, (a.x+b.x)/2, b.y + (up?-14:14), up ? '#5b9cf6' : '#f0616d', '#fff', 'center'); break }
      case 'text': { const fs = it.size || 13; ctx.font = fs + 'px  "Noto Sans KR", sans-serif'; ctx.textBaseline = 'alphabetic'; const w = ctx.measureText(it.text||'').width;

<script>
/* 차트 한 칸: 캔들, 지표, 작도, 알림, 리플레이 */
(() => {
/* 봉 마감까지 남은 시간: 59:12, 3:05:09, 2일 4시간 */

  return d ? `${d}일 ${h}시간` : h ? `${h}:${P(m)}:${P(x)}` : `${P(m)}:${P(x)}` };

class ChartView {

      grid:{ vertLines:{color:'rgba(255,255,255,.045)'}, horzLines:{color:'rgba(255,255,255,.045)'} },

      const D = this.drawings, rc = D.cv.getBoundingClientRect(), hit = D.hitTest(e.clientX - rc.left, e.clientY - rc.top);

      LC.ctxMenu(e.clientX, e.clientY, [...top, ['차트 설정…', () => LC.chartStyle.modal(), '모양·색'], ['지표 추가…', () => this.app.indModal()], '-',
        [(LC.walls && LC.walls.cfg().on ? '✓ ' : '　') + '호가 벽 표시', () => { const c = LC.walls.cfg(); c.on = !c.on; LC.store.set('wallCfg', c); LC.walls.poll() }], ['호가 벽 · 알림 설정…', () => LC.walls.modal()], '-',
        ['차트 그림 저장', () => this.screenshot()], ['리플레이', () => this.replayBegin()], ['처음 화면으로', () => this.resetView(true), '더블클릭'], ['오른쪽 끝으로', () => this.scrollNow()], ['가격 눈금 자동 맞춤', () => this.chart.priceScale('right').applyOptions({autoScale:true})], '-',
        ['이 종목 작도 모두 지우기', () => this.drawings.clear()]]) });
    /* 예전에 따로 넣은 이동평균선 여러 개는 '이동평균선 묶음' 하나로 합쳐요 */
    let inds = cfg.inds || [{key:'VOL'}, {key:'MAS'}]; const mas = inds.filter(x => x.key === 'MA');
    if(mas.length >= 2){ const P = { ...LC.IND.DEFS.MAS.params }, plots = []; for(let i = 1; i <= 8; i++) P['p'+i] = 0;
      mas.slice(0, 8).forEach((x, i) => { const q = x.params || {}; P['t'+(i+1)] = q.type || 'SMA'; P['p'+(i+1)] = +q.period || 20; plots[i] = (x.style && x.style.plots && x.style.plots[0]) || (x.color ? { color:x.color } : undefined) });
      const at = inds.indexOf(mas[0]); inds = inds.filter(x => x.key !== 'MA'); inds.splice(Math.min(at, inds.length), 0, { key:'MAS', params:P, style:{ plots:plots.map(p => p || {}) } }) }
    inds
      .forEach(c => this.addInd(c.key, c.params, c.color, c.hidden, true, c.style));
    LC.chartStyle.apply(this);
    this.load();
  }
  cfg(){ return { sym:this.sym, market:this.market, tf:this.tf, type:this.type, inds:this.inds.map(i => ({key:i.key, params:i.params, color:i.color, hidden:i.hidden && !(this._indHid || []).includes(i.id), style:i.style})) } }
  destroy(){ this.closeStreams(); this.replayExit(true); this.drawings.destroy(); this.chart.remove(); this.box.remove() }

  makeMain(){
    if(this.series) this.chart.removeSeries(this.series);
    const t = this.type, opts = { priceFormat:{type:'price', precision:this.prec, minMove:1/10**this.prec}, ...LC.chartStyle.mainOpts(t) };

  }
  /* 몸통을 비운 캔들은 현재가 라벨이 투명해져서, 경계선 색으로 직접 그려요 */

    if(!need || !b){ if(this.lastPL){ try{ this.series.removePriceLine(this.lastPL) }catch(e){} this.lastPL = null } return }

  toMain(bars){
    if(this.type === 'line' || this.type === 'area') return bars.map(b => ({time:b.time, value:b.close}));
    if(this.type !== 'ha'){ const S = LC.chartStyle.get();
      if(S.prevClose && this.type !== 'hollow') return bars.map((b, i) => { const up = b.close >= (i ? bars[i-1].close : b.open), c = up ? S.upColor : S.downColor;
        return {time:b.time, open:b.open, high:b.high, low:b.low, close:b.close, color: S.bodyVisible ? c : 'rgba(0,0,0,0)', borderColor: up ? S.borderUp : S.borderDown, wickColor: up ? S.wickUp : S.wickDown} });
      return bars.map(b => ({time:b.time, open:b.open, high:b.high, low:b.low, close:b.close})) }
    const out = []; bars.forEach((b, i) => { const c = (b.open+b.high+b.low+b.close)/4; const o = i ? (out[i-1].open + out[i-1].close)/2 : (b.open+b.close)/2;
      out.push({time:b.time, open:o, high:Math.max(b.high,o,c), low:Math.min(b.low,o,c), close:c}) }); this.ha = out; return out;
  }
  mainLast(b){
    if(this.type === 'line' || this.type === 'area') return {time:b.time, value:b.close};
    if(this.type !== 'ha'){ const S = LC.chartStyle.get(), c = this.candles, pc = c.length > 1 ? c[c.length-2].close : b.open;
      if(S.prevClose && this.type !== 'hollow'){ const up = b.close >= pc; return {time:b.time, open:b.open, high:b.high, low:b.low, close:b.close, color: S.bodyVisible ? (up ? S.upColor : S.downColor) : 'rgba(0,0,0,0)', borderColor: up ? S.borderUp : S.borderDown, wickColor: up ? S.wickUp : S.wickDown} }
      return {time:b.time, open:b.open, high:b.high, low:b.low, close:b.close} }
    const prev = this.ha && this.ha.length > 1 ? this.ha[this.ha.length - (this.ha[this.ha.length-1].time === b.time ? 2 : 1)] : null;
    const c = (b.open+b.high+b.low+b.close)/4, o = prev ? (prev.open+prev.close)/2 : (b.open+b.close)/2;
    const h = {time:b.time, open:o, high:Math.max(b.high,o,c), low:Math.min(b.low,o,c), close:c};
    if(this.ha){ if(this.ha.length && this.ha[this.ha.length-1].time === b.time) this.ha[this.ha.length-1] = h; else this.ha.push(h) }
    return h;
  }

  /* 데이터 */
  get rest(){ return LC.EP[this.market].rest }
  /* 거래소에서 봉 받기. since(초)를 주면 그 봉부터 지금까지만 */
  async fetchK(since){
    if(this.market === 'hl'){ const r = await LC.hlm.klines(this.sym, this.tf); return since ? r.filter(b => b.time >= since) : r }
    const rows = await LC.getJSON(`${this.rest}/klines?symbol=${this.sym}&interval=${this.tf}&limit=1000${since ? '&startTime=' + since * 1000 : ''}`);
    return rows.map(k => ({time:Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:+k[5], tbv:+k[9]})) }
  /* 연결이 끊겼다 다시 붙거나 잠자기에서 깨면, 끊긴 동안의 봉을 받아 채워요. 마지막 봉도 다시 받아서 덜 반영된 값을 고쳐요 */
  async backfill(tok = this.tok){
    if(this._bfBusy || !this.candles || !this.candles.length || !this.loadedSym) return; this._bfBusy = true;
    try{ const last = this.candles[this.candles.length - 1], rows = await this.fetchK(last.time); if(tok !== this.tok || !rows.length) return;
      if(this.market !== 'hl' && rows.length >= 1000){ KC.delete(this._ck); return this.load() }   /* 너무 오래 끊겼으면 통째로 다시 */
      const c = this.candles; let n = 0;
      rows.forEach(b => { const L = c[c.length - 1]; if(L.time === b.time){ c[c.length - 1] = b; n++ } else if(b.time > L.time){ c.push(b); n++ } });
      if(!n || this.replay) return; this.shown = c;
      if(n <= 1){ const b = c[c.length - 1]; this.series.update(this.mainLast(b)); this.lastLabel(); this.updateInds(false) } else { const r = this.chart.timeScale().getVisibleLogicalRange(); this.renderAll(); if(r) this.chart.timeScale().setVisibleLogicalRange({ from: r.from + n - 1, to: r.to + n - 1 }) }
      this.setLegend(c[c.length - 1]);
    }catch(e){} finally{ this._bfBusy = false } }
  async load(){
    /* 떠나는 봉 묶음은 잠깐 기억해 둬요 (분봉을 오갈 때 바로 보이게) */
    if(this.loadedSym && this._ck && this.candles && this.candles.length && !this.replay){ KC.delete(this._ck); KC.set(this._ck, { t: Date.now(), c: this.candles, noMore: this.noMore }); while(KC.size > 8) KC.delete(KC.keys().next().value) }
    const tok = this.tok = Math.random(), ck = `${this.sym}|${this.market}|${this.tf}`, hit = KC.get(ck), fresh = hit && Date.now() - hit.t < 30 * 6e4;
    this.closeStreams(); this.replayExit(true); this.noMore = false; this.loadedSym = null;
    const ld = this.q('.cv-load'); ld.hidden = false; ld.innerHTML = '<div class="cv-sk"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
    this.q('.lg-t').textContent = this.market === 'hl' ? `${this.sym.split(':')[1] || this.sym} · ${(LC.TF.find(x=>x[0]===this.tf)||[,''])[1]} · HYPERLIQUID ${(this.sym.split(':')[0] || '').toUpperCase()}` : `${this.sym}${this.market==='futures'?'.P':''} · ${(LC.TF.find(x=>x[0]===this.tf)||[,''])[1]} · BINANCE`;
    this.q('.lg-mk').innerHTML = LC.session ? LC.session.badge(this.sym, this.market) : '';
    this.drawings.load(); if(this.bubbles) this.bubbles.items = []; if(this.wm) LC.chartStyle.apply(this);
    try{
      if(fresh){ this.candles = hit.c.slice(); this.noMore = !!hit.noMore }
      else { const r = await this.fetchK(); if(tok !== this.tok) return; this.candles = r }
      this.autoPrec = null; this.prec = this.app.precOf(this.sym, this.market) ?? LC.autoPrec(this.candles.length ? this.candles[this.candles.length-1].close : 1);
      this.applyPrec(); LC.chartStyle.apply(this);
      this.shown = this.candles; this.renderAll();
      /* 종목이 바뀌면 가격 눈금을 새 종목에 맞추고 지금 봉이 보이게 해요 (시간 단위만 바뀌면 확대 정도는 그대로) */
      if(this._vSym !== this.sym + this.market) this.resetView(false); else this.scrollNow(); this._vSym = this.sym + this.market; this.loadedSym = this.sym; this._ck = ck;
      ld.hidden = true; if(fresh) this.backfill(tok);
    }catch(e){ if(tok !== this.tok) return;
      ld.innerHTML = `<div class="cv-err">${/늦어요/.test(e.message) ? '거래소 응답이 너무 늦어요.' : '데이터를 못 불러왔어요. 종목이나 인터넷 연결을 확인해 주세요.'}<button class="btn sm" data-retry>다시 시도</button></div>`;
      ld.querySelector('[data-retry]').onclick = () => this.load(); return }
    this.prevPrice = this.last && this.last.close;
    this._down = false;
    if(this.market === 'hl') this.kws = LC.hlm.stream(this.sym, this.tf, b => { if(tok === this.tok) this.onBar(b) }, ok => { this.app.setConn(this, ok); if(!ok) this._down = true; else if(this._down){ this._down = false; this.backfill(tok) } });
    else { let bnOk = false;
      this.kws = LC.openWS(`${LC.EP[this.market].ws}/${this.sym.toLowerCase()}@kline_${this.tf}`, m => {
        if(tok !== this.tok || !m.k) return; const k = m.k;
        this.onBar({time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, tbv:+k.V});
      }, ok => { bnOk = ok; if(!ok) this._down = true; else if(this._down){ this._down = false; this.backfill(tok) }
        if(ok){ clearTimeout(this.bkT); this.bkT = null; this.stopBackup() } else if(!this.bkT && !this.bkws) this.bkT = setTimeout(() => { this.bkT = null; this.startBackup(tok) }, 8000);
        this.app.setConn(this, ok || this.bkOk, ok ? '' : this.bkOk ? 'bybit' : '') });
      /* 처음 8초 안에 바이낸스가 안 열리면(막힌 지역 등) 바로 바이비트로 */
      clearTimeout(this.bkT); this.bkT = setTimeout(() => { this.bkT = null; if(!bnOk) this.startBackup(tok) }, 8000) }
    this.inds.filter(i => i.def.async).forEach(i => this.fetchAsync(i));
    clearInterval(this.asyncTimer); this.asyncTimer = setInterval(() => this.inds.filter(i => i.def.async).forEach(i => this.fetchAsync(i)), 60000);
    this.app.onViewLoaded(this);
  }
  scrollNow(){ this.chart.timeScale().scrollToRealTime() }
  /* 처음 화면: 가격 눈금 자동, 지금 봉이 오른쪽에 보이게. full이면 봉 간격도 기본으로 */
  resetView(full){ try{ this.chart.priceScale('right').applyOptions({ autoScale:true }); this.chart.priceScale('left') && this.chart.priceScale('left').applyOptions({ autoScale:true }) }catch(e){}
    const ts = this.chart.timeScale(); if(full){ ts.applyOptions({ barSpacing: 6 }) } else { const bs = ts.options().barSpacing; if(!(bs >= 2.5 && bs <= 40)) ts.applyOptions({ barSpacing: 6 }) }
    ts.applyOptions({ rightOffset: 8 }); ts.scrollToRealTime(); this.zoomStack = [] }
  closeStreams(){ this.kws && this.kws.close(); this.kws = null; clearInterval(this.asyncTimer); clearTimeout(this.bkT); this.bkT = null; this.stopBackup() }
  /* 예비 실시간 시세: 바이낸스 봉 스트림이 8초 넘게 끊기면 바이비트 봉으로 잠시 이어 그려요 */
  startBackup(tok){
    const iv = {'1m':'1','3m':'3','5m':'5','15m':'15','30m':'30','1h':'60','2h':'120','4h':'240','6h':'360','12h':'720','1d':'D','1w':'W'}[this.tf];
    if(this.bkws || tok !== this.tok || !iv || this.market === 'hl') return;
    const topic = `kline.${iv}.${this.sym}`;
    this.bkws = LC.openWS(`wss://stream.bybit.com/v5/public/${this.market === 'spot' ? 'spot' : 'linear'}`, m => {
      if(tok !== this.tok || m.topic !== topic || !Array.isArray(m.data)) return;
      m.data.forEach(k => { const t = Math.floor(k.start/1000), l = this.candles[this.candles.length-1];
        this.onBar({time:t, open:+k.open, high:+k.high, low:+k.low, close:+k.close, volume:+k.volume, tbv: l && l.time === t ? l.tbv : null}) });
    }, ok => { this.bkOk = ok; if(this.kws) this.app.setConn(this, ok, ok ? 'bybit' : '') }, ws => ws.send(JSON.stringify({op:'subscribe', args:[topic]})));
    this.bkws.keepAlive({op:'ping'}, 20000);
  }
  stopBackup(){ if(this.bkws){ this.bkws.close(); this.bkws = null } this.bkOk = false }
  async loadMore(){
    if(this.loadingMore || this.noMore || !this.candles.length) return;
    this.loadingMore = true; const tok = this.tok;
    try{
      const end = this.candles[0].time*1000 - 1;
      const more = this.market === 'hl' ? await LC.hlm.klines(this.sym, this.tf, end)
        : (await LC.getJSON(`${this.rest}/klines?symbol=${this.sym}&interval=${this.tf}&limit=1000&endTime=${end}`)).map(k => ({time:Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:+k[5], tbv:+k[9]}));
      if(tok !== this.tok) return; const old = more.filter(b => b.time < this.candles[0].time); if(!old.length){ this.noMore = true; return }
      this.candles = old.concat(this.candles);
      this.shown = this.candles; this.renderAll();
    }catch(e){} finally{ this.loadingMore = false }
  }
  get last(){ return this.candles[this.candles.length-1] }
  set(sym, market){ this.sym = sym; if(market) this.market = market; this.load(); this.app.save() }
  setTf(tf){ this.tf = tf; this.inds.forEach(i => this.applyIndStyle(i)); this.renderLegendInds(); this.load(); this.app.save() }

  onBar(b){
    const c = this.candles, last = c[c.length-1];
    if(last && last.time === b.time) c[c.length-1] = b; else if(!last || b.time > last.time) c.push(b); else return;
    this.checkAlerts(b.close);
    if(this.replay) return;
    this.shown = c;
    this.series.update(this.mainLast(b)); this.lastLabel();
    this.updateInds(false);
    if(!this.hovering) this.setLegend(b);
  }
  renderAll(){
    /* 현재가 선은 새로 그리기 전에 꼭 떼요. 안 떼면 분봉을 바꿀 때마다 쌓여요 */
    if(this.lastPL){ try{ this.series.removePriceLine(this.lastPL) }catch(e){} this.lastPL = null }
    this.series.setData(this.toMain(this.shown)); this.lastLabel();
    this.updateInds(true);
    this.setLegend(this.shown[this.shown.length-1]);
  }

  /* 지표 */
  /* 지표 모양 기본값: 선마다 색·굵기·모양·보이기, 기준선, 띠 채우기 */
  defStyle(def, color){
    return { plots: def.series.map((s, i) => ({ color: (i === 0 && color) || (def.colors||[])[i] || '#888888', width: s.type === 'hist' ? 1 : s.w || def.width || (def.overlay ? 1 : 1.5), dash: s.dash ? 2 : 0, visible:!s.hide })),
      opts: def.opts ? Object.fromEntries(def.opts.map(o => [o.k, o.v])) : null, tfs: [],
      levels: (def.levels||[]).map(v => ({ v, color:'rgba(120,134,156,0.6)', dash:2, show:true })),
      fill: def.fill ? { show:true, color:def.fill.color, color2:def.fill.color2 } : null };
  }
  addInd(key, params, color, hidden, silent, style){
    const def = LC.IND.DEFS[key]; if(!def) return;
    const ds = this.defStyle(def, color);
    if(style){ ds.plots.forEach((p, i) => style.plots && style.plots[i] && Object.assign(p, style.plots[i]));
      if(style.levels && style.levels.length === ds.levels.length) ds.levels = style.levels; if(style.fill && ds.fill) Object.assign(ds.fill, style.fill)
      if(style.opts && ds.opts) Object.keys(ds.opts).forEach(k => { if(k in style.opts) ds.opts[k] = style.opts[k] }); if(Array.isArray(style.tfs)) ds.tfs = style.tfs.slice() }
    const ind = { id:Math.random().toString(36).slice(2,8), key, def, params:{...def.params, ...(params||{})}, hidden:!!hidden, series:[], data:{}, style:ds, lines:[] };
    ind.color = ds.plots[0].color;
    const pane = def.overlay ? 0 : this.chart.panes().length;
    def.series.forEach((s, i) => {
      const base = { priceLineVisible:false, lastValueVisible:!def.overlay };
      let se;
      if(s.type === 'hist') se = this.chart.addSeries(L.HistogramSeries, {...base, priceScaleId: s.scale || 'right', priceFormat:{type: key==='VOL' ? 'volume' : 'price', precision:4, minMove:0.0001}, lastValueVisible:false}, pane);
      else if(s.type === 'area') se = this.chart.addSeries(L.AreaSeries, {...base, priceFormat:{type:'volume'}}, pane);
      else se = this.chart.addSeries(L.LineSeries, {...base, crosshairMarkerVisible:!def.overlay, ...(s.type === 'dots' ? {lineVisible:false, pointMarkersVisible:true, pointMarkersRadius:1.6} : s.type === 'step' ? {lineType:1} : {}),
                 priceFormat: def.overlay ? {type:'price', precision:this.prec, minMove:1/10**this.prec} : {type:'price', precision:2, minMove:0.01}}, pane);
      if(s.scale) se.priceScale().applyOptions({ scaleMargins:{top: s.scale === 'vol' ? 0.88 : 0.6, bottom:0} });
      ind.series.push(se);
    });
    if(def.fill){ ind.fillP = new LC.IndFill(this, ind); ind.series[0].attachPrimitive(ind.fillP) }
    this.applyIndStyle(ind);
    this.inds.push(ind); this.layoutPanes();
    if(!silent){ this.computeInd(ind, true); if(def.async) this.fetchAsync(ind); this.renderLegendInds(); this.app.save() }
    return ind;
  }
  /* 왼쪽 막대의 '지표 모두 숨기기': 켜 둔 지표만 기억했다가 그대로 다시 보여요 (저장은 안 해요) */
  setIndsHidden(on){
    if(on){ this._indHid = this.inds.filter(i => !i.hidden).map(i => i.id); this.inds.forEach(i => { if(this._indHid.includes(i.id)){ i.hidden = true; this.applyIndStyle(i) } }) }
    else { (this._indHid || []).forEach(id => { const i = this.inds.find(x => x.id === id); if(i){ i.hidden = false; this.applyIndStyle(i); i.def.async ? this.fetchAsync(i) : this.computeInd(i, true) } }); this._indHid = null }
    this.renderLegendInds() }
  applyIndStyle(ind){
    const st = ind.style; ind.color = st.plots[0].color; ind.tfOff = (st.tfs || []).includes(this.tf);
    ind.def.series.forEach((s, i) => { const p = st.plots[i], se = ind.series[i], vis = !ind.hidden && !ind.tfOff && p.visible;
      if(s.type === 'hist') se.applyOptions({ color:p.color, visible:vis });
      else if(s.type === 'area'){ const c = LC.color.parseColor(p.color); se.applyOptions({ lineColor:p.color, topColor:LC.color.mkColor(c.hex, .3), bottomColor:LC.color.mkColor(c.hex, .02), lineWidth:+p.width, lineStyle:+p.dash, visible:vis }) }
      else se.applyOptions({ color:p.color, lineWidth:+p.width, lineStyle:+p.dash, visible:vis }) });
    ind.lines.forEach(l => { try{ ind.series[0].removePriceLine(l) }catch(e){} });
    ind.lines = st.levels.filter(l => l.show).map(l => ind.series[0].createPriceLine({ price:+l.v, color:l.color, lineWidth:1, lineStyle:+l.dash, axisLabelVisible:false }));
    if(this.chart) this.chart.applyOptions({});
  }
  removeInd(ind){ ind.series.forEach(s => this.chart.removeSeries(s)); this.inds = this.inds.filter(i => i !== ind); this.layoutPanes(); this.renderLegendInds(); this.app.save() }
  layoutPanes(){ try{ this.chart.panes().forEach((p, i) => p.setStretchFactor(i === 0 ? 4 : 1)) }catch(e){} }
  computeInd(ind, full){
    if(ind.def.async || !this.shown.length) return;
    const r = ind.def.calc(this.shown, ind.params, ind.style);
    Object.keys(r).forEach(k => { if(k[0] === '_') ind.data[k] = r[k] });
    ind.def.series.forEach((s, i) => { const arr = r[s.key] || []; ind.data[s.key] = arr;
      if(ind.hidden) return;
      if(full) ind.series[i].setData(arr); else if(arr.length) ind.series[i].update(arr[arr.length-1]) });
  }
  updateInds(full){
    if(full){ this.inds.forEach(i => this.computeInd(i, true)); this.lastIndCalc = Date.now(); this.renderLegendInds(); return }
    if(Date.now() - (this.lastIndCalc||0) < 400) return;
    this.lastIndCalc = Date.now(); this.inds.forEach(i => this.computeInd(i, false));
  }
  async fetchAsync(ind){
    if(ind.def.futuresOnly && this.market !== 'futures'){ ind.series.forEach(s => s.setData([])); return }
    /* 받는 사이 종목이나 분봉을 바꿨으면 버려요 (예전 분봉 값이 섞이면 봉 간격이 깨져요) */
    const tok = this.tok, key = this.sym + '|' + this.market + '|' + this.tf;
    try{ const r = await ind.def.fetch({sym:this.sym, tf:this.tf}); if(tok !== this.tok || key !== this.sym + '|' + this.market + '|' + this.tf || !this.inds.includes(ind)) return;
      ind.def.series.forEach((s, i) => { r[s.key] = this.snapToBars(r[s.key] || []); ind.data[s.key] = r[s.key]; if(!ind.hidden) ind.series[i].setData(r[s.key]) }) }catch(e){}
  }
  /* 바깥 데이터(미결제약정 등)의 시각을 차트 봉 시각에 맞춰요. 봉 사이에 시각이 끼면 차트에 빈 칸이 생겨 봉이 띄엄띄엄 그려져요 */
  snapToBars(arr){
    const c = this.candles; if(!c.length) return []; const out = new Map(); let j = 0;
    [...arr].sort((a, b) => a.time - b.time).forEach(d => { if(d.time < c[0].time) return; while(j + 1 < c.length && c[j+1].time <= d.time) j++; out.set(c[j].time, {...d, time:c[j].time}) });
    return [...out.values()];
  }
  /* 가격 소수점 자리를 본 차트와 위에 겹친 지표 모두에 맞춰요 (예전 종목 자리수가 남으면 눈금이 0으로만 보여요) */
  applyPrec(){
    const pf = { type:'price', precision:this.prec, minMove:1/10**this.prec };
    try{ this.series.applyOptions({ priceFormat:pf }) }catch(e){}
    this.inds.forEach(i => { if(i.def.overlay) i.def.series.forEach((s, k) => { if(s.type !== 'hist' && s.type !== 'area') try{ i.series[k].applyOptions({ priceFormat:pf }) }catch(e){} }) });
  }
  indPane(ind){ try{ return ind.series[0].getPane().paneIndex() }catch(e){ return ind.def.overlay ? 0 : 1 } }
  renderLegendInds(){
    const I = LC.LG_ICON, title = i => LC.esc(i.def.title ? i.def.title(i.params) : i.def.label);
    const row = i => `<div class="lgr ${i.hidden || i.tfOff ? 'off' : ''}" data-id="${i.id}"${i.tfOff ? ' title="이 분봉에선 숨겨 둔 지표예요 (설정 → 보임)"' : ''}><span class="nm">${title(i)}</span><span class="vals num"></span>
      ${i.hidden ? `<button class="hid" data-a="eye" title="다시 보이기">${I.eyeOff}</button>` : ''}
      <span class="act"><button data-a="eye" title="${i.hidden ? '보이기' : '숨기기'}">${i.hidden ? I.eyeOff : I.eye}</button><button data-a="set" title="설정">${I.gear}</button><button data-a="del" title="지우기">${I.trash}</button><button data-a="more" title="더 보기">${I.more}</button></span></div>`;
    const by = {}; this.inds.forEach(i => { const p = this.indPane(i); (by[p] = by[p] || []).push(i) });
    const main = by[0] || [];
    this.q('.lg-i').innerHTML = (this.lgCol ? '' : main.map(row).join(''))
      + (main.length ? `<button class="lg-tg" title="${this.lgCol ? '지표 이름 펼치기' : '지표 이름 접기'}">${this.lgCol ? I.down + `<span class="num">${main.length}</span>` : I.up}</button>` : '');
    this.q('.lg-p').innerHTML = Object.keys(by).filter(k => +k > 0).map(k => `<div class="lgp" data-pane="${k}">${by[k].map(row).join('')}</div>`).join('');
    this.lgSig = null; this.placePaneLegends();
    this.setLegend(this.hoverBar || this.shown[this.shown.length-1]);
  }
  placePaneLegends(){
    if(!this.box.isConnected){ clearInterval(this.lgTimer); return }
    let panes; try{ panes = this.chart.panes() }catch(e){ return }
    const tops = []; let y = 0; panes.forEach((p, i) => { tops[i] = y; y += p.getHeight() + 1 });
    const sig = tops.join(','); if(sig === this.lgSig) return; this.lgSig = sig;
    this.q('.lg-p').querySelectorAll('.lgp').forEach(d => { const t = tops[+d.dataset.pane]; d.hidden = t == null; if(t != null) d.style.top = (t + 4) + 'px' });
  }
  onLegendClick(e){
    const b = e.target.closest('button'); if(!b) return; const row = b.closest('.lgr'); if(!row) return; const ind = this.inds.find(i => i.id === row.dataset.id); if(!ind) return;
    const eye = () => { ind.hidden = !ind.hidden; this.applyIndStyle(ind); if(!ind.hidden){ ind.def.async ? this.fetchAsync(ind) : this.computeInd(ind, true) } this.renderLegendInds(); this.app.save() };
    if(b.dataset.a === 'del') this.removeInd(ind);
    if(b.dataset.a === 'eye') eye();
    if(b.dataset.a === 'set') this.editInd(ind);
    if(b.dataset.a === 'more'){ const r = b.getBoundingClientRect();
      LC.ctxMenu(r.left, r.bottom + 4, [['설정…', () => this.editInd(ind)], [ind.hidden ? '보이기' : '숨기기', eye],
        ['같은 지표 하나 더', () => { const n = this.addInd(ind.key, ind.params, null, false, false, JSON.parse(JSON.stringify(ind.style))); if(n) this.renderLegendInds() }], '-',
        ['지우기', () => this.removeInd(ind)], ['지표 모두 지우기', () => { [...this.inds].forEach(i => i.series.forEach(s => this.chart.removeSeries(s))); this.inds = []; this.layoutPanes(); this.renderLegendInds(); this.app.save() }]]) }
  }
  /* 지표 설정 창: 입력값 / 모양 (바꾸면 바로 차트에 보여요) */
  editInd(ind){
    const P = ind.params, keys = Object.keys(P), st = ind.style, C = LC.color, D = ind.def;
    const old = { params:{...P}, style:JSON.parse(JSON.stringify(st)) };
    const field = k => (k === 'type' || /^t\d$/.test(k)) ? `<select class="inp" data-k="${k}">${['SMA','EMA','WMA','HMA','RMA'].map(t => `<option ${P[k]===t?'selected':''}>${t}</option>`).join('')}</select>`
      : k === 'reset' ? `<select class="inp" data-k="reset">${['없음','일간'].map(s => `<option ${P.reset===s?'selected':''}>${s}</option>`).join('')}</select>`
      : D.selects && D.selects[k] ? `<select class="inp" data-k="${k}">${D.selects[k].map(s => `<option ${P[k]===s?'selected':''}>${s}</option>`).join('')}</select>`
      : k === 'source' ? `<select class="inp" data-k="source">${['close','open','high','low','hl2','hlc3'].map(s => `<option ${P.source===s?'selected':''}>${s}</option>`).join('')}</select>`
      : `<input class="inp" type="number" step="any" min="0" data-k="${k}" value="${LC.esc(P[k])}">`;
    const dashSel = (attr, v) => `<select ${attr} title="선 모양">${LC.DASH.map(([k, n]) => `<option value="${k}" ${String(v) === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
    const plots = D.series.map((s, i) => { const p = st.plots[i];
      return `<div class="srow"><label><input type="checkbox" data-pv="${i}" ${p.visible ? 'checked' : ''}> ${LC.esc(s.name || (D.series.length > 1 ? '선 ' + (i+1) : D.label))}</label><span class="sctl">${s.trend ? '<span class="muted" style="font-size:11px">추세 색</span>' : C.colorField('p' + i, p.color)}
        ${s.type === 'hist' ? '' : `<select data-pw="${i}" title="굵기">${[1,1.5,2,3,4].map(w => `<option ${+p.width === w ? 'selected' : ''}>${w}</option>`).join('')}</select>${dashSel(`data-pd="${i}"`, p.dash)}`}</span></div>` }).join('');
    const levels = st.levels.map((l, i) => `<div class="srow"><label><input type="checkbox" data-lv="${i}" ${l.show ? 'checked' : ''}> 기준선 <input class="inp sm" type="number" step="any" data-lval="${i}" value="${l.v}"></label><span class="sctl">${C.colorField('l' + i, l.color)}${dashSel(`data-ld="${i}"`, l.dash)}</span></div>`).join('');
    const fill = st.fill && !D.fill.hideUi ? `<div class="srow"><label><input type="checkbox" data-fill ${st.fill.show ? 'checked' : ''}> ${D.fill.name || (D.fill.kind === 'band' ? '띠 (상승 / 하락)' : '사이 채우기')}</label><span class="sctl">${C.colorField('f1', st.fill.color)}${D.fill.color2 ? C.colorField('f2', st.fill.color2) : ''}</span></div>` : '';
    const opts = (D.opts || []).map(o => { const v = st.opts[o.k];
      return `<div class="srow">${o.t === 'bool' ? `<label><input type="checkbox" data-ok="${o.k}" ${v ? 'checked' : ''}> ${LC.esc(o.label)}</label>`
        : `<label>${LC.esc(o.label)}</label><span class="sctl">${o.t === 'color' ? C.colorField('o_' + o.k, v) : `<input class="inp sm" type="number" step="any" data-ok="${o.k}" value="${LC.esc(v)}">`}</span>`}</div>` }).join('');
    const tfs = `<p class="muted" style="font-size:12px;margin:4px 0 8px">체크를 끈 분봉에선 이 지표를 숨겨요.</p>` + LC.TF.map(([k, n]) => `<div class="srow"><label><input type="checkbox" data-tf="${k}" ${(st.tfs || []).includes(k) ? '' : 'checked'}> ${n}</label></div>`).join('');
    const html = `<div class="sub-tabs st-tabs"><button data-t="0" class="on">입력값</button><button data-t="1">모양</button><button data-t="2">보임</button></div>
      <div class="st-pane" data-t="0"><div class="form">${ind.key === 'MAS' ? `<label>기준값${field('source')}</label><div class="mas-h"><span></span><span>종류</span><span>기간 (0이면 끔)</span></div>${[1,2,3,4,5,6,7,8].map(i => `<div class="mas-r"><i style="background:${LC.color.parseColor(st.plots[i-1].color).hex}"></i>${field('t'+i)}${field('p'+i)}</div>`).join('')}` : keys.length ? keys.map(k => `<label>${LC.IND.PARAM_LABEL[k]||k}${field(k)}</label>`).join('') : '<p class="muted">바꿀 입력값이 없는 지표예요. 모양 탭에서 색과 선을 바꿀 수 있어요.</p>'}</div></div>
      <div class="st-pane" data-t="1" hidden>${plots}${levels ? '<h6>기준선</h6>' + levels : ''}${fill ? '<h6>채우기</h6>' + fill : ''}${opts ? '<h6>옵션</h6>' + opts : ''}</div>
      <div class="st-pane" data-t="2" hidden>${tfs}</div>
      <div class="row-end"><button class="btn" id="indDef">기본값으로</button><button class="btn" id="indCancel">취소</button><button class="btn pri" id="indOk">확인</button></div>`;
    let done = false;
    const close = LC.modal(D.label + ' 설정', html, (mb, close) => {
      mb.querySelector('.st-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return;
        mb.querySelectorAll('.st-tabs button').forEach(x => x.classList.toggle('on', x === b)); mb.querySelectorAll('.st-pane').forEach(p => p.hidden = p.dataset.t !== b.dataset.t) };
      const read = () => {
        mb.querySelectorAll('[data-k]').forEach(el => { const k = el.dataset.k; P[k] = el.type === 'number' ? (el.value === '' ? old.params[k] : Math.max(/^(ma|p\d|fib)$/.test(k) ? 0 : 1, +el.value)) : el.value });
        D.series.forEach((s, i) => { const p = st.plots[i]; p.visible = mb.querySelector(`[data-pv="${i}"]`).checked; const ck = mb.querySelector(`[data-ck="p${i}"]`); if(ck) p.color = C.readColor(ck);
          const w = mb.querySelector(`[data-pw="${i}"]`); if(w){ p.width = +w.value; p.dash = +mb.querySelector(`[data-pd="${i}"]`).value } });
        st.levels.forEach((l, i) => { l.show = mb.querySelector(`[data-lv="${i}"]`).checked; const v = mb.querySelector(`[data-lval="${i}"]`).value; if(v !== '') l.v = +v;
          l.color = C.readColor(mb.querySelector(`[data-ck="l${i}"]`)); l.dash = +mb.querySelector(`[data-ld="${i}"]`).value });
        (D.opts || []).forEach(o => { if(o.t === 'color') st.opts[o.k] = C.readColor(mb.querySelector(`[data-ck="o_${o.k}"]`));
          else { const el = mb.querySelector(`[data-ok="${o.k}"]`); st.opts[o.k] = o.t === 'bool' ? el.checked : (el.value === '' ? o.v : +el.value) } });
        st.tfs = [...mb.querySelectorAll('[data-tf]')].filter(x => !x.checked).map(x => x.dataset.tf);
        if(st.fill && mb.querySelector('[data-fill]')){ st.fill.show = mb.querySelector('[data-fill]').checked; st.fill.color = C.readColor(mb.querySelector('[data-ck="f1"]')); const f2 = mb.querySelector('[data-ck="f2"]'); if(f2) st.fill.color2 = C.readColor(f2) }
        this.applyIndStyle(ind); ind.def.async ? this.fetchAsync(ind) : this.computeInd(ind, true); this.renderLegendInds() };
      mb.addEventListener('input', read); mb.addEventListener('change', read);
      mb.querySelector('#indDef').onclick = () => { Object.assign(P, D.params); Object.assign(st, this.defStyle(D)); this.applyIndStyle(ind); this.computeInd(ind, true); this.renderLegendInds(); done = true; close(); this.editInd(ind) };
      mb.querySelector('#indCancel').onclick = () => close();
      mb.querySelector('#indOk').onclick = () => { done = true; this.app.save(); close() };
    }, false, () => { if(done) return; Object.keys(P).forEach(k => delete P[k]); Object.assign(P, old.params); Object.assign(st, old.style);
      this.applyIndStyle(ind); ind.def.async ? this.fetchAsync(ind) : this.computeInd(ind, true); this.renderLegendInds() });
  }

  /* 범례 */
  onCross(p){
    this.hovering = !!(p && p.time);
    const b = p && p.time ? this.shown.find(x => x.time === p.time) : null;
    this.hoverBar = b; this.setLegend(b || this.shown[this.shown.length-1]);
  }
  setLegend(b){
    if(!b) return; const pr = this.prec, cls = b.close >= b.open ? 'up' : 'down', d = b.close - b.open;
    this.q('.lg-o').innerHTML = ['시','고','저','종'].map((k, i) => `<i>${k}</i><span class="num ${cls}">${LC.fmtN([b.open,b.high,b.low,b.close][i], pr)}</span>`).join('')
      + `<span class="num lg-chg ${cls}">${d>=0?'+':''}${LC.fmtN(d, pr)} (${LC.fmtPct(b.open ? d/b.open*100 : 0)})</span>`;
    this.box.querySelectorAll('.lgr').forEach(row => { const ind = this.inds.find(i => i.id === row.dataset.id); if(!ind) return;
      const vals = ind.def.series.map((s, si) => { const p = ind.style.plots[si]; if((p && !p.visible) || !(ind.data[s.key] || []).length || ind.key === 'EW') return ''; const arr = ind.data[s.key] || []; let v = null;
        for(let i = arr.length-1; i >= 0 && i >= arr.length-1500; i--) if(arr[i].time <= b.time){ if(arr[i].time === b.time || ind.def.async) v = arr[i].value; break }
        const t = v == null ? '-' : ['VOL','OBV','OI','CVD'].includes(ind.key) ? LC.fmtBig(v) : ind.def.overlay ? LC.fmtN(v, pr) : LC.fmtN(v, 2);
        return `<span style="color:${LC.color.parseColor(p ? p.color : ind.color || '#cccccc').hex}">${t}</span>` });
      row.querySelector('.vals').innerHTML = ind.hidden ? '' : vals.join('') });
  }

  /* 클릭: 리플레이 시작점 고르기 */
  onClick(p){
    if(this.replayPick && p.time){ this.replayPick = false; this.app.hint(''); const i = this.candles.findIndex(b => b.time === p.time); if(i > 5) this.replayStart(i) }
  }
  /* 알림 */
  checkAlerts(price){
    const prev = this.prevPrice; this.prevPrice = price; if(prev == null) return;
    let changed = false;
    this.drawings.items.forEach(it => { if(it.type !== 'alert' || it.fired) return; const lv = it.pts[0].p;
      if((prev < lv && price >= lv) || (prev > lv && price <= lv)){ it.fired = true; changed = true;
        LC.notify(`${this.sym} 가격 알림`, `${LC.fmtN(lv, this.prec)} ${price >= lv ? '위로 돌파' : '아래로 이탈'} · 지금 ${LC.fmtN(price, this.prec)}`) } });
    if(changed) this.drawings.save();
  }

  /* 리플레이 */
  replayBegin(){ this.replayPick = true; this.app.hint('차트에서 리플레이를 시작할 봉을 누르세요 (Esc 취소)') }
  replayStart(i){
    this.replay = { idx:i, speed:+this.q('.cv-replay select').value, timer:null };
    this.q('.cv-replay').hidden = false; this.shown = this.candles.slice(0, i+1); this.renderAll(); this.replayLabel();
  }
  replayStep(){
    const r = this.replay; if(!r) return; if(r.idx >= this.candles.length-1){ this.replayExit(); return }
    r.idx++; const b = this.candles[r.idx]; this.shown = this.candles.slice(0, r.idx+1);
    this.series.update(this.mainLast(b)); this.inds.forEach(i => this.computeInd(i, false)); this.setLegend(b); this.replayLabel();
  }
  replayToggle(){ const r = this.replay; if(!r) return;
    if(r.timer){ clearInterval(r.timer); r.timer = null } else r.timer = setInterval(() => this.replayStep(), r.speed);
    this.q('[data-r=play]').textContent = r.timer ? '⏸' : '▶' }
  replayLabel(){ const b = this.shown[this.shown.length-1]; const d = new Date(b.time*1000);
    this.q('.rp-time').textContent = `${d.getMonth()+1}/${d.getDate()} ${LC.pad(d.getHours())}:${LC.pad(d.getMinutes())} · 남은 봉 ${this.candles.length-1-this.replay.idx}` }
  replayExit(silent){
    if(this.replayPick && this.app) this.app.hint(''); this.replayPick = false;
    if(!this.replay) return; clearInterval(this.replay.timer); this.replay = null; this.q('.cv-replay').hidden = true; this.q('[data-r=play]').textContent = '▶';
    if(!silent){ this.shown = this.candles; this.renderAll(); this.chart.timeScale().scrollToRealTime() }
  }

  tick(){ /* 1초마다 */
    const ms = LC.TFMS[this.tf], now = Date.now(); const b = this.last;
    const left = this.tf === '1w' && b ? b.time*1000 + ms - now : ms - (now % ms);
    const el = this.q('.cv-cd'); el.textContent = this.replay ? '' : cdFmt(left); this.placeCd();
  }
  /* 남은 시간 이름표: 오른쪽 가격 눈금의 현재가 이름표 바로 아래, 같은 색으로 붙여요 */
  placeCd(){
    const el = this.q('.cv-cd'), b = this.shown[this.shown.length-1]; if(!el || !b || this.replay){ if(el) el.hidden = true; return }
    let y = null, w = 0; try{ y = this.series.priceToCoordinate(b.close); w = this.chart.priceScale('right').width() }catch(e){}
    const H = this.chart.panes && this.chart.panes()[0] ? this.chart.panes()[0].getHeight() : 0;
    if(y == null || !w || y < 0 || y > H - 8){ el.hidden = true; return }
    const S = LC.chartStyle.get(); el.hidden = false;
    el.style.background = b.close >= b.open ? S.borderUp : S.borderDown; el.style.width = w + 'px'; el.style.top = Math.round(y + 9) + 'px';
  }
  setLog(on){ this.log = on; this.chart.priceScale('right').applyOptions({ mode: on ? L.PriceScaleMode.Logarithmic : L.PriceScaleMode.Normal }) }
  setPercent(on){ this.chart.priceScale('right').applyOptions({ mode: on ? L.PriceScaleMode.Percentage : L.PriceScaleMode.Normal }) }
  snapCanvas(){
    const c = this.chart.takeScreenshot(); const ctx = c.getContext('2d');
    ctx.drawImage(this.drawings.cv, 0, 0, this.drawings.cv.width, this.drawings.cv.height, 0, 0, c.width, c.height);
    ctx.font = '600 14px  "Noto Sans KR", sans-serif'; ctx.fillStyle = '#e6e8ec'; ctx.fillText(this.q('.lg-t').textContent, 12, 22);
    return c;
  }
  screenshot(){
    const c = this.snapCanvas();
    const d = new Date(); LC.download(`${this.sym}_${this.tf}_${d.getFullYear()}${LC.pad(d.getMonth()+1)}${LC.pad(d.getDate())}_${LC.pad(d.getHours())}${LC.pad(d.getMinutes())}.png`, c.toDataURL('image/png'));
  }
}
LC.ChartView = ChartView;
})();
