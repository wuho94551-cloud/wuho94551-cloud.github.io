<script>
/* 하이퍼리퀴드: 고래 포지션, 고래 움직임, 청산 감지, 청산 지도 */
(() => {
const { esc, store } = LC;
const API = 'https://api.hyperliquid.xyz/info';
const N_WHALES = 120, POLL_MS = 45000;
const post = body => fetch(API, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) }).then(r => { if(!r.ok) throw new Error(r.status); return r.json() });
const toCoin = sym => { const b = sym.replace(/USDT$/, ''); return /^1000/.test(b) ? 'k' + b.slice(4) : b };
const toSym = coin => (/^k[A-Z]/.test(coin) ? '1000' + coin.slice(1) : coin) + 'USDT';
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const HL = LC.hl = {
  whales: [], pos: {}, marks: {}, moves: [], liqs: [], ready: false, lastPoll: 0,
  async start(){
    if(this.started) return; this.started = true;
    try{ await this.loadWhales() }catch(e){ this.err = '하이퍼리퀴드 순위표를 못 불러왔어요'; LC.bus.emit('hl', 'err'); return }
    this.loadMarks(); setInterval(() => this.loadMarks(), 15000);
    this.poll(); setInterval(() => this.poll(), POLL_MS);
  },
  /* 순위표에서 계좌 규모가 큰 활동 계정 120개를 골라요 (6시간마다 새로) */
  async loadWhales(){
    const c = store.get('hlWhales', null);
    if(c && Date.now() - c.t < 6*36e5 && c.list.length){ this.whales = c.list; return }
    const lb = await LC.getJSON('https://stats-data.hyperliquid.xyz/Mainnet/leaderboard');
    const perf = (r, w) => { const x = r.windowPerformances.find(p => p[0] === w); return x ? x[1] : {pnl:0, vlm:0} };
    this.whales = lb.leaderboardRows.filter(r => +r.accountValue > 1e6 && +perf(r, 'month').vlm > 0)
      .sort((a, b) => b.accountValue - a.accountValue).slice(0, N_WHALES)
      .map(r => ({ a:r.ethAddress, av:+r.accountValue, mp:+perf(r, 'month').pnl, name:r.displayName || '' }));
    store.set('hlWhales', { t:Date.now(), list:this.whales });
  },
  async loadMarks(){
    try{ const [meta, ctx] = await post({type:'metaAndAssetCtxs'}); meta.universe.forEach((u, i) => { this.marks[u.name] = +ctx[i].markPx }) }catch(e){}
  },
  async poll(){
    if(this.polling) return; this.polling = true;
    const list = [...this.whales]; let i = 0;
    const worker = async () => { while(i < list.length){ const w = list[i++]; try{ await this.check(w) }catch(e){} await sleep(120) } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    this.polling = false; this.ready = true; this.lastPoll = Date.now(); LC.bus.emit('hl', 'poll');
  },
  async check(w){
    const st = await post({ type:'clearinghouseState', user:w.a });
    const now = Date.now(), prev = this.pos[w.a];
    const cur = (st.assetPositions || []).map(x => { const p = x.position;
      return { coin:p.coin, szi:+p.szi, entry:+p.entryPx, val:+p.positionValue, upnl:+p.unrealizedPnl, liq: p.liquidationPx ? +p.liquidationPx : null, lev: p.leverage ? +p.leverage.value : null } });
    this.pos[w.a] = { t:now, list:cur, av:+(st.marginSummary || {}).accountValue || w.av };
    if(!prev) return;
    /* 이전과 비교해서 고래 움직임과 청산을 찾아요 */
    for(const p of prev.list){
      const n = cur.find(x => x.coin === p.coin && Math.sign(x.szi) === Math.sign(p.szi));
      const was = Math.abs(p.szi), now2 = n ? Math.abs(n.szi) : 0, mark = this.marks[p.coin] || p.entry;
      if(now2 < was * 0.7){
        const long = p.szi > 0, nearLiq = p.liq && (long ? mark <= p.liq * 1.02 : mark >= p.liq * 0.98);
        let liqFill = null;
        if(nearLiq){ try{ const f = await post({ type:'userFillsByTime', user:w.a, startTime:prev.t - 5000, endTime:now + 1000 }); liqFill = f.find(x => x.coin === p.coin && x.liquidation) }catch(e){} }
        const usd = (was - now2) * (liqFill ? +liqFill.px : mark);
        if(liqFill) this.addLiq({ coin:p.coin, a:w.a, long, usd, px:+liqFill.px, T:+liqFill.time });
        else if(usd >= 2e5) this.addMove({ kind: now2 ? '줄임' : '종료', coin:p.coin, a:w.a, long, usd, px:mark, T:now });
      }
    }
    for(const n of cur){
      const p = prev.list.find(x => x.coin === n.coin && Math.sign(x.szi) === Math.sign(n.szi));
      const add = (Math.abs(n.szi) - (p ? Math.abs(p.szi) : 0)) * (this.marks[n.coin] || n.entry);
      if(add >= 2e5) this.addMove({ kind: p ? '늘림' : '진입', coin:n.coin, a:w.a, long:n.szi > 0, usd:add, px:this.marks[n.coin] || n.entry, T:now });
    }
  },
  addMove(m){ this.moves.unshift(m); this.moves = this.moves.slice(0, 200); LC.bus.emit('hl', 'move');
    if(m.usd >= 1e6) LC.toast(`고래 ${m.long ? '롱' : '숏'} ${m.kind} · ${m.coin} $${LC.fmtBig(m.usd)}`, m.long ? 'up' : 'down', 6000) },
  addLiq(l){
    this.liqs.unshift(l); this.liqs = this.liqs.slice(0, 200); LC.bus.emit('hl', 'liq');
    const F = LC.panels.find(p => p.id === 'flow'); if(F && F.onLiq) F.onLiq({ ex:'Hyperliquid', s:toSym(l.coin), long:l.long, p:l.px, usd:l.usd, T:l.T });
    LC.toast(`하이퍼리퀴드 고래 ${l.long ? '롱' : '숏'} 청산 · ${l.coin} $${LC.fmtBig(l.usd)}`, 'alert', 8000); LC.beep(l.long ? 300 : 900, 0.2);
  },
  /* 한 코인의 고래 포지션 전체 */
  positions(coin){
    const out = [];
    Object.entries(this.pos).forEach(([a, s]) => s.list.forEach(p => { if(!coin || p.coin === coin) out.push({ ...p, a }) }));
    return out.sort((x, y) => y.val - x.val);
  }
};

/* 차트 위 청산 지도: 고래 포지션의 청산가를 가격대별로 모아 오른쪽에 막대로 */
const MAP = {
  draw(ctx, dr, A){
    const P = LC.panels.find(p => p.id === 'whale'); if(!P || !P.cfg.map) return;
    const v = dr.v; if(v.market !== 'futures') return;
    const list = HL.positions(toCoin(v.sym)).filter(p => p.liq); if(!list.length) return;
    const top = v.series.coordinateToPrice(0), bot = v.series.coordinateToPrice(A.h); if(top == null || bot == null) return;
    const bins = 60, step = (top - bot) / bins, buck = new Array(bins).fill(null).map(() => ({l:0, s:0}));
    list.forEach(p => { const i = Math.floor((top - p.liq) / step); if(i >= 0 && i < bins) buck[i][p.szi > 0 ? 'l' : 's'] += p.val });
    const max = Math.max(...buck.map(b => b.l + b.s)); if(!max) return;
    const h = A.h / bins, W = Math.min(160, A.w * 0.25);
    buck.forEach((b, i) => { if(!b.l && !b.s) return; const y = i * h;
      const wl = b.l / max * W, ws = b.s / max * W;
      ctx.fillStyle = 'rgba(234,57,67,.55)'; ctx.fillRect(A.w - wl, y + 1, wl, h - 2);
      ctx.fillStyle = 'rgba(22,199,132,.55)'; ctx.fillRect(A.w - wl - ws, y + 1, ws, h - 2);
      if(b.l + b.s >= max * 0.35){ ctx.font = '10px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = '#e8eef6'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText('$' + LC.fmtBig(b.l + b.s), A.w - wl - ws - 4, y + h/2); ctx.textAlign = 'left' } });
    if(P.cfg.entries) list.slice(0, 12).forEach(p => { const y = dr.pToY(p.entry); if(y == null) return;
      ctx.strokeStyle = p.szi > 0 ? 'rgba(22,199,132,.8)' : 'rgba(234,57,67,.8)'; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(A.w - 220, y); ctx.lineTo(A.w, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '10px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = ctx.strokeStyle; ctx.fillText(`${p.szi > 0 ? '롱' : '숏'} $${LC.fmtBig(p.val)}`, A.w - 218, y - 3) });
  }
};
LC.overlays = LC.overlays || []; LC.overlays.push(MAP);

/* 오른쪽 창: 고래 */
const W = {
  id:'whale', label:'고래', icon:'<path d="M3 13c2-4 7-6 11-5 3 .7 5 3 7 2-1 3-3 5-6 5H9l-3 3v-3c-2-.5-3-1-3-2z"/><circle cx="15" cy="11" r=".8"/>',
  tab:'coin', cfg: Object.assign({ map:true, entries:false }, store.get('whaleCfg', {})),
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="sub-tabs"><button data-t="coin" class="on">이 종목</button><button data-t="all">전체</button><button data-t="moves">움직임</button><button data-t="liqs">청산</button></div>
      <div class="flow-ctl"><label class="chk"><input type="checkbox" data-c="map" ${this.cfg.map?'checked':''}>차트에 청산 지도</label>
        <label class="chk"><input type="checkbox" data-c="entries" ${this.cfg.entries?'checked':''}>고래 진입가</label><span class="dim wh-st"></span></div>
      <div class="wh-sum"></div><div class="feed wh-feed"></div>`;
    el.querySelector('.sub-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.tab = b.dataset.t;
      el.querySelectorAll('.sub-tabs button').forEach(x => x.classList.toggle('on', x === b)); this.render() };
    el.querySelector('.flow-ctl').onchange = e => { const k = e.target.dataset.c; if(k){ this.cfg[k] = e.target.checked; store.set('whaleCfg', this.cfg) } };
    el.querySelector('.wh-feed').onclick = e => { const r = e.target.closest('[data-s]'); if(r && !e.target.closest('a')) app.openSymbol(r.dataset.s, 'futures') };
    LC.bus.on('hl', () => { if(!this.el.hidden) this.render() });
    HL.start();
    setInterval(() => { if(!this.el.hidden) this.status() }, 1000);
  },
  onSymbol(){ if(!this.el.hidden) this.render() },
  onShow(on){ if(on) this.render() },
  status(){ const s = this.el.querySelector('.wh-st');
    s.textContent = HL.err ? HL.err : !HL.ready ? `고래 ${HL.whales.length}명 불러오는 중…` : `고래 ${HL.whales.length}명 · ${Math.round((Date.now() - HL.lastPoll)/1000)}초 전` },
  row(p){ const long = p.szi > 0, mark = HL.marks[p.coin], dist = p.liq && mark ? (p.liq/mark - 1)*100 : null;
    return `<div class="frow wh" data-s="${esc(toSym(p.coin))}"><span><b class="${long?'up':'down'}">${long?'롱':'숏'}</b> ${this.tab === 'all' ? `<b>${esc(p.coin)}</b> ` : ''}<a class="dim" href="https://hypurrscan.io/address/${esc(p.a)}" target="_blank" rel="noopener">${short(p.a)}</a></span>
      <span class="num">$${LC.fmtBig(p.val)}${p.lev ? ` <small class="dim">${p.lev}x</small>` : ''}</span><span class="num ${p.upnl >= 0 ? 'up' : 'down'}">${p.upnl >= 0 ? '+' : ''}${LC.fmtBig(p.upnl)}</span>
      <small class="num dim wh-2">진입 ${LC.fmtPx(p.entry)} · 청산 ${p.liq ? LC.fmtPx(p.liq) + (dist != null ? ` (${LC.fmtPct(dist)})` : '') : '없음'}</small></div>` },
  render(){
    this.status();
    const sum = this.el.querySelector('.wh-sum'), feed = this.el.querySelector('.wh-feed'), v = this.app.v;
    if(!HL.ready){ sum.innerHTML = ''; feed.innerHTML = '<div class="empty">하이퍼리퀴드 큰 계정들의 포지션을 모으는 중이에요. 처음엔 1분쯤 걸려요.</div>'; return }
    if(this.tab === 'coin' || this.tab === 'all'){
      const coin = v ? toCoin(v.sym) : 'BTC', list = HL.positions(this.tab === 'coin' ? coin : null).slice(0, 80);
      const L = list.filter(p => p.szi > 0), S = list.filter(p => p.szi < 0), sv = a => a.reduce((s, p) => s + p.val, 0);
      const avg = a => { const q = a.reduce((s, p) => s + Math.abs(p.szi), 0); return q ? a.reduce((s, p) => s + p.entry*Math.abs(p.szi), 0) / q : null };
      const lv = sv(L), svv = sv(S), r = lv + svv ? lv / (lv + svv) * 100 : 50;
      sum.innerHTML = this.tab === 'coin' ? `<div class="wh-head"><b>${esc(coin)}</b> 고래 ${list.length}명 <span class="dim">(하이퍼리퀴드 계좌 상위 ${HL.whales.length}명 중)</span></div>
        <div class="imb"><div class="imb-bar"><i style="width:${r.toFixed(1)}%"></i></div><div class="imb-t num"><span class="up">롱 $${LC.fmtBig(lv)} · 평단 ${avg(L) ? LC.fmtPx(avg(L)) : '-'}</span><span class="down">숏 $${LC.fmtBig(svv)} · 평단 ${avg(S) ? LC.fmtPx(avg(S)) : '-'}</span></div></div>` : '<div class="wh-head">모든 코인에서 가장 큰 고래 포지션</div>';
      feed.innerHTML = list.length ? list.map(p => this.row(p)).join('') : '<div class="empty">이 코인에 포지션을 가진 고래가 없어요</div>';
    } else if(this.tab === 'moves'){
      sum.innerHTML = '<div class="wh-head">고래가 $20만 이상 들어가거나 줄이거나 끝낸 기록 <span class="dim">(45초마다 확인)</span></div>';
      feed.innerHTML = HL.moves.length ? HL.moves.map(m => `<div class="frow wh" data-s="${esc(toSym(m.coin))}"><span><b class="${m.long?'up':'down'}">${m.long?'롱':'숏'} ${m.kind}</b> <b>${esc(m.coin)}</b> <a class="dim" href="https://hypurrscan.io/address/${esc(m.a)}" target="_blank" rel="noopener">${short(m.a)}</a></span>
        <span class="num">$${LC.fmtBig(m.usd)}</span><span class="num dim">${LC.fmtClock(m.T)}</span></div>`).join('') : '<div class="empty">아직 기록이 없어요. 켜 두면 쌓여요.</div>';
    } else {
      sum.innerHTML = '<div class="wh-head">고래 계정의 실제 청산 <span class="dim">(포지션이 청산가 근처에서 사라지면 체결 기록으로 확인해요)</span></div>';
      feed.innerHTML = HL.liqs.length ? HL.liqs.map(l => `<div class="frow wh" data-s="${esc(toSym(l.coin))}"><span><b class="${l.long?'down':'up'}">${l.long?'롱 청산':'숏 청산'}</b> <b>${esc(l.coin)}</b> <a class="dim" href="https://hypurrscan.io/address/${esc(l.a)}" target="_blank" rel="noopener">${short(l.a)}</a></span>
        <span class="num">$${LC.fmtBig(l.usd)}</span><span class="num dim">${LC.fmtClock(l.T)}</span></div>`).join('') : '<div class="empty">아직 고래 청산이 없어요. 생기면 소리와 함께 여기와 체결·청산 탭에 떠요.</div>';
    }
  }
};
LC.panels.push(W);
})();

</script>
<script>
/* 화면 전체: 헤더, 작도 도구 막대, 차트 칸 배치, 오른쪽 창 */
(() => {
const { $, esc, store } = LC;
const TOOLS = [
  ['cross','십자선 (Esc)','<path d="M12 3v18M3 12h18"/>'],
  ['trend','추세선 (Alt+T)','<path d="M4 19L20 5"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/>'],
  ['ray','반직선','<path d="M4 18L21 6"/><circle cx="4" cy="18" r="1.6"/>'],
  ['ext','연장선','<path d="M2 20L22 4"/>'],
  ['hline','수평선 (Alt+H)','<path d="M2 12h20"/><circle cx="12" cy="12" r="1.6"/>'],
  ['hray','수평 반직선','<path d="M8 12h14"/><circle cx="8" cy="12" r="1.6"/>'],
  ['vline','수직선 (Alt+V)','<path d="M12 2v20"/>'],
  ['rect','사각형','<rect x="4" y="6" width="16" height="12" rx="1"/>'],
  ['fib','피보나치 되돌림 (Alt+F)','<path d="M3 5h18M3 9.5h18M3 14h18M3 19h18"/>'],
  ['pos','롱/숏 포지션 (진입 → 손절 순서로 클릭)','<rect x="5" y="4" width="14" height="8" fill="rgba(22,199,132,.35)"/><rect x="5" y="12" width="14" height="7" fill="rgba(234,57,67,.35)"/>'],
  ['measure','재기 (가격·% ·봉 수)','<path d="M4 20V4M4 20h16M8 16l8-8"/>'],
  ['text','글자','<path d="M5 6h14M12 6v13"/>'],
  ['alert','가격 알림선 (Alt+A)','<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"/>']
];
const EXTRA = [
  ['magnet','자석 (봉의 시가·고가·저가·종가에 붙임)','<path d="M6 4v8a6 6 0 0012 0V4h-4v8a2 2 0 01-4 0V4z"/>'],
  ['keepTool','그리기 유지 (도구가 계속 선택돼 있음)','<path d="M5 19l4-1 10-10-3-3L6 15z"/><path d="M14 5l3 3"/>'],
  ['drawLocked','모든 작도 잠그기','<rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 018 0v3"/>'],
  ['drawHidden','모든 작도 숨기기','<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'],
  ['undo','되돌리기 (Ctrl+Z)','<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>'],
  ['clear','이 종목 작도 모두 지우기','<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>']
];
const CHART_TYPES = [['candle','캔들'],['hollow','속 빈 캔들'],['ha','하이킨 아시'],['bar','바'],['line','라인'],['area','영역']];
const LAYOUTS = [['1','1칸'],['2h','좌우 2칸'],['2v','위아래 2칸'],['4','4칸']];
const DEFAULT_SYMS = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT'];
const RANGES = [['1일','1m'],['5일','5m'],['1개월','30m'],['3개월','1h'],['1년','1d'],['전체','1w']];
const RAIL = {
  list:['목록','<path d="M4 6h16M4 12h16M4 18h16"/>'],
  flow:['체결','<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>'],
  book:['호가','<path d="M4 5h9M4 9h12M4 13h7M4 17h14M4 21h5"/>'],
  move:['급변','<path d="M12 3l4 6h-3v6h-2V9H8zM5 21h14"/>'],
  paper:['매매','<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 15l3-3 2 2 4-4"/>'],
  pf:['자산','<circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/>'],
  whale:['고래', null]
};

const app = LC.app = {
  views: [], active: null, tool: 'cross',
  magnet: store.get('magnet', false), keepTool: false, drawHidden: false, drawLocked: false,
  layout: store.get('layout', '1'), tickers: { futures:{}, spot:{} }, info: { futures:null, spot:null }, panels: LC.panels || [],

  init(){
    this.buildHeader(); this.buildTools();
    document.documentElement.dataset.theme = this.theme = store.get('theme', 'dark');
    const saved = store.get('views', null);
    const cfgs = saved && saved.length ? saved : [{ sym:store.get('sym','BTCUSDT'), market:store.get('market','futures'), tf:store.get('tf','1m') }];
    this.applyLayout(this.layout, cfgs);
    this.buildAside();
    this.loadInfo('futures'); this.loadInfo('spot');
    setInterval(() => { this.views.forEach(v => v.tick()); this.updateHeader(); this.updateFunding() }, 1000);
    document.addEventListener('keydown', e => this.onKey(e));
    if('Notification' in window && Notification.permission === 'default') document.addEventListener('click', () => { try{ Notification.requestPermission() }catch(e){} }, {once:true});
  },
  save(){ store.set('views', this.views.map(v => v.cfg())); store.set('layout', this.layout) },
  get v(){ return this.active },

  /* 칸 배치 */
  applyLayout(lay, cfgs){
    this.layout = lay; const n = lay === '1' ? 1 : lay === '4' ? 4 : 2;
    const host = $('views'); host.className = 'views l' + lay;
    cfgs = cfgs || this.views.map(v => v.cfg());
    while(this.views.length > n){ const v = this.views.pop(); v.destroy() }
    for(let i = 0; i < n; i++){
      if(this.views[i]) continue;
      const v0 = this.views[0]; const base = cfgs[i] || { sym: DEFAULT_SYMS.find(x => !this.views.some(v => v.sym === x)) || DEFAULT_SYMS[i], market: v0 ? v0.market : 'futures', tf: v0 ? v0.tf : '1m' };
      this.views.push(new LC.ChartView(this, host, base));
    }
    if(!this.views.includes(this.active)) this.setActive(this.views[0]);
    if(this.theme) this.setTheme(this.theme);
    host.classList.toggle('multi', n > 1);
    $('laySel').value = lay; this.save();
  },
  setActive(v){
    if(this.active === v) return;
    this.active = v; this.views.forEach(o => o.box.classList.toggle('active', o === v));
    this.syncHeader(); if(this.asideReady) this.panels.forEach(p => p.onSymbol && p.onSymbol(v));
  },
  onViewLoaded(v){ if(v === this.active && this.asideReady){ this.syncHeader(); this.panels.forEach(p => p.onSymbol && p.onSymbol(v)) } this.loadFunding(); LC.paper && LC.paper.lines() },
  openSymbol(sym, market){
    const v = this.active; if(!v) return;
    if(market && market !== v.market) v.market = market;
    v.set(sym); this.syncHeader(); this.panels.forEach(p => p.onSymbol && p.onSymbol(v));
  },
  setConn(v, ok){ if(v === this.active){ $('dot').classList.toggle('ok', ok); $('connTxt').textContent = ok ? '실시간 연결됨' : '재연결 중…' } },
  hint(t){ const h = $('hint'); h.textContent = t; h.classList.toggle('show', !!t) },

  /* 거래소 종목 정보 (가격 소수점) */
  async loadInfo(m){
    try{ const d = await LC.getJSON(`${LC.EP[m].rest}/exchangeInfo`); const map = {};
      d.symbols.forEach(s => { if(m === 'futures' && (s.contractType !== 'PERPETUAL' || s.status !== 'TRADING')) return; if(m === 'spot' && s.status !== 'TRADING') return;
        const f = (s.filters||[]).find(x => x.filterType === 'PRICE_FILTER'); const ts = f ? f.tickSize : '0.01';
        map[s.symbol] = { prec: Math.max(0, (ts.replace(/0+$/,'').split('.')[1]||'').length), base:s.baseAsset } });
      this.info[m] = map; this.views.forEach(v => { if(v.market === m){ const p = this.precOf(v.sym, m); if(p != null && p !== v.prec){ v.prec = p; v.series.applyOptions({priceFormat:{type:'price', precision:p, minMove:1/10**p}}) } } });
    }catch(e){}
  },
  precOf(sym, m){ const i = this.info[m] && this.info[m][sym]; return i ? i.prec : null },

  /* 헤더 */
  buildHeader(){
    $('tfs').innerHTML = LC.TF.map(([k,n]) => `<button data-tf="${k}">${n}</button>`).join('');
    $('tfs').onclick = e => { const b = e.target.closest('button'); if(b && this.v){ this.v.setTf(b.dataset.tf); this.syncHeader() } };
    $('typeSel').innerHTML = CHART_TYPES.map(([k,n]) => `<option value="${k}">${n}</option>`).join('');
    $('typeSel').onchange = e => this.v && this.v.setType(e.target.value);
    $('laySel').innerHTML = LAYOUTS.map(([k,n]) => `<option value="${k}">${n}</option>`).join('');
    $('laySel').onchange = e => this.applyLayout(e.target.value);
    $('mkt').onclick = e => { const b = e.target.closest('button'); if(!b || !this.v || b.dataset.m === this.v.market) return;
      const m = b.dataset.m, sym = this.v.sym; this.v.market = m; this.v.set(sym, m); this.syncHeader(); this.panels.forEach(p => p.onMarket && p.onMarket(m)) };
    $('btnInd').onclick = () => this.indModal();
    $('btnReplay').onclick = () => this.v && (this.v.replay ? this.v.replayExit() : this.v.replayBegin());
    $('btnLog').onclick = () => { if(!this.v) return; this.v.setLog(!this.v.log); $('btnLog').classList.toggle('on', this.v.log); $('btnPct').classList.remove('on') };
    $('btnPct').onclick = () => { if(!this.v) return; const on = !$('btnPct').classList.contains('on'); this.v.setPercent(on); this.v.log = false; $('btnPct').classList.toggle('on', on); $('btnLog').classList.remove('on') };
    $('btnShot').onclick = () => this.v && this.v.screenshot();
    $('btnSet').onclick = () => LC.chartStyle.modal();
    $('btnMarket').onclick = () => LC.market.open();
    $('hTemp').onclick = () => LC.market.open('temp');
    $('btnTheme').onclick = () => this.setTheme(this.theme === 'light' ? 'dark' : 'light');
    $('btnFull').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen() }catch(e){} };
    $('btnReplay2').onclick = $('btnReplay').onclick;
    $('btnSym').onclick = () => this.symSearch();
    $('ranges').innerHTML = RANGES.map(([n,tf]) => `<button data-tf="${tf}" title="${n} 보기 (${tf} 봉)">${n}</button>`).join('');
    $('ranges').onclick = e => { const b = e.target.closest('button'); if(b && this.v){ this.v.setTf(b.dataset.tf); this.syncHeader() } };
    $('ctabAdd').onclick = () => { const v = this.v; if(!v) return; this.ctabs.push({ sym:v.sym, market:v.market, tf:v.tf }); this.ctabOn = this.ctabs.length - 1; this.saveTabs() };
    $('ctabs').onclick = e => { const t = e.target.closest('.ctab'); if(!t) return; const i = +t.dataset.i;
      if(e.target.closest('.x')){ if(this.ctabs.length < 2) return; this.ctabs.splice(i, 1); if(this.ctabOn >= this.ctabs.length) this.ctabOn = this.ctabs.length - 1; this.saveTabs(); this.goTab(this.ctabOn); return }
      this.goTab(i) };
    const clk = () => { $('clock').textContent = new Date().toLocaleTimeString('ko-KR', { timeZone:'Asia/Seoul', hour12:false }) + ' KST' }; clk(); setInterval(clk, 1000);
  },
  /* 위쪽 차트 탭: 종목·시장·봉 묶음을 저장해 두고 눌러서 바꿔요 */
  ctabs: store.get('ctabs', null) || [{ sym:'BTCUSDT', market:'futures', tf:'1m' }], ctabOn: store.get('ctabOn', 0),
  saveTabs(){ store.set('ctabs', this.ctabs); store.set('ctabOn', this.ctabOn); this.renderTabs() },
  renderTabs(){ $('ctabs').innerHTML = this.ctabs.map((t, i) => `<div class="ctab ${i === this.ctabOn ? 'on' : ''}" data-i="${i}"><b>${esc(t.sym.replace(/USDT$/, ''))}</b><span class="dim">${t.market === 'futures' ? '선물' : '현물'} · ${esc(t.tf)}</span>${this.ctabs.length > 1 ? '<span class="x" title="탭 닫기">✕</span>' : ''}</div>`).join('') },
  goTab(i){ const t = this.ctabs[i], v = this.v; if(!t || !v) return; this.ctabOn = i; this.saveTabs();
    if(v.tf !== t.tf) v.tf = t.tf; this.openSymbol(t.sym, t.market) },
  tabSync(){ const t = this.ctabs[this.ctabOn], v = this.v; if(!t || !v) return; if(t.sym !== v.sym || t.market !== v.market || t.tf !== v.tf){ Object.assign(t, { sym:v.sym, market:v.market, tf:v.tf }); this.saveTabs() } },
  /* 종목 찾기 창 */
  symSearch(){
    const v = this.v; if(!v) return; let m = v.market;
    const html = `<div class="seg" id="srM" style="margin-bottom:8px"><button data-m="futures">선물</button><button data-m="spot">현물</button></div>
      <input class="sr-in" id="srQ" placeholder="종목 이름 (예: BTC, SOL, PEPE)" autocomplete="off"><div class="sr-list" id="srL"></div>`;
    LC.modal('종목 찾기', html, (mb, close) => {
      const q = mb.querySelector('#srQ'), L = mb.querySelector('#srL'); let sel = 0, rows = [];
      const draw = () => { mb.querySelectorAll('#srM button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
        const T = this.tickers[m] || {}, k = q.value.trim().toUpperCase();
        rows = Object.keys(T).filter(s => s.endsWith('USDT') && (!k || s.includes(k))).sort((a, b) => (k && a.startsWith(k)) - (k && b.startsWith(k)) || T[b].q - T[a].q).slice(0, 60);
        if(k && !rows.length) rows = [k.endsWith('USDT') ? k : k + 'USDT'];
        sel = Math.min(sel, rows.length - 1);
        L.innerHTML = rows.map((s, i) => { const t = T[s] || {}; return `<div class="sr-row ${i === sel ? 'on' : ''}" data-s="${esc(s)}"><b>${esc(s.replace(/USDT$/, ''))}<span class="dim">/USDT${m === 'futures' ? ' 무기한' : ''}</span></b>
          <span class="num">${t.c ? LC.fmtPx(t.c) : '-'}</span><span class="num ${(t.P||0) >= 0 ? 'up' : 'down'}">${t.P != null ? LC.fmtPct(t.P) : ''}</span><span class="num dim">${t.q ? LC.fmtBig(t.q) : ''}</span></div>` }).join('') || '<div class="empty">시세를 불러오는 중이에요</div>' };
      const pick = s => { close(); this.openSymbol(s, m) };
      q.oninput = () => { sel = 0; draw() };
      q.onkeydown = e => { if(e.key === 'ArrowDown'){ sel = Math.min(sel + 1, rows.length - 1); draw(); e.preventDefault() } else if(e.key === 'ArrowUp'){ sel = Math.max(sel - 1, 0); draw(); e.preventDefault() } else if(e.key === 'Enter' && rows[sel]) pick(rows[sel]) };
      L.onclick = e => { const r = e.target.closest('[data-s]'); if(r) pick(r.dataset.s) };
      mb.querySelector('#srM').onclick = e => { const b = e.target.closest('button'); if(b){ m = b.dataset.m; draw(); q.focus() } };
      draw(); q.focus();
    });
  },
  setTheme(t){
    this.theme = t; store.set('theme', t); document.documentElement.dataset.theme = t;
    const light = t === 'light', grid = light ? 'rgba(0,0,0,.06)' : 'rgba(35,45,59,.6)', border = light ? '#d6dce4' : '#232d3b';
    LC.chartStyle.applyAll();
  },
  syncHeader(){
    const v = this.v; if(!v) return;
    $('hSym').textContent = v.sym + (v.market === 'futures' ? '.P' : '');
    [...$('tfs').children].forEach(b => b.classList.toggle('on', b.dataset.tf === v.tf));
    [...$('ranges').children].forEach(b => b.classList.toggle('on', b.dataset.tf === v.tf));
    this.tabSync();
    [...$('mkt').children].forEach(b => b.classList.toggle('on', b.dataset.m === v.market));
    $('typeSel').value = v.type; $('btnLog').classList.toggle('on', v.log);
    $('fundBox').style.display = v.market === 'futures' ? '' : 'none';
    this.updateHeader();
  },
  updateHeader(){
    const v = this.v; if(!v) return;
    const t = this.tickers[v.market][v.sym], last = v.last, pr = v.prec;
    if(last){ $('hLast').textContent = LC.fmtN(last.close, pr); document.title = `${v.sym} ${LC.fmtN(last.close, pr)} · wuho.com` }
    if(t){ const cls = t.P >= 0 ? 'up' : 'down'; $('hLast').className = 'last num ' + cls; $('hChg').textContent = LC.fmtPct(t.P); $('hChg').className = 'chg num ' + cls;
      $('sHigh').textContent = LC.fmtN(t.h, pr); $('sLow').textContent = LC.fmtN(t.l, pr); $('sVol').textContent = LC.fmtBig(t.q) + ' USDT' }
  },
  async loadFunding(){
    const v = this.v; if(!v || v.market !== 'futures') return;
    try{ const d = await LC.getJSON(`${LC.EP.futures.rest}/premiumIndex?symbol=${v.sym}`); this.fund = { sym:v.sym, rate:+d.lastFundingRate, next:+d.nextFundingTime, mark:+d.markPrice } }catch(e){}
  },
  updateFunding(){
    const f = this.fund, v = this.v; if(!f || !v || f.sym !== v.sym) return;
    const left = f.next - Date.now(); if(left <= 0){ this.fund = null; this.loadFunding(); return }
    $('sFund').innerHTML = `<span class="${f.rate>=0?'up':'down'}">${(f.rate*100).toFixed(4)}%</span> · ${LC.fmtDur(left)}`;
  },

  /* 작도 도구 막대 */
  buildTools(){
    const svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
    $('tools').innerHTML = TOOLS.map(([k,t,p]) => `<button data-tool="${k}" title="${t}" aria-label="${t}">${svg(p)}</button>`).join('')
      + '<span class="tsep"></span>' + EXTRA.map(([k,t,p]) => `<button data-x="${k}" title="${t}" aria-label="${t}">${svg(p)}</button>`).join('');
    $('tools').onclick = e => { const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.tool) return this.setTool(this.tool === b.dataset.tool && b.dataset.tool !== 'cross' ? 'cross' : b.dataset.tool);
      const x = b.dataset.x;
      if(x === 'undo') return this.v && this.v.drawings.undo();
      if(x === 'clear') return this.v && this.v.drawings.clear();
      this[x] = !this[x]; if(x === 'magnet') store.set('magnet', this.magnet); this.syncTools() };
    this.syncTools();
  },
  syncTools(){ document.querySelectorAll('#tools [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === this.tool));
    document.querySelectorAll('#tools [data-x]').forEach(b => b.classList.toggle('on', !!this[b.dataset.x])) },
  setTool(t){ this.tool = t; this.views.forEach(v => { v.drawings.draft = null; v.box.classList.toggle('tool-on', t !== 'cross') }); this.syncTools() },

  onKey(e){
    const tag = (e.target.tagName || '').toLowerCase(); if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    const v = this.v;
    if(e.key === 'Escape'){ this.setTool('cross'); this.hint(''); if(v){ v.replayPick = false; v.drawings.sel = null; v.drawings.updateBar() } }
    else if((e.key === 'Delete' || e.key === 'Backspace') && v && v.drawings.sel){ v.drawings.remove(v.drawings.sel); e.preventDefault() }
    else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && v){ v.drawings.undo(); e.preventDefault() }
    else if(e.altKey && !e.ctrlKey){ const m = {t:'trend', h:'hline', v:'vline', f:'fib', a:'alert', r:'rect'}[e.key.toLowerCase()]; if(m){ this.setTool(m); e.preventDefault() } }
    else if(e.shiftKey && e.key === 'ArrowRight' && v && v.replay){ v.replayStep(); e.preventDefault() }
    else if(e.key === '/' && !e.ctrlKey){ this.symSearch(); e.preventDefault() }
  },

  /* 지표 고르기 */
  /* 지표 찾기 창: 검색, 분류, 즐겨찾기, 지금 차트에 있는 지표 */
  indModal(){
    const v = this.v; if(!v) return;
    const D = LC.IND.DEFS, CATS = ['전체','즐겨찾기','지금 차트','추세','모멘텀','변동성','거래량','선물 데이터','우호 전용'];
    let cat = store.get('indCat', '전체'), favs = store.get('indFav', []);
    const html = `<div class="ix"><div class="ix-cats">${CATS.map(c => `<button data-c="${c}">${c}</button>`).join('')}</div>
      <div class="ix-main"><input class="sr-in" id="ixQ" placeholder="지표 이름으로 찾기 (예: RSI, 일목, 볼린저, 펀딩)" autocomplete="off"><div class="ix-list" id="ixL"></div></div></div>
      <p class="muted" style="margin:10px 0 0">누르면 바로 차트에 들어가고 창은 열려 있어요. 들어간 지표는 범례에서 이름을 두 번 누르거나 ⚙를 눌러 모양을 바꿔요.</p>`;
    LC.modal('지표', html, (mb) => {
      const q = mb.querySelector('#ixQ'), L = mb.querySelector('#ixL'); let sel = 0, rows = [];
      const count = k => v.inds.filter(i => i.key === k).length;
      const draw = () => {
        mb.querySelectorAll('.ix-cats button').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
        if(cat === '지금 차트' && !q.value.trim()){
          L.innerHTML = v.inds.length ? v.inds.map(i => `<div class="ix-row cur" data-id="${i.id}"><span class="dotc" style="background:${LC.color.parseColor(i.color||'#888888').hex}"></span><b>${esc(i.def.title ? i.def.title(i.params) : i.def.label)}</b><span class="dim">${esc(i.def.cat||'')}</span>
            <span class="ix-act"><button data-a="eye" title="보이기/숨기기">${i.hidden ? '◌' : '◉'}</button><button data-a="set" title="설정">⚙</button><button data-a="del" title="지우기">✕</button></span></div>`).join('') : '<div class="empty">아직 넣은 지표가 없어요</div>';
          rows = []; return }
        const k = q.value.trim().toLowerCase();
        rows = Object.keys(D).filter(key => { const d = D[key];
          if(k) return (d.label + ' ' + key + ' ' + (d.desc||'') + ' ' + (d.cat||'')).toLowerCase().includes(k);
          return cat === '전체' || (cat === '즐겨찾기' ? favs.includes(key) : d.cat === cat) });
        sel = Math.max(0, Math.min(sel, rows.length - 1));
        L.innerHTML = rows.map((key, i) => { const d = D[key], n = count(key);
          return `<div class="ix-row ${i === sel ? 'on' : ''}" data-k="${key}"><button class="fav ${favs.includes(key) ? 'on' : ''}" data-fav="${key}" title="즐겨찾기">★</button>
            <b>${esc(d.label)}</b><span class="dim ix-desc">${esc(d.desc||'')}</span><span class="tag">${d.overlay ? '차트 위' : '아래 칸'}${d.futuresOnly ? ' · 선물' : ''}</span>${n ? `<span class="tag on">${n}개 있음</span>` : ''}</div>` }).join('')
          || '<div class="empty">' + (cat === '즐겨찾기' ? '★를 눌러 자주 쓰는 지표를 모아 두세요' : '찾는 지표가 없어요') + '</div>';
      };
      const add = key => { if(D[key].futuresOnly && v.market !== 'futures') return LC.toast('선물 차트에서만 쓸 수 있는 지표예요'); v.addInd(key); LC.toast(`${D[key].label} 넣었어요`); draw() };
      mb.querySelector('.ix-cats').onclick = e => { const b = e.target.closest('button'); if(!b) return; cat = b.dataset.c; store.set('indCat', cat); q.value = ''; sel = 0; draw() };
      q.oninput = () => { sel = 0; draw() };
      q.onkeydown = e => { if(e.key === 'ArrowDown'){ sel = Math.min(sel + 1, rows.length - 1); draw(); e.preventDefault() } else if(e.key === 'ArrowUp'){ sel = Math.max(sel - 1, 0); draw(); e.preventDefault() } else if(e.key === 'Enter' && rows[sel]) add(rows[sel]) };
      L.onclick = e => {
        const f = e.target.closest('[data-fav]'); if(f){ const k = f.dataset.fav; favs = favs.includes(k) ? favs.filter(x => x !== k) : [...favs, k]; store.set('indFav', favs); draw(); return }
        const cur = e.target.closest('.ix-row.cur'); if(cur){ const ind = v.inds.find(i => i.id === cur.dataset.id); const a = e.target.closest('[data-a]'); if(!ind || !a) return;
          if(a.dataset.a === 'set') return v.editInd(ind); v.onLegendClick({ target:v.q(`.lgr[data-id="${ind.id}"] [data-a="${a.dataset.a}"]`) }); draw(); return }
        const r = e.target.closest('[data-k]'); if(r) add(r.dataset.k) };
      draw(); q.focus();
    }, true);
  },

  /* 오른쪽 창 */
  buildAside(){
    const body = $('asideBody'), rail = $('rail'), svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
    rail.innerHTML = this.panels.map(p => { const r = RAIL[p.id] || [p.label, null]; return `<button data-p="${p.id}" title="${esc(p.label)}">${svg(p.icon || r[1] || '<circle cx="12" cy="12" r="6"/>')}<span>${esc(r[0])}</span></button>` }).join('')
      + '<span class="tsep"></span><button data-x="market" title="시장 자료">' + svg('<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="5"/><rect x="13" y="10" width="8" height="11"/><rect x="3" y="13" width="8" height="8"/>') + '<span>시장</span></button>';
    body.innerHTML = this.panels.map(p => `<div class="pn" data-p="${p.id}" hidden></div>`).join('');
    this.panels.forEach(p => p.mount(body.querySelector(`.pn[data-p="${p.id}"]`), this));
    rail.onclick = e => { const b = e.target.closest('button'); if(!b) return; if(b.dataset.x) return LC.market.open();
      if(b.dataset.p === this.panelId && !this.asideHidden) return this.toggleAside(true); this.toggleAside(false); this.showPanel(b.dataset.p) };
    /* 왼쪽 가장자리를 끌어 너비 조절 */
    const app = document.querySelector('.app'), grip = $('asideGrip');
    const setW = w => { w = Math.max(260, Math.min(720, w)); app.style.setProperty('--asideW', w + 'px'); return w };
    setW(store.get('asideW', 340));
    grip.onmousedown = e => { e.preventDefault(); grip.classList.add('on'); const x0 = e.clientX, w0 = $('asideBody').offsetWidth; let w = w0;
      const mv = ev => { w = setW(w0 + x0 - ev.clientX); this.views.forEach(v => v.resize && v.resize()) };
      const up = () => { grip.classList.remove('on'); store.set('asideW', w); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); window.dispatchEvent(new Event('resize')) };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up) };
    this.asideReady = true;
    this.showPanel(store.get('panel', this.panels[0] && this.panels[0].id));
    if(store.get('asideHidden', false)) this.toggleAside(true);
    if(this.v) this.panels.forEach(p => p.onSymbol && p.onSymbol(this.v));
    this.renderTabs();
  },
  toggleAside(hide){ this.asideHidden = hide; store.set('asideHidden', hide); document.querySelector('aside').style.display = hide ? 'none' : '';
    document.querySelector('.app').style.setProperty('--asideW', hide ? '0px' : store.get('asideW', 340) + 'px');
    document.querySelectorAll('#rail [data-p]').forEach(b => b.classList.toggle('on', !hide && b.dataset.p === this.panelId)); window.dispatchEvent(new Event('resize')) },
  showPanel(id){
    if(!this.panels.find(p => p.id === id)) id = this.panels[0].id;
    this.panelId = id; const P = this.panels.find(p => p.id === id);
    $('asideHead').innerHTML = `<span>${esc(P.label)}</span><button class="hb" title="창 접기" id="asideClose">›</button>`;
    $('asideClose').onclick = () => this.toggleAside(true);
    document.querySelectorAll('#rail [data-p]').forEach(b => b.classList.toggle('on', !this.asideHidden && b.dataset.p === id));
    document.querySelectorAll('#asideBody .pn').forEach(el => el.hidden = el.dataset.p !== id);
    this.panels.forEach(p => p.onShow && p.onShow(p.id === id)); store.set('panel', id);
  }
};
window.addEventListener('DOMContentLoaded', () => app.init());
})();

</script>
</body>
</html>
