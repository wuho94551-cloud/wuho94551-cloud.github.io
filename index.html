  kr:'2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31 2027-01-01 2027-02-08 2027-02-09 2027-03-01 2027-05-05 2027-05-13 2027-08-16 2027-09-14 2027-09-15 2027-09-16 2027-10-04 2027-10-11 2027-12-27 2027-12-31' };
const ymd = tz => new Intl.DateTimeFormat('en-CA', { timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
const JP = new Set(['SOFTBANK','KIOXIA','IBIDEN','JP225','SONY']), CN = new Set(['CATL','CXMT','UNITREE','CAMBRICON','INNOLIGHT','AMEC','YMTC','ZHONGJI']), IN = new Set(['NIFTY','RELIANCE','JIO']);
const now = tz => { const p = new Intl.DateTimeFormat('en-US', { timeZone:tz, weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date());
  const g = t => (p.find(x => x.type === t) || {}).value; return { wd:g('weekday'), m:(+g('hour') % 24)*60 + +g('minute') } };
const zoneOf = (sym, market) => { const A = LC.assets, g = A.group(sym, market), k = A.key(sym);
  if(g === 'coin') return null; if(g === 'cmd' || g === 'fx') return g;
  if(JP.has(k)) return 'jp'; if(CN.has(k)) return 'cn'; if(IN.has(k)) return 'in'; if(k === 'IBOV') return 'br';
  if(g === 'kr') return 'kr'; if(g === 'hk') return 'hk'; return 'us' };
LC.session = {
  /* [글자, 종류(open/pre/closed), 설명] 또는 null(코인) */
  of(sym, market){ const z = zoneOf(sym, market); if(!z) return null;
    if(z === 'cmd' || z === 'fx'){ /* 선물·외환: 뉴욕 기준 일 18시 ~ 금 17시, 매일 17~18시 쉼 */
      const t = now('America/New_York'), wk = t.wd === 'Sat' || (t.wd === 'Sun' && t.m < 1080) || (t.wd === 'Fri' && t.m >= 1020);
      if(wk) return ['장 마감', 'closed', '주말 휴장 (뉴욕 일요일 18시 재개)']; if(t.m >= 1020 && t.m < 1080) return ['쉬는 시간', 'closed', '매일 뉴욕 17~18시는 쉬어요'];
      return ['장 중', 'open', z === 'fx' ? '외환 시장 거래 중' : '원자재 선물 거래 중'] }
    const Z = ZONES[z], t = now(Z.tz); if(t.wd === 'Sat' || t.wd === 'Sun') return ['장 마감', 'closed', `${Z.name} 주말 휴장`];
    if(HOL[z] && HOL[z].includes(ymd(Z.tz))) return ['휴장', 'closed', `${Z.name} 증시 휴일`];
    if(Z.open.some(([a, b]) => t.m >= a && t.m < b)) return ['장 중', 'open', `${Z.name} 정규장 거래 중`];
    if(Z.pre && t.m >= Z.pre[0] && t.m < Z.pre[1]) return ['프리마켓', 'pre', '미국 정규장 전 (뉴욕 4:00~9:30)'];

    if(Z.open.length > 1 && t.m >= Z.open[0][1] && t.m < Z.open[1][0]) return ['점심 휴장', 'closed', `${Z.name} 점심 쉬는 시간`];
    return ['장 마감', 'closed', `${Z.name} 정규장 밖 · 선물은 계속 거래돼서 실제 주가와 다를 수 있어요`] },
  badge(sym, market){ const s = this.of(sym, market); return s ? `<span class="mk-b ${s[1]}" title="${LC.esc(s[2])}"><i></i>${s[0]}</span>` : '' }
};
})();

    LC.bus.on('assets', () => this.render()); LC.bus.on('info', () => this.render());

  },
  CATS: [['coin','코인',[['futures','선물'],['spot','현물']]], ['stock','주식',[['us','미국'],['kr','한국'],['hk','아시아'],['idx','지수·ETF']]], ['cmd','원자재·외환',[['cmd','원자재'],['fx','외환']]]],
  THIN: 3e5,   /* 하루 거래대금이 이보다 적으면 접어 둬요 */
  subOf(c){ const C = this.CATS.find(x => x[0] === c); return this.sub[c] || C[2][0][0] },
  /* 주식·원자재는 바이낸스 선물에만 있어요 */

  favs(m){ m = m || this.market; return store.get('favs_' + m, m === 'hl' ? [] : ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','BNBUSDT']) },

  },
  async onMarket(m){

  /* 24시간 흐름: 1시간봉 24개를 화면에 보이는 줄만 받아 와서 작은 선으로 그려요 (10분 보관) */
  sparkSvg(s, m){ const c = (this.spc || {})[s + '|' + m]; if(!c || !c.p.length) return '';
    const p = c.p, lo = Math.min(...p), hi = Math.max(...p), W = 46, H = 18, k = hi > lo ? H / (hi - lo) : 0;

  async sparkRun(){

  render(){ if(!this.market) return;

    el.querySelector('.ls-cats').hidden = el.querySelector('.ls-subs').hidden = !all;
    if(all){ el.querySelector('.ls-cats').innerHTML = this.CATS.map(c => `<button data-cat="${c[0]}" class="${this.cat === c[0] ? 'on' : ''}">${c[1]}</button>`).join('');
      const C = this.CATS.find(x => x[0] === this.cat), cur = this.subOf(this.cat);
      el.querySelector('.ls-subs').innerHTML = C[2].map(([k, n]) => `<button data-sub="${k}" class="${cur === k ? 'on' : ''}">${n}</button>`).join('') }
    const s = this.syms(), ar = k => this.sortKey === k ? (this.sortDir > 0 ? ' ▲' : ' ▼') : '';
    const isCap = !all || this.cat === 'coin', mk = isCap && this.sortKey !== 'q' ? 'm' : 'q';
    el.querySelector('.lhead').innerHTML = `<div data-s="s" style="grid-column:1/3">종목${ar('s')}</div><div data-s="c">현재가${ar('c')}</div><div data-s="P">일봉${ar('P')}</div>${this.col4 === 'spark' ? `<div class="col4" data-col4="1" title="눌러서 ${isCap ? '시총' : '거래대금'} 보기로 바꾸기">24시간 ▾</div>` : `<div class="col4"><span data-s="${isCap ? 'm' : 'q'}" title="${isCap ? '시가총액 (없으면 하루 거래대금)' : '하루 거래대금'}">${isCap ? '시총' : '거래대금'}${ar(isCap ? 'm' : 'q')}</span><span class="c4b" data-col4="1" title="24시간 흐름 보기로 바꾸기">▾</span></div>`}`;
    el.querySelector('.ls-n').textContent = s.length + '개';
    const loading = all && this.cat !== 'coin' && !LC.hlm.ready ? '<div class="ls-note">하이퍼리퀴드 종목도 불러오는 중…</div>' : '';
    const more = this.thinN || this.showThin ? `<button class="ls-more">${this.showThin ? '거래 적은 종목 접기' : `하루 거래대금 $300K 안 되는 ${this.thinN}개 더 보기`}</button>` : '';
    const key = [this.top, this.cat, this.subOf ? this.subOf(this.cat) : '', this.market, (el.querySelector('#q') || {}).value, this.showThin].join('|');
    if(key !== this.lkey){ this.lkey = key; this.nShow = this.CH; this.list.scrollTop = 0 }
    this.rowsAll = s;
    this.list.innerHTML = loading + (s.length ? s.slice(0, this.nShow).map(([x, m]) => this.row(x, m)).join('') : `<div class="empty">${this.top === 'fav' ? '전체 종목에서 ☆을 눌러 내 목록에 담아 보세요' : '종목이 없어요'}</div>`) + more;
    if(this.col4 === 'spark') this.sparkWatch() },
  markSel(){ this.list.querySelectorAll('.wrow').forEach(r => r.classList.toggle('sel', !!this.app.v && r.dataset.s === this.app.v.sym)) },
  patch(ch){
    if(this.el.hidden) return;
    const map = {}; this.list.querySelectorAll('.wrow').forEach(r => { if(r.dataset.m === this.market) map[r.dataset.s] = r });
    const T = this.app.tickers[this.market];
    ch.forEach(([s, dir]) => { const r = map[s]; if(!r) return; const t = T[s], cls = t.P >= 0 ? 'up' : 'down';
      const px = r.querySelector('.px'), pc = r.querySelector('.pc');
      px.textContent = LC.fmtPx(t.c); pc.textContent = LC.fmtChg(t.P); pc.className = 'pc num ' + cls;
      const now = Date.now(), lf = this.lastFl[s] || 0; if(now - lf < 1000) return; this.lastFl[s] = now;
      px.classList.remove('fx-up','fx-dn'); void px.offsetWidth; px.classList.add(dir > 0 ? 'fx-up' : 'fx-dn') });
  },
  onShow(on){ if(on) this.render() }
};
LC.panels.push(P);

/* 아주 작은 이벤트 버스: 다른 창들이 시세 흐름을 함께 쓰도록 */
LC.bus = LC.bus || { h:{}, on(k, f){ (this.h[k] = this.h[k] || []).push(f) }, emit(k, d){ (this.h[k] || []).forEach(f => { try{ f(d) }catch(e){ console.error(e) } }) } };
})();

</script>
<script>
/* 오른쪽 창: 체결·청산, 호가, 급등락 알림 + 차트 위 큰 체결 버블 */
(() => {
const { esc, store } = LC;
const AMTS = [[0,'전체'],[1e3,'$1K+'],[1e4,'$10K+'],[5e4,'$50K+'],[1e5,'$100K+'],[5e5,'$500K+']];

/* 차트 위 버블: 큰 시장가 체결을 가격·시간 위치에 원으로 */
class Bubbles {
  constructor(){ this.items = [] }
  add(b){ this.items.push(b); if(this.items.length > 400) this.items.shift() }
  draw(ctx, dr, A){
    const P = LC.panels.find(p => p.id === 'flow'); if(!P || !P.cfg.bubbles) return;
    const base = Math.max(P.cfg.bubbleMin, 1);
    for(const b of this.items){
      const x = dr.tToX(b.t), y = dr.pToY(b.p); if(x == null || y == null || x < -20 || x > A.w + 20) continue;
      const r = Math.min(28, 3 + Math.sqrt(b.usd / base) * 4);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
      ctx.fillStyle = b.liq ? 'rgba(240,185,11,.35)' : b.buy ? 'rgba(91,156,246,.28)' : 'rgba(240,97,109,.28)'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = b.liq ? '#f0b90b' : b.buy ? '#5b9cf6' : '#f0616d'; ctx.stroke();
      if(r > 12){ ctx.font = '10px  "Noto Sans KR", sans-serif'; ctx.fillStyle = '#e8eef6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(LC.fmtBig(b.usd), x, y); ctx.textAlign = 'left' }
    }
  }
}

/* 체결·청산 */
const FLOW = {
  id:'flow', label:'체결·청산', tab:'trades',
  cfg: Object.assign({ tradeMin:1e4, liqMin:0, liqAll:true, sound:false, bubbles:false, bubbleMin:5e4 }, store.get('flowCfg', {}), store.get('bubOff1', false) ? {} : (store.set('bubOff1', true), { bubbles:false })),
  trades:[], liqs:[], liqMin:{},
  mount(el, app){
    this.el = el; this.app = app;
    const opt = (sel) => AMTS.map(([v,n]) => `<option value="${v}" ${+sel===v?'selected':''}>${n}</option>`).join('');
    el.innerHTML = `<div class="sub-tabs"><button data-t="trades" class="on">큰 체결</button><button data-t="liqs">청산</button></div>
      <div class="flow-ctl">
        <label>체결 <select data-c="tradeMin">${opt(this.cfg.tradeMin)}</select></label>
        <label>청산 <select data-c="liqMin">${opt(this.cfg.liqMin)}</select></label>
        <label class="chk"><input type="checkbox" data-c="liqAll" ${this.cfg.liqAll?'checked':''}>청산 모든 종목</label>
        <label class="chk"><input type="checkbox" data-c="bubbles" ${this.cfg.bubbles?'checked':''}>차트 버블</label>
        <label>버블 <select data-c="bubbleMin">${opt(this.cfg.bubbleMin)}</select></label>
        <label class="chk"><input type="checkbox" data-c="sound" ${this.cfg.sound?'checked':''}>소리</label>
      </div>
      <div class="liq-chart"><canvas></canvas><div class="liq-sum num"></div></div>
      <div class="feed-head"><span>가격</span><span>금액</span><span>시각</span></div>
      <div class="feed"></div>`;
    this.feed = el.querySelector('.feed'); this.cv = el.querySelector('.liq-chart canvas');
    el.querySelector('.sub-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.tab = b.dataset.t;
      el.querySelectorAll('.sub-tabs button').forEach(x => x.classList.toggle('on', x === b)); this.renderFeed() };
    el.querySelector('.flow-ctl').onchange = e => { const k = e.target.dataset.c; if(!k) return;
      this.cfg[k] = e.target.type === 'checkbox' ? e.target.checked : +e.target.value; store.set('flowCfg', this.cfg); this.renderFeed() };
    this.feed.onclick = e => { const r = e.target.closest('[data-s]'); if(r && r.dataset.s !== (app.v && app.v.sym)) app.openSymbol(r.dataset.s, 'futures') };
    this.startLiq();
    setInterval(() => { if(document.hidden) return; this.drawLiqChart(); if(this.dirty && !this.el.hidden){ this.dirty = false; this.renderFeed() } }, 500);
  },
  onSymbol(v){
    if(this.sym === v.sym && this.market === v.market) return;
    this.sym = v.sym; this.market = v.market; this.trades = []; this.ws && this.ws.close(); this.bybit && this.bybit.close();
    this.app.views.forEach(x => { x.bubbles = x.bubbles || new Bubbles() });
    const s = v.sym.toLowerCase(), sym = v.sym, mkt = v.market;
    const onTrade = (T, p, q, buy) => { if(sym !== this.sym) return; const usd = p*q;
      if(usd >= this.cfg.bubbleMin) this.app.views.forEach(x => { if(x.sym === sym && x.market === mkt) x.bubbles.add({t:Math.floor(T/1000), p, usd, buy}) });
      if(usd < this.cfg.tradeMin) return;
      this.trades.unshift({T, p, usd, buy, s:sym}); if(this.trades.length > 300) this.trades.pop();
      if(this.cfg.sound && usd >= Math.max(this.cfg.tradeMin, 5e4)) LC.beep(buy ? 660 : 440, 0.05, 0.08);
      this.dirty = true };
    /* 하이퍼리퀴드 종목: 하이퍼리퀴드 실시간 체결 */
    if(mkt === 'hl'){ this.ws = LC.openWS('wss://api.hyperliquid.xyz/ws', m => { if(m.channel !== 'trades' || !Array.isArray(m.data)) return;
        m.data.forEach(t => { if(t.coin === sym) onTrade(+t.time, +t.px, +t.sz, t.side === 'B') }) }, null,
      ws => ws.send(JSON.stringify({ method:'subscribe', subscription:{ type:'trades', coin:sym } }))); this.ws.keepAlive({ method:'ping' }, 45000); return }
    this.ws = LC.openWS(`${LC.EP[mkt].ws}/${s}@aggTrade`, m => {
      if(sym !== this.sym) return; const p = +m.p, q = +m.q, usd = p*q, buy = !m.m;
      if(usd >= this.cfg.bubbleMin) this.app.views.forEach(x => { if(x.sym === sym && x.market === mkt) x.bubbles.add({t:Math.floor(m.T/1000), p, usd, buy}) });
      if(usd < this.cfg.tradeMin) return;
      this.trades.unshift({T:m.T, p, usd, buy, s:sym}); if(this.trades.length > 300) this.trades.pop();
      if(this.cfg.sound && usd >= Math.max(this.cfg.tradeMin, 5e4)) LC.beep(buy ? 660 : 440, 0.05, 0.08);
      this.dirty = true;
    });
    if(mkt === 'futures'){
      this.bybit = LC.openWS('wss://stream.bybit.com/v5/public/linear', m => {
        if(!m.topic || !m.data) return; (Array.isArray(m.data) ? m.data : [m.data]).forEach(d => this.onLiq({ ex:'Bybit', s:d.s, long: d.S === 'Buy', p:+d.p, usd:+d.p * +d.v, T:+d.T }));
      }, null, ws => ws.send(JSON.stringify({op:'subscribe', args:[`allLiquidation.${sym}`]})));
      this.bybit.keepAlive({op:'ping'}, 20000);
    }
  },
  startLiq(){
    this.liqWS = LC.openWS(`${LC.EP.futures.ws}/!forceOrder@arr`, m => { const o = m.o; if(!o) return;
      this.onLiq({ ex:'Binance', s:o.s, long: o.S === 'SELL', p:+o.ap || +o.p, usd:(+o.ap || +o.p) * +(o.z || o.q), T:+o.T }) });
  },
  onLiq(l){
    if(!l.usd) return;
    this.liqs.unshift(l); if(this.liqs.length > 500) this.liqs.pop();
    const min = Math.floor(l.T / 6e4); const k = this.liqMin[min] = this.liqMin[min] || {long:0, short:0, sym:{}};
    k[l.long ? 'long' : 'short'] += l.usd;
    if(this.app.v && l.s === this.app.v.sym){
      this.app.views.forEach(x => { if(x.sym === l.s && x.market === 'futures' && x.bubbles) x.bubbles.add({t:Math.floor(l.T/1000), p:l.p, usd:l.usd, liq:true}) });
      if(this.cfg.sound && l.usd >= Math.max(this.cfg.liqMin, 1e4)) LC.beep(l.long ? 300 : 900, 0.12, 0.1);
    }
    this.dirty = true;
  },
  renderFeed(){
    if(this.el.hidden) return;
    const c = this.cfg, cur = this.app.v ? this.app.v.sym : '';
    let rows;
    if(this.tab === 'trades'){
      rows = this.trades.filter(t => t.usd >= c.tradeMin).slice(0, 120).map(t =>
        `<div class="frow ${t.usd >= 1e5 ? 'big' : ''}"><span class="num ${t.buy?'up':'down'}">${t.buy?'▲':'▼'} ${LC.fmtPx(t.p)}</span><span class="num">$${LC.fmtBig(t.usd)}</span><span class="num dim">${LC.fmtClock(t.T)}</span></div>`);
      if(this.market === 'spot' && !rows.length) rows = ['<div class="empty">현물 큰 체결을 기다리는 중이에요</div>'];
    } else {
      rows = this.liqs.filter(l => l.usd >= c.liqMin && (c.liqAll || l.s === cur)).slice(0, 150).map(l =>
        `<div class="frow liq ${l.usd >= 1e5 ? 'big' : ''}" data-s="${esc(l.s)}"><span><b class="${l.long?'down':'up'}">${l.long?'롱 청산':'숏 청산'}</b> ${esc(l.s.replace(/USDT$/,''))} <small class="dim">${l.ex}</small></span><span class="num">$${LC.fmtBig(l.usd)}</span><span class="num dim">${LC.fmtClock(l.T)}</span></div>`);
    }
    this.feed.innerHTML = rows.length ? rows.join('') : '<div class="empty">조건에 맞는 내역을 기다리는 중이에요</div>';
  },
  drawLiqChart(){
    if(this.el.hidden) return;
    const cv = this.cv, box = cv.parentElement, W = box.clientWidth, H = 70, dpr = window.devicePixelRatio || 1;
    if(cv.width !== W*dpr){ cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px' }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const now = Math.floor(Date.now()/6e4), mins = []; let max = 1, tl = 0, ts = 0;
    for(let i = 29; i >= 0; i--){ const k = this.liqMin[now - i] || {long:0, short:0}; mins.push(k); max = Math.max(max, k.long, k.short); tl += k.long; ts += k.short }
    const bw = W / 30, mid = H / 2;
    mins.forEach((k, i) => { const hl = k.long / max * (mid - 4), hs = k.short / max * (mid - 4);
      ctx.fillStyle = '#f0616d'; ctx.fillRect(i*bw + 1, mid, bw - 2, hl); ctx.fillStyle = '#5b9cf6'; ctx.fillRect(i*bw + 1, mid - hs, bw - 2, hs) });
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, mid, W, 1);
    this.el.querySelector('.liq-sum').innerHTML = tl + ts ? `30분 청산 · <span class="down">롱 $${LC.fmtBig(tl)}</span> · <span class="up">숏 $${LC.fmtBig(ts)}</span>` : '<span class="dim">최근 30분 동안 청산이 없어요</span>';
    Object.keys(this.liqMin).forEach(k => { if(k < now - 60) delete this.liqMin[k] });
  },
  onShow(on){ if(on){ this.renderFeed(); this.drawLiqChart() } }
};

/* 호가창 */
const BOOK = {
  id:'book', label:'호가', ex: store.get('bookEx', 'Binance'), group:0, bids:new Map(), asks:new Map(),
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="book-ctl"><div class="seg" data-c="ex"><button data-v="Binance">Binance</button><button data-v="Bybit">Bybit</button></div><span class="book-src dim" hidden>Hyperliquid 호가</span>
      <label>묶음 <select data-c="group"></select></label></div>
      <div class="book-head"><span>가격</span><span>수량</span><span>누적(USDT)</span></div>
      <div class="book"><div class="asks"></div><div class="mid num"></div><div class="bids"></div></div>
      <div class="imb"><div class="imb-bar"><i></i></div><div class="imb-t num"></div></div>`;
    el.querySelector('[data-c=ex]').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.ex = b.dataset.v; store.set('bookEx', this.ex); this.connect() };
    el.querySelector('[data-c=group]').onchange = e => { this.group = +e.target.value; this.render() };
    setInterval(() => { if(!document.hidden && this.vis()) this.render() }, 250);
    /* 호가는 초당 10번씩 들어와서, 패널이 보일 때만 연결하고 안 보인 지 20초가 지나면 끊어요 */
    setInterval(() => { const on = this.vis() && !document.hidden; if(on){ this.offAt = 0; if(!this.ws && this.sym) this.connect() } else if(this.ws){ this.offAt = this.offAt || Date.now(); if(Date.now() - this.offAt > 20000){ this.ws.close(); this.ws = null; this.offAt = 0 } } }, 2000);
  },
  vis(){ const pn = this.el && (this.el.closest('.pn') || this.el); return !!pn && !pn.hidden && !(this.app && this.app.asideHidden) },
  onShow(on){ if(on && !this.ws && this.sym) this.connect() },
  onSymbol(v){ if(this.sym === v.sym && this.market === v.market){ if(this.prec !== v.prec) this.setupGroups(v); return } this.sym = v.sym; this.market = v.market; this.setupGroups(v); if(this.vis()) this.connect(); else { this.ws && this.ws.close(); this.ws = null; this.bids = new Map(); this.asks = new Map() } },
  setupGroups(v){
    this.prec = v.prec; const tick = 1 / 10 ** v.prec; const g = [1, 2, 5, 10, 50, 100, 500].map(m => +(tick*m).toFixed(10));
    this.group = g[0];
    this.el.querySelector('[data-c=group]').innerHTML = g.map(x => `<option value="${x}">${x}</option>`).join('');
  },
  connect(){
    this.ws && this.ws.close(); this.bids = new Map(); this.asks = new Map();
    this.el.querySelectorAll('[data-c=ex] button').forEach(b => b.classList.toggle('on', b.dataset.v === this.ex));
    const s = this.sym, m = this.market;
    this.el.querySelector('[data-c=ex]').hidden = m === 'hl'; this.el.querySelector('.book-src').hidden = m !== 'hl';
    if(m === 'hl'){ this.ws = LC.openWS('wss://api.hyperliquid.xyz/ws', d => { if(d.channel !== 'l2Book' || !d.data || d.data.coin !== s) return; const [b, a] = d.data.levels;
        this.bids = new Map(b.map(x => [+x.px, +x.sz])); this.asks = new Map(a.map(x => [+x.px, +x.sz])) }, null,
      ws => ws.send(JSON.stringify({ method:'subscribe', subscription:{ type:'l2Book', coin:s } }))); this.ws.keepAlive({ method:'ping' }, 45000); return }
    if(this.ex === 'Binance'){
      this.ws = LC.openWS(`${LC.EP[m].wsPub}/${s.toLowerCase()}@depth20@100ms`, d => {
        const b = d.b || d.bids, a = d.a || d.asks; if(!b) return;
        this.bids = new Map(b.map(x => [+x[0], +x[1]])); this.asks = new Map(a.map(x => [+x[0], +x[1]])) });
    } else {
      const url = m === 'futures' ? 'wss://stream.bybit.com/v5/public/linear' : 'wss://stream.bybit.com/v5/public/spot';
      this.ws = LC.openWS(url, d => {
        if(!d.topic || !d.data) return;
        if(d.type === 'snapshot'){ this.bids = new Map(); this.asks = new Map() }
        d.data.b.forEach(([p, q]) => +q ? this.bids.set(+p, +q) : this.bids.delete(+p));
        d.data.a.forEach(([p, q]) => +q ? this.asks.set(+p, +q) : this.asks.delete(+p));
      }, null, ws => ws.send(JSON.stringify({op:'subscribe', args:[`orderbook.50.${s}`]})));
      this.ws.keepAlive({op:'ping'}, 20000);
    }
  },
  agg(map, side){
    const g = this.group || 0, out = new Map();
    map.forEach((q, p) => { const k = g ? (side === 'bid' ? Math.floor(p/g)*g : Math.ceil(p/g)*g) : p; out.set(+k.toFixed(10), (out.get(+k.toFixed(10)) || 0) + q) });
    return [...out.entries()].sort((a, b) => side === 'bid' ? b[0] - a[0] : a[0] - b[0]).slice(0, this.depth || 14);
  },
  render(){
    if(this.el.hidden || !this.sym) return;
    /* 패널 높이에 맞춰 호가 줄 수를 정해요 (한 줄 약 19px) */
    const bh = this.el.querySelector('.book').clientHeight; if(bh) this.depth = Math.max(6, Math.min(40, Math.floor((bh - 40) / 2 / 19)));
    const bids = this.agg(this.bids, 'bid'), asks = this.agg(this.asks, 'ask');
    if(!bids.length || !asks.length){ const sk = '<div class="skel-row"></div>'.repeat(this.depth || 10); this.el.querySelector('.asks').innerHTML = sk; this.el.querySelector('.bids').innerHTML = sk; this.el.querySelector('.mid').innerHTML = '<span class="dim">호가 기다리는 중</span>'; return }
    const v = this.app.v, pr = v ? Math.max(0, v.prec) : 2;
    const cum = arr => { let c = 0; return arr.map(([p, q]) => { c += p*q; return [p, q, c] }) };
    const B = cum(bids), A = cum(asks); const max = Math.max(B[B.length-1][2], A[A.length-1][2]);
    const row = ([p, q, c], side) => `<div class="brow ${side}"><i style="width:${(c/max*100).toFixed(1)}%"></i><span class="num">${LC.fmtN(p, pr)}</span><span class="num">${q >= 1000 ? LC.fmtBig(q) : q.toFixed(q < 10 ? 3 : 1)}</span><span class="num">${LC.fmtBig(c)}</span></div>`;
    this.el.querySelector('.asks').innerHTML = A.slice().reverse().map(r => row(r, 'ask')).join('');
    this.el.querySelector('.bids').innerHTML = B.map(r => row(r, 'bid')).join('');
    const bb = bids[0][0], ba = asks[0][0], spread = ba - bb;
    const last = v && v.last ? v.last.close : (bb + ba) / 2;
    this.el.querySelector('.mid').innerHTML = `<b class="${last >= (this.prevLast||last) ? 'up' : 'down'}">${LC.fmtN(last, pr)}</b> <small class="dim">스프레드 ${LC.fmtN(spread, pr)} (${(spread/ba*1e4).toFixed(2)}bp)</small>`;
    this.prevLast = last;
    const bs = B[B.length-1][2], as = A[A.length-1][2], r = bs / (bs + as) * 100;
    this.el.querySelector('.imb i').style.width = r.toFixed(1) + '%';
    this.el.querySelector('.imb-t').innerHTML = `<span class="up">매수 ${r.toFixed(1)}%</span><span class="down">매도 ${(100-r).toFixed(1)}%</span>`;
  }
};

/* 급등락 알림: 전체 종목 시세 흐름에서 1분·5분 사이 크게 움직인 종목 */
const MOVE = {
  id:'move', label:'급등락', events:[], hist:{}, last:{},
  cfg: Object.assign({ th1:1.5, th5:3, sound:true, toast:true }, store.get('moveCfg', {})),
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="flow-ctl"><label>1분 <input type="number" step="0.1" min="0.2" data-c="th1" value="${this.cfg.th1}">%</label>
      <label>5분 <input type="number" step="0.1" min="0.5" data-c="th5" value="${this.cfg.th5}">%</label>
      <label class="chk"><input type="checkbox" data-c="sound" ${this.cfg.sound?'checked':''}>소리</label>
      <label class="chk"><input type="checkbox" data-c="toast" ${this.cfg.toast?'checked':''}>팝업</label><span class="qmark" title="지금 보고 있는 시장(선물/현물)의 모든 USDT 종목을 지켜보다가 1분·5분 사이 기준보다 크게 움직이면 알려 줘요. 같은 종목은 5분에 한 번만 알려요.">?</span></div>
      <div class="feed"></div>`;
    this.feed = el.querySelector('.feed');
    el.querySelector('.flow-ctl').onchange = e => { const k = e.target.dataset.c; if(!k) return;
      this.cfg[k] = e.target.type === 'checkbox' ? e.target.checked : Math.max(0.1, +e.target.value || this.cfg[k]); store.set('moveCfg', this.cfg) };
    this.feed.onclick = e => { const r = e.target.closest('[data-s]'); if(r) app.openSymbol(r.dataset.s, r.dataset.m) };
    LC.bus.on('tickers', d => this.onTickers(d));
    this.render();
  },
  onTickers({market, arr}){
    const now = Date.now(), sec = Math.floor(now / 5000);
    if(this.market !== market){ this.market = market; this.hist = {} }
    arr.forEach(r => {
      const s = r.s; if(!s.endsWith('USDT')) return; const c = +r.c; const h = this.hist[s] = this.hist[s] || [];
      if(!h.length || h[h.length-1][0] !== sec) h.push([sec, c]); else h[h.length-1][1] = c;
      while(h.length && h[0][0] < sec - 62) h.shift();
      if(+r.q < 5e5) return;
      const ref = (back) => { for(const x of h) if(x[0] >= sec - back) return x[1]; return null };
      const p1 = ref(12), p5 = ref(60);
      const c1 = p1 ? (c - p1) / p1 * 100 : 0, c5 = p5 ? (c - p5) / p5 * 100 : 0;
      let hit = null;
      if(Math.abs(c1) >= this.cfg.th1) hit = {w:'1분', ch:c1}; else if(Math.abs(c5) >= this.cfg.th5 && h[0][0] <= sec - 55) hit = {w:'5분', ch:c5};
      if(hit && (!this.last[s] || now - this.last[s] > 3e5)){
        this.last[s] = now; const ev = { s, m:market, ...hit, p:c, T:now };
        this.events.unshift(ev); if(this.events.length > 200) this.events.pop();
        if(this.cfg.sound) LC.beep(hit.ch > 0 ? 1046 : 330, 0.15, 0.12);
        if(this.cfg.toast) LC.toast(`${s.replace(/USDT$/,'')} ${hit.w} ${LC.fmtPct(hit.ch)} · ${LC.fmtPx(c)}`, hit.ch > 0 ? 'up' : 'down', 6000);
        this.render();
      }
    });
  },
  render(){
    this.feed.innerHTML = this.events.length ? this.events.map(e => `<div class="frow mv" data-s="${esc(e.s)}" data-m="${e.m}"><span><b>${esc(e.s.replace(/USDT$/,''))}</b> <small class="dim">${e.w}</small></span>
      <span class="num ${e.ch > 0 ? 'up' : 'down'}">${e.ch > 0 ? '급등' : '급락'} ${LC.fmtPct(e.ch)}</span><span class="num dim">${LC.fmtClock(e.T)}</span></div>`).join('')
      : '<div class="empty">아직 기준을 넘은 종목이 없어요. 켜 두면 여기 쌓여요.</div>';
  }
};

LC.panels.push(FLOW, BOOK, MOVE);
LC.Bubbles = Bubbles;
})();

</script>
<script>
/* 시장 자료 창: 김치 프리미엄, 히트맵, 펀딩·OI 흐름, 시장 온도·공포 탐욕 지수 */
(() => {
const { $, esc, getJSON } = LC;
const TABS = [['kimp','김치 프리미엄'],['heat','히트맵'],['flow','펀딩·OI 흐름'],['temp','시장 온도·공포 탐욕']];
let timer = null;

const M = LC.market = {
  open(tab){
    LC.modal('시장 자료', `<div class="sub-tabs mk-tabs">${TABS.map(([k,n]) => `<button data-t="${k}">${n}</button>`).join('')}</div><div class="mk-body"></div>`, (mb, close) => {
      this.mb = mb; this.body = mb.querySelector('.mk-body');
      mb.querySelector('.mk-tabs').onclick = e => { const b = e.target.closest('button'); if(b) this.show(b.dataset.t) };
      this.show(tab || LC.store.get('mkTab', 'kimp'));
      const obs = new MutationObserver(() => { if(!document.body.contains(mb)){ clearInterval(timer); obs.disconnect() } });
      obs.observe(document.body, {childList:true});
    }, true);
  },
  show(t){
    clearInterval(timer); LC.store.set('mkTab', t); this.tab = t;
    this.mb.querySelectorAll('.mk-tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    this.body.innerHTML = LC.skel(8);
    const run = () => this[t]().catch(e => { if(this.tab === t) this.body.innerHTML = `<div class="empty">자료를 못 불러왔어요 (${esc(e.message)}). 잠시 뒤 다시 열어 주세요.</div>` });
    run(); timer = setInterval(() => { if(!document.hidden) run() }, t === 'flow' ? 60000 : t === 'kimp' ? 15000 : 10000);
  },
  goto(sym){ LC.app.openSymbol(sym, 'futures'); document.querySelector('.modal-bg .x') && document.querySelector('.modal-bg .x').click() },

  /* 김치 프리미엄: 업비트·빗썸 원화 가격 ÷ (바이낸스 현물 USDT 가격 × 환율) − 1 */
  async kimp(){
    /* 업비트는 브라우저 요청을 10초에 한 번쯤만 받아 줘서, 원화 전체 시세를 한 번에 받고 실패하면 직전 값을 써요 */
    let up = this.upCache;
    try{ up = await getJSON('https://api.upbit.com/v1/ticker/all?quote_currencies=KRW'); this.upCache = up; this.upAt = Date.now() }catch(e){ if(!up) throw new Error('업비트 요청이 잠시 막혔어요') }
    if(!this.fx || Date.now() - this.fxAt > 6e5){ try{ const f = await getJSON('https://open.er-api.com/v6/latest/USD'); this.fx = f.rates.KRW; this.fxAt = Date.now() }catch(e){ this.fx = this.fx || 1400 } }
    const [bn, bt] = await Promise.all([getJSON(`${LC.EP.spot.rest}/ticker/price`), getJSON('https://api.bithumb.com/public/ticker/ALL_KRW').catch(() => ({data:{}}))]);
    const bnP = Object.fromEntries(bn.filter(x => x.symbol.endsWith('USDT')).map(x => [x.symbol.slice(0, -4), +x.price]));
    const usdt = (up.find(x => x.market === 'KRW-USDT') || {}).trade_price;
    const totalVol = up.reduce((s, x) => s + x.acc_trade_price_24h, 0);
    const rows = up.filter(x => bnP[x.market.slice(4)]).map(x => { const c = x.market.slice(4), b = bnP[c];
      const bth = bt.data && bt.data[c] ? +bt.data[c].closing_price : null;
      return { c, up:x.trade_price, ch:x.signed_change_rate*100, vol:x.acc_trade_price_24h, share:x.acc_trade_price_24h/totalVol*100, b, kp:(x.trade_price/(b*this.fx)-1)*100, tp: usdt ? (x.trade_price/(b*usdt)-1)*100 : null, bth, bkp: bth ? (bth/(b*this.fx)-1)*100 : null } })
      .sort((a, b) => b.vol - a.vol).slice(0, 60);
    if(this.tab !== 'kimp') return;
    const btc = rows.find(r => r.c === 'BTC') || {};
    /* 김프가 ±15%를 넘으면 같은 이름의 다른 코인일 가능성이 커서 평균에서 빼고 표시해요 */
    const ok = rows.filter(r => Math.abs(r.kp) < 15).slice(0, 20), avg = ok.reduce((s, r) => s + r.kp, 0) / (ok.length || 1);
    const pc = v => v == null ? '-' : `<span class="${v >= 0 ? 'up' : 'down'}">${LC.fmtPct(v)}</span>`;
    this.body.innerHTML = `<div class="kpis">
        <div><small>BTC 김프 (환율)</small><b class="num">${pc(btc.kp)}</b></div><div><small>BTC 김프 (업비트 테더)</small><b class="num">${pc(btc.tp)}</b></div>
        <div><small>거래 상위 20 평균 김프</small><b class="num">${pc(avg)}</b></div><div><small>원/달러 · 업비트 USDT</small><b class="num">${LC.fmtN(this.fx, 1)} · ${usdt ? LC.fmtN(usdt, 0) : '-'}</b></div></div>
      <p class="muted">김프 = 업비트 원화 가격 ÷ (바이낸스 현물 가격 × 원/달러 환율) − 1. 테더 김프는 환율 대신 업비트 USDT 원화 가격으로 나눠요. 업비트 거래대금 순, 15초마다 새로 고쳐요. 업비트 시세 기준 ${LC.fmtClock(this.upAt)}.</p>
      <div class="scroll"><table class="tbl"><thead><tr><th>코인</th><th>업비트 (원)</th><th>24h</th><th>바이낸스 ($)</th><th>김프</th><th>테더 김프</th><th>빗썸 김프</th><th>업비트 거래대금</th><th>점유율</th></tr></thead>
      <tbody>${rows.map(r => `<tr data-s="${esc(r.c)}USDT"><td><b>${esc(r.c)}</b>${Math.abs(r.kp) >= 15 ? ' <span class="tag" title="업비트와 바이낸스에서 같은 이름의 다른 코인일 수 있어요">이름 겹침?</span>' : ''}</td><td class="num">${LC.fmtN(r.up, r.up < 100 ? 2 : 0)}</td><td class="num">${pc(r.ch)}</td>
        <td class="num">${LC.fmtPx(r.b)}</td><td class="num">${pc(r.kp)}</td><td class="num">${pc(r.tp)}</td><td class="num">${pc(r.bkp)}</td><td class="num">${LC.fmtBig(r.vol)}</td><td class="num">${r.share.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`;
    this.body.querySelector('tbody').onclick = e => { const tr = e.target.closest('tr'); if(tr) this.goto(tr.dataset.s) };
  },

  /* 히트맵: 선물 거래대금 상위 종목을 네모 크기로, 색은 고른 값으로 */
  async heat(){
    const [tk, pi] = await Promise.all([getJSON(`${LC.EP.futures.rest}/ticker/24hr`), getJSON(`${LC.EP.futures.rest}/premiumIndex`)]);
    const fund = Object.fromEntries(pi.map(x => [x.symbol, +x.lastFundingRate * 100]));
    const inf = LC.app.info.futures;
    let items = tk.filter(x => x.symbol.endsWith('USDT') && (!inf || inf[x.symbol])).map(x => ({ s:x.symbol, q:+x.quoteVolume, ch:+x.priceChangePercent, f:fund[x.symbol] ?? 0, p:+x.lastPrice }))
      .sort((a, b) => b.q - a.q).slice(0, 70);
    if(this.tab !== 'heat') return;
    const metric = this.heatMetric || 'ch';
    if(!this.body.querySelector('.heat')){
      this.body.innerHTML = `<div class="heat-ctl"><div class="seg"><button data-m="ch">24h 등락률</button><button data-m="f">펀딩비</button></div><span class="muted">선물 거래대금 상위 70개 · 네모 크기 = 거래대금(제곱근 비율) · 눌러서 차트 열기</span></div><div class="heat"></div>`;
      this.body.querySelector('.heat-ctl .seg').onclick = e => { const b = e.target.closest('button'); if(b){ this.heatMetric = b.dataset.m; this.heat() } };
      this.body.querySelector('.heat').onclick = e => { const t = e.target.closest('[data-s]'); if(t) this.goto(t.dataset.s) };
    }
    this.body.querySelectorAll('.heat-ctl button').forEach(b => b.classList.toggle('on', b.dataset.m === metric));
    const box = this.body.querySelector('.heat'), W = box.clientWidth, H = box.clientHeight;
    const rects = squarify(items.map(i => ({...i, v:Math.sqrt(i.q)})), 0, 0, W, H);
    const col = v => { const lim = metric === 'ch' ? 8 : 0.05; const t = Math.max(-1, Math.min(1, v / lim)); const a = 0.18 + Math.abs(t) * 0.72;
      return metric === 'f' && Math.abs(v - 0.01) < 0.002 ? 'rgba(125,138,156,.35)' : t >= 0 ? `rgba(91,156,246,${a})` : `rgba(240,97,109,${a})` };
    box.innerHTML = rects.map(r => { const big = r.w > 70 && r.h > 38;
      return `<div class="tile" data-s="${esc(r.s)}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${col(metric === 'ch' ? r.ch : r.f)}" title="${esc(r.s)} ${LC.fmtPct(r.ch)} · 펀딩 ${r.f.toFixed(4)}%">
        ${r.w > 34 && r.h > 18 ? `<b>${esc(r.s.replace(/USDT$/,''))}</b>` : ''}${big ? `<span class="num">${metric === 'ch' ? LC.fmtPct(r.ch) : r.f.toFixed(4) + '%'}</span>` : ''}</div>` }).join('');
  },

  /* 펀딩·OI 흐름: 가격과 미결제약정이 함께 어떻게 움직였는지 */
  async flow(){
    const [tk, pi] = await Promise.all([getJSON(`${LC.EP.futures.rest}/ticker/24hr`), getJSON(`${LC.EP.futures.rest}/premiumIndex`)]);
    const fund = Object.fromEntries(pi.map(x => [x.symbol, +x.lastFundingRate * 100]));
    const inf = LC.app.info.futures;
    const top = tk.filter(x => x.symbol.endsWith('USDT') && (!inf || inf[x.symbol])).sort((a, b) => b.quoteVolume - a.quoteVolume).slice(0, 30);
    const rows = [];
    for(let i = 0; i < top.length; i += 6){
      const part = await Promise.all(top.slice(i, i+6).map(async x => {
        const [oi, ls] = await Promise.all([getJSON(`${LC.EP.futures.data}/openInterestHist?symbol=${x.symbol}&period=1h&limit=25`).catch(() => []),
                                            getJSON(`${LC.EP.futures.data}/globalLongShortAccountRatio?symbol=${x.symbol}&period=1h&limit=1`).catch(() => [])]);
        const n = oi.length, cur = n ? +oi[n-1].sumOpenInterestValue : 0;
        const ch = k => n > k ? (cur / +oi[n-1-k].sumOpenInterestValue - 1) * 100 : null;
        return { s:x.symbol, p:+x.lastPrice, pc:+x.priceChangePercent, f:fund[x.symbol], oi:cur, oi1:ch(1), oi24:ch(24), ls: ls[0] ? +ls[0].longShortRatio : null };
      }));
      rows.push(...part); if(this.tab !== 'flow') return;
    }
    const tag = r => r.oi24 == null ? '' : r.pc >= 0 && r.oi24 >= 0 ? '<span class="tag up">롱 유입</span>' : r.pc < 0 && r.oi24 >= 0 ? '<span class="tag down">숏 유입</span>' : r.pc >= 0 ? '<span class="tag">숏 정리</span>' : '<span class="tag">롱 정리</span>';
    const pc = v => v == null ? '-' : `<span class="${v >= 0 ? 'up' : 'down'}">${LC.fmtPct(v)}</span>`;
    this.body.innerHTML = `<p class="muted">선물 거래대금 상위 30개. 가격과 미결제약정(OI)이 같이 오르면 새 롱 돈이, 가격이 내리는데 OI가 늘면 새 숏 돈이 들어온 걸로 봐요. 1분마다 새로 고쳐요.</p>
      <div class="scroll"><table class="tbl"><thead><tr><th>종목</th><th>가격</th><th>24h</th><th>펀딩비</th><th>OI</th><th>OI 1h</th><th>OI 24h</th><th>롱/숏 계정</th><th>해석</th></tr></thead>
      <tbody>${rows.map(r => `<tr data-s="${esc(r.s)}"><td><b>${esc(r.s.replace(/USDT$/,''))}</b></td><td class="num">${LC.fmtPx(r.p)}</td><td class="num">${pc(r.pc)}</td>
        <td class="num ${r.f > 0.01 ? 'up' : r.f < 0 ? 'down' : ''}">${r.f != null ? r.f.toFixed(4) + '%' : '-'}</td><td class="num">$${LC.fmtBig(r.oi)}</td><td class="num">${pc(r.oi1)}</td><td class="num">${pc(r.oi24)}</td>
        <td class="num">${r.ls != null ? r.ls.toFixed(2) : '-'}</td><td>${tag(r)}</td></tr>`).join('')}</tbody></table></div>`;
    this.body.querySelector('tbody').onclick = e => { const tr = e.target.closest('tr'); if(tr) this.goto(tr.dataset.s) };
  },

  /* 시장 온도 + 공포·탐욕 */
  async temp(){
    const t = await M.measureTemp();
    if(!this.fng || Date.now() - this.fngAt > 6e5){ try{ this.fng = (await getJSON('https://api.alternative.me/fng/?limit=60')).data.reverse(); this.fngAt = Date.now() }catch(e){} }
    if(this.tab !== 'temp') return;
    const f = this.fng ? this.fng[this.fng.length-1] : null;
    const KO = {'Extreme Fear':'극단적 공포','Fear':'공포','Neutral':'중립','Greed':'탐욕','Extreme Greed':'극단적 탐욕'};
    this.body.innerHTML = `<div class="temp-grid">
      <div class="card"><h4>시장 온도 · BTC</h4><div class="gauge"><b class="num" style="color:${t.color}">${t.label}</b><span class="num">${t.score.toFixed(2)}배</span></div>
        <p class="muted">최근 3분을 앞 1시간 평소(3분 평균)와 견줘요.</p>
        <div class="bars">${[['체결 수', t.trades],['거래량', t.vol],['움직임(고저폭)', t.range]].map(([n, v]) => `<div class="bar-row"><span>${n}</span><div class="bar"><i style="width:${Math.min(100, v/3*100)}%;background:${v >= 2 ? 'var(--down)' : v >= 1.2 ? 'var(--accent)' : 'var(--blue)'}"></i></div><b class="num">${v.toFixed(2)}배</b></div>`).join('')}</div></div>
      <div class="card"><h4>공포·탐욕 지수</h4>${f ? `<div class="gauge"><b class="num" style="color:${+f.value < 25 ? 'var(--down)' : +f.value > 75 ? 'var(--up)' : 'var(--accent)'}">${f.value}</b><span>${KO[f.value_classification] || f.value_classification}</span></div>
        <svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none">${spark(this.fng.map(x => +x.value), 300, 70)}</svg><p class="muted">최근 60일 · 0 = 극단적 공포, 100 = 극단적 탐욕 · 자료: alternative.me</p>` : '<p class="muted">지수를 못 불러왔어요</p>'}</div></div>`;
  },
  async measureTemp(){
    const k = await getJSON(`${LC.EP.futures.rest}/klines?symbol=BTCUSDT&interval=1m&limit=64`); k.pop();
    const last = k.slice(-3), prev = k.slice(-63, -3);
    const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
    const ratio = f => (sum(last, f)) / (sum(prev, f) / 20 || 1);
    const trades = ratio(x => +x[8]), vol = ratio(x => +x[5]), range = (Math.max(...last.map(x => +x[2])) - Math.min(...last.map(x => +x[3]))) / (sum(prev, x => +x[2] - +x[3]) / 60 * 3 || 1);
    const score = (trades + vol + range) / 3;
    const [label, color] = score < 0.7 ? ['조용', 'var(--blue)'] : score < 1.3 ? ['보통', 'var(--ink)'] : score < 2.2 ? ['활발', 'var(--accent)'] : ['과열', 'var(--down)'];
    return { trades, vol, range, score, label, color };
  }
};

function squarify(items, x, y, w, h){
  const out = []; const total = items.reduce((s, i) => s + i.v, 0); if(!total) return out;
  const scale = w * h / total; let rest = items.map(i => ({...i, a: i.v * scale}));
  while(rest.length){
    const short = Math.min(w, h); let row = [rest[0]], best = worst(row, short);
    for(let i = 1; i < rest.length; i++){ const r = [...row, rest[i]], wv = worst(r, short); if(wv > best) break; row = r; best = wv }
    const sum = row.reduce((s, i) => s + i.a, 0), thick = sum / short;
    let off = 0; row.forEach(i => { const len = i.a / thick;
      if(w >= h) out.push({...i, x:Math.round(x), y:Math.round(y + off), w:Math.round(thick) - 2, h:Math.round(len) - 2});
      else out.push({...i, x:Math.round(x + off), y:Math.round(y), w:Math.round(len) - 2, h:Math.round(thick) - 2}); off += len });
    if(w >= h){ x += thick; w -= thick } else { y += thick; h -= thick }
    rest = rest.slice(row.length);
  }
  return out;
  function worst(r, s){ const sum = r.reduce((a, i) => a + i.a, 0), mx = Math.max(...r.map(i => i.a)), mn = Math.min(...r.map(i => i.a)); return Math.max(s*s*mx/(sum*sum), sum*sum/(s*s*mn)) }
}
function spark(vals, W, H){
  const n = vals.length; if(n < 2) return ''; const pts = vals.map((v, i) => `${(i/(n-1)*W).toFixed(1)},${(H - v/100*H).toFixed(1)}`).join(' ');
  return `<line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="rgba(255,255,255,0.1)"/><polyline points="${pts}" fill="none" stroke="#f0b90b" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

/* 헤더의 작은 시장 온도 표시 (1분마다) */
async function headerTemp(){
  try{ const t = await M.measureTemp(); const el = $('hTemp'); if(el){ el.innerHTML = `시장 온도 <b style="color:${t.color}">${t.label}</b>`; el.title = `BTC 최근 3분 ÷ 앞 1시간 평소 · 체결 ${t.trades.toFixed(2)}배 · 거래량 ${t.vol.toFixed(2)}배 · 움직임 ${t.range.toFixed(2)}배` } }catch(e){}
}
window.addEventListener('DOMContentLoaded', () => { headerTemp(); setInterval(headerTemp, 60000) });
LC.headerTemp = headerTemp;
})();

<script>
/* 오른쪽 창: 가상 매매(모의 선물 거래)와 내 현물 포트폴리오 */
(() => {
const { esc, store } = LC;
const FEE = 0.0004, START = 10000;
const uid = () => Math.random().toString(36).slice(2, 9);
const prices = {};          // 종목별 최신가 (선물)
let pollT = 0;

function livePx(sym){
  const v = LC.app.views.find(x => x.sym === sym && x.market === 'futures' && x.last);
  if(v) return v.last.close;
  const t = LC.app.tickers.futures[sym]; if(t && t.c) return t.c;
  return prices[sym];
}

const PAPER = {
  id:'paper', label:'가상 매매',
  st: store.get('paper', { bal:START, pos:[], orders:[], hist:[] }),
  side:'long', type:'market',
  save(){ store.set('paper', this.st) },
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="pp-scroll">
      <div class="pp-acc"><div><small>잔고</small><b class="num pp-bal"></b></div><div><small>평가 자산</small><b class="num pp-eq"></b></div><div><small>미실현 손익</small><b class="num pp-upnl"></b></div></div>
      <div class="pp-form">
        <div class="seg pp-side"><button data-s="long" class="on">롱</button><button data-s="short">숏</button></div>
        <div class="seg pp-type"><button data-t="market" class="on">시장가</button><button data-t="limit">지정가</button></div>
        <label class="pp-limit" hidden>주문 가격<input class="inp num" id="ppPrice" type="number" step="any"></label>
        <label>증거금 (USDT)<input class="inp num" id="ppAmt" type="number" step="any" min="1" value="100"></label>
        <div class="pp-pcts">${[10,25,50,100].map(p => `<button data-p="${p}">${p}%</button>`).join('')}</div>
        <label>레버리지 <b class="num" id="ppLevT">10x</b><input id="ppLev" type="range" min="1" max="100" value="10"></label>
        <div class="pp-two"><label>익절 가격<input class="inp num" id="ppTp" type="number" step="any" placeholder="선택"></label><label>손절 가격<input class="inp num" id="ppSl" type="number" step="any" placeholder="선택"></label></div>
        <div class="pp-info muted"></div>
        <button class="btn pri pp-go" id="ppGo">롱 주문</button>
        <p class="muted small">실제 돈은 오가지 않아요. 바이낸스 선물 실시간 가격으로 계산하고, 수수료 0.04%를 양쪽에 매겨요. 청산가는 대략 값이에요.</p>
      </div>
      <h5>포지션 <span class="dim pp-pn"></span></h5><div class="pp-pos"></div>
      <h5>대기 주문</h5><div class="pp-ord"></div>
      <h5>최근 거래 <button class="lnk" id="ppReset">처음부터 (잔고 ${START.toLocaleString()} USDT)</button></h5><div class="pp-hist"></div></div>`;
    const q = s => el.querySelector(s);
    q('.pp-side').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.side = b.dataset.s; q('.pp-side').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); this.form() };
    q('.pp-type').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.type = b.dataset.t; q('.pp-type').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      q('.pp-limit').hidden = this.type !== 'limit'; if(this.type === 'limit' && !q('#ppPrice').value){ const p = livePx(this.sym); if(p) q('#ppPrice').value = p } this.form() };
    q('.pp-pcts').onclick = e => { const b = e.target.closest('button'); if(b){ q('#ppAmt').value = Math.floor(this.st.bal * b.dataset.p / 100 * 100) / 100; this.form() } };
    q('#ppLev').oninput = () => { q('#ppLevT').textContent = q('#ppLev').value + 'x'; this.form() };
    ['#ppAmt','#ppPrice','#ppTp','#ppSl'].forEach(s => q(s).oninput = () => this.form());
    q('#ppGo').onclick = () => this.submit();
    q('#ppReset').onclick = () => { this.st = { bal:START, pos:[], orders:[], hist:[] }; this.save(); this.render(); this.lines(); LC.toast('가상 매매를 처음부터 시작해요') };
    el.addEventListener('click', e => { const b = e.target.closest('[data-close],[data-cancel],[data-go]'); if(!b) return;
      if(b.dataset.close){ const p = this.st.pos.find(x => x.id === b.dataset.close); if(p) this.close(p, livePx(p.sym), '직접 종료') }
      if(b.dataset.cancel){ const o = this.st.orders.find(x => x.id === b.dataset.cancel); if(o){ this.st.bal += o.margin; this.st.orders = this.st.orders.filter(x => x !== o); this.save(); this.render(); this.lines() } }
      if(b.dataset.go) app.openSymbol(b.dataset.go, 'futures') });
    setInterval(() => this.tick(), 1000);
    this.render();
  },
  onSymbol(v){ this.sym = v.sym; this.form(); this.lines() },
  onShow(on){ if(on){ this.form(); this.render() } },
  form(){
    if(!this.el) return; const q = s => this.el.querySelector(s);
    const lev = +q('#ppLev').value, amt = +q('#ppAmt').value || 0, px = this.type === 'limit' ? +q('#ppPrice').value : livePx(this.sym);
    const long = this.side === 'long';
    q('#ppGo').textContent = `${esc(this.sym || '')} ${long ? '롱' : '숏'} ${this.type === 'limit' ? '지정가' : '시장가'} 주문`;
    q('#ppGo').className = 'btn pp-go ' + (long ? 'buy' : 'sell');
    if(!px){ q('.pp-info').textContent = this.app && this.app.v && this.app.v.market !== 'futures' ? '가상 매매는 선물 가격으로 해요. 선물로 바꾸면 바로 쓸 수 있어요.' : '가격을 기다리는 중…'; return }
    const size = amt * lev, liq = long ? px * (1 - 1/lev + 0.004) : px * (1 + 1/lev - 0.004);
    q('.pp-info').innerHTML = `포지션 크기 <b class="num">${LC.fmtN(size, 2)} USDT</b> · 수량 <b class="num">${(size/px).toPrecision(5)}</b><br>예상 청산가 <b class="num down">${LC.fmtPx(liq)}</b> · 수수료 약 <b class="num">${LC.fmtN(size*FEE, 2)}</b>`;
  },
  submit(){
    const q = s => this.el.querySelector(s), sym = this.sym;
    if(!sym || !this.app.v || this.app.v.market !== 'futures') return LC.toast('가상 매매는 선물 차트에서 할 수 있어요');
    const margin = +q('#ppAmt').value, lev = +q('#ppLev').value, tp = +q('#ppTp').value || null, sl = +q('#ppSl').value || null;
    const px = this.type === 'limit' ? +q('#ppPrice').value : livePx(sym);
    if(!(margin > 0) || !px) return LC.toast('증거금과 가격을 확인해 주세요');
    const fee = margin * lev * FEE;
    if(margin + fee > this.st.bal) return LC.toast('잔고가 모자라요');
    const long = this.side === 'long';
    if(tp && (long ? tp <= px : tp >= px)) return LC.toast('익절 가격이 진입가 반대쪽에 있어요');
    if(sl && (long ? sl >= px : sl <= px)) return LC.toast('손절 가격이 진입가 반대쪽에 있어요');
    if(this.type === 'limit'){
      this.st.bal -= margin; this.st.orders.push({ id:uid(), sym, side:this.side, price:px, margin, lev, tp, sl, t:Date.now(), above: px > livePx(sym) });
      LC.toast(`${sym} ${long ? '롱' : '숏'} 지정가 ${LC.fmtPx(px)} 주문을 걸었어요`);
    } else this.open({ sym, side:this.side, entry:px, margin, lev, tp, sl });
    this.save(); this.render(); this.lines();
  },
  open(o){
    const fee = o.margin * o.lev * FEE; this.st.bal -= o.margin + fee;
    this.st.pos.push({ id:uid(), sym:o.sym, side:o.side, entry:o.entry, margin:o.margin, lev:o.lev, qty:o.margin*o.lev/o.entry, tp:o.tp, sl:o.sl, t:Date.now() });
    LC.toast(`${o.sym} ${o.side === 'long' ? '롱' : '숏'} ${LC.fmtPx(o.entry)} 체결 · ${o.lev}x`, o.side === 'long' ? 'up' : 'down');
  },
  pnl(p, px){ return (p.side === 'long' ? px - p.entry : p.entry - px) * p.qty },
  liq(p){ return p.side === 'long' ? p.entry * (1 - 1/p.lev + 0.004) : p.entry * (1 + 1/p.lev - 0.004) },
  close(p, px, reason){
    if(!px) return; const pnl = this.pnl(p, px), fee = p.qty * px * FEE;
    const back = reason === '강제 청산' ? 0 : Math.max(0, p.margin + pnl - fee);
    this.st.bal += back; this.st.pos = this.st.pos.filter(x => x !== p);
    const real = back - p.margin;
    this.st.hist.unshift({ sym:p.sym, side:p.side, entry:p.entry, exit:px, lev:p.lev, pnl:real, roe:real/p.margin*100, reason, t:Date.now() }); this.st.hist = this.st.hist.slice(0, 50);
    LC.toast(`${p.sym} ${reason} · ${real >= 0 ? '+' : ''}${LC.fmtN(real, 2)} USDT`, real >= 0 ? 'up' : 'down', 7000); if(reason !== '직접 종료') LC.beep(real >= 0 ? 880 : 300, 0.2);
    this.save(); this.render(); this.lines();
  },
  async tick(){
    const syms = [...new Set([...this.st.pos.map(p => p.sym), ...this.st.orders.map(o => o.sym)])];
    if(syms.some(s => !livePx(s) || !LC.app.views.some(v => v.sym === s)) && Date.now() - pollT > 2000){
      pollT = Date.now(); try{ (await LC.getJSON(`${LC.EP.futures.rest}/ticker/price`)).forEach(x => prices[x.symbol] = +x.price) }catch(e){} }
    let changed = false;
    for(const o of [...this.st.orders]){ const px = livePx(o.sym); if(!px) continue;
      if(o.above ? px >= o.price : px <= o.price){ this.st.orders = this.st.orders.filter(x => x !== o); this.st.bal += o.margin; this.open({...o, entry:o.price}); changed = true } }
    for(const p of [...this.st.pos]){ const px = livePx(p.sym); if(!px) continue; const long = p.side === 'long';
      if(long ? px <= this.liq(p) : px >= this.liq(p)) this.close(p, px, '강제 청산');
      else if(p.tp && (long ? px >= p.tp : px <= p.tp)) this.close(p, p.tp, '익절');
      else if(p.sl && (long ? px <= p.sl : px >= p.sl)) this.close(p, p.sl, '손절') }
    if(changed){ this.save(); this.lines() }
    if(!this.el.hidden || changed) this.render();
  },
  render(){
    if(!this.el) return; const q = s => this.el.querySelector(s);
    let upnl = 0, used = 0;
    const pos = this.st.pos.map(p => { const px = livePx(p.sym), pnl = px ? this.pnl(p, px) : 0; upnl += pnl; used += p.margin;
      return `<div class="pp-row"><div class="pp-r1"><button class="lnk" data-go="${esc(p.sym)}"><b>${esc(p.sym.replace(/USDT$/,''))}</b></button> <span class="tag ${p.side === 'long' ? 'up' : 'down'}">${p.side === 'long' ? '롱' : '숏'} ${p.lev}x</span>
        <span class="num ${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${LC.fmtN(pnl, 2)} (${LC.fmtPct(pnl/p.margin*100)})</span><button class="btn sm" data-close="${p.id}">종료</button></div>
        <div class="pp-r2 num dim">진입 ${LC.fmtPx(p.entry)} · 지금 ${px ? LC.fmtPx(px) : '-'} · 청산 ${LC.fmtPx(this.liq(p))}${p.tp ? ' · 익절 ' + LC.fmtPx(p.tp) : ''}${p.sl ? ' · 손절 ' + LC.fmtPx(p.sl) : ''}</div></div>` }).join('');
    const ord = this.st.orders.map(o => `<div class="pp-row"><div class="pp-r1"><b>${esc(o.sym.replace(/USDT$/,''))}</b> <span class="tag ${o.side === 'long' ? 'up' : 'down'}">${o.side === 'long' ? '롱' : '숏'} ${o.lev}x</span><span class="num">${LC.fmtPx(o.price)} · ${LC.fmtN(o.margin, 2)} USDT</span><button class="btn sm" data-cancel="${o.id}">취소</button></div></div>`).join('');
    const hist = this.st.hist.slice(0, 20).map(h => `<div class="pp-row"><div class="pp-r1"><b>${esc(h.sym.replace(/USDT$/,''))}</b> <span class="tag">${h.side === 'long' ? '롱' : '숏'} ${h.lev}x · ${esc(h.reason)}</span><span class="num ${h.pnl >= 0 ? 'up' : 'down'}">${h.pnl >= 0 ? '+' : ''}${LC.fmtN(h.pnl, 2)} (${LC.fmtPct(h.roe)})</span></div>
      <div class="pp-r2 num dim">${LC.fmtPx(h.entry)} → ${LC.fmtPx(h.exit)} · ${new Date(h.t).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div></div>`).join('');
    q('.pp-bal').textContent = LC.fmtN(this.st.bal, 2);
    q('.pp-eq').textContent = LC.fmtN(this.st.bal + used + upnl + this.st.orders.reduce((s, o) => s + o.margin, 0), 2);
    q('.pp-upnl').innerHTML = `<span class="${upnl >= 0 ? 'up' : 'down'}">${upnl >= 0 ? '+' : ''}${LC.fmtN(upnl, 2)}</span>`;
    q('.pp-pn').textContent = this.st.pos.length ? this.st.pos.length + '개' : '';
    q('.pp-pos').innerHTML = pos || '<div class="empty sm">열린 포지션이 없어요</div>';
    q('.pp-ord').innerHTML = ord || '<div class="empty sm">대기 주문이 없어요</div>';
    q('.pp-hist').innerHTML = hist || '<div class="empty sm">아직 거래가 없어요</div>';
  },
  /* 차트에 진입·청산·익절·손절 가격선 */
  lines(){
    LC.app.views.forEach(v => {
      (v.paperLines || []).forEach(l => { try{ v.series.removePriceLine(l) }catch(e){} }); v.paperLines = [];
      if(v.market !== 'futures') return;
      this.st.pos.filter(p => p.sym === v.sym).forEach(p => {
        const add = (price, color, title, style = 0) => v.paperLines.push(v.series.createPriceLine({ price, color, title, lineWidth:1, lineStyle:style, axisLabelVisible:true }));
        add(p.entry, p.side === 'long' ? '#5b9cf6' : '#f0616d', `가상 ${p.side === 'long' ? '롱' : '숏'} ${p.lev}x`);
        add(this.liq(p), '#b38cff', '청산', 2); if(p.tp) add(p.tp, '#5b9cf6', '익절', 2); if(p.sl) add(p.sl, '#f0616d', '손절', 2) });
      this.st.orders.filter(o => o.sym === v.sym).forEach(o => v.paperLines.push(v.series.createPriceLine({ price:o.price, color:'#8a94a6', title:'가상 지정가', lineWidth:1, lineStyle:1, axisLabelVisible:true })));
    });
  }
};

/* 포트폴리오: 현물 보유 코인의 평단가·수량으로 손익 보기 */
const PF = {
  id:'pf', label:'포트폴리오',
  rows: store.get('pf', []), px:{},
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="pp-scroll"><div class="pp-acc"><div><small>평가 금액</small><b class="num pf-val">-</b></div><div><small>매수 금액</small><b class="num pf-cost">-</b></div><div><small>손익</small><b class="num pf-pnl">-</b></div></div>
      <form class="pf-form"><input class="inp" id="pfCoin" placeholder="코인 (예: BTC)" autocomplete="off" aria-label="코인"><input class="inp num" id="pfQty" type="number" step="any" placeholder="수량" aria-label="수량">
        <input class="inp num" id="pfAvg" type="number" step="any" placeholder="평단가 (USDT)" aria-label="평단가"><button class="btn pri">추가</button></form>
      <p class="muted small pad">바이낸스 현물 가격으로 5초마다 계산해요. 같은 코인을 다시 넣으면 평단가를 합쳐 줘요. 이 브라우저에 저장되고, 서버 동기화를 켜 두면 다른 기기에도 같이 올라가요.</p>
      <div class="pf-list"></div></div>`;
    el.querySelector('.pf-form').onsubmit = e => { e.preventDefault();
      const c = el.querySelector('#pfCoin').value.trim().toUpperCase().replace(/USDT$/, ''), qn = +el.querySelector('#pfQty').value, a = +el.querySelector('#pfAvg').value;
      if(!/^[A-Z0-9]{1,15}$/.test(c) || !(qn > 0) || !(a > 0)) return LC.toast('코인, 수량, 평단가를 확인해 주세요');
      const ex = this.rows.find(r => r.c === c);
      if(ex){ const tq = ex.q + qn; ex.a = (ex.a*ex.q + a*qn) / tq; ex.q = tq } else this.rows.push({ c, q:qn, a });
      store.set('pf', this.rows); e.target.reset(); this.refresh() };
    el.querySelector('.pf-list').onclick = e => { const b = e.target.closest('[data-del]'); if(b){ this.rows = this.rows.filter(r => r.c !== b.dataset.del); store.set('pf', this.rows); this.render() }
      const g = e.target.closest('[data-go]'); if(g) app.openSymbol(g.dataset.go + 'USDT', 'spot') };
    setInterval(() => { if(!this.el.hidden) this.refresh() }, 5000);
  },
  onShow(on){ if(on) this.refresh() },
  async refresh(){
    if(this.rows.length){ try{ const syms = JSON.stringify(this.rows.map(r => r.c + 'USDT'));
      (await LC.getJSON(`${LC.EP.spot.rest}/ticker/price?symbols=${encodeURIComponent(syms)}`)).forEach(x => this.px[x.symbol.replace(/USDT$/, '')] = +x.price) }catch(e){
      try{ (await LC.getJSON(`${LC.EP.spot.rest}/ticker/price`)).forEach(x => { if(x.symbol.endsWith('USDT')) this.px[x.symbol.slice(0, -4)] = +x.price }) }catch(e2){} } }
    this.render();
  },
  render(){
    let val = 0, cost = 0;
    const list = this.rows.map(r => { const p = this.px[r.c], v = p ? p*r.q : null, c = r.a*r.q; if(v != null){ val += v; cost += c }
      const pnl = v != null ? v - c : null;
      return `<div class="pp-row"><div class="pp-r1"><button class="lnk" data-go="${esc(r.c)}"><b>${esc(r.c)}</b></button><span class="num">${v != null ? LC.fmtN(v, 2) + ' USDT' : '가격 없음'}</span>
        <span class="num ${pnl >= 0 ? 'up' : 'down'}">${pnl != null ? (pnl >= 0 ? '+' : '') + LC.fmtN(pnl, 2) + ' (' + LC.fmtPct(pnl/c*100) + ')' : '-'}</span><button class="btn sm" data-del="${esc(r.c)}" aria-label="${esc(r.c)} 빼기">빼기</button></div>
        <div class="pp-r2 num dim">${r.q} 개 · 평단 ${LC.fmtPx(r.a)} · 지금 ${p ? LC.fmtPx(p) : '-'}</div></div>` }).join('');

  statHtml(){
    const now = Date.now(), cut = { all:0, '90':90, '30':30, '7':7 }[this.period] || 0;
    const C = this.list.filter(r => r.status === 'closed' && r.entry && r.exit && (!cut || (r.closeAt || r.openAt || r.at) >= now - cut * 864e5))
      .sort((a, b) => (a.closeAt || a.openAt || a.at) - (b.closeAt || b.openAt || b.at)).map(r => ({ r, c:calc(r) }));
    const per = `<div class="jr-f"><select data-per="1">${[['all','전체 기간'],['90','최근 90일'],['30','최근 30일'],['7','최근 7일']].map(([k, n]) => `<option value="${k}" ${this.period === k ? 'selected' : ''}>${n}</option>`).join('')}</select><span class="dim jr-n">끝난 매매 ${C.length}개</span></div>`;
    if(!C.length) return per + '<div class="empty">끝난 매매(청산가가 적힌 기록)가 생기면 여기서 승률, 손익비, 잘 되는 근거와 반복되는 실수를 보여 줘요.</div>';
    const S = list => { const n = list.length, w = list.filter(x => x.c.pct > 0), l = list.filter(x => x.c.pct <= 0), Rs = list.filter(x => x.c.R != null);
      const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
      return { n, win: w.length / n * 100, avgP: avg(list.map(x => x.c.pct)), avgR: Rs.length ? avg(Rs.map(x => x.c.R)) : null, rN: Rs.length,
        aw: avg(w.map(x => x.c.pct)), al: avg(l.map(x => x.c.pct)), usd: list.some(x => x.c.usd != null) ? list.reduce((s, x) => s + (x.c.usd || 0), 0) : null } };
    const T = S(C); let streak = 0, worst = 0; C.forEach(x => { streak = x.c.pct <= 0 ? streak + 1 : 0; worst = Math.max(worst, streak) });
    const kept = C.filter(x => !(x.r.mistakes || []).includes('손절 안 지킴')).length / C.length * 100;
    const plans = C.filter(x => x.c.plan != null), planAvg = plans.length ? plans.reduce((s, x) => s + x.c.plan, 0) / plans.length : null;
    const kpi = (n, v, c, sub) => `<div class="jk"><small>${n}</small><b class="num ${c || ''}">${v}</b>${sub ? `<small class="dim">${sub}</small>` : ''}</div>`;
    const kpis = `<div class="jks">${kpi('승률', T.win.toFixed(0) + '%', '', `${C.filter(x => x.c.pct > 0).length}승 ${C.filter(x => x.c.pct <= 0).length}패`)}
      ${kpi('평균 결과', T.avgR != null ? fmtR(T.avgR) : fmtP(T.avgP), cls(T.avgR != null ? T.avgR : T.avgP), T.avgR != null ? '한 번 매매당 (손절폭 = 1R)' : '한 번 매매당')}
      ${kpi('손익비', T.aw != null && T.al ? (T.aw / Math.abs(T.al)).toFixed(2) : '-', '', '평균 수익 ÷ 평균 손실')}
      ${kpi(T.usd != null ? '총 손익' : '총 손익 %', T.usd != null ? (T.usd >= 0 ? '+$' : '-$') + Math.abs(T.usd).toFixed(1) : fmtP(C.reduce((s, x) => s + x.c.pct, 0)), cls(T.usd != null ? T.usd : T.avgP))}
      ${kpi('최대 연속 손실', worst + '번')}${kpi('손절 지킨 비율', kept.toFixed(0) + '%', kept >= 90 ? 'up' : kept < 70 ? 'down' : '')}
      ${planAvg != null ? kpi('계획 손익비 평균', '1 : ' + planAvg.toFixed(2)) : ''}
      ${(() => { const W = C.filter(x => x.r.ruleN); if(!W.length) return ''; const f = W.filter(x => x.r.rules.length >= x.r.ruleN).length / W.length * 100; return kpi('규칙 모두 지킨 비율', f.toFixed(0) + '%', f >= 80 ? 'up' : f < 50 ? 'down' : '', `체크한 매매 ${W.length}개 중`) })()}</div>`;
    /* 누적 손익 곡선 */
    let acc = 0; const pts = [0, ...C.map(x => acc += (x.c.R != null && T.rN === C.length ? x.c.R : x.c.pct))], lo = Math.min(...pts), hi = Math.max(...pts), W = 300, H = 70;
    const xy = pts.map((p, i) => `${(i / (pts.length - 1 || 1) * W).toFixed(1)},${(H - (p - lo) / ((hi - lo) || 1) * (H - 6) - 3).toFixed(1)}`).join(' '), z = H - (0 - lo) / ((hi - lo) || 1) * (H - 6) - 3;
    const curve = `<h6>누적 결과 <small class="dim">${T.rN === C.length ? 'R 기준' : '% 기준'}</small></h6><svg class="jr-eq" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--line2)" stroke-dasharray="3 3"/><polyline points="${xy}" fill="none" stroke="var(--${acc >= 0 ? 'up' : 'down'})" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
    /* 묶어 보기 */
    const grp = keyFn => { const m = new Map(); C.forEach(x => [].concat(keyFn(x.r) || []).forEach(k => { if(k === '' || k == null) return; if(!m.has(k)) m.set(k, []); m.get(k).push(x) }));
      return [...m.entries()].map(([k, l]) => ({ k, ...S(l) })).sort((a, b) => b.n - a.n) };
    const HOUR = r => { const h = +kst(r.openAt || r.closeAt || r.at, { hour:'2-digit' }).replace(/\D/g, '') % 24; return h < 6 ? '새벽 (0~6시)' : h < 12 ? '오전 (6~12시)' : h < 18 ? '오후 (12~18시)' : '저녁 (18~24시)' };
    const DAY = r => '일월화수목금토'[new Date(new Date(r.openAt || r.closeAt || r.at).toLocaleString('en-US', { timeZone:'Asia/Seoul' })).getDay()] + '요일';
    const G = { '진입 근거': grp(r => r.reasons), '아쉬운 점': grp(r => r.mistakes && r.mistakes.length ? r.mistakes : ['없음']), '방향': grp(r => r.side === 'short' ? '숏' : '롱'),
      '시간대': grp(HOUR), '요일': grp(DAY), '종목': grp(r => (r.sym || '').replace(/USDT$/, '')), '시간 단위': grp(r => r.tf), '그때 마음': grp(r => r.mood),
      '진입 전 체크': grp(r => !r.ruleN ? null : r.rules.length >= r.ruleN ? '규칙 모두 지킴' : '규칙 일부 못 지킴'),
      '빠뜨린 규칙': grp(r => !r.ruleN ? null : rules().filter(t => !r.rules.includes(t))) };
    const metric = g => g.avgR != null && g.rN === g.n ? g.avgR : g.avgP, mfmt = g => g.avgR != null && g.rN === g.n ? fmtR(g.avgR) : fmtP(g.avgP);
    const table = (name, rows) => rows.length ? `<h6>${name}</h6><div class="jt"><div class="jt-h"><span></span><span>횟수</span><span>승률</span><span>평균</span></div>${rows.slice(0, 8).map(g => `<div class="jt-r"><span>${esc(g.k)}</span><span class="num">${g.n}</span><span class="num">${g.win.toFixed(0)}%</span><span class="num ${cls(metric(g))}">${mfmt(g)}</span></div>`).join('')}</div>` : '';
    /* 장점 · 단점 짚어 주기 */
    const tips = [], cand = [];
    ['진입 근거','방향','시간대','요일','종목','시간 단위','그때 마음'].forEach(n => G[n].filter(g => g.n >= 3).forEach(g => cand.push({ ...g, gn:n, m:metric(g) })));
    const best = cand.filter(g => g.m > 0).sort((a, b) => b.m - a.m).slice(0, 2), worstG = cand.filter(g => g.m < 0).sort((a, b) => a.m - b.m).slice(0, 2);
    best.forEach(g => tips.push(`<li class="good"><b>키울 점</b> ${esc(g.gn)} '${esc(g.k)}' 매매가 잘 돼요. ${g.n}번 · 승률 ${g.win.toFixed(0)}% · 평균 ${mfmt(g)}</li>`));
    worstG.forEach(g => tips.push(`<li class="bad"><b>고칠 점</b> ${esc(g.gn)} '${esc(g.k)}' 매매에서 잃고 있어요. ${g.n}번 · 승률 ${g.win.toFixed(0)}% · 평균 ${mfmt(g)}</li>`));
    const mk = G['아쉬운 점'].filter(g => g.k !== '없음').sort((a, b) => b.n - a.n)[0], clean = G['아쉬운 점'].find(g => g.k === '없음');
    if(mk) tips.push(`<li class="bad"><b>반복되는 실수</b> '${esc(mk.k)}' ${mk.n}번, 그때 평균 ${mfmt(mk)}${clean ? `. 실수 없이 한 매매는 평균 ${mfmt(clean)}이에요` : ''}</li>`);
    if(T.aw != null && T.al && T.win < 50 && T.aw / Math.abs(T.al) < 1) tips.push('<li class="bad"><b>구조</b> 승률도 50%가 안 되고 손익비도 1보다 낮아요. 목표를 더 멀리 두거나 진입을 더 골라 보세요.</li>');
    if(planAvg != null && T.aw != null && T.al && T.aw / Math.abs(T.al) < planAvg * 0.6) tips.push(`<li class="bad"><b>계획과 실제</b> 계획 손익비는 1:${planAvg.toFixed(2)}인데 실제는 ${(T.aw / Math.abs(T.al)).toFixed(2)}이에요. 목표 전에 일찍 나오거나 손절을 늦게 하고 있을 수 있어요.</li>`);
    { const g = G['진입 전 체크'], ok = g.find(x => x.k === '규칙 모두 지킴'), no = g.find(x => x.k === '규칙 일부 못 지킴');
      if(ok && no && ok.n >= 3 && no.n >= 3) tips.push(`<li class="${metric(ok) > metric(no) ? 'good' : ''}"><b>규칙</b> 규칙을 다 지킨 매매는 평균 ${mfmt(ok)} (승률 ${ok.win.toFixed(0)}%), 못 지킨 매매는 평균 ${mfmt(no)} (승률 ${no.win.toFixed(0)}%)예요.${metric(ok) > metric(no) ? ' 규칙이 돈을 벌어 주고 있어요.' : ' 규칙 자체를 다시 볼 때일 수 있어요.'}</li>`);
      const miss = G['빠뜨린 규칙'].filter(x => x.n >= 3 && metric(x) < 0).sort((a, b) => metric(a) - metric(b))[0];
      if(miss) tips.push(`<li class="bad"><b>자주 빠뜨리는 규칙</b> '${esc(miss.k)}' 규칙을 빠뜨린 매매가 ${miss.n}번이고, 그때 평균 ${mfmt(miss)}예요.</li>`) }
    if(C.length < 10) tips.push(`<li><b>참고</b> 끝난 매매가 ${C.length}개예요. 10개, 30개가 넘을수록 분석이 믿을 만해져요. 같은 묶음이 3번 넘게 나와야 키울 점·고칠 점에 떠요.</li>`);
    return per + kpis + curve + (tips.length ? `<h6>짚어 주기</h6><ul class="jr-tips">${tips.join('')}</ul>` : '') + Object.entries(G).map(([n, rows]) => table(n, rows)).join('');
  },

  /* 차트 위에 진입(▲▼)과 청산(●)을 점선으로 이어 보여 줘요 */
  drawOn(ctx, d, A){
    if(!this.show || !d.v || d.v.replay) return;
    const L = this.list.filter(r => r.sym === d.v.sym && r.entry && r.openAt && r.status !== 'cancel'); if(!L.length) return;
    ctx.save(); ctx.setLineDash([]);
    L.forEach(r => { const x0 = d.tToX(r.openAt / 1000), y0 = d.pToY(r.entry); if(x0 == null || y0 == null) return;
      const long = r.side !== 'short', c = calc(r), col = r.status === 'closed' ? (c.pct > 0 ? '#5b9cf6' : '#f0616d') : '#f0b90b';
      if(r.status === 'closed' && r.exit && r.closeAt){ const x1 = d.tToX(r.closeAt / 1000), y1 = d.pToY(r.exit);
        if(x1 != null && y1 != null){ ctx.strokeStyle = col; ctx.globalAlpha = .8; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
          ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x1, y1, 4, 0, 7); ctx.fill();
          d.label(ctx, c.R != null ? fmtR(c.R) : fmtP(c.pct), x1 + 7, y1, col, '#0b0c0f') } }
      ctx.globalAlpha = 1; ctx.fillStyle = long ? '#5b9cf6' : '#f0616d'; ctx.beginPath();
      if(long){ ctx.moveTo(x0, y0 + 3); ctx.lineTo(x0 - 6, y0 + 12); ctx.lineTo(x0 + 6, y0 + 12) } else { ctx.moveTo(x0, y0 - 3); ctx.lineTo(x0 - 6, y0 - 12); ctx.lineTo(x0 + 6, y0 - 12) }
      ctx.closePath(); ctx.fill();
      if(r.status === 'open' && r.stop){ const ys = d.pToY(r.stop); if(ys != null){ ctx.strokeStyle = '#f0616d'; ctx.globalAlpha = .7; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(x0, ys); ctx.lineTo(A.w, ys); ctx.stroke(); ctx.setLineDash([]) } }
      if(r.status === 'open' && r.target){ const yt = d.pToY(r.target); if(yt != null){ ctx.strokeStyle = '#5b9cf6'; ctx.globalAlpha = .7; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(x0, yt); ctx.lineTo(A.w, yt); ctx.stroke(); ctx.setLineDash([]) } }
    });
    ctx.restore();
  }
};
LC.journal = J; imgsLoad();
LC.panels.push(J);
})();
