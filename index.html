  save(){ LC.store.set(this.key(), this.items); this.app && this.app.views.forEach(o => { if(o !== this.v && o.sym === this.v.sym) o.drawings.load() }) }
  snapshot(){ this.undoStack.push(JSON.stringify(this.items)); if(this.undoStack.length > 50) this.undoStack.shift() }
  undo(){ const s = this.undoStack.pop(); if(s){ this.items = JSON.parse(s); this.sel = null; this.save(); this.updateBar() } }
  clear(){ if(!this.items.length) return; this.snapshot(); this.items = []; this.sel = null; this.save(); this.updateBar() }
  remove(it){ this.snapshot(); this.items = this.items.filter(x => x !== it); if(this.sel === it) this.sel = null; this.save(); this.updateBar() }

  /* 좌표 변환: 시간(초) ↔ x, 가격 ↔ y */
  bars(){ return this.v.shown }
  tfSec(){ return LC.TFMS[this.v.tf] / 1000 }
  tToL(t){ const c = this.bars(); if(!c.length) return null; const n = c.length, sec = this.tfSec();
    if(t >= c[n-1].time) return n-1 + (t - c[n-1].time)/sec;
    if(t <= c[0].time) return (t - c[0].time)/sec;
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    return lo + (t - c[lo].time)/(c[hi].time - c[lo].time) }
  /* 지표 칸이 다른 시간 점을 더할 수 있어서, 봉 시각 → 화면 좌표를 직접 이어 계산해요 */
  spacing(){ const ts = this.v.chart.timeScale(); const a = ts.logicalToCoordinate(0), b = ts.logicalToCoordinate(1); return (a != null && b != null && b !== a) ? b - a : 6 }
  tToX(t){ const c = this.bars(); if(!c.length) return null; const ts = this.v.chart.timeScale(), n = c.length, sec = this.tfSec();
    if(t >= c[n-1].time){ const xl = ts.timeToCoordinate(c[n-1].time); return xl == null ? null : xl + (t - c[n-1].time)/sec * this.spacing() }
    if(t <= c[0].time){ const x0 = ts.timeToCoordinate(c[0].time); return x0 == null ? null : x0 + (t - c[0].time)/sec * this.spacing() }
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    const x0 = ts.timeToCoordinate(c[lo].time); if(x0 == null || t === c[lo].time) return x0;
    const x1 = ts.timeToCoordinate(c[hi].time); return x1 == null ? x0 : x0 + (x1 - x0) * (t - c[lo].time)/(c[hi].time - c[lo].time) }
  xToT(x){ const c = this.bars(); if(!c.length) return null; const ts = this.v.chart.timeScale(), n = c.length, sec = this.tfSec(), sp = this.spacing();
    const xl = ts.timeToCoordinate(c[n-1].time), x0 = ts.timeToCoordinate(c[0].time);
    if(xl != null && x > xl + sp/2) return c[n-1].time + Math.round((x - xl)/sp) * sec;
    if(x0 != null && x < x0 - sp/2) return c[0].time + Math.round((x - x0)/sp) * sec;
    const t = ts.coordinateToTime(x); if(t == null) return null;
    let lo = 0, hi = n-1; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(c[m].time <= t) lo = m; else hi = m }
    return Math.abs(c[hi].time - t) < Math.abs(t - c[lo].time) ? c[hi].time : c[lo].time }
  pToY(p){ return this.v.series.priceToCoordinate(p) }
  yToP(y){ return this.v.series.coordinateToPrice(y) }
  area(){ const ch = this.v.chart; return { w: ch.timeScale().width(), h: ch.panes()[0].getHeight() } }
  snap(t, p, y){
    if(!this.app || !this.app.magnet) return p;
    const c = this.bars(); const l = Math.round(this.tToL(t)); const b = c[l]; if(!b) return p;
    let best = p, bd = 1e9; [b.open, b.high, b.low, b.close].forEach(v => { const d = Math.abs(this.pToY(v) - y); if(d < bd){ bd = d; best = v } });
    return bd < 40 ? best : p;
  }
  pos(e){ const r = this.v.box.getBoundingClientRect(); const pt = e.touches ? e.touches[0] : e; return { x: pt.clientX - r.left, y: pt.clientY - r.top } }
  ptAt(x, y){ const t = this.xToT(x); let p = this.yToP(y); if(t == null || p == null) return null; p = this.snap(t, p, y); return { t, p } }

  /* 마우스 */
  onDown(e){
    if(e.type === 'touchstart' || e.button > 0) return;
    if(e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
    if(e.type === 'mousedown' && this._handled){ this._handled = false; e.stopPropagation(); e.preventDefault(); return }
    const {x, y} = this.pos(e); const A = this.area();
    if(x > A.w || (y > A.h && !this.draft)) return;
    this.app && this.app.setActive(this.v);
    const tool = this.app ? this.app.tool : 'cross';
    const stop = () => { e.stopPropagation(); e.preventDefault(); if(e.type === 'pointerdown') this._handled = true };
    if(tool !== 'cross'){
      const pt = this.ptAt(x, y); if(!pt){ stop(); return }
      if(this.draft){ this.finishDraft(pt); stop(); return }
      if(ONE.includes(tool)){
        if(tool === 'text'){ this.askText(txt => { if(!txt) return; this.add({type:'text', pts:[pt], text:txt}) }); stop(); return }
        this.add({type:tool, pts:[pt]}); stop(); return;
      }
      this.draft = { id:uid(), type:tool, pts:[pt, {...pt}], color: DEFAULT_COLOR[tool] || COLORS[0] };
      stop(); return;
    }
    if(this.app && this.app.drawLocked) return;
    const hit = this.hitTest(x, y);
    if(hit){
      this.sel = hit.item; this.updateBar();
      if(!hit.item.locked){ this.snapshot(); this.drag = { item: hit.item, handle: hit.handle, start: this.ptAt(x, y), orig: JSON.parse(JSON.stringify(hit.item.pts)), moved:false } }
      stop();
    } else if(this.sel){ this.sel = null; this.updateBar() }
  }
  onHover(e){
    const {x, y} = this.pos(e);
    if(this.draft){ const pt = this.ptAt(x, y); if(pt) this.draft.pts[1] = pt; return }
    if(this.drag) return;
    const tool = this.app ? this.app.tool : 'cross';
    const hit = tool === 'cross' && !(this.app && this.app.drawLocked) ? this.hitTest(x, y) : null;
    this.v.box.classList.toggle('hover-draw', !!hit);
    this.v.box.classList.toggle('tool-on', tool !== 'cross');
  }
  onMove(e){
    if(!this.drag) return;
    const {x, y} = this.pos(e); const pt = this.ptAt(x, y); if(!pt || !this.drag.start) return;
    const d = this.drag, it = d.item; d.moved = true;
    if(d.handle == null){
      const dt = pt.t - d.start.t, dp = pt.p - d.start.p;
      it.pts = d.orig.map(o => ({ t: ['hline','alert'].includes(it.type) ? o.t : o.t + dt, p: it.type === 'vline' ? o.p : o.p + dp }));
      if(it.type === 'alert') it.fired = false;
    } else if(it.type === 'pos' && d.handle > 0){
      it.pts[d.handle] = { t: it.pts[d.handle].t, p: pt.p };
      if(d.handle === 1) it.pts[1].t = pt.t;
    } else {
      it.pts[d.handle] = pt;
      if(it.type === 'pos' && d.handle === 0){ const dp = pt.p - d.orig[0].p; it.pts[1].p = d.orig[1].p + dp; it.pts[2].p = d.orig[2].p + dp }
    }
  }
  onUp(){ if(this.drag){ if(this.drag.moved) this.save(); else this.undoStack.pop(); this.drag = null } }
  onDbl(e){ const {x, y} = this.pos(e); const hit = this.hitTest(x, y);
    if(hit && hit.item.type === 'text'){ e.stopPropagation(); this.askText(t => { if(t){ this.snapshot(); hit.item.text = t; this.save() } }, hit.item.text) } }
  finishDraft(pt){
    const d = this.draft; d.pts[1] = pt; this.draft = null;
    if(d.type === 'measure'){ this.measure = d; setTimeout(() => { if(this.measure === d) this.measure = null }, 8000); this.app && this.app.setTool('cross'); return }
    if(d.type === 'pos'){ const e = d.pts[0].p, s = d.pts[1].p; d.pts[2] = { t: d.pts[1].t, p: e + 2*(e - s) } }
    this.add(d);
  }
  add(it){
    this.snapshot(); it.id = it.id || uid(); it.color = it.color || DEFAULT_COLOR[it.type] || COLORS[0];
    this.items.push(it); this.sel = it; this.save(); this.updateBar();
    if(this.app && !this.app.keepTool) this.app.setTool('cross');
  }
  askText(cb, cur = ''){
    LC.modal('글자 넣기', `<input class="inp" id="txtIn" maxlength="120" value="${LC.esc(cur)}" placeholder="차트에 적을 글자"><div class="row-end"><button class="btn pri" id="txtOk">넣기</button></div>`, (mb, close) => {
      const i = mb.querySelector('#txtIn'); i.focus();
      const ok = () => { const v = i.value.trim(); close(); cb(v) };
      mb.querySelector('#txtOk').onclick = ok; i.onkeydown = e => { if(e.key === 'Enter') ok() };
    });
  }

  /* 선택된 개체 도구 막대 */
  updateBar(){
    const it = this.sel;
    if(!it){ this.bar.style.display = 'none'; return }
    this.bar.style.display = 'flex';
    this.bar.innerHTML = COLORS.map(c => `<button class="sw ${it.color===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="색 ${c}"></button>`).join('')
      + `<button data-a="lock" title="잠그기">${it.locked ? '🔒' : '🔓'}</button><button data-a="del" title="지우기 (Delete)">🗑</button>`;
    this.bar.onmousedown = e => e.stopPropagation();
    this.bar.onclick = e => { const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.c){ this.snapshot(); it.color = b.dataset.c; this.save(); this.updateBar() }
      else if(b.dataset.a === 'lock'){ it.locked = !it.locked; this.save(); this.updateBar() }
      else if(b.dataset.a === 'del') this.remove(it) };
  }

  /* 맞춤 검사 */
  hitTest(x, y){
    if(this.app && this.app.drawHidden) return null;
    const A = this.area(); const TOL = 6;
    const segD = (px, py, x1, y1, x2, y2) => { const dx = x2-x1, dy = y2-y1; const L = dx*dx+dy*dy; let t = L ? ((px-x1)*dx+(py-y1)*dy)/L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px-x1-t*dx, py-y1-t*dy) };
    const list = this.sel ? [this.sel, ...this.items.filter(i => i !== this.sel).reverse()] : [...this.items].reverse();
    for(const it of list){
      const P = it.pts.map(p => ({x: this.tToX(p.t), y: this.pToY(p.p)}));
      if(P.some(p => p.x == null || p.y == null)) continue;
      if(it === this.sel) for(let i=0;i<P.length;i++) if(Math.hypot(P[i].x-x, P[i].y-y) < 8) return {item:it, handle:i};
      const [a, b] = P; let hit = false;
      switch(it.type){
        case 'trend': case 'measure': hit = segD(x,y,a.x,a.y,b.x,b.y) < TOL; break;
        case 'ray': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); const ex = b.x >= a.x ? A.w : 0; hit = segD(x,y,a.x,a.y,ex,a.y+k*(ex-a.x)) < TOL; break }
        case 'ext': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); hit = segD(x,y,0,a.y-k*a.x,A.w,a.y+k*(A.w-a.x)) < TOL; break }
        case 'hline': case 'alert': hit = Math.abs(y-a.y) < TOL; break;
        case 'hray': hit = Math.abs(y-a.y) < TOL && x >= a.x - TOL; break;
        case 'vline': hit = Math.abs(x-a.x) < TOL; break;
        case 'rect': { const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x), t = Math.min(a.y,b.y), bo = Math.max(a.y,b.y); hit = x>=l-TOL && x<=r+TOL && y>=t-TOL && y<=bo+TOL; break }
        case 'fib': { const l = Math.min(a.x,b.x); hit = x >= l-TOL && FIB.some(f => Math.abs(y - this.pToY(it.pts[1].p + (it.pts[0].p-it.pts[1].p)*f)) < TOL); break }
        case 'pos': { const c = P[2]; const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x); const ys = [a.y,b.y,c.y]; hit = x>=l && x<=r && y>=Math.min(...ys)-TOL && y<=Math.max(...ys)+TOL; break }
        case 'text': { this.ctx.font = '13px "DM Mono", "Noto Sans KR", sans-serif'; const w = this.ctx.measureText(it.text||'').width; hit = x>=a.x-4 && x<=a.x+w+8 && y>=a.y-18 && y<=a.y+6; break }
      }
      if(hit) return {item:it, handle:null};
    }
    return null;
  }

  /* 그리기 */
  render(){
    const cv = this.cv, ctx = this.ctx, dpr = window.devicePixelRatio || 1;
    const W = this.v.box.clientWidth, H = this.v.box.clientHeight;
    if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.width = W+'px'; cv.style.height = H+'px' }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    if(!this.bars().length) return;
    const A = this.area();
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,A.w,A.h); ctx.clip();
    if(this.v.bubbles) this.v.bubbles.draw(ctx, this, A);
    (LC.overlays || []).forEach(o => { try{ o.draw(ctx, this, A) }catch(e){} });
    const hidden = this.app && this.app.drawHidden;
    const list = hidden ? [] : [...this.items];
    if(this.draft) list.push(this.draft);
    if(this.measure) list.push(this.measure);
    for(const it of list) this.drawItem(ctx, it, A);
    ctx.restore();
    if(this.sel && !hidden && this.items.includes(this.sel)){
      const a = this.sel.pts.map(p => ({x:this.tToX(p.t), y:this.pToY(p.p)}));
      a.forEach(p => { if(p.x==null||p.y==null) return; ctx.beginPath(); ctx.arc(p.x,p.y,4.5,0,7); ctx.fillStyle = '#0d1117'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = this.sel.color; ctx.stroke() });
    }
  }
  label(ctx, txt, x, y, bg, fg = '#0d1117', align = 'left'){
    ctx.font = '11px "DM Mono", "Noto Sans KR", sans-serif'; const w = ctx.measureText(txt).width + 8;
    const lx = align === 'right' ? x - w : align === 'center' ? x - w/2 : x;
    ctx.fillStyle = bg; ctx.fillRect(lx, y-9, w, 18); ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(txt, lx+4, y);
  }
  drawItem(ctx, it, A){
    const P = it.pts.map(p => ({x:this.tToX(p.t), y:this.pToY(p.p)}));
    if(P.some(p => p.x == null || p.y == null)) return;
    const [a, b] = P; const col = it.color || '#f0b90b'; const prec = this.v.prec;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    const line = (x1,y1,x2,y2) => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke() };
    switch(it.type){
      case 'trend': line(a.x,a.y,b.x,b.y); break;
      case 'ray': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); const ex = b.x >= a.x ? A.w : 0; line(a.x,a.y,ex,a.y+k*(ex-a.x)); break }
      case 'ext': { const k = (b.y-a.y)/((b.x-a.x)||1e-9); line(0,a.y-k*a.x,A.w,a.y+k*(A.w-a.x)); break }
      case 'hline': line(0,a.y,A.w,a.y); this.label(ctx, LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, col, '#0d1117', 'right'); break;
      case 'hray': line(a.x,a.y,A.w,a.y); this.label(ctx, LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, col, '#0d1117', 'right'); break;
      case 'vline': line(a.x,0,a.x,A.h); break;
      case 'alert': { const fired = it.fired; ctx.setLineDash([6,4]); ctx.strokeStyle = fired ? '#5b6676' : col; line(0,a.y,A.w,a.y); ctx.setLineDash([]);
        this.label(ctx, (fired ? '✓ ' : '🔔 ') + LC.fmtN(it.pts[0].p, prec), A.w-2, a.y, fired ? '#5b6676' : col, '#0d1117', 'right'); break }
      case 'rect': { ctx.globalAlpha = 0.12; ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        ctx.strokeRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); break }
      case 'fib': { const l = Math.min(a.x,b.x); const p0 = it.pts[0].p, p1 = it.pts[1].p;
        ctx.setLineDash([4,3]); ctx.strokeStyle = '#5b6676'; ctx.lineWidth = 1; line(a.x,a.y,b.x,b.y); ctx.setLineDash([]);
        FIB.forEach((f,i) => { const pr = p1 + (p0-p1)*f; const y = this.pToY(pr); if(y == null) return;
          ctx.strokeStyle = FIB_COL[i]; line(l,y,A.w,y); ctx.font = '11px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = FIB_COL[i]; ctx.textBaseline = 'bottom';
          ctx.fillText(`${f} (${LC.fmtN(pr, prec)})`, l+4, y-2) }); break }
      case 'pos': { const e = it.pts[0].p, s = it.pts[1].p, t = it.pts[2] ? it.pts[2].p : e + 2*(e - s); const long = t > e;
        const c = {x:b.x, y:this.pToY(t)}; if(c.y == null) break; const l = Math.min(a.x,b.x), r = Math.max(a.x,b.x), w = Math.max(r-l, 30);
        ctx.globalAlpha = 0.18; ctx.fillStyle = '#16c784'; ctx.fillRect(l, Math.min(a.y,c.y), w, Math.abs(c.y-a.y));
        ctx.fillStyle = '#ea3943'; ctx.fillRect(l, Math.min(a.y,b.y), w, Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        ctx.strokeStyle = '#d7dee8'; ctx.lineWidth = 1; line(l,a.y,l+w,a.y);
        const rr = Math.abs(t-e)/Math.abs(e-s || 1e-9);
        this.label(ctx, `${long?'롱':'숏'} 목표 ${LC.fmtN(t,prec)} (${LC.fmtPct((t-e)/e*100)})`, l+w/2, c.y + (long?-11:11), '#16c784', '#0d1117', 'center');
        this.label(ctx, `손절 ${LC.fmtN(s,prec)} (${LC.fmtPct((s-e)/e*100)})`, l+w/2, b.y + (long?11:-11), '#ea3943', '#fff', 'center');
        this.label(ctx, `진입 ${LC.fmtN(e,prec)} · 손익비 ${rr.toFixed(2)}`, l+w/2, a.y, '#d7dee8', '#0d1117', 'center');
        if(this.v.last){ const lp = this.v.last.close; const pnl = (long ? lp-e : e-lp)/e*100;
          this.label(ctx, `지금 ${LC.fmtPct(pnl)}`, l+w+4, a.y, pnl>=0?'#16c784':'#ea3943', '#0d1117') }
        break }
      case 'measure': { const up = b.y < a.y; ctx.globalAlpha = 0.15; ctx.fillStyle = up ? '#4aa3ff' : '#ea3943';
        ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); ctx.globalAlpha = 1;
        const p0 = it.pts[0].p, p1 = it.pts[1].p; const bars = Math.round(this.tToL(it.pts[1].t) - this.tToL(it.pts[0].t));
        const secs = Math.abs(it.pts[1].t - it.pts[0].t);
        const dur = secs >= 86400 ? (secs/86400).toFixed(1)+'일' : secs >= 3600 ? (secs/3600).toFixed(1)+'시간' : Math.round(secs/60)+'분';
        this.label(ctx, `${LC.fmtN(p1-p0, prec)} (${LC.fmtPct((p1-p0)/p0*100)}) · ${bars}봉 · ${dur}`, (a.x+b.x)/2, b.y + (up?-14:14), up ? '#4aa3ff' : '#ea3943', '#fff', 'center'); break }
      case 'text': { ctx.font = '13px "DM Mono", "Noto Sans KR", sans-serif'; ctx.textBaseline = 'alphabetic'; const w = ctx.measureText(it.text||'').width;
        ctx.globalAlpha = 0.85; ctx.fillStyle = '#131922'; ctx.fillRect(a.x-4, a.y-17, w+8, 22); ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.fillText(it.text||'', a.x, a.y); break }
    }
  }
}
LC.Drawings = Drawings;
LC.DRAW_TOOLS = { TWO, ONE };
})();

</script>
<script>
/* 차트 한 칸: 캔들, 지표, 작도, 알림, 리플레이 */
(() => {
const L = LightweightCharts;
const SERIES_BY_TYPE = { candle:L.CandlestickSeries, hollow:L.CandlestickSeries, ha:L.CandlestickSeries, bar:L.BarSeries, line:L.LineSeries, area:L.AreaSeries };
const UP = '#16c784', DN = '#ea3943';
let seq = 0;

class ChartView {
  constructor(app, host, cfg){
    this.app = app; this.id = ++seq;
    this.sym = cfg.sym || 'BTCUSDT'; this.market = cfg.market || 'futures'; this.tf = cfg.tf || '1m'; this.type = cfg.type || 'candle';
    this.candles = []; this.shown = []; this.inds = []; this.prec = 2; this.replay = null; this.log = false;
    const box = this.box = document.createElement('div'); box.className = 'cv';
    box.innerHTML = `<div class="cv-chart"></div>
      <div class="lg"><div class="lg1"><b class="lg-t"></b><span class="lg-mk"></span><span class="lg-o"></span></div><div class="lg-i"></div></div><div class="lg-p"></div>
      <div class="cv-cd num"></div><div class="cv-load">차트 불러오는 중…</div>
      <div class="cv-replay" hidden><span class="rp-t">리플레이</span><button data-r="play" title="재생/멈춤">▶</button><button data-r="step" title="한 봉 앞으로 (Shift+→)">⏭</button>
        <select data-r="speed" aria-label="속도"><option value="1000">1x</option><option value="333">3x</option><option value="100">10x</option></select><span class="rp-time num"></span><button data-r="exit">실시간으로</button></div>`;
    host.appendChild(box);
    this.q = s => box.querySelector(s);
    this.chart = L.createChart(this.q('.cv-chart'), {
      autoSize:true,
      layout:{ background:{color:'transparent'}, textColor:'#8b97a8', fontFamily:LC.FONT, fontSize:11, panes:{separatorColor:'#232d3b', separatorHoverColor:'#3b4a5e'} },
      grid:{ vertLines:{color:'rgba(35,45,59,.6)'}, horzLines:{color:'rgba(35,45,59,.6)'} },
      crosshair:{ mode:L.CrosshairMode.Normal },
      rightPriceScale:{ borderColor:'#232d3b', scaleMargins:{top:0.12, bottom:0.14} },
      timeScale:{ borderColor:'#232d3b', timeVisible:true, secondsVisible:false, rightOffset:8, barSpacing:4, minBarSpacing:0.5,
        tickMarkFormatter:(t, type) => { const d = new Date(t*1000); return type===0 ? String(d.getFullYear()) : type===1 ? (d.getMonth()+1)+'월' : type===2 ? (d.getMonth()+1)+'/'+d.getDate() : LC.pad(d.getHours())+':'+LC.pad(d.getMinutes()) } },
      localization:{ locale:'ko-KR', timeFormatter:t => { const d = new Date(t*1000); return `${d.getFullYear()}-${LC.pad(d.getMonth()+1)}-${LC.pad(d.getDate())} ${LC.pad(d.getHours())}:${LC.pad(d.getMinutes())}` } }
    });
    this.makeMain();
    this.bubbles = LC.Bubbles ? new LC.Bubbles() : null;
    this.drawings = new LC.Drawings(this);
    this.chart.subscribeCrosshairMove(p => this.onCross(p));
    this.chart.subscribeClick(p => this.onClick(p));
    this.chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if(r && r.from < 15 && !this.replay) this.loadMore() });
    this.q('.cv-replay').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
      ({play:() => this.replayToggle(), step:() => this.replayStep(), exit:() => this.replayExit()})[b.dataset.r]() });
    this.q('.cv-replay select').onchange = e => { if(this.replay){ this.replay.speed = +e.target.value; if(this.replay.timer){ this.replayToggle(); this.replayToggle() } } };
    box.addEventListener('click', e => { if(e.target.closest('.lg-tg')){ this.lgCol = !this.lgCol; LC.store.set('lgCol', this.lgCol); this.renderLegendInds(); return }
      if(e.target.closest('.lgr')) this.onLegendClick(e) });
    box.addEventListener('dblclick', e => { const row = e.target.closest('.lgr'); if(!row || e.target.closest('button')) return; const ind = this.inds.find(i => i.id === row.dataset.id); if(ind) this.editInd(ind) });
    this.lgCol = LC.store.get('lgCol', false);
    /* 아래 칸 지표 이름은 각 칸 왼쪽 위에 붙여요. 칸 높이가 바뀌면 다시 맞춰요 */
    this.lgTimer = setInterval(() => this.placePaneLegends(), 700);
    box.addEventListener('contextmenu', e => { if(e.target.closest('.lg,.cv-replay')) return; e.preventDefault(); this.app.setActive(this);
      LC.ctxMenu(e.clientX, e.clientY, [['차트 설정…', () => LC.chartStyle.modal(), '모양·색'], ['지표 추가…', () => this.app.indModal()], '-',
        ['차트 그림 저장', () => this.screenshot()], ['리플레이', () => this.replayBegin()], ['오른쪽 끝으로', () => this.chart.timeScale().scrollToRealTime()], ['가격 눈금 자동 맞춤', () => this.chart.priceScale('right').applyOptions({autoScale:true})], '-',
        ['이 종목 작도 모두 지우기', () => this.drawings.clear()]]) });
    /* 예전에 따로 넣은 이동평균선 여러 개는 '이동평균선 묶음' 하나로 합쳐요 */
    let inds = cfg.inds || [{key:'VOL'}, {key:'MAS'}]; const mas = inds.filter(x => x.key === 'MA');
    if(mas.length >= 2){ const P = { ...LC.IND.DEFS.MAS.params }, plots = []; for(let i = 1; i <= 8; i++) P['p'+i] = 0;
      mas.slice(0, 8).forEach((x, i) => { const q = x.params || {}; P['t'+(i+1)] = q.type || 'SMA'; P['p'+(i+1)] = +q.period || 20; plots[i] = (x.style && x.style.plots && x.style.plots[0]) || (x.color ? { color:x.color } : undefined) });
      const at = inds.indexOf(mas[0]); inds = inds.filter(x => x.key !== 'MA'); inds.splice(Math.min(at, inds.length), 0, { key:'MAS', params:P, style:{ plots:plots.map(p => p || {}) } }) }
    inds
      .forEach(c => this.addInd(c.key, c.params, c.color, c.hidden, true, c.style));
    LC.chartStyle.apply(this);
    this.load();
  }
  cfg(){ return { sym:this.sym, market:this.market, tf:this.tf, type:this.type, inds:this.inds.map(i => ({key:i.key, params:i.params, color:i.color, hidden:i.hidden, style:i.style})) } }
  destroy(){ this.closeStreams(); this.replayExit(true); this.drawings.destroy(); this.chart.remove(); this.box.remove() }

  makeMain(){
    if(this.series) this.chart.removeSeries(this.series);
    const t = this.type, opts = { priceFormat:{type:'price', precision:this.prec, minMove:1/10**this.prec}, ...LC.chartStyle.mainOpts(t) };
    this.series = this.chart.addSeries(SERIES_BY_TYPE[t], opts, 0); this.lastPL = null;
    if(this.drawings) this.drawings.v = this;
  }
  /* 몸통을 비운 캔들은 현재가 라벨이 투명해져서, 경계선 색으로 직접 그려요 */
  lastLabel(){
    const S = LC.chartStyle.get(), b = this.shown[this.shown.length-1], need = (this.type === 'candle' || this.type === 'ha') && !S.bodyVisible;
    if(!need || !b){ if(this.lastPL){ try{ this.series.removePriceLine(this.lastPL) }catch(e){} this.lastPL = null } return }
    const o = { price:b.close, color: b.close >= b.open ? S.borderUp : S.borderDown, lineWidth:1, lineStyle:2, lineVisible:S.lastLine, axisLabelVisible:S.lastLabel, axisLabelTextColor:'#0d1117' };
    if(this.lastPL) this.lastPL.applyOptions(o); else this.lastPL = this.series.createPriceLine(o);
  }
  setType(t){ this.type = t; this.makeMain(); this.renderAll(); this.app.save(); LC.paper && LC.paper.lines() }
  toMain(bars){
    if(this.type === 'line' || this.type === 'area') return bars.map(b => ({time:b.time, value:b.close}));
    if(this.type !== 'ha'){ const S = LC.chartStyle.get();
      if(S.prevClose && this.type !== 'hollow') return bars.map((b, i) => { const up = b.close >= (i ? bars[i-1].close : b.open), c = up ? S.upColor : S.downColor;
        return {time:b.time, open:b.open, high:b.high, low:b.low, close:b.close, color: S.bodyVisible ? c : 'rgba(0,0,0,0)', borderColor: up ? S.borderUp : S.borderDown, wickColor: up ? S.wickUp : S.wickDown} });
      return bars.map(b => ({time:b.time, open:b.open, high:b.high, low:b.low, close:b.close})) }
    const out = []; bars.forEach((b, i) => { const c = (b.open+b.high+b.low+b.close)/4; const o = i ? (out[i-1].open + out[i-1].close)/2 : (b.open+b.close)/2;
      out.push({time:b.time, open:o, high:Math.max(b.high,o,c), low:Math.min(b.low,o,c), close:c}) }); this.ha = out; return out;
  }
  mainLast(b){
    if(this.type === 'line' || this.type === 'area') return {time:b.time, value:b.close};
    if(this.type !== 'ha'){ const S = LC.chartStyle.get(), c = this.candles, pc = c.length > 1 ? c[c.length-2].close : b.open;
      if(S.prevClose && this.type !== 'hollow'){ const up = b.close >= pc; return {time:b.time, open:b.open, high:b.high, low:b.low, close:b.close, color: S.bodyVisible ? (up ? S.upColor : S.downColor) : 'rgba(0,0,0,0)', borderColor: up ? S.borderUp : S.borderDown, wickColor: up ? S.wickUp : S.wickDown} }
      return {time:b.time, open:b.open, high:b.high, low:b.low, close:b.close} }
    const prev = this.ha && this.ha.length > 1 ? this.ha[this.ha.length - (this.ha[this.ha.length-1].time === b.time ? 2 : 1)] : null;
    const c = (b.open+b.high+b.low+b.close)/4, o = prev ? (prev.open+prev.close)/2 : (b.open+b.close)/2;
    const h = {time:b.time, open:o, high:Math.max(b.high,o,c), low:Math.min(b.low,o,c), close:c};
    if(this.ha){ if(this.ha.length && this.ha[this.ha.length-1].time === b.time) this.ha[this.ha.length-1] = h; else this.ha.push(h) }
    return h;
  }

  /* 데이터 */
  get rest(){ return LC.EP[this.market].rest }
  async load(){
    const tok = this.tok = Math.random();
    this.closeStreams(); this.replayExit(true); this.noMore = false; this.loadedSym = null;
    const ld = this.q('.cv-load'); ld.hidden = false; ld.textContent = '차트 불러오는 중…';
    this.q('.lg-t').textContent = this.market === 'hl' ? `${this.sym.split(':')[1] || this.sym} · ${(LC.TF.find(x=>x[0]===this.tf)||[,''])[1]} · HYPERLIQUID ${(this.sym.split(':')[0] || '').toUpperCase()}` : `${this.sym}${this.market==='futures'?'.P':''} · ${(LC.TF.find(x=>x[0]===this.tf)||[,''])[1]} · BINANCE`;
    this.q('.lg-mk').innerHTML = LC.session ? LC.session.badge(this.sym, this.market) : '';
    this.drawings.load(); if(this.bubbles) this.bubbles.items = []; if(this.wm) LC.chartStyle.apply(this);
    try{
      if(this.market === 'hl'){ const r = await LC.hlm.klines(this.sym, this.tf); if(tok !== this.tok) return; this.candles = r }
      else { const rows = await LC.getJSON(`${this.rest}/klines?symbol=${this.sym}&interval=${this.tf}&limit=1000`);
        if(tok !== this.tok) return;
        this.candles = rows.map(k => ({time:Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:+k[5], tbv:+k[9]})) }
      this.autoPrec = null; this.prec = this.app.precOf(this.sym, this.market) ?? LC.autoPrec(this.candles.length ? this.candles[this.candles.length-1].close : 1);
      this.series.applyOptions({ priceFormat:{type:'price', precision:this.prec, minMove:1/10**this.prec} }); LC.chartStyle.apply(this);
      this.shown = this.candles; this.renderAll(); this.chart.timeScale().scrollToRealTime(); this.loadedSym = this.sym;
      ld.hidden = true;
    }catch(e){ ld.textContent = '데이터를 못 불러왔어요. 종목이나 인터넷 연결을 확인해 주세요.'; return }
    this.prevPrice = this.last && this.last.close;
    if(this.market === 'hl') this.kws = LC.hlm.stream(this.sym, this.tf, b => { if(tok === this.tok) this.onBar(b) }, ok => this.app.setConn(this, ok));
    else this.kws = LC.openWS(`${LC.EP[this.market].ws}/${this.sym.toLowerCase()}@kline_${this.tf}`, m => {
      if(tok !== this.tok || !m.k) return; const k = m.k;
      this.onBar({time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, tbv:+k.V});
    }, ok => this.app.setConn(this, ok));
    this.inds.filter(i => i.def.async).forEach(i => this.fetchAsync(i));
    clearInterval(this.asyncTimer); this.asyncTimer = setInterval(() => this.inds.filter(i => i.def.async).forEach(i => this.fetchAsync(i)), 60000);
    this.app.onViewLoaded(this);
  }
  closeStreams(){ this.kws && this.kws.close(); this.kws = null; clearInterval(this.asyncTimer) }
  async loadMore(){
    if(this.loadingMore || this.noMore || !this.candles.length) return;
    this.loadingMore = true; const tok = this.tok;
    try{
      const end = this.candles[0].time*1000 - 1;
      const more = this.market === 'hl' ? await LC.hlm.klines(this.sym, this.tf, end)
        : (await LC.getJSON(`${this.rest}/klines?symbol=${this.sym}&interval=${this.tf}&limit=1000&endTime=${end}`)).map(k => ({time:Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:+k[5], tbv:+k[9]}));
      if(tok !== this.tok) return; const old = more.filter(b => b.time < this.candles[0].time); if(!old.length){ this.noMore = true; return }
      this.candles = old.concat(this.candles);
      this.shown = this.candles; this.renderAll();
    }catch(e){} finally{ this.loadingMore = false }
  }
  get last(){ return this.candles[this.candles.length-1] }
  set(sym, market){ this.sym = sym; if(market) this.market = market; this.load(); this.app.save() }
  setTf(tf){ this.tf = tf; this.load(); this.app.save() }

  onBar(b){
    const c = this.candles, last = c[c.length-1];
    if(last && last.time === b.time) c[c.length-1] = b; else if(!last || b.time > last.time) c.push(b); else return;
    this.checkAlerts(b.close);
    if(this.replay) return;
    this.shown = c;
    this.series.update(this.mainLast(b)); this.lastLabel();
    this.updateInds(false);
    if(!this.hovering) this.setLegend(b);
  }
  renderAll(){
    this.series.setData(this.toMain(this.shown)); this.lastPL = null; this.lastLabel();
    this.updateInds(true);
    this.setLegend(this.shown[this.shown.length-1]);
  }

  /* 지표 */
  /* 지표 모양 기본값: 선마다 색·굵기·모양·보이기, 기준선, 띠 채우기 */
  defStyle(def, color){
    return { plots: def.series.map((s, i) => ({ color: (i === 0 && color) || (def.colors||[])[i] || '#888888', width: s.type === 'hist' ? 1 : def.width || (def.overlay ? 1 : 1.5), dash: s.dash ? 2 : 0, visible:true })),
      levels: (def.levels||[]).map(v => ({ v, color:'rgba(120,134,156,0.6)', dash:2, show:true })),
      fill: def.fill ? { show:true, color:def.fill.color, color2:def.fill.color2 } : null };
  }
  addInd(key, params, color, hidden, silent, style){
    const def = LC.IND.DEFS[key]; if(!def) return;
    const ds = this.defStyle(def, color);
    if(style){ ds.plots.forEach((p, i) => style.plots && style.plots[i] && Object.assign(p, style.plots[i]));
      if(style.levels && style.levels.length === ds.levels.length) ds.levels = style.levels; if(style.fill && ds.fill) Object.assign(ds.fill, style.fill) }
    const ind = { id:Math.random().toString(36).slice(2,8), key, def, params:{...def.params, ...(params||{})}, hidden:!!hidden, series:[], data:{}, style:ds, lines:[] };
    ind.color = ds.plots[0].color;
    const pane = def.overlay ? 0 : this.chart.panes().length;
    def.series.forEach((s, i) => {
      const base = { priceLineVisible:false, lastValueVisible:!def.overlay };
      let se;
      if(s.type === 'hist') se = this.chart.addSeries(L.HistogramSeries, {...base, priceScaleId: s.scale || 'right', priceFormat:{type: key==='VOL' ? 'volume' : 'price', precision:4, minMove:0.0001}, lastValueVisible:false}, pane);
      else if(s.type === 'area') se = this.chart.addSeries(L.AreaSeries, {...base, priceFormat:{type:'volume'}}, pane);
      else se = this.chart.addSeries(L.LineSeries, {...base, crosshairMarkerVisible:!def.overlay, ...(s.type === 'dots' ? {lineVisible:false, pointMarkersVisible:true, pointMarkersRadius:1.6} : s.type === 'step' ? {lineType:1} : {}),
                 priceFormat: def.overlay ? {type:'price', precision:this.prec, minMove:1/10**this.prec} : {type:'price', precision:2, minMove:0.01}}, pane);
      if(s.scale) se.priceScale().applyOptions({ scaleMargins:{top: s.scale === 'vol' ? 0.88 : 0.6, bottom:0} });
      ind.series.push(se);
    });
    if(def.fill){ ind.fillP = new LC.IndFill(this, ind); ind.series[0].attachPrimitive(ind.fillP) }
    this.applyIndStyle(ind);
    this.inds.push(ind); this.layoutPanes();
    if(!silent){ this.computeInd(ind, true); if(def.async) this.fetchAsync(ind); this.renderLegendInds(); this.app.save() }
    return ind;
  }
  applyIndStyle(ind){
    const st = ind.style; ind.color = st.plots[0].color;
    ind.def.series.forEach((s, i) => { const p = st.plots[i], se = ind.series[i], vis = !ind.hidden && p.visible;
      if(s.type === 'hist') se.applyOptions({ color:p.color, visible:vis });
      else if(s.type === 'area'){ const c = LC.color.parseColor(p.color); se.applyOptions({ lineColor:p.color, topColor:LC.color.mkColor(c.hex, .3), bottomColor:LC.color.mkColor(c.hex, .02), lineWidth:+p.width, lineStyle:+p.dash, visible:vis }) }
      else se.applyOptions({ color:p.color, lineWidth:+p.width, lineStyle:+p.dash, visible:vis }) });
    ind.lines.forEach(l => { try{ ind.series[0].removePriceLine(l) }catch(e){} });
    ind.lines = st.levels.filter(l => l.show).map(l => ind.series[0].createPriceLine({ price:+l.v, color:l.color, lineWidth:1, lineStyle:+l.dash, axisLabelVisible:false }));
    if(this.chart) this.chart.applyOptions({});
  }
  removeInd(ind){ ind.series.forEach(s => this.chart.removeSeries(s)); this.inds = this.inds.filter(i => i !== ind); this.layoutPanes(); this.renderLegendInds(); this.app.save() }
  layoutPanes(){ try{ this.chart.panes().forEach((p, i) => p.setStretchFactor(i === 0 ? 4 : 1)) }catch(e){} }
  computeInd(ind, full){
    if(ind.def.async || !this.shown.length) return;
    const r = ind.def.calc(this.shown, ind.params, ind.style);
    Object.keys(r).forEach(k => { if(k[0] === '_') ind.data[k] = r[k] });
    ind.def.series.forEach((s, i) => { const arr = r[s.key] || []; ind.data[s.key] = arr;
      if(ind.hidden) return;
      if(full) ind.series[i].setData(arr); else if(arr.length) ind.series[i].update(arr[arr.length-1]) });
  }
  updateInds(full){
    if(full){ this.inds.forEach(i => this.computeInd(i, true)); this.lastIndCalc = Date.now(); this.renderLegendInds(); return }
    if(Date.now() - (this.lastIndCalc||0) < 400) return;
    this.lastIndCalc = Date.now(); this.inds.forEach(i => this.computeInd(i, false));
  }
  async fetchAsync(ind){
    if(ind.def.futuresOnly && this.market !== 'futures'){ ind.series.forEach(s => s.setData([])); return }
    try{ const r = await ind.def.fetch({sym:this.sym, tf:this.tf}); const t0 = this.candles.length ? this.candles[0].time : 0;
      ind.def.series.forEach((s, i) => { r[s.key] = r[s.key].filter(d => d.time >= t0); ind.data[s.key] = r[s.key]; if(!ind.hidden) ind.series[i].setData(r[s.key]) }) }catch(e){}
  }
  indPane(ind){ try{ return ind.series[0].getPane().paneIndex() }catch(e){ return ind.def.overlay ? 0 : 1 } }
  renderLegendInds(){
    const I = LC.LG_ICON, title = i => LC.esc(i.def.title ? i.def.title(i.params) : i.def.label);
    const row = i => `<div class="lgr ${i.hidden ? 'off' : ''}" data-id="${i.id}"><span class="nm">${title(i)}</span><span class="vals num"></span>
      ${i.hidden ? `<button class="hid" data-a="eye" title="다시 보이기">${I.eyeOff}</button>` : ''}
      <span class="act"><button data-a="eye" title="${i.hidden ? '보이기' : '숨기기'}">${i.hidden ? I.eyeOff : I.eye}</button><button data-a="set" title="설정">${I.gear}</button><button data-a="del" title="지우기">${I.trash}</button><button data-a="more" title="더 보기">${I.more}</button></span></div>`;
    const by = {}; this.inds.forEach(i => { const p = this.indPane(i); (by[p] = by[p] || []).push(i) });
    const main = by[0] || [];
    this.q('.lg-i').innerHTML = (this.lgCol ? '' : main.map(row).join(''))
      + (main.length ? `<button class="lg-tg" title="${this.lgCol ? '지표 이름 펼치기' : '지표 이름 접기'}">${this.lgCol ? I.down + `<span class="num">${main.length}</span>` : I.up}</button>` : '');
    this.q('.lg-p').innerHTML = Object.keys(by).filter(k => +k > 0).map(k => `<div class="lgp" data-pane="${k}">${by[k].map(row).join('')}</div>`).join('');
    this.lgSig = null; this.placePaneLegends();
    this.setLegend(this.hoverBar || this.shown[this.shown.length-1]);
  }
  placePaneLegends(){
    if(!this.box.isConnected){ clearInterval(this.lgTimer); return }
    let panes; try{ panes = this.chart.panes() }catch(e){ return }
    const tops = []; let y = 0; panes.forEach((p, i) => { tops[i] = y; y += p.getHeight() + 1 });
    const sig = tops.join(','); if(sig === this.lgSig) return; this.lgSig = sig;
    this.q('.lg-p').querySelectorAll('.lgp').forEach(d => { const t = tops[+d.dataset.pane]; d.hidden = t == null; if(t != null) d.style.top = (t + 4) + 'px' });
  }
  onLegendClick(e){
    const b = e.target.closest('button'); if(!b) return; const row = b.closest('.lgr'); if(!row) return; const ind = this.inds.find(i => i.id === row.dataset.id); if(!ind) return;
    const eye = () => { ind.hidden = !ind.hidden; this.applyIndStyle(ind); if(!ind.hidden){ ind.def.async ? this.fetchAsync(ind) : this.computeInd(ind, true) } this.renderLegendInds(); this.app.save() };
    if(b.dataset.a === 'del') this.removeInd(ind);
    if(b.dataset.a === 'eye') eye();
    if(b.dataset.a === 'set') this.editInd(ind);
    if(b.dataset.a === 'more'){ const r = b.getBoundingClientRect();
      LC.ctxMenu(r.left, r.bottom + 4, [['설정…', () => this.editInd(ind)], [ind.hidden ? '보이기' : '숨기기', eye],
        ['같은 지표 하나 더', () => { const n = this.addInd(ind.key, ind.params, null, false, false, JSON.parse(JSON.stringify(ind.style))); if(n) this.renderLegendInds() }], '-',
        ['지우기', () => this.removeInd(ind)], ['지표 모두 지우기', () => { [...this.inds].forEach(i => i.series.forEach(s => this.chart.removeSeries(s))); this.inds = []; this.layoutPanes(); this.renderLegendInds(); this.app.save() }]]) }
  }
  /* 지표 설정 창: 입력값 / 모양 (바꾸면 바로 차트에 보여요) */
  editInd(ind){
    const P = ind.params, keys = Object.keys(P), st = ind.style, C = LC.color, D = ind.def;
    const old = { params:{...P}, style:JSON.parse(JSON.stringify(st)) };
    const field = k => (k === 'type' || /^t\d$/.test(k)) ? `<select class="inp" data-k="${k}">${['SMA','EMA','WMA','HMA','RMA'].map(t => `<option ${P[k]===t?'selected':''}>${t}</option>`).join('')}</select>`
      : k === 'reset' ? `<select class="inp" data-k="reset">${['없음','일간'].map(s => `<option ${P.reset===s?'selected':''}>${s}</option>`).join('')}</select>`
      : k === 'source' ? `<select class="inp" data-k="source">${['close','open','high','low','hl2','hlc3'].map(s => `<option ${P.source===s?'selected':''}>${s}</option>`).join('')}</select>`
      : `<input class="inp" type="number" step="any" min="0" data-k="${k}" value="${LC.esc(P[k])}">`;
    const dashSel = (attr, v) => `<select ${attr} title="선 모양">${LC.DASH.map(([k, n]) => `<option value="${k}" ${String(v) === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
    const plots = D.series.map((s, i) => { const p = st.plots[i];
      return `<div class="srow"><label><input type="checkbox" data-pv="${i}" ${p.visible ? 'checked' : ''}> ${LC.esc(s.name || (D.series.length > 1 ? '선 ' + (i+1) : D.label))}</label><span class="sctl">${C.colorField('p' + i, p.color)}
        ${s.type === 'hist' ? '' : `<select data-pw="${i}" title="굵기">${[1,1.5,2,3,4].map(w => `<option ${+p.width === w ? 'selected' : ''}>${w}</option>`).join('')}</select>${dashSel(`data-pd="${i}"`, p.dash)}`}</span></div>` }).join('');
    const levels = st.levels.map((l, i) => `<div class="srow"><label><input type="checkbox" data-lv="${i}" ${l.show ? 'checked' : ''}> 기준선 <input class="inp sm" type="number" step="any" data-lval="${i}" value="${l.v}"></label><span class="sctl">${C.colorField('l' + i, l.color)}${dashSel(`data-ld="${i}"`, l.dash)}</span></div>`).join('');
    const fill = st.fill ? `<div class="srow"><label><input type="checkbox" data-fill ${st.fill.show ? 'checked' : ''}> ${D.fill.kind === 'band' ? '띠 (상승 / 하락)' : '사이 채우기'}</label><span class="sctl">${C.colorField('f1', st.fill.color)}${D.fill.color2 ? C.colorField('f2', st.fill.color2) : ''}</span></div>` : '';
    const html = `<div class="sub-tabs st-tabs"><button data-t="0" class="on">입력값</button><button data-t="1">모양</button></div>
      <div class="st-pane" data-t="0"><div class="form">${ind.key === 'MAS' ? `<label>기준값${field('source')}</label><div class="mas-h"><span></span><span>종류</span><span>기간 (0이면 끔)</span></div>${[1,2,3,4,5,6,7,8].map(i => `<div class="mas-r"><i style="background:${LC.color.parseColor(st.plots[i-1].color).hex}"></i>${field('t'+i)}${field('p'+i)}</div>`).join('')}` : keys.length ? keys.map(k => `<label>${LC.IND.PARAM_LABEL[k]||k}${field(k)}</label>`).join('') : '<p class="muted">바꿀 입력값이 없는 지표예요. 모양 탭에서 색과 선을 바꿀 수 있어요.</p>'}</div></div>
      <div class="st-pane" data-t="1" hidden>${plots}${levels ? '<h6>기준선</h6>' + levels : ''}${fill ? '<h6>채우기</h6>' + fill : ''}</div>
      <div class="row-end"><button class="btn" id="indDef">기본값으로</button><button class="btn" id="indCancel">취소</button><button class="btn pri" id="indOk">확인</button></div>`;
    let done = false;
    const close = LC.modal(D.label + ' 설정', html, (mb, close) => {
      mb.querySelector('.st-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return;
        mb.querySelectorAll('.st-tabs button').forEach(x => x.classList.toggle('on', x === b)); mb.querySelectorAll('.st-pane').forEach(p => p.hidden = p.dataset.t !== b.dataset.t) };
      const read = () => {
        mb.querySelectorAll('[data-k]').forEach(el => { const k = el.dataset.k; P[k] = el.type === 'number' ? (el.value === '' ? old.params[k] : Math.max(/^(ma|p\d|fib)$/.test(k) ? 0 : 1, +el.value)) : el.value });
        D.series.forEach((s, i) => { const p = st.plots[i]; p.visible = mb.querySelector(`[data-pv="${i}"]`).checked; p.color = C.readColor(mb.querySelector(`[data-ck="p${i}"]`));
          const w = mb.querySelector(`[data-pw="${i}"]`); if(w){ p.width = +w.value; p.dash = +mb.querySelector(`[data-pd="${i}"]`).value } });
        st.levels.forEach((l, i) => { l.show = mb.querySelector(`[data-lv="${i}"]`).checked; const v = mb.querySelector(`[data-lval="${i}"]`).value; if(v !== '') l.v = +v;
          l.color = C.readColor(mb.querySelector(`[data-ck="l${i}"]`)); l.dash = +mb.querySelector(`[data-ld="${i}"]`).value });
        if(st.fill){ st.fill.show = mb.querySelector('[data-fill]').checked; st.fill.color = C.readColor(mb.querySelector('[data-ck="f1"]')); const f2 = mb.querySelector('[data-ck="f2"]'); if(f2) st.fill.color2 = C.readColor(f2) }
        this.applyIndStyle(ind); ind.def.async ? this.fetchAsync(ind) : this.computeInd(ind, true); this.renderLegendInds() };
      mb.addEventListener('input', read); mb.addEventListener('change', read);
      mb.querySelector('#indDef').onclick = () => { Object.assign(P, D.params); Object.assign(st, this.defStyle(D)); this.applyIndStyle(ind); this.computeInd(ind, true); this.renderLegendInds(); done = true; close(); this.editInd(ind) };
      mb.querySelector('#indCancel').onclick = () => close();
      mb.querySelector('#indOk').onclick = () => { done = true; this.app.save(); close() };
    }, false, () => { if(done) return; Object.keys(P).forEach(k => delete P[k]); Object.assign(P, old.params); Object.assign(st, old.style);
      this.applyIndStyle(ind); ind.def.async ? this.fetchAsync(ind) : this.computeInd(ind, true); this.renderLegendInds() });
  }

  /* 범례 */
  onCross(p){
    this.hovering = !!(p && p.time);
    const b = p && p.time ? this.shown.find(x => x.time === p.time) : null;
    this.hoverBar = b; this.setLegend(b || this.shown[this.shown.length-1]);
  }
  setLegend(b){
    if(!b) return; const pr = this.prec, cls = b.close >= b.open ? 'up' : 'down', d = b.close - b.open;
    this.q('.lg-o').innerHTML = ['시','고','저','종'].map((k, i) => `<i>${k}</i><span class="num ${cls}">${LC.fmtN([b.open,b.high,b.low,b.close][i], pr)}</span>`).join('')
      + `<span class="num lg-chg ${cls}">${d>=0?'+':''}${LC.fmtN(d, pr)} (${LC.fmtPct(b.open ? d/b.open*100 : 0)})</span>`;
    this.box.querySelectorAll('.lgr').forEach(row => { const ind = this.inds.find(i => i.id === row.dataset.id); if(!ind) return;
      const vals = ind.def.series.map((s, si) => { const p = ind.style.plots[si]; if((p && !p.visible) || !(ind.data[s.key] || []).length || ind.key === 'EW') return ''; const arr = ind.data[s.key] || []; let v = null;
        for(let i = arr.length-1; i >= 0 && i >= arr.length-1500; i--) if(arr[i].time <= b.time){ if(arr[i].time === b.time || ind.def.async) v = arr[i].value; break }
        const t = v == null ? '-' : ['VOL','OBV','OI','CVD'].includes(ind.key) ? LC.fmtBig(v) : ind.def.overlay ? LC.fmtN(v, pr) : LC.fmtN(v, 2);
        return `<span style="color:${LC.color.parseColor(p ? p.color : ind.color || '#cccccc').hex}">${t}</span>` });
      row.querySelector('.vals').innerHTML = ind.hidden ? '' : vals.join('') });
  }

  /* 클릭: 리플레이 시작점 고르기 */
  onClick(p){
    if(this.replayPick && p.time){ this.replayPick = false; this.app.hint(''); const i = this.candles.findIndex(b => b.time === p.time); if(i > 5) this.replayStart(i) }
  }
  /* 알림 */
  checkAlerts(price){
    const prev = this.prevPrice; this.prevPrice = price; if(prev == null) return;
    let changed = false;
    this.drawings.items.forEach(it => { if(it.type !== 'alert' || it.fired) return; const lv = it.pts[0].p;
      if((prev < lv && price >= lv) || (prev > lv && price <= lv)){ it.fired = true; changed = true;
        LC.notify(`${this.sym} 가격 알림`, `${LC.fmtN(lv, this.prec)} ${price >= lv ? '위로 돌파' : '아래로 이탈'} · 지금 ${LC.fmtN(price, this.prec)}`) } });
    if(changed) this.drawings.save();
  }

  /* 리플레이 */
  replayBegin(){ this.replayPick = true; this.app.hint('차트에서 리플레이를 시작할 봉을 누르세요 (Esc 취소)') }
  replayStart(i){
    this.replay = { idx:i, speed:+this.q('.cv-replay select').value, timer:null };
    this.q('.cv-replay').hidden = false; this.shown = this.candles.slice(0, i+1); this.renderAll(); this.replayLabel();
  }
  replayStep(){
    const r = this.replay; if(!r) return; if(r.idx >= this.candles.length-1){ this.replayExit(); return }
    r.idx++; const b = this.candles[r.idx]; this.shown = this.candles.slice(0, r.idx+1);
    this.series.update(this.mainLast(b)); this.inds.forEach(i => this.computeInd(i, false)); this.setLegend(b); this.replayLabel();
  }
  replayToggle(){ const r = this.replay; if(!r) return;
    if(r.timer){ clearInterval(r.timer); r.timer = null } else r.timer = setInterval(() => this.replayStep(), r.speed);
    this.q('[data-r=play]').textContent = r.timer ? '⏸' : '▶' }
  replayLabel(){ const b = this.shown[this.shown.length-1]; const d = new Date(b.time*1000);
    this.q('.rp-time').textContent = `${d.getMonth()+1}/${d.getDate()} ${LC.pad(d.getHours())}:${LC.pad(d.getMinutes())} · 남은 봉 ${this.candles.length-1-this.replay.idx}` }
  replayExit(silent){
    this.replayPick = false;
    if(!this.replay) return; clearInterval(this.replay.timer); this.replay = null; this.q('.cv-replay').hidden = true; this.q('[data-r=play]').textContent = '▶';
    if(!silent){ this.shown = this.candles; this.renderAll(); this.chart.timeScale().scrollToRealTime() }
  }

  tick(){
    const ms = LC.TFMS[this.tf], now = Date.now(); const b = this.last;
    const left = this.tf === '1w' && b ? b.time*1000 + ms - now : ms - (now % ms);
    this.q('.cv-cd').textContent = this.replay ? '' : '봉 마감까지 ' + LC.fmtDur(left);
  }
  setLog(on){ this.log = on; this.chart.priceScale('right').applyOptions({ mode: on ? L.PriceScaleMode.Logarithmic : L.PriceScaleMode.Normal }) }
  setPercent(on){ this.chart.priceScale('right').applyOptions({ mode: on ? L.PriceScaleMode.Percentage : L.PriceScaleMode.Normal }) }
  screenshot(){
    const c = this.chart.takeScreenshot(); const ctx = c.getContext('2d');
    ctx.drawImage(this.drawings.cv, 0, 0, this.drawings.cv.width, this.drawings.cv.height, 0, 0, c.width, c.height);
    ctx.font = '600 14px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = '#d7dee8'; ctx.fillText(this.q('.lg-t').textContent, 12, 22);
    const d = new Date(); LC.download(`${this.sym}_${this.tf}_${d.getFullYear()}${LC.pad(d.getMonth()+1)}${LC.pad(d.getDate())}_${LC.pad(d.getHours())}${LC.pad(d.getMinutes())}.png`, c.toDataURL('image/png'));
  }
}
LC.ChartView = ChartView;
})();

</script>

  TSLA:'Tesla', NVDA:'NVIDIA', AAPL:'Apple', MSFT:'Microsoft', AMZN:'Amazon', GOOGL:'Alphabet', META:'Meta', AMD:'AMD', INTC:'Intel', MSTR:'Strategy', COIN:'Coinbase', HOOD:'Robinhood', PLTR:'Palantir',

const ALIAS = { GOLD:'XAU', SILVER:'XAG', PLATINUM:'XPT', PALLADIUM:'XPD', WTI:'CL', OIL:'CL', USOIL:'CL', BRENTOIL:'BZ', GAS:'NATGAS', SMSN:'SAMSUNG', SKHX:'SKHYNIX', XIAOMI:'HK1810',
  USA500:'SP500', US500:'SP500', USA100:'XYZ100', USTECH:'XYZ100', JPN225:'JP225' };
const HL_CMD = new Set(['XAU','XAG','XPT','XPD','COPPER','CL','BZ','NATGAS','URANIUM','ALUMINIUM','CORN','WHEAT','SOY','TTF','HO','GOLDJM','SILVERJM','USENERGY','GLDMINE']);
const HL_FX = new Set(['JPY','EUR','GBP','KRW','DXY','USDBRL']);
const HL_IDX = new Set(['XYZ100','SP500','SMALL2000','JP225','NIFTY','IBOV','VIX','VOL','MAG7','SEMIS','SEMI','TOTAL2','OTHERS','BTCD','USBOND','10Y','2Y','30Y','ROBOT','INFOTECH','NUCLEAR','DEFENSE','ENERGY','BIOTECH']);
const ETF = new Set(['SPY','QQQ','IWM','DIA','SOXL','SOXS','TQQQ','SQQQ','KORU','NVDL','TSLL','AMDL','MSTU','TZA','TMF','TBT','UVXY','SMH','SOXX','XLE','XBI','GDX','URNM','IGV','EWY','EWJ','EWT','EWZ','EWZS','KWEB','ARTY','BITO','IBIT','MAGS','SKUU','SKDD','MUU','TLT','STXX','SNXX','CSOPSKHYNIX2L','CSOPSAMSUNG2L']);
const HL_KR = new Set(['SAMSUNG','SKHYNIX','HYUNDAI','KR200']);
const HL_ASIA = new Set(['HK1810','TENCENT','CATL','CXMT','UNITREE','MINIMAX','ZHIPU','GIGADEV','CAMBRICON','INNOLIGHT','AMEC','YMTC','SOFTBANK','KIOXIA','IBIDEN','RELIANCE','JIO','SHEIN','UMC']);
CMD.GOLD = CMD.XAU; Object.assign(CMD, { URANIUM:['우라늄','#7bb661'], ALUMINIUM:['알루미늄','#9aa4b2'], CORN:['옥수수','#e3b23c'], WHEAT:['밀','#d9a85b'], SOY:['대두','#b59a5a'], TTF:['유럽 가스','#3f8fd6'], HO:['난방유','#6b7280'],
  JPY:['엔/달러','#ea3943'], EUR:['유로/달러','#4aa3ff'], GBP:['파운드/달러','#c38bff'], KRW:['원/달러','#16c784'], DXY:['달러 인덱스','#2f9e6b'] });
Object.assign(US, { SP500:'S&P 500 지수', XYZ100:'나스닥 100 지수', SMALL2000:'러셀 2000', JP225:'닛케이 225', NIFTY:'인도 니프티 50', IBOV:'브라질 보베스파', VIX:'VIX 변동성', KR200:'코스피 200' });
KR.KR200 = ['코스피 200','']; HK.SOFTBANK = ['소프트뱅크','9984.T']; HK.KIOXIA = ['키옥시아','285A.T']; HK.CATL = ['CATL','300750.SZ']; HK.RELIANCE = ['릴라이언스','RELIANCE.NS'];
const COL = ['#f0b90b','#4aa3ff','#16c784','#e05bd6','#ff9f43','#2ec4b6','#c38bff','#ea3943'];
const hash = s => { let h = 0; for(const ch of s) h = (h*31 + ch.charCodeAt(0)) | 0; return Math.abs(h) };

const A = LC.assets = {
  cg: store.get('cgMeta', null),
  base(sym){ return sym.includes(':') ? sym.split(':')[1] : sym.replace(/USDT$|USDC$|USD1$/, '') },
  /* 같은 종목끼리 묶는 열쇠 */
  key(sym){ const b = this.base(sym); return ALIAS[b] || b },
  coinBase(sym){ return this.base(sym).replace(/^1000000|^1000|^1M/, '') },
  kind(sym, market){ const i = LC.app && LC.app.info[market || 'futures'] && LC.app.info[market || 'futures'][sym]; return i && i.ut ? i.ut : 'COIN' },
  group(sym, market){

    const k = market === 'spot' ? 'COIN' : this.kind(sym, 'futures');
    if(/EQUITY$/.test(k) && ETF.has(this.base(sym))) return 'idx';
    return k === 'EQUITY' || k === 'PREMARKET' ? 'us' : k === 'KR_EQUITY' ? 'kr' : (k === 'HK_EQUITY' || k === 'CN_EQUITY') ? 'hk' : k === 'COMMODITY' ? 'cmd' : k === 'FX' ? 'fx' : 'coin' },
  async load(){
    if(this.cg && Date.now() - this.cg.at < 12*36e5) return;
    try{ const pages = await Promise.all([1, 2].map(p => LC.getJSON(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=${p}`)));

      this.cg = { at:Date.now(), m }; store.set('cgMeta', this.cg); LC.bus && LC.bus.emit('assets') }catch(e){}
  },
  /* [이름, 시총] */
  info(sym, market){ const g = this.group(sym, market), b = this.key(sym);
    if(g === 'kr') return [(KR[b] || [b])[0], null]; if(g === 'hk') return [(HK[b] || [b])[0] || b, null];
    if(g === 'cmd' || g === 'fx') return [(CMD[b] || [b])[0], null]; if(g === 'us' || g === 'idx') return [US[b] || b, null];

<script>
/* 주식·원자재 장 상태: 실제 거래소 시간 기준 (공휴일은 빼고 요일·시간만 봐요) */
(() => {
const ZONES = {
  us:{ tz:'America/New_York', name:'미국', open:[[570,960]], pre:[240,570], post:[960,1200] },
  kr:{ tz:'Asia/Seoul', name:'한국', open:[[540,930]] },
  hk:{ tz:'Asia/Hong_Kong', name:'홍콩', open:[[570,720],[780,960]] },
  cn:{ tz:'Asia/Shanghai', name:'중국', open:[[570,690],[780,900]] },
  jp:{ tz:'Asia/Tokyo', name:'일본', open:[[540,690],[750,930]] },
  in:{ tz:'Asia/Kolkata', name:'인도', open:[[555,930]] },
  br:{ tz:'America/Sao_Paulo', name:'브라질', open:[[600,1015]] }
};
/* 휴장일 (2026~2027년, 각 거래소 날짜) */
const HOL = { us:'2026-01-01 2026-01-19 2026-02-16 2026-04-03 2026-05-25 2026-06-19 2026-07-03 2026-09-07 2026-11-26 2026-12-25 2027-01-01 2027-01-18 2027-02-15 2027-03-26 2027-05-31 2027-06-18 2027-07-05 2027-09-06 2027-11-25 2027-12-24',
  kr:'2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31 2027-01-01 2027-02-08 2027-02-09 2027-03-01 2027-05-05 2027-05-13 2027-08-16 2027-09-14 2027-09-15 2027-09-16 2027-10-04 2027-10-11 2027-12-27 2027-12-31' };
const ymd = tz => new Intl.DateTimeFormat('en-CA', { timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
const JP = new Set(['SOFTBANK','KIOXIA','IBIDEN','JP225','SONY']), CN = new Set(['CATL','CXMT','UNITREE','CAMBRICON','INNOLIGHT','AMEC','YMTC','ZHONGJI']), IN = new Set(['NIFTY','RELIANCE','JIO']);
const now = tz => { const p = new Intl.DateTimeFormat('en-US', { timeZone:tz, weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date());
  const g = t => (p.find(x => x.type === t) || {}).value; return { wd:g('weekday'), m:(+g('hour') % 24)*60 + +g('minute') } };
const zoneOf = (sym, market) => { const A = LC.assets, g = A.group(sym, market), k = A.key(sym);
  if(g === 'coin') return null; if(g === 'cmd' || g === 'fx') return g;
  if(JP.has(k)) return 'jp'; if(CN.has(k)) return 'cn'; if(IN.has(k)) return 'in'; if(k === 'IBOV') return 'br';
  if(g === 'kr') return 'kr'; if(g === 'hk') return 'hk'; return 'us' };
LC.session = {
  /* [글자, 종류(open/pre/closed), 설명] 또는 null(코인) */
  of(sym, market){ const z = zoneOf(sym, market); if(!z) return null;
    if(z === 'cmd' || z === 'fx'){ /* 선물·외환: 뉴욕 기준 일 18시 ~ 금 17시, 매일 17~18시 쉼 */
      const t = now('America/New_York'), wk = t.wd === 'Sat' || (t.wd === 'Sun' && t.m < 1080) || (t.wd === 'Fri' && t.m >= 1020);
      if(wk) return ['장 마감', 'closed', '주말 휴장 (뉴욕 일요일 18시 재개)']; if(t.m >= 1020 && t.m < 1080) return ['쉬는 시간', 'closed', '매일 뉴욕 17~18시는 쉬어요'];
      return ['장 중', 'open', z === 'fx' ? '외환 시장 거래 중' : '원자재 선물 거래 중'] }
    const Z = ZONES[z], t = now(Z.tz); if(t.wd === 'Sat' || t.wd === 'Sun') return ['장 마감', 'closed', `${Z.name} 주말 휴장`];
    if(HOL[z] && HOL[z].includes(ymd(Z.tz))) return ['휴장', 'closed', `${Z.name} 증시 휴일`];
    if(Z.open.some(([a, b]) => t.m >= a && t.m < b)) return ['장 중', 'open', `${Z.name} 정규장 거래 중`];
    if(Z.pre && t.m >= Z.pre[0] && t.m < Z.pre[1]) return ['프리마켓', 'pre', '미국 정규장 전 (뉴욕 4:00~9:30)'];

    if(Z.open.length > 1 && t.m >= Z.open[0][1] && t.m < Z.open[1][0]) return ['점심 휴장', 'closed', `${Z.name} 점심 쉬는 시간`];
    return ['장 마감', 'closed', `${Z.name} 정규장 밖 · 선물은 계속 거래돼서 실제 주가와 다를 수 있어요`] },
  badge(sym, market){ const s = this.of(sym, market); return s ? `<span class="mk-b ${s[1]}" title="${LC.esc(s[2])}"><i></i>${s[0]}</span>` : '' }
};
})();

    if(all){ el.querySelector('.ls-cats').innerHTML = this.CATS.map(c => `<button data-cat="${c[0]}" class="${this.cat === c[0] ? 'on' : ''}">${c[1]}</button>`).join('');
      const C = this.CATS.find(x => x[0] === this.cat), cur = this.subOf(this.cat);
      el.querySelector('.ls-subs').innerHTML = C[2].map(([k, n]) => `<button data-sub="${k}" class="${cur === k ? 'on' : ''}">${n}</button>`).join('') }
    const s = this.syms(), ar = k => this.sortKey === k ? (this.sortDir > 0 ? ' ▲' : ' ▼') : '';
    const isCap = !all || this.cat === 'coin', mk = isCap && this.sortKey !== 'q' ? 'm' : 'q';
    el.querySelector('.lhead').innerHTML = `<div data-s="s" style="grid-column:1/3">종목${ar('s')}</div><div data-s="c">현재가${ar('c')}</div><div data-s="P">일봉${ar('P')}</div><div data-s="${isCap ? 'm' : 'q'}" title="${isCap ? '시가총액 (없으면 하루 거래대금)' : '하루 거래대금'}">${isCap ? '시총' : '거래대금'}${ar(isCap ? 'm' : 'q')}</div>`;
    el.querySelector('.ls-n').textContent = s.length + '개';
    const loading = all && this.cat !== 'coin' && !LC.hlm.ready ? '<div class="ls-note">하이퍼리퀴드 종목도 불러오는 중…</div>' : '';
    const more = this.thinN || this.showThin ? `<button class="ls-more">${this.showThin ? '거래 적은 종목 접기' : `하루 거래대금 $300K 안 되는 ${this.thinN}개 더 보기`}</button>` : '';
    this.list.innerHTML = loading + (s.length ? s.map(([x, m]) => this.row(x, m)).join('') : `<div class="empty">${this.top === 'fav' ? '전체 종목에서 ☆을 눌러 내 목록에 담아 보세요' : '종목이 없어요'}</div>`) + more },
  markSel(){ this.list.querySelectorAll('.wrow').forEach(r => r.classList.toggle('sel', !!this.app.v && r.dataset.s === this.app.v.sym)) },
  patch(ch){
    if(this.el.hidden) return;
    const map = {}; this.list.querySelectorAll('.wrow').forEach(r => { if(r.dataset.m === this.market) map[r.dataset.s] = r });
    const T = this.app.tickers[this.market];
    ch.forEach(([s, dir]) => { const r = map[s]; if(!r) return; const t = T[s], cls = t.P >= 0 ? 'up' : 'down';
      const px = r.querySelector('.px'), pc = r.querySelector('.pc');
      px.textContent = LC.fmtPx(t.c); pc.textContent = (t.P > 0 ? '+' : '') + LC.fmtPct(t.P).replace(/^\+/, ''); pc.className = 'pc num ' + cls;
      r.classList.remove('flash-up','flash-down'); void r.offsetWidth; r.classList.add(dir > 0 ? 'flash-up' : 'flash-down') });
  },
  onShow(on){ if(on) this.render() }
};
LC.panels.push(P);

/* 아주 작은 이벤트 버스: 다른 창들이 시세 흐름을 함께 쓰도록 */
LC.bus = LC.bus || { h:{}, on(k, f){ (this.h[k] = this.h[k] || []).push(f) }, emit(k, d){ (this.h[k] || []).forEach(f => { try{ f(d) }catch(e){ console.error(e) } }) } };
})();

</script>
<script>
/* 오른쪽 창: 체결·청산, 호가, 급등락 알림 + 차트 위 큰 체결 버블 */
(() => {
const { esc, store } = LC;
const AMTS = [[0,'전체'],[1e3,'$1K+'],[1e4,'$10K+'],[5e4,'$50K+'],[1e5,'$100K+'],[5e5,'$500K+']];

/* 차트 위 버블: 큰 시장가 체결을 가격·시간 위치에 원으로 */
class Bubbles {
  constructor(){ this.items = [] }
  add(b){ this.items.push(b); if(this.items.length > 400) this.items.shift() }
  draw(ctx, dr, A){
    const P = LC.panels.find(p => p.id === 'flow'); if(!P || !P.cfg.bubbles) return;
    const base = Math.max(P.cfg.bubbleMin, 1);
    for(const b of this.items){
      const x = dr.tToX(b.t), y = dr.pToY(b.p); if(x == null || y == null || x < -20 || x > A.w + 20) continue;
      const r = Math.min(28, 3 + Math.sqrt(b.usd / base) * 4);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
      ctx.fillStyle = b.liq ? 'rgba(240,185,11,.35)' : b.buy ? 'rgba(22,199,132,.28)' : 'rgba(234,57,67,.28)'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = b.liq ? '#f0b90b' : b.buy ? '#16c784' : '#ea3943'; ctx.stroke();
      if(r > 12){ ctx.font = '10px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = '#e8eef6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(LC.fmtBig(b.usd), x, y); ctx.textAlign = 'left' }
    }
  }
}

/* 체결·청산 */
const FLOW = {
  id:'flow', label:'체결·청산', tab:'trades',
  cfg: Object.assign({ tradeMin:1e4, liqMin:0, liqAll:true, sound:false, bubbles:false, bubbleMin:5e4 }, store.get('flowCfg', {}), store.get('bubOff1', false) ? {} : (store.set('bubOff1', true), { bubbles:false })),
  trades:[], liqs:[], liqMin:{},
  mount(el, app){
    this.el = el; this.app = app;
    const opt = (sel) => AMTS.map(([v,n]) => `<option value="${v}" ${+sel===v?'selected':''}>${n}</option>`).join('');
    el.innerHTML = `<div class="sub-tabs"><button data-t="trades" class="on">큰 체결</button><button data-t="liqs">청산</button></div>
      <div class="flow-ctl">
        <label>체결 <select data-c="tradeMin">${opt(this.cfg.tradeMin)}</select></label>
        <label>청산 <select data-c="liqMin">${opt(this.cfg.liqMin)}</select></label>
        <label class="chk"><input type="checkbox" data-c="liqAll" ${this.cfg.liqAll?'checked':''}>청산 모든 종목</label>
        <label class="chk"><input type="checkbox" data-c="bubbles" ${this.cfg.bubbles?'checked':''}>차트 버블</label>
        <label>버블 <select data-c="bubbleMin">${opt(this.cfg.bubbleMin)}</select></label>
        <label class="chk"><input type="checkbox" data-c="sound" ${this.cfg.sound?'checked':''}>소리</label>
      </div>
      <div class="liq-chart"><canvas></canvas><div class="liq-sum num"></div></div>
      <div class="feed-head"><span>가격</span><span>금액</span><span>시각</span></div>
      <div class="feed"></div>`;
    this.feed = el.querySelector('.feed'); this.cv = el.querySelector('.liq-chart canvas');
    el.querySelector('.sub-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.tab = b.dataset.t;
      el.querySelectorAll('.sub-tabs button').forEach(x => x.classList.toggle('on', x === b)); this.renderFeed() };
    el.querySelector('.flow-ctl').onchange = e => { const k = e.target.dataset.c; if(!k) return;
      this.cfg[k] = e.target.type === 'checkbox' ? e.target.checked : +e.target.value; store.set('flowCfg', this.cfg); this.renderFeed() };
    this.feed.onclick = e => { const r = e.target.closest('[data-s]'); if(r && r.dataset.s !== (app.v && app.v.sym)) app.openSymbol(r.dataset.s, 'futures') };
    this.startLiq();
    setInterval(() => { this.drawLiqChart(); if(this.dirty && !this.el.hidden){ this.dirty = false; this.renderFeed() } }, 500);
  },
  onSymbol(v){
    if(this.sym === v.sym && this.market === v.market) return;
    this.sym = v.sym; this.market = v.market; this.trades = []; this.ws && this.ws.close(); this.bybit && this.bybit.close();
    this.app.views.forEach(x => { x.bubbles = x.bubbles || new Bubbles() });
    const s = v.sym.toLowerCase(), sym = v.sym, mkt = v.market;
    this.ws = LC.openWS(`${LC.EP[mkt].ws}/${s}@aggTrade`, m => {
      if(sym !== this.sym) return; const p = +m.p, q = +m.q, usd = p*q, buy = !m.m;
      if(usd >= this.cfg.bubbleMin) this.app.views.forEach(x => { if(x.sym === sym && x.market === mkt) x.bubbles.add({t:Math.floor(m.T/1000), p, usd, buy}) });
      if(usd < this.cfg.tradeMin) return;
      this.trades.unshift({T:m.T, p, usd, buy, s:sym}); if(this.trades.length > 300) this.trades.pop();
      if(this.cfg.sound && usd >= Math.max(this.cfg.tradeMin, 5e4)) LC.beep(buy ? 660 : 440, 0.05, 0.08);
      this.dirty = true;
    });
    if(mkt === 'futures'){
      this.bybit = LC.openWS('wss://stream.bybit.com/v5/public/linear', m => {
        if(!m.topic || !m.data) return; (Array.isArray(m.data) ? m.data : [m.data]).forEach(d => this.onLiq({ ex:'Bybit', s:d.s, long: d.S === 'Buy', p:+d.p, usd:+d.p * +d.v, T:+d.T }));
      }, null, ws => ws.send(JSON.stringify({op:'subscribe', args:[`allLiquidation.${sym}`]})));
      this.bybit.keepAlive({op:'ping'}, 20000);
    }
  },
  startLiq(){
    this.liqWS = LC.openWS(`${LC.EP.futures.ws}/!forceOrder@arr`, m => { const o = m.o; if(!o) return;
      this.onLiq({ ex:'Binance', s:o.s, long: o.S === 'SELL', p:+o.ap || +o.p, usd:(+o.ap || +o.p) * +(o.z || o.q), T:+o.T }) });
  },
  onLiq(l){
    if(!l.usd) return;
    this.liqs.unshift(l); if(this.liqs.length > 500) this.liqs.pop();
    const min = Math.floor(l.T / 6e4); const k = this.liqMin[min] = this.liqMin[min] || {long:0, short:0, sym:{}};
    k[l.long ? 'long' : 'short'] += l.usd;
    if(this.app.v && l.s === this.app.v.sym){
      this.app.views.forEach(x => { if(x.sym === l.s && x.market === 'futures' && x.bubbles) x.bubbles.add({t:Math.floor(l.T/1000), p:l.p, usd:l.usd, liq:true}) });
      if(this.cfg.sound && l.usd >= Math.max(this.cfg.liqMin, 1e4)) LC.beep(l.long ? 300 : 900, 0.12, 0.1);
    }
    this.dirty = true;
  },
  renderFeed(){
    if(this.el.hidden) return;
    const c = this.cfg, cur = this.app.v ? this.app.v.sym : '';
    let rows;
    if(this.tab === 'trades'){
      rows = this.trades.filter(t => t.usd >= c.tradeMin).slice(0, 120).map(t =>
        `<div class="frow ${t.usd >= 1e5 ? 'big' : ''}"><span class="num ${t.buy?'up':'down'}">${t.buy?'▲':'▼'} ${LC.fmtPx(t.p)}</span><span class="num">$${LC.fmtBig(t.usd)}</span><span class="num dim">${LC.fmtClock(t.T)}</span></div>`);
      if(this.market === 'spot' && !rows.length) rows = ['<div class="empty">현물 큰 체결을 기다리는 중이에요</div>'];
    } else {
      rows = this.liqs.filter(l => l.usd >= c.liqMin && (c.liqAll || l.s === cur)).slice(0, 150).map(l =>
        `<div class="frow liq ${l.usd >= 1e5 ? 'big' : ''}" data-s="${esc(l.s)}"><span><b class="${l.long?'down':'up'}">${l.long?'롱 청산':'숏 청산'}</b> ${esc(l.s.replace(/USDT$/,''))} <small class="dim">${l.ex}</small></span><span class="num">$${LC.fmtBig(l.usd)}</span><span class="num dim">${LC.fmtClock(l.T)}</span></div>`);
    }
    this.feed.innerHTML = rows.length ? rows.join('') : '<div class="empty">조건에 맞는 내역을 기다리는 중이에요</div>';
  },
  drawLiqChart(){
    if(this.el.hidden) return;
    const cv = this.cv, box = cv.parentElement, W = box.clientWidth, H = 70, dpr = window.devicePixelRatio || 1;
    if(cv.width !== W*dpr){ cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px' }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const now = Math.floor(Date.now()/6e4), mins = []; let max = 1, tl = 0, ts = 0;
    for(let i = 29; i >= 0; i--){ const k = this.liqMin[now - i] || {long:0, short:0}; mins.push(k); max = Math.max(max, k.long, k.short); tl += k.long; ts += k.short }
    const bw = W / 30, mid = H / 2;
    mins.forEach((k, i) => { const hl = k.long / max * (mid - 4), hs = k.short / max * (mid - 4);
      ctx.fillStyle = '#ea3943'; ctx.fillRect(i*bw + 1, mid, bw - 2, hl); ctx.fillStyle = '#16c784'; ctx.fillRect(i*bw + 1, mid - hs, bw - 2, hs) });
    ctx.fillStyle = '#232d3b'; ctx.fillRect(0, mid, W, 1);
    this.el.querySelector('.liq-sum').innerHTML = `30분 청산 · <span class="down">롱 $${LC.fmtBig(tl)}</span> · <span class="up">숏 $${LC.fmtBig(ts)}</span>`;
    Object.keys(this.liqMin).forEach(k => { if(k < now - 60) delete this.liqMin[k] });
  },
  onShow(on){ if(on){ this.renderFeed(); this.drawLiqChart() } }
};

/* 호가창 */
const BOOK = {
  id:'book', label:'호가', ex: store.get('bookEx', 'Binance'), group:0, bids:new Map(), asks:new Map(),
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="book-ctl"><div class="seg" data-c="ex"><button data-v="Binance">Binance</button><button data-v="Bybit">Bybit</button></div>
      <label>묶음 <select data-c="group"></select></label></div>
      <div class="book-head"><span>가격</span><span>수량</span><span>누적(USDT)</span></div>
      <div class="book"><div class="asks"></div><div class="mid num"></div><div class="bids"></div></div>
      <div class="imb"><div class="imb-bar"><i></i></div><div class="imb-t num"></div></div>`;
    el.querySelector('[data-c=ex]').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.ex = b.dataset.v; store.set('bookEx', this.ex); this.connect() };
    el.querySelector('[data-c=group]').onchange = e => { this.group = +e.target.value; this.render() };
    setInterval(() => this.render(), 250);
  },
  onSymbol(v){ if(this.sym === v.sym && this.market === v.market) return; this.sym = v.sym; this.market = v.market; this.setupGroups(v); this.connect() },
  setupGroups(v){
    const tick = 1 / 10 ** v.prec; const g = [1, 2, 5, 10, 50, 100, 500].map(m => +(tick*m).toFixed(10));
    this.group = g[0];
    this.el.querySelector('[data-c=group]').innerHTML = g.map(x => `<option value="${x}">${x}</option>`).join('');
  },
  connect(){
    this.ws && this.ws.close(); this.bids = new Map(); this.asks = new Map();
    this.el.querySelectorAll('[data-c=ex] button').forEach(b => b.classList.toggle('on', b.dataset.v === this.ex));
    const s = this.sym, m = this.market;
    if(this.ex === 'Binance'){
      this.ws = LC.openWS(`${LC.EP[m].wsPub}/${s.toLowerCase()}@depth20@100ms`, d => {
        const b = d.b || d.bids, a = d.a || d.asks; if(!b) return;
        this.bids = new Map(b.map(x => [+x[0], +x[1]])); this.asks = new Map(a.map(x => [+x[0], +x[1]])) });
    } else {
      const url = m === 'futures' ? 'wss://stream.bybit.com/v5/public/linear' : 'wss://stream.bybit.com/v5/public/spot';
      this.ws = LC.openWS(url, d => {
        if(!d.topic || !d.data) return;
        if(d.type === 'snapshot'){ this.bids = new Map(); this.asks = new Map() }
        d.data.b.forEach(([p, q]) => +q ? this.bids.set(+p, +q) : this.bids.delete(+p));
        d.data.a.forEach(([p, q]) => +q ? this.asks.set(+p, +q) : this.asks.delete(+p));
      }, null, ws => ws.send(JSON.stringify({op:'subscribe', args:[`orderbook.50.${s}`]})));
      this.ws.keepAlive({op:'ping'}, 20000);
    }
  },
  agg(map, side){
    const g = this.group || 0, out = new Map();
    map.forEach((q, p) => { const k = g ? (side === 'bid' ? Math.floor(p/g)*g : Math.ceil(p/g)*g) : p; out.set(+k.toFixed(10), (out.get(+k.toFixed(10)) || 0) + q) });
    return [...out.entries()].sort((a, b) => side === 'bid' ? b[0] - a[0] : a[0] - b[0]).slice(0, 14);
  },
  render(){
    if(this.el.hidden || !this.sym) return;
    const bids = this.agg(this.bids, 'bid'), asks = this.agg(this.asks, 'ask');
    if(!bids.length || !asks.length){ this.el.querySelector('.mid').textContent = '호가 불러오는 중…'; return }
    const v = this.app.v, pr = v ? Math.max(0, v.prec) : 2;
    const cum = arr => { let c = 0; return arr.map(([p, q]) => { c += p*q; return [p, q, c] }) };
    const B = cum(bids), A = cum(asks); const max = Math.max(B[B.length-1][2], A[A.length-1][2]);
    const row = ([p, q, c], side) => `<div class="brow ${side}"><i style="width:${(c/max*100).toFixed(1)}%"></i><span class="num">${LC.fmtN(p, pr)}</span><span class="num">${q >= 1000 ? LC.fmtBig(q) : q.toFixed(q < 10 ? 3 : 1)}</span><span class="num">${LC.fmtBig(c)}</span></div>`;
    this.el.querySelector('.asks').innerHTML = A.slice().reverse().map(r => row(r, 'ask')).join('');
    this.el.querySelector('.bids').innerHTML = B.map(r => row(r, 'bid')).join('');
    const bb = bids[0][0], ba = asks[0][0], spread = ba - bb;
    const last = v && v.last ? v.last.close : (bb + ba) / 2;
    this.el.querySelector('.mid').innerHTML = `<b class="${last >= (this.prevLast||last) ? 'up' : 'down'}">${LC.fmtN(last, pr)}</b> <small class="dim">스프레드 ${LC.fmtN(spread, pr)} (${(spread/ba*1e4).toFixed(2)}bp)</small>`;
    this.prevLast = last;
    const bs = B[B.length-1][2], as = A[A.length-1][2], r = bs / (bs + as) * 100;
    this.el.querySelector('.imb i').style.width = r.toFixed(1) + '%';
    this.el.querySelector('.imb-t').innerHTML = `<span class="up">매수 ${r.toFixed(1)}%</span><span class="down">매도 ${(100-r).toFixed(1)}%</span>`;
  }
};

/* 급등락 알림: 전체 종목 시세 흐름에서 1분·5분 사이 크게 움직인 종목 */
const MOVE = {
  id:'move', label:'급등락', events:[], hist:{}, last:{},
  cfg: Object.assign({ th1:1.5, th5:3, sound:true, toast:true }, store.get('moveCfg', {})),
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="flow-ctl"><label>1분 <input type="number" step="0.1" min="0.2" data-c="th1" value="${this.cfg.th1}">%</label>
      <label>5분 <input type="number" step="0.1" min="0.5" data-c="th5" value="${this.cfg.th5}">%</label>
      <label class="chk"><input type="checkbox" data-c="sound" ${this.cfg.sound?'checked':''}>소리</label>
      <label class="chk"><input type="checkbox" data-c="toast" ${this.cfg.toast?'checked':''}>팝업</label></div>
      <p class="muted pad">지금 보고 있는 시장(선물/현물)의 모든 USDT 종목을 지켜보다가 1분·5분 사이 기준보다 크게 움직이면 알려 줘요. 같은 종목은 5분에 한 번만 알려요.</p>
      <div class="feed"></div>`;
    this.feed = el.querySelector('.feed');
    el.querySelector('.flow-ctl').onchange = e => { const k = e.target.dataset.c; if(!k) return;
      this.cfg[k] = e.target.type === 'checkbox' ? e.target.checked : Math.max(0.1, +e.target.value || this.cfg[k]); store.set('moveCfg', this.cfg) };
    this.feed.onclick = e => { const r = e.target.closest('[data-s]'); if(r) app.openSymbol(r.dataset.s, r.dataset.m) };
    LC.bus.on('tickers', d => this.onTickers(d));
    this.render();
  },
  onTickers({market, arr}){
    const now = Date.now(), sec = Math.floor(now / 5000);
    if(this.market !== market){ this.market = market; this.hist = {} }
    arr.forEach(r => {
      const s = r.s; if(!s.endsWith('USDT')) return; const c = +r.c; const h = this.hist[s] = this.hist[s] || [];
      if(!h.length || h[h.length-1][0] !== sec) h.push([sec, c]); else h[h.length-1][1] = c;
      while(h.length && h[0][0] < sec - 62) h.shift();
      if(+r.q < 5e5) return;
      const ref = (back) => { for(const x of h) if(x[0] >= sec - back) return x[1]; return null };
      const p1 = ref(12), p5 = ref(60);
      const c1 = p1 ? (c - p1) / p1 * 100 : 0, c5 = p5 ? (c - p5) / p5 * 100 : 0;
      let hit = null;
      if(Math.abs(c1) >= this.cfg.th1) hit = {w:'1분', ch:c1}; else if(Math.abs(c5) >= this.cfg.th5 && h[0][0] <= sec - 55) hit = {w:'5분', ch:c5};
      if(hit && (!this.last[s] || now - this.last[s] > 3e5)){
        this.last[s] = now; const ev = { s, m:market, ...hit, p:c, T:now };
        this.events.unshift(ev); if(this.events.length > 200) this.events.pop();
        if(this.cfg.sound) LC.beep(hit.ch > 0 ? 1046 : 330, 0.15, 0.12);
        if(this.cfg.toast) LC.toast(`${s.replace(/USDT$/,'')} ${hit.w} ${LC.fmtPct(hit.ch)} · ${LC.fmtPx(c)}`, hit.ch > 0 ? 'up' : 'down', 6000);
        this.render();
      }
    });
  },
  render(){
    this.feed.innerHTML = this.events.length ? this.events.map(e => `<div class="frow mv" data-s="${esc(e.s)}" data-m="${e.m}"><span><b>${esc(e.s.replace(/USDT$/,''))}</b> <small class="dim">${e.w}</small></span>

      : '<div class="empty">아직 기준을 넘은 종목이 없어요. 켜 두면 여기 쌓여요.</div>';
  }
};

LC.panels.push(FLOW, BOOK, MOVE);
LC.Bubbles = Bubbles;

      <p class="muted">김프 = 업비트 원화 가격 ÷ (바이낸스 현물 가격 × 원/달러 환율) − 1. 테더 김프는 환율 대신 업비트 USDT 원화 가격으로 나눠요. 업비트 거래대금 순, 15초마다 새로 고쳐요. 업비트 시세 기준 ${LC.fmtClock(this.upAt)}.</p>

  async temp(){
    const t = await M.measureTemp();
    if(!this.fng || Date.now() - this.fngAt > 6e5){ try{ this.fng = (await getJSON('https://api.alternative.me/fng/?limit=60')).data.reverse(); this.fngAt = Date.now() }catch(e){} }
    if(this.tab !== 'temp') return;
    const f = this.fng ? this.fng[this.fng.length-1] : null;
    const KO = {'Extreme Fear':'극단적 공포','Fear':'공포','Neutral':'중립','Greed':'탐욕','Extreme Greed':'극단적 탐욕'};
    this.body.innerHTML = `<div class="temp-grid">
      <div class="card"><h4>시장 온도 · BTC</h4><div class="gauge"><b class="num" style="color:${t.color}">${t.label}</b><span class="num">${t.score.toFixed(2)}배</span></div>

      <div class="card"><h4>공포·탐욕 지수</h4>${f ? `<div class="gauge"><b class="num" style="color:${+f.value < 25 ? 'var(--down)' : +f.value > 75 ? 'var(--up)' : 'var(--accent)'}">${f.value}</b><span>${KO[f.value_classification] || f.value_classification}</span></div>
        <svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none">${spark(this.fng.map(x => +x.value), 300, 70)}</svg><p class="muted">최근 60일 · 0 = 극단적 공포, 100 = 극단적 탐욕 · 자료: alternative.me</p>` : '<p class="muted">지수를 못 불러왔어요</p>'}</div></div>`;
  },
  async measureTemp(){
    const k = await getJSON(`${LC.EP.futures.rest}/klines?symbol=BTCUSDT&interval=1m&limit=64`); k.pop();
    const last = k.slice(-3), prev = k.slice(-63, -3);
    const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
    const ratio = f => (sum(last, f)) / (sum(prev, f) / 20 || 1);
    const trades = ratio(x => +x[8]), vol = ratio(x => +x[5]), range = (Math.max(...last.map(x => +x[2])) - Math.min(...last.map(x => +x[3]))) / (sum(prev, x => +x[2] - +x[3]) / 60 * 3 || 1);
    const score = (trades + vol + range) / 3;
    const [label, color] = score < 0.7 ? ['조용', 'var(--blue)'] : score < 1.3 ? ['보통', 'var(--ink)'] : score < 2.2 ? ['활발', 'var(--accent)'] : ['과열', 'var(--down)'];
    return { trades, vol, range, score, label, color };
  }
};

function squarify(items, x, y, w, h){
  const out = []; const total = items.reduce((s, i) => s + i.v, 0); if(!total) return out;
  const scale = w * h / total; let rest = items.map(i => ({...i, a: i.v * scale}));
  while(rest.length){
    const short = Math.min(w, h); let row = [rest[0]], best = worst(row, short);
    for(let i = 1; i < rest.length; i++){ const r = [...row, rest[i]], wv = worst(r, short); if(wv > best) break; row = r; best = wv }
    const sum = row.reduce((s, i) => s + i.a, 0), thick = sum / short;
    let off = 0; row.forEach(i => { const len = i.a / thick;
      if(w >= h) out.push({...i, x:Math.round(x), y:Math.round(y + off), w:Math.round(thick) - 2, h:Math.round(len) - 2});
      else out.push({...i, x:Math.round(x + off), y:Math.round(y), w:Math.round(len) - 2, h:Math.round(thick) - 2}); off += len });
    if(w >= h){ x += thick; w -= thick } else { y += thick; h -= thick }
    rest = rest.slice(row.length);
  }
  return out;
  function worst(r, s){ const sum = r.reduce((a, i) => a + i.a, 0), mx = Math.max(...r.map(i => i.a)), mn = Math.min(...r.map(i => i.a)); return Math.max(s*s*mx/(sum*sum), sum*sum/(s*s*mn)) }
}
function spark(vals, W, H){
  const n = vals.length; if(n < 2) return ''; const pts = vals.map((v, i) => `${(i/(n-1)*W).toFixed(1)},${(H - v/100*H).toFixed(1)}`).join(' ');
  return `<line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#232d3b"/><polyline points="${pts}" fill="none" stroke="#f0b90b" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

/* 헤더의 작은 시장 온도 표시 (1분마다) */
async function headerTemp(){
  try{ const t = await M.measureTemp(); const el = $('hTemp'); if(el){ el.innerHTML = `시장 온도 <b style="color:${t.color}">${t.label}</b>`; el.title = `BTC 최근 3분 ÷ 앞 1시간 평소 · 체결 ${t.trades.toFixed(2)}배 · 거래량 ${t.vol.toFixed(2)}배 · 움직임 ${t.range.toFixed(2)}배` } }catch(e){}
}
window.addEventListener('DOMContentLoaded', () => { headerTemp(); setInterval(headerTemp, 60000) });
LC.headerTemp = headerTemp;
})();
