        <div class="seg pp-type"><button data-t="market" class="on">시장가</button><button data-t="limit">지정가</button></div>
        <label class="pp-limit" hidden>주문 가격<input class="inp num" id="ppPrice" type="number" step="any"></label>
        <label>증거금 (USDT)<input class="inp num" id="ppAmt" type="number" step="any" min="1" value="100"></label>
        <div class="pp-pcts">${[10,25,50,100].map(p => `<button data-p="${p}">${p}%</button>`).join('')}</div>
        <label>레버리지 <b class="num" id="ppLevT">10x</b><input id="ppLev" type="range" min="1" max="100" value="10"></label>
        <div class="pp-two"><label>익절 가격<input class="inp num" id="ppTp" type="number" step="any" placeholder="선택"></label><label>손절 가격<input class="inp num" id="ppSl" type="number" step="any" placeholder="선택"></label></div>
        <div class="pp-info muted"></div>
        <button class="btn pri pp-go" id="ppGo">롱 주문</button>
        <p class="muted small">실제 돈은 오가지 않아요. 바이낸스 선물 실시간 가격으로 계산하고, 수수료 0.04%를 양쪽에 매겨요. 청산가는 대략 값이에요.</p>
      </div>
      <h5>포지션 <span class="dim pp-pn"></span></h5><div class="pp-pos"></div>
      <h5>대기 주문</h5><div class="pp-ord"></div>
      <h5>최근 거래 <button class="lnk" id="ppReset">처음부터 (잔고 ${START.toLocaleString()} USDT)</button></h5><div class="pp-hist"></div></div>`;
    const q = s => el.querySelector(s);
    q('.pp-side').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.side = b.dataset.s; q('.pp-side').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); this.form() };
    q('.pp-type').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.type = b.dataset.t; q('.pp-type').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      q('.pp-limit').hidden = this.type !== 'limit'; if(this.type === 'limit' && !q('#ppPrice').value){ const p = livePx(this.sym); if(p) q('#ppPrice').value = p } this.form() };
    q('.pp-pcts').onclick = e => { const b = e.target.closest('button'); if(b){ q('#ppAmt').value = Math.floor(this.st.bal * b.dataset.p / 100 * 100) / 100; this.form() } };
    q('#ppLev').oninput = () => { q('#ppLevT').textContent = q('#ppLev').value + 'x'; this.form() };
    ['#ppAmt','#ppPrice','#ppTp','#ppSl'].forEach(s => q(s).oninput = () => this.form());
    q('#ppGo').onclick = () => this.submit();
    q('#ppReset').onclick = () => { this.st = { bal:START, pos:[], orders:[], hist:[] }; this.save(); this.render(); this.lines(); LC.toast('가상 매매를 처음부터 시작해요') };
    el.addEventListener('click', e => { const b = e.target.closest('[data-close],[data-cancel],[data-go]'); if(!b) return;
      if(b.dataset.close){ const p = this.st.pos.find(x => x.id === b.dataset.close); if(p) this.close(p, livePx(p.sym), '직접 종료') }
      if(b.dataset.cancel){ const o = this.st.orders.find(x => x.id === b.dataset.cancel); if(o){ this.st.bal += o.margin; this.st.orders = this.st.orders.filter(x => x !== o); this.save(); this.render(); this.lines() } }
      if(b.dataset.go) app.openSymbol(b.dataset.go, 'futures') });
    setInterval(() => this.tick(), 1000);
    this.render();
  },
  onSymbol(v){ this.sym = v.sym; this.form(); this.lines() },
  onShow(on){ if(on){ this.form(); this.render() } },
  form(){
    if(!this.el) return; const q = s => this.el.querySelector(s);
    const lev = +q('#ppLev').value, amt = +q('#ppAmt').value || 0, px = this.type === 'limit' ? +q('#ppPrice').value : livePx(this.sym);
    const long = this.side === 'long';
    q('#ppGo').textContent = `${esc(this.sym || '')} ${long ? '롱' : '숏'} ${this.type === 'limit' ? '지정가' : '시장가'} 주문`;
    q('#ppGo').className = 'btn pp-go ' + (long ? 'buy' : 'sell');
    if(!px){ q('.pp-info').textContent = this.app && this.app.v && this.app.v.market !== 'futures' ? '가상 매매는 선물 가격으로 해요. 선물로 바꾸면 바로 쓸 수 있어요.' : '가격을 기다리는 중…'; return }
    const size = amt * lev, liq = long ? px * (1 - 1/lev + 0.004) : px * (1 + 1/lev - 0.004);
    q('.pp-info').innerHTML = `포지션 크기 <b class="num">${LC.fmtN(size, 2)} USDT</b> · 수량 <b class="num">${(size/px).toPrecision(5)}</b><br>예상 청산가 <b class="num down">${LC.fmtPx(liq)}</b> · 수수료 약 <b class="num">${LC.fmtN(size*FEE, 2)}</b>`;
  },
  submit(){
    const q = s => this.el.querySelector(s), sym = this.sym;
    if(!sym || !this.app.v || this.app.v.market !== 'futures') return LC.toast('가상 매매는 선물 차트에서 할 수 있어요');
    const margin = +q('#ppAmt').value, lev = +q('#ppLev').value, tp = +q('#ppTp').value || null, sl = +q('#ppSl').value || null;
    const px = this.type === 'limit' ? +q('#ppPrice').value : livePx(sym);
    if(!(margin > 0) || !px) return LC.toast('증거금과 가격을 확인해 주세요');
    const fee = margin * lev * FEE;
    if(margin + fee > this.st.bal) return LC.toast('잔고가 모자라요');
    const long = this.side === 'long';
    if(tp && (long ? tp <= px : tp >= px)) return LC.toast('익절 가격이 진입가 반대쪽에 있어요');
    if(sl && (long ? sl >= px : sl <= px)) return LC.toast('손절 가격이 진입가 반대쪽에 있어요');
    if(this.type === 'limit'){
      this.st.bal -= margin; this.st.orders.push({ id:uid(), sym, side:this.side, price:px, margin, lev, tp, sl, t:Date.now(), above: px > livePx(sym) });
      LC.toast(`${sym} ${long ? '롱' : '숏'} 지정가 ${LC.fmtPx(px)} 주문을 걸었어요`);
    } else this.open({ sym, side:this.side, entry:px, margin, lev, tp, sl });
    this.save(); this.render(); this.lines();
  },
  open(o){
    const fee = o.margin * o.lev * FEE; this.st.bal -= o.margin + fee;
    this.st.pos.push({ id:uid(), sym:o.sym, side:o.side, entry:o.entry, margin:o.margin, lev:o.lev, qty:o.margin*o.lev/o.entry, tp:o.tp, sl:o.sl, t:Date.now() });
    LC.toast(`${o.sym} ${o.side === 'long' ? '롱' : '숏'} ${LC.fmtPx(o.entry)} 체결 · ${o.lev}x`, o.side === 'long' ? 'up' : 'down');
  },
  pnl(p, px){ return (p.side === 'long' ? px - p.entry : p.entry - px) * p.qty },
  liq(p){ return p.side === 'long' ? p.entry * (1 - 1/p.lev + 0.004) : p.entry * (1 + 1/p.lev - 0.004) },
  close(p, px, reason){
    if(!px) return; const pnl = this.pnl(p, px), fee = p.qty * px * FEE;
    const back = reason === '강제 청산' ? 0 : Math.max(0, p.margin + pnl - fee);
    this.st.bal += back; this.st.pos = this.st.pos.filter(x => x !== p);
    const real = back - p.margin;
    this.st.hist.unshift({ sym:p.sym, side:p.side, entry:p.entry, exit:px, lev:p.lev, pnl:real, roe:real/p.margin*100, reason, t:Date.now() }); this.st.hist = this.st.hist.slice(0, 50);
    LC.toast(`${p.sym} ${reason} · ${real >= 0 ? '+' : ''}${LC.fmtN(real, 2)} USDT`, real >= 0 ? 'up' : 'down', 7000); if(reason !== '직접 종료') LC.beep(real >= 0 ? 880 : 300, 0.2);
    this.save(); this.render(); this.lines();
  },
  async tick(){
    const syms = [...new Set([...this.st.pos.map(p => p.sym), ...this.st.orders.map(o => o.sym)])];
    if(syms.some(s => !livePx(s) || !LC.app.views.some(v => v.sym === s)) && Date.now() - pollT > 2000){
      pollT = Date.now(); try{ (await LC.getJSON(`${LC.EP.futures.rest}/ticker/price`)).forEach(x => prices[x.symbol] = +x.price) }catch(e){} }
    let changed = false;
    for(const o of [...this.st.orders]){ const px = livePx(o.sym); if(!px) continue;
      if(o.above ? px >= o.price : px <= o.price){ this.st.orders = this.st.orders.filter(x => x !== o); this.st.bal += o.margin; this.open({...o, entry:o.price}); changed = true } }
    for(const p of [...this.st.pos]){ const px = livePx(p.sym); if(!px) continue; const long = p.side === 'long';
      if(long ? px <= this.liq(p) : px >= this.liq(p)) this.close(p, px, '강제 청산');
      else if(p.tp && (long ? px >= p.tp : px <= p.tp)) this.close(p, p.tp, '익절');
      else if(p.sl && (long ? px <= p.sl : px >= p.sl)) this.close(p, p.sl, '손절') }
    if(changed){ this.save(); this.lines() }
    if(!this.el.hidden || changed) this.render();
  },
  render(){
    if(!this.el) return; const q = s => this.el.querySelector(s);
    let upnl = 0, used = 0;
    const pos = this.st.pos.map(p => { const px = livePx(p.sym), pnl = px ? this.pnl(p, px) : 0; upnl += pnl; used += p.margin;
      return `<div class="pp-row"><div class="pp-r1"><button class="lnk" data-go="${esc(p.sym)}"><b>${esc(p.sym.replace(/USDT$/,''))}</b></button> <span class="tag ${p.side === 'long' ? 'up' : 'down'}">${p.side === 'long' ? '롱' : '숏'} ${p.lev}x</span>
        <span class="num ${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${LC.fmtN(pnl, 2)} (${LC.fmtPct(pnl/p.margin*100)})</span><button class="btn sm" data-close="${p.id}">종료</button></div>
        <div class="pp-r2 num dim">진입 ${LC.fmtPx(p.entry)} · 지금 ${px ? LC.fmtPx(px) : '-'} · 청산 ${LC.fmtPx(this.liq(p))}${p.tp ? ' · 익절 ' + LC.fmtPx(p.tp) : ''}${p.sl ? ' · 손절 ' + LC.fmtPx(p.sl) : ''}</div></div>` }).join('');
    const ord = this.st.orders.map(o => `<div class="pp-row"><div class="pp-r1"><b>${esc(o.sym.replace(/USDT$/,''))}</b> <span class="tag ${o.side === 'long' ? 'up' : 'down'}">${o.side === 'long' ? '롱' : '숏'} ${o.lev}x</span><span class="num">${LC.fmtPx(o.price)} · ${LC.fmtN(o.margin, 2)} USDT</span><button class="btn sm" data-cancel="${o.id}">취소</button></div></div>`).join('');
    const hist = this.st.hist.slice(0, 20).map(h => `<div class="pp-row"><div class="pp-r1"><b>${esc(h.sym.replace(/USDT$/,''))}</b> <span class="tag">${h.side === 'long' ? '롱' : '숏'} ${h.lev}x · ${esc(h.reason)}</span><span class="num ${h.pnl >= 0 ? 'up' : 'down'}">${h.pnl >= 0 ? '+' : ''}${LC.fmtN(h.pnl, 2)} (${LC.fmtPct(h.roe)})</span></div>
      <div class="pp-r2 num dim">${LC.fmtPx(h.entry)} → ${LC.fmtPx(h.exit)} · ${new Date(h.t).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div></div>`).join('');
    q('.pp-bal').textContent = LC.fmtN(this.st.bal, 2);
    q('.pp-eq').textContent = LC.fmtN(this.st.bal + used + upnl + this.st.orders.reduce((s, o) => s + o.margin, 0), 2);
    q('.pp-upnl').innerHTML = `<span class="${upnl >= 0 ? 'up' : 'down'}">${upnl >= 0 ? '+' : ''}${LC.fmtN(upnl, 2)}</span>`;
    q('.pp-pn').textContent = this.st.pos.length ? this.st.pos.length + '개' : '';
    q('.pp-pos').innerHTML = pos || '<div class="empty sm">열린 포지션이 없어요</div>';
    q('.pp-ord').innerHTML = ord || '<div class="empty sm">대기 주문이 없어요</div>';
    q('.pp-hist').innerHTML = hist || '<div class="empty sm">아직 거래가 없어요</div>';
  },
  /* 차트에 진입·청산·익절·손절 가격선 */
  lines(){
    LC.app.views.forEach(v => {
      (v.paperLines || []).forEach(l => { try{ v.series.removePriceLine(l) }catch(e){} }); v.paperLines = [];
      if(v.market !== 'futures') return;
      this.st.pos.filter(p => p.sym === v.sym).forEach(p => {
        const add = (price, color, title, style = 0) => v.paperLines.push(v.series.createPriceLine({ price, color, title, lineWidth:1, lineStyle:style, axisLabelVisible:true }));
        add(p.entry, p.side === 'long' ? '#16c784' : '#ea3943', `가상 ${p.side === 'long' ? '롱' : '숏'} ${p.lev}x`);
        add(this.liq(p), '#b38cff', '청산', 2); if(p.tp) add(p.tp, '#16c784', '익절', 2); if(p.sl) add(p.sl, '#ea3943', '손절', 2) });
      this.st.orders.filter(o => o.sym === v.sym).forEach(o => v.paperLines.push(v.series.createPriceLine({ price:o.price, color:'#8a94a6', title:'가상 지정가', lineWidth:1, lineStyle:1, axisLabelVisible:true })));
    });
  }
};

/* 포트폴리오: 현물 보유 코인의 평단가·수량으로 손익 보기 */
const PF = {
  id:'pf', label:'포트폴리오',
  rows: store.get('pf', []), px:{},
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="pp-scroll"><div class="pp-acc"><div><small>평가 금액</small><b class="num pf-val">-</b></div><div><small>매수 금액</small><b class="num pf-cost">-</b></div><div><small>손익</small><b class="num pf-pnl">-</b></div></div>
      <form class="pf-form"><input class="inp" id="pfCoin" placeholder="코인 (예: BTC)" autocomplete="off" aria-label="코인"><input class="inp num" id="pfQty" type="number" step="any" placeholder="수량" aria-label="수량">
        <input class="inp num" id="pfAvg" type="number" step="any" placeholder="평단가 (USDT)" aria-label="평단가"><button class="btn pri">추가</button></form>
      <p class="muted small pad">바이낸스 현물 가격으로 5초마다 계산해요. 같은 코인을 다시 넣으면 평단가를 합쳐 줘요. 이 브라우저에만 저장돼요.</p>
      <div class="pf-list"></div></div>`;
    el.querySelector('.pf-form').onsubmit = e => { e.preventDefault();
      const c = el.querySelector('#pfCoin').value.trim().toUpperCase().replace(/USDT$/, ''), qn = +el.querySelector('#pfQty').value, a = +el.querySelector('#pfAvg').value;
      if(!/^[A-Z0-9]{1,15}$/.test(c) || !(qn > 0) || !(a > 0)) return LC.toast('코인, 수량, 평단가를 확인해 주세요');
      const ex = this.rows.find(r => r.c === c);
      if(ex){ const tq = ex.q + qn; ex.a = (ex.a*ex.q + a*qn) / tq; ex.q = tq } else this.rows.push({ c, q:qn, a });
      store.set('pf', this.rows); e.target.reset(); this.refresh() };
    el.querySelector('.pf-list').onclick = e => { const b = e.target.closest('[data-del]'); if(b){ this.rows = this.rows.filter(r => r.c !== b.dataset.del); store.set('pf', this.rows); this.render() }
      const g = e.target.closest('[data-go]'); if(g) app.openSymbol(g.dataset.go + 'USDT', 'spot') };
    setInterval(() => { if(!this.el.hidden) this.refresh() }, 5000);
  },
  onShow(on){ if(on) this.refresh() },
  async refresh(){
    if(this.rows.length){ try{ const syms = JSON.stringify(this.rows.map(r => r.c + 'USDT'));
      (await LC.getJSON(`${LC.EP.spot.rest}/ticker/price?symbols=${encodeURIComponent(syms)}`)).forEach(x => this.px[x.symbol.replace(/USDT$/, '')] = +x.price) }catch(e){
      try{ (await LC.getJSON(`${LC.EP.spot.rest}/ticker/price`)).forEach(x => { if(x.symbol.endsWith('USDT')) this.px[x.symbol.slice(0, -4)] = +x.price }) }catch(e2){} } }
    this.render();
  },
  render(){
    let val = 0, cost = 0;
    const list = this.rows.map(r => { const p = this.px[r.c], v = p ? p*r.q : null, c = r.a*r.q; if(v != null){ val += v; cost += c }
      const pnl = v != null ? v - c : null;
      return `<div class="pp-row"><div class="pp-r1"><button class="lnk" data-go="${esc(r.c)}"><b>${esc(r.c)}</b></button><span class="num">${v != null ? LC.fmtN(v, 2) + ' USDT' : '가격 없음'}</span>
        <span class="num ${pnl >= 0 ? 'up' : 'down'}">${pnl != null ? (pnl >= 0 ? '+' : '') + LC.fmtN(pnl, 2) + ' (' + LC.fmtPct(pnl/c*100) + ')' : '-'}</span><button class="btn sm" data-del="${esc(r.c)}" aria-label="${esc(r.c)} 빼기">빼기</button></div>
        <div class="pp-r2 num dim">${r.q} 개 · 평단 ${LC.fmtPx(r.a)} · 지금 ${p ? LC.fmtPx(p) : '-'}</div></div>` }).join('');
    this.el.querySelector('.pf-list').innerHTML = list || '<div class="empty sm">위에서 보유 코인을 넣어 보세요</div>';
    const pnl = val - cost;
    this.el.querySelector('.pf-val').textContent = this.rows.length ? LC.fmtN(val, 2) : '-';
    this.el.querySelector('.pf-cost').textContent = this.rows.length ? LC.fmtN(cost, 2) : '-';
    this.el.querySelector('.pf-pnl').innerHTML = this.rows.length ? `<span class="${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${LC.fmtN(pnl, 2)} (${LC.fmtPct(cost ? pnl/cost*100 : 0)})</span>` : '-';
  }
};
LC.panels.push(PAPER, PF);
LC.paper = PAPER;
})();

</script>
<script>
/* 하이퍼리퀴드: 고래 포지션, 고래 움직임, 청산 감지, 청산 지도 */
(() => {
const { esc, store } = LC;
const API = 'https://api.hyperliquid.xyz/info';
const N_WHALES = 120, POLL_MS = 45000;
const post = body => fetch(API, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) }).then(r => { if(!r.ok) throw new Error(r.status); return r.json() });
const toCoin = sym => { const b = sym.replace(/USDT$/, ''); return /^1000/.test(b) ? 'k' + b.slice(4) : b };
const toSym = coin => (/^k[A-Z]/.test(coin) ? '1000' + coin.slice(1) : coin) + 'USDT';
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const HL = LC.hl = {
  whales: [], pos: {}, marks: {}, moves: [], liqs: [], ready: false, lastPoll: 0,
  async start(){
    if(this.started) return; this.started = true;
    try{ await this.loadWhales() }catch(e){ this.err = '하이퍼리퀴드 순위표를 못 불러왔어요'; LC.bus.emit('hl', 'err'); return }
    this.loadMarks(); setInterval(() => this.loadMarks(), 15000);
    this.poll(); setInterval(() => this.poll(), POLL_MS);
  },
  /* 순위표에서 계좌 규모가 큰 활동 계정 120개를 골라요 (6시간마다 새로) */
  async loadWhales(){
    const c = store.get('hlWhales', null);
    if(c && Date.now() - c.t < 6*36e5 && c.list.length){ this.whales = c.list; return }
    const lb = await LC.getJSON('https://stats-data.hyperliquid.xyz/Mainnet/leaderboard');
    const perf = (r, w) => { const x = r.windowPerformances.find(p => p[0] === w); return x ? x[1] : {pnl:0, vlm:0} };
    this.whales = lb.leaderboardRows.filter(r => +r.accountValue > 1e6 && +perf(r, 'month').vlm > 0)
      .sort((a, b) => b.accountValue - a.accountValue).slice(0, N_WHALES)
      .map(r => ({ a:r.ethAddress, av:+r.accountValue, mp:+perf(r, 'month').pnl, name:r.displayName || '' }));
    store.set('hlWhales', { t:Date.now(), list:this.whales });
  },
  async loadMarks(){
    try{ const [meta, ctx] = await post({type:'metaAndAssetCtxs'}); meta.universe.forEach((u, i) => { this.marks[u.name] = +ctx[i].markPx }) }catch(e){}
  },
  async poll(){
    if(this.polling) return; this.polling = true;
    const list = [...this.whales]; let i = 0;
    const worker = async () => { while(i < list.length){ const w = list[i++]; try{ await this.check(w) }catch(e){} await sleep(120) } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    this.polling = false; this.ready = true; this.lastPoll = Date.now(); LC.bus.emit('hl', 'poll');
  },
  async check(w){
    const st = await post({ type:'clearinghouseState', user:w.a });
    const now = Date.now(), prev = this.pos[w.a];
    const cur = (st.assetPositions || []).map(x => { const p = x.position;
      return { coin:p.coin, szi:+p.szi, entry:+p.entryPx, val:+p.positionValue, upnl:+p.unrealizedPnl, liq: p.liquidationPx ? +p.liquidationPx : null, lev: p.leverage ? +p.leverage.value : null } });
    this.pos[w.a] = { t:now, list:cur, av:+(st.marginSummary || {}).accountValue || w.av };
    if(!prev) return;
    /* 이전과 비교해서 고래 움직임과 청산을 찾아요 */
    for(const p of prev.list){
      const n = cur.find(x => x.coin === p.coin && Math.sign(x.szi) === Math.sign(p.szi));
      const was = Math.abs(p.szi), now2 = n ? Math.abs(n.szi) : 0, mark = this.marks[p.coin] || p.entry;
      if(now2 < was * 0.7){
        const long = p.szi > 0, nearLiq = p.liq && (long ? mark <= p.liq * 1.02 : mark >= p.liq * 0.98);
        let liqFill = null;
        if(nearLiq){ try{ const f = await post({ type:'userFillsByTime', user:w.a, startTime:prev.t - 5000, endTime:now + 1000 }); liqFill = f.find(x => x.coin === p.coin && x.liquidation) }catch(e){} }
        const usd = (was - now2) * (liqFill ? +liqFill.px : mark);
        if(liqFill) this.addLiq({ coin:p.coin, a:w.a, long, usd, px:+liqFill.px, T:+liqFill.time });
        else if(usd >= 2e5) this.addMove({ kind: now2 ? '줄임' : '종료', coin:p.coin, a:w.a, long, usd, px:mark, T:now });
      }
    }
    for(const n of cur){
      const p = prev.list.find(x => x.coin === n.coin && Math.sign(x.szi) === Math.sign(n.szi));
      const add = (Math.abs(n.szi) - (p ? Math.abs(p.szi) : 0)) * (this.marks[n.coin] || n.entry);
      if(add >= 2e5) this.addMove({ kind: p ? '늘림' : '진입', coin:n.coin, a:w.a, long:n.szi > 0, usd:add, px:this.marks[n.coin] || n.entry, T:now });
    }
  },
  addMove(m){ this.moves.unshift(m); this.moves = this.moves.slice(0, 200); LC.bus.emit('hl', 'move');
    if(m.usd >= 1e6) LC.toast(`고래 ${m.long ? '롱' : '숏'} ${m.kind} · ${m.coin} $${LC.fmtBig(m.usd)}`, m.long ? 'up' : 'down', 6000) },
  addLiq(l){
    this.liqs.unshift(l); this.liqs = this.liqs.slice(0, 200); LC.bus.emit('hl', 'liq');
    const F = LC.panels.find(p => p.id === 'flow'); if(F && F.onLiq) F.onLiq({ ex:'Hyperliquid', s:toSym(l.coin), long:l.long, p:l.px, usd:l.usd, T:l.T });
    LC.toast(`하이퍼리퀴드 고래 ${l.long ? '롱' : '숏'} 청산 · ${l.coin} $${LC.fmtBig(l.usd)}`, 'alert', 8000); LC.beep(l.long ? 300 : 900, 0.2);
  },
  /* 한 코인의 고래 포지션 전체 */
  positions(coin){
    const out = [];
    Object.entries(this.pos).forEach(([a, s]) => s.list.forEach(p => { if(!coin || p.coin === coin) out.push({ ...p, a }) }));
    return out.sort((x, y) => y.val - x.val);
  }
};

/* 차트 위 청산 지도: 고래 포지션의 청산가를 가격대별로 모아 오른쪽에 막대로 */
const MAP = {
  draw(ctx, dr, A){
    const P = LC.panels.find(p => p.id === 'whale'); if(!P || !P.cfg.map) return;
    const v = dr.v; if(v.market !== 'futures') return;
    const list = HL.positions(toCoin(v.sym)).filter(p => p.liq); if(!list.length) return;
    const top = v.series.coordinateToPrice(0), bot = v.series.coordinateToPrice(A.h); if(top == null || bot == null) return;
    const bins = 60, step = (top - bot) / bins, buck = new Array(bins).fill(null).map(() => ({l:0, s:0}));
    list.forEach(p => { const i = Math.floor((top - p.liq) / step); if(i >= 0 && i < bins) buck[i][p.szi > 0 ? 'l' : 's'] += p.val });
    const max = Math.max(...buck.map(b => b.l + b.s)); if(!max) return;
    const h = A.h / bins, W = Math.min(160, A.w * 0.25);
    buck.forEach((b, i) => { if(!b.l && !b.s) return; const y = i * h;
      const wl = b.l / max * W, ws = b.s / max * W;
      ctx.fillStyle = 'rgba(234,57,67,.55)'; ctx.fillRect(A.w - wl, y + 1, wl, h - 2);
      ctx.fillStyle = 'rgba(22,199,132,.55)'; ctx.fillRect(A.w - wl - ws, y + 1, ws, h - 2);
      if(b.l + b.s >= max * 0.35){ ctx.font = '10px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = '#e8eef6'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText('$' + LC.fmtBig(b.l + b.s), A.w - wl - ws - 4, y + h/2); ctx.textAlign = 'left' } });
    if(P.cfg.entries) list.slice(0, 12).forEach(p => { const y = dr.pToY(p.entry); if(y == null) return;
      ctx.strokeStyle = p.szi > 0 ? 'rgba(22,199,132,.8)' : 'rgba(234,57,67,.8)'; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(A.w - 220, y); ctx.lineTo(A.w, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '10px "DM Mono", "Noto Sans KR", sans-serif'; ctx.fillStyle = ctx.strokeStyle; ctx.fillText(`${p.szi > 0 ? '롱' : '숏'} $${LC.fmtBig(p.val)}`, A.w - 218, y - 3) });
  }
};
LC.overlays = LC.overlays || []; LC.overlays.push(MAP);

/* 오른쪽 창: 고래 */
const W = {
  id:'whale', label:'고래', icon:'<path d="M3 13c2-4 7-6 11-5 3 .7 5 3 7 2-1 3-3 5-6 5H9l-3 3v-3c-2-.5-3-1-3-2z"/><circle cx="15" cy="11" r=".8"/>',
  tab:'coin', cfg: Object.assign({ map:true, entries:false }, store.get('whaleCfg', {})),
  mount(el, app){
    this.el = el; this.app = app;
    el.innerHTML = `<div class="sub-tabs"><button data-t="coin" class="on">이 종목</button><button data-t="all">전체</button><button data-t="moves">움직임</button><button data-t="liqs">청산</button></div>
      <div class="flow-ctl"><label class="chk"><input type="checkbox" data-c="map" ${this.cfg.map?'checked':''}>차트에 청산 지도</label>
        <label class="chk"><input type="checkbox" data-c="entries" ${this.cfg.entries?'checked':''}>고래 진입가</label><span class="dim wh-st"></span></div>
      <div class="wh-sum"></div><div class="feed wh-feed"></div>`;
    el.querySelector('.sub-tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; this.tab = b.dataset.t;
      el.querySelectorAll('.sub-tabs button').forEach(x => x.classList.toggle('on', x === b)); this.render() };
    el.querySelector('.flow-ctl').onchange = e => { const k = e.target.dataset.c; if(k){ this.cfg[k] = e.target.checked; store.set('whaleCfg', this.cfg) } };
    el.querySelector('.wh-feed').onclick = e => { const r = e.target.closest('[data-s]'); if(r && !e.target.closest('a')) app.openSymbol(r.dataset.s, 'futures') };
    LC.bus.on('hl', () => { if(!this.el.hidden) this.render() });
    HL.start();
    setInterval(() => { if(!this.el.hidden) this.status() }, 1000);
  },
  onSymbol(){ if(!this.el.hidden) this.render() },
  onShow(on){ if(on) this.render() },
  status(){ const s = this.el.querySelector('.wh-st');
    s.textContent = HL.err ? HL.err : !HL.ready ? `고래 ${HL.whales.length}명 불러오는 중…` : `고래 ${HL.whales.length}명 · ${Math.round((Date.now() - HL.lastPoll)/1000)}초 전` },
  row(p){ const long = p.szi > 0, mark = HL.marks[p.coin], dist = p.liq && mark ? (p.liq/mark - 1)*100 : null;
    return `<div class="frow wh" data-s="${esc(toSym(p.coin))}"><span><b class="${long?'up':'down'}">${long?'롱':'숏'}</b> ${this.tab === 'all' ? `<b>${esc(p.coin)}</b> ` : ''}<a class="dim" href="https://hypurrscan.io/address/${esc(p.a)}" target="_blank" rel="noopener">${short(p.a)}</a></span>
      <span class="num">$${LC.fmtBig(p.val)}${p.lev ? ` <small class="dim">${p.lev}x</small>` : ''}</span><span class="num ${p.upnl >= 0 ? 'up' : 'down'}">${p.upnl >= 0 ? '+' : ''}${LC.fmtBig(p.upnl)}</span>
      <small class="num dim wh-2">진입 ${LC.fmtPx(p.entry)} · 청산 ${p.liq ? LC.fmtPx(p.liq) + (dist != null ? ` (${LC.fmtPct(dist)})` : '') : '없음'}</small></div>` },
  render(){
    this.status();
    const sum = this.el.querySelector('.wh-sum'), feed = this.el.querySelector('.wh-feed'), v = this.app.v;
    if(!HL.ready){ sum.innerHTML = ''; feed.innerHTML = '<div class="empty">하이퍼리퀴드 큰 계정들의 포지션을 모으는 중이에요. 처음엔 1분쯤 걸려요.</div>'; return }
    if(this.tab === 'coin' || this.tab === 'all'){
      const coin = v ? toCoin(v.sym) : 'BTC', list = HL.positions(this.tab === 'coin' ? coin : null).slice(0, 80);
      const L = list.filter(p => p.szi > 0), S = list.filter(p => p.szi < 0), sv = a => a.reduce((s, p) => s + p.val, 0);
      const avg = a => { const q = a.reduce((s, p) => s + Math.abs(p.szi), 0); return q ? a.reduce((s, p) => s + p.entry*Math.abs(p.szi), 0) / q : null };
      const lv = sv(L), svv = sv(S), r = lv + svv ? lv / (lv + svv) * 100 : 50;
      sum.innerHTML = this.tab === 'coin' ? `<div class="wh-head"><b>${esc(coin)}</b> 고래 ${list.length}명 <span class="dim">(하이퍼리퀴드 계좌 상위 ${HL.whales.length}명 중)</span></div>
        <div class="imb"><div class="imb-bar"><i style="width:${r.toFixed(1)}%"></i></div><div class="imb-t num"><span class="up">롱 $${LC.fmtBig(lv)} · 평단 ${avg(L) ? LC.fmtPx(avg(L)) : '-'}</span><span class="down">숏 $${LC.fmtBig(svv)} · 평단 ${avg(S) ? LC.fmtPx(avg(S)) : '-'}</span></div></div>` : '<div class="wh-head">모든 코인에서 가장 큰 고래 포지션</div>';
      feed.innerHTML = list.length ? list.map(p => this.row(p)).join('') : '<div class="empty">이 코인에 포지션을 가진 고래가 없어요</div>';
    } else if(this.tab === 'moves'){
      sum.innerHTML = '<div class="wh-head">고래가 $20만 이상 들어가거나 줄이거나 끝낸 기록 <span class="dim">(45초마다 확인)</span></div>';
      feed.innerHTML = HL.moves.length ? HL.moves.map(m => `<div class="frow wh" data-s="${esc(toSym(m.coin))}"><span><b class="${m.long?'up':'down'}">${m.long?'롱':'숏'} ${m.kind}</b> <b>${esc(m.coin)}</b> <a class="dim" href="https://hypurrscan.io/address/${esc(m.a)}" target="_blank" rel="noopener">${short(m.a)}</a></span>
        <span class="num">$${LC.fmtBig(m.usd)}</span><span class="num dim">${LC.fmtClock(m.T)}</span></div>`).join('') : '<div class="empty">아직 기록이 없어요. 켜 두면 쌓여요.</div>';
    } else {
      sum.innerHTML = '<div class="wh-head">고래 계정의 실제 청산 <span class="dim">(포지션이 청산가 근처에서 사라지면 체결 기록으로 확인해요)</span></div>';
      feed.innerHTML = HL.liqs.length ? HL.liqs.map(l => `<div class="frow wh" data-s="${esc(toSym(l.coin))}"><span><b class="${l.long?'down':'up'}">${l.long?'롱 청산':'숏 청산'}</b> <b>${esc(l.coin)}</b> <a class="dim" href="https://hypurrscan.io/address/${esc(l.a)}" target="_blank" rel="noopener">${short(l.a)}</a></span>
        <span class="num">$${LC.fmtBig(l.usd)}</span><span class="num dim">${LC.fmtClock(l.T)}</span></div>`).join('') : '<div class="empty">아직 고래 청산이 없어요. 생기면 소리와 함께 여기와 체결·청산 탭에 떠요.</div>';
    }
  }
};
LC.panels.push(W);
})();

<script>
/* 하이퍼리퀴드 주식·원자재 시장(HIP-3: xyz, flx, km 등) 시세와 봉. 차트에서 market 'hl', 종목 이름은 'xyz:NVDA' 꼴 */
(() => {
const API = 'https://api.hyperliquid.xyz/info', WS = 'wss://api.hyperliquid.xyz/ws';
const post = b => fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(b) }).then(r => { if(!r.ok) throw new Error(r.status); return r.json() });
const SKIP_DEX = new Set(['hyna']);   /* 코인만 있는 거래소 */
const H = LC.hlm = {
  dexes: {}, ready: false, at: 0,
  async load(){
    if(this.busy) return; this.busy = true;
    try{
      if(!this.dexList){ const d = await post({ type:'perpDexs' }); this.dexList = d.filter(Boolean).filter(x => !SKIP_DEX.has(x.name)); this.dexList.forEach(x => this.dexes[x.name] = x.fullName || x.name) }
      const T = LC.app.tickers.hl = LC.app.tickers.hl || {}, I = LC.app.info.hl = LC.app.info.hl || {};
      const coinSet = new Set(Object.values(LC.app.info.futures || {}).filter(x => x.ut === 'COIN').map(x => x.base));
      await Promise.all(this.dexList.map(async dx => { try{ const [m, c] = await post({ type:'metaAndAssetCtxs', dex:dx.name });
        m.universe.forEach((u, i) => { const x = c[i]; if(!x || u.isDelisted) return; const name = u.name.split(':')[1] || u.name;
          if(coinSet.has(name) || coinSet.has(name.replace(/^k/, ''))) return;
          const px = +(x.midPx || x.markPx), prev = +x.prevDayPx; if(!px) return;
          T[u.name] = { c:px, P: prev ? (px/prev - 1)*100 : 0, q:+x.dayNtlVlm || 0, h:null, l:null };
          if(!I[u.name]) I[u.name] = { prec: Math.max(0, Math.min(6 - u.szDecimals, LC.autoPrec(px) + 1)), base:name, dex:dx.name } }) }catch(e){} }));
      this.ready = true; this.at = Date.now(); LC.bus && LC.bus.emit('hlTick');
    }catch(e){} finally{ this.busy = false }
  },
  start(){ if(this.timer) return; this.load(); this.timer = setInterval(() => this.load(), 15000) },
  label(sym){ const d = sym.split(':')[0]; return 'HL·' + (d.length <= 4 ? d.toUpperCase() : d) },
  async klines(sym, tf, endMs){ const ms = LC.TFMS[tf] || 6e4, end = endMs || Date.now();
    const r = await post({ type:'candleSnapshot', req:{ coin:sym, interval:tf, startTime:end - 1000*ms, endTime:end } });
    return r.map(k => ({ time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, tbv:0 })) },
  stream(sym, tf, onBar, onState){
    const ws = LC.openWS(WS, m => { if(m.channel !== 'candle' || !m.data || m.data.s !== sym || m.data.i !== tf) return; const k = m.data;
      onBar({ time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v, tbv:0 }) }, onState,
      w => w.send(JSON.stringify({ method:'subscribe', subscription:{ type:'candle', coin:sym, interval:tf } })));
    ws.keepAlive({ method:'ping' }, 45000); return ws }
};
})();

const STOP = new Set('the a an of to in on for and or with by is are at as from its it this that be was were will has have after over new says said than into up out more amid how why what 등 및 위해 대한 관련 통해 이후 지난 올해 오늘 기자 뉴스 대해 가장 위한 것으로 있는 없는 한다 했다 밝혀 전망 분석 기대 경신 가능성 예상 소식 오전 오후 하루 이번 지금 최근 사상 최대 역대 까지 just new daily week report price prices market markets crypto happened today here whats could would should about'.split(' '));
const JOSA = /(으로|에서|에게|까지|부터|보다|이며|이고|에도|으로써|하고|했다|한다|하며|된|될|하는|했던|이다|에|의|은|는|이|가|을|를|로|와|과|도|만)$/;
const words = t => (t.match(/[A-Za-z][A-Za-z0-9.]{2,}|[가-힣]{2,}/g) || []).map(w => { w = w.toLowerCase(); if(/[가-힣]/.test(w) && w.length > 2) w = w.replace(JOSA, ''); return w }).filter(w => w.length >= 2 && !STOP.has(w));

const NC = LC.news = {
  SOURCES, SECTIONS, items: [], notices: [], seenAt: LC.store.get('newsSeen', {}), at: 0,
  classify(it){
    const t = it.title;
    it.secs = SECTIONS.filter(s => s[3].test(t)).map(s => s[0]);
    it.stars = BIG.test(t) ? 3 : MID.test(t) ? 2 : 1;
    it.words = words(t);
    return it;
  },
  /* 비슷한 제목끼리 묶어서 몇 곳이 같은 걸 다뤘는지 세고, 상태를 정해요 */
  cluster(){
    const L = this.items; L.forEach(x => { x.cl = null });
    for(let i = 0; i < L.length; i++){ const a = L[i]; if(a.cl) continue; a.cl = a; a.clN = 1; a.clSrc = new Set([a.src]); const A = new Set(a.words); if(A.size < 2) continue;
      for(let j = i + 1; j < L.length; j++){ const b = L[j]; if(b.cl || Math.abs(a.t - b.t) > 12*36e5) continue; const B = b.words; let hit = 0; B.forEach(w => A.has(w) && hit++);
        if(hit >= 3 && hit / Math.min(A.size, B.length) >= 0.5){ b.cl = a; a.clN++; a.clSrc.add(b.src) } } }
    const now = Date.now();
    L.forEach(x => { const head = x.cl || x, n = head.clSrc ? head.clSrc.size : 1; x.srcN = n;
      if(n >= 3 && x.stars < 3) x.stars = Math.min(3, x.stars + 1);
      x.status = /정정|correction|corrected|clarif/i.test(x.title) ? 'fix' : (x.secs.includes('flash') && now - x.t < 36e5) ? 'flash' : (n >= 3 || now - x.t > 6*36e5) ? 'ok' : 'dev' });
  },
  async load(){
    const r = await Promise.allSettled(SOURCES.map(async ([n, lang, u, filter]) => { const d = await getJSON(RSS(u)); if(d.status !== 'ok') throw 0;
      return d.items.map(i => { const g = n === '구글 뉴스', title = g ? strip(i.title).replace(/ - [^-]+$/, '') : strip(i.title);
        return { src: g ? ((strip(i.title).match(/ - ([^-]+)$/) || [, '구글 뉴스'])[1]).trim() : n, lang, title, link:i.link, t:pTime(i.pubDate) } }).filter(x => x.title && (!filter || CRYPTO.test(x.title))) }));
    const all = []; let ok = 0; r.forEach(x => { if(x.status === 'fulfilled'){ ok++; all.push(...x.value) } });
    const seen = new Set(), now = Date.now();
    this.items = all.filter(x => { const k = x.title.slice(0, 36); if(seen.has(k)) return false; seen.add(k); return now - x.t < 4*864e5 }).sort((a, b) => b.t - a.t).map(x => this.classify(x));
    this.items.forEach(x => { if(!this.seenAt[x.link]) this.seenAt[x.link] = now; x.first = this.seenAt[x.link] });
    const keep = {}; this.items.forEach(x => keep[x.link] = this.seenAt[x.link]); this.seenAt = keep; LC.store.set('newsSeen', keep);
    this.cluster(); this.ok = ok; this.at = Date.now(); return this.items;
  },
  isNew(x){ return Date.now() - x.t < 15*6e4 },
  trending(){
    const now = Date.now(), cnt = {}, prev = {};
    /* 같은 이야기 묶음은 한 번만 세서, 여러 이야기에 걸쳐 나오는 낱말만 뜨게 해요 */
    const per = new Map(); this.items.forEach(x => { const age = now - x.t, k = age < 3*36e5 ? 'c' : age < 6*36e5 ? 'p' : null; if(!k) return; const h = x.cl || x; if(!per.has(h)) per.set(h, { k, w:new Set() }); x.words.forEach(w => per.get(h).w.add(w)) });
    per.forEach(({ k, w }) => w.forEach(x => { const tgt = k === 'c' ? cnt : prev; tgt[x] = (tgt[x] || 0) + 1 }));
    return Object.entries(cnt).filter(([w, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([w, n]) => ({ w, n, isNew: !prev[w], up: (prev[w] || 0) < n }));
  },
  /* 거래소 공지: 바이낸스·바이비트·비트겟 공개 API */
  async loadNotices(){
    const kind = t => /delist|removal|상장\s?폐지|폐지|cease|terminate/i.test(t) ? 'delist' : /new listing|will list|lists?\b|listing|상장|launchpool|launch/i.test(t) ? 'list' : /maintenance|점검|suspend|upgrade|일시\s?중지/i.test(t) ? 'maint'
      : /caution|monitoring|warning|유의|주의/i.test(t) ? 'warn' : /campaign|event|promo|tournament|airdrop|reward|bonanza|giveaway|arena|이벤트|competition/i.test(t) ? 'event' : 'notice';
    const jobs = [
      (async () => { const d = await getJSON('https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=15');
        const out = []; d.data.catalogs.forEach(c => (c.articles || []).forEach(a => out.push({ ex:'Binance', title:a.title, t:a.releaseDate, link:`https://www.binance.com/en/support/announcement/detail/${a.code}` }))); return out })(),
      (async () => { const d = await getJSON('https://api.bybit.com/v5/announcements/index?locale=en-US&limit=30'); return d.result.list.map(a => ({ ex:'Bybit', title:a.title, t:+a.publishTime || +a.dateTimestamp, link:a.url })) })(),
      (async () => { const d = await getJSON('https://api.bitget.com/api/v2/public/annoucements?language=en_US'); return d.data.map(a => ({ ex:'Bitget', title:a.annTitle, t:+a.cTime, link:a.annUrl })) })()
    ];
    const r = await Promise.allSettled(jobs), all = []; r.forEach(x => x.status === 'fulfilled' && all.push(...x.value));
    this.notices = all.filter(x => x.title).map(x => ({ ...x, kind:kind(x.title) })).sort((a, b) => b.t - a.t).slice(0, 120); return this.notices;
  }
};

NC.NKIND = { list:'상장', warn:'유의', delist:'폐지', maint:'점검', notice:'공지', event:'이벤트' };

<script>

(() => {

const ARB = {

  mount(el, app){ this.el = el; this.app = app;

    setInterval(() => { if(!el.hidden){ this.load(); if(this.tab === 'kp') this.loadKp() } }, 15000) },
  onShow(on){ if(on){ this.load(); if(this.tab === 'kp') this.loadKp() } },
  async load(){ if(this.busy) return; this.busy = true;
    const r = await Promise.allSettled(Object.entries(EX).map(async ([n, f]) => [n, await f()]));
    r.forEach(x => { if(x.status === 'fulfilled') this.data[x.value[0]] = x.value[1] }); this.at = Date.now(); this.busy = false; this.render() },
  async loadKp(){ try{ if(!this.kpAt || Date.now() - this.kpAt > 14000){ this.kpAt = Date.now();
      const [up, bn] = await Promise.all([getJSON('https://api.upbit.com/v1/ticker/all?quote_currencies=KRW'), getJSON(`${LC.EP.spot.rest}/ticker/price`)]);
      const P = Object.fromEntries(bn.filter(x => x.symbol.endsWith('USDT')).map(x => [x.symbol.slice(0, -4), +x.price])), usdt = (up.find(x => x.market === 'KRW-USDT') || {}).trade_price;
      this.kp = { usdt, rows: up.filter(x => P[x.market.slice(4)] && usdt).map(x => { const c = x.market.slice(4); return { c, krw:x.trade_price, kp:(x.trade_price/(P[c]*usdt) - 1)*100, vol:x.acc_trade_price_24h } }).sort((a, b) => b.vol - a.vol).slice(0, 60) } } }catch(e){} this.render() },
  render(){
    if(this.el.hidden) return; this.el.querySelectorAll('.sub-tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === this.tab));

    L.innerHTML = this.items.length ? this.items.map(x => `<a class="xrow" href="${esc(x.link)}" target="_blank" rel="noopener"><div class="nmeta"><b>@${esc(x.a)}</b>${x.rt ? '<span class="tag">리포스트</span>' : ''}<span class="dim">${ago(x.t)}</span></div><div class="xtext">${esc(x.text.slice(0, 420))}</div></a>`).join('')
      : `<div class="empty">${this.busy ? '불러오는 중…' : '글을 못 받았어요. 공개 미러가 잠시 막혔을 수 있어요.'}</div>` }

LC.panels.push(IND, ARB, NEWS, XF);
})();

  ctx(cv){ const r = cv.parentElement.getBoundingClientRect(), dpr = devicePixelRatio || 1; cv.width = r.width*dpr; cv.height = r.height*dpr; cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height); return [c, r.width, r.height] },
  css(k){ return getComputedStyle(document.documentElement).getPropertyValue(k).trim() },
  empty(c, W, H, t){ c.fillStyle = this.css('--dim'); c.font = '13px ' + LC.FONT; c.textAlign = 'center'; c.fillText(t, W/2, H/2); c.textAlign = 'left' },
  /* 청산 차트: 가격대별 고래 청산 금액 (롱은 아래, 숏은 위) + 누적선 */
  liq(cv, coin, mb){

    c.fillStyle = '#f0b90b'; c.textAlign = 'center'; c.fillText('지금 ' + LC.fmtPx(mark), mx, pad.t - 6);

    $('hMk').innerHTML = LC.session.badge(v.sym, v.market);
    [...$('tfs').children].forEach(b => b.classList.toggle('on', b.dataset.tf === v.tf));
    [...$('ranges').children].forEach(b => b.classList.toggle('on', b.dataset.tf === v.tf));
    this.tabSync();
    [...$('mkt').children].forEach(b => b.classList.toggle('on', b.dataset.m === v.market));
    $('typeSel').value = v.type; $('btnLog').classList.toggle('on', v.log);
    $('fundBox').style.display = v.market === 'futures' ? '' : 'none';
    this.updateHeader();
  },
  updateHeader(){
    const v = this.v; if(!v) return;
    const t = (this.tickers[v.market] || {})[v.sym], last = v.last, pr = v.prec;
    if(last){ $('hLast').textContent = LC.fmtN(last.close, pr); document.title = `${v.sym} ${LC.fmtN(last.close, pr)} · 우호` }
    if(t && v.market === 'hl' && v.loadedSym === v.sym && last){ const d = v.candles.filter(b => b.time >= Date.now()/1000 - 86400); if(d.length){ t.h = Math.max(...d.map(b => b.high)); t.l = Math.min(...d.map(b => b.low)) } }
    if(t){ const cls = t.P >= 0 ? 'up' : 'down'; $('hLast').className = 'last num ' + cls; $('hChg').textContent = LC.fmtPct(t.P); $('hChg').className = 'chg num ' + cls;
      $('sHigh').textContent = LC.fmtN(t.h, pr); $('sLow').textContent = LC.fmtN(t.l, pr); $('sVol').textContent = LC.fmtBig(t.q) + ' USDT' }
  },
  async loadFunding(){
    const v = this.v; if(!v || v.market !== 'futures') return;
    try{ const d = await LC.getJSON(`${LC.EP.futures.rest}/premiumIndex?symbol=${v.sym}`); this.fund = { sym:v.sym, rate:+d.lastFundingRate, next:+d.nextFundingTime, mark:+d.markPrice } }catch(e){}
  },
  updateFunding(){
    const f = this.fund, v = this.v; if(!f || !v || f.sym !== v.sym) return;
    const left = f.next - Date.now(); if(left <= 0){ this.fund = null; this.loadFunding(); return }
    $('sFund').innerHTML = `<span class="${f.rate>=0?'up':'down'}">${(f.rate*100).toFixed(4)}%</span> · ${LC.fmtDur(left)}`;
  },

  /* 작도 도구 막대: 트레이딩뷰처럼 묶음별로, 오른쪽 작은 화살표를 누르면 묶음 안 도구가 펼쳐져요 */
  buildTools(){
    const svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`, T = Object.fromEntries(TOOLS.map(t => [t[0], t]));
    const GROUPS = [['cross',['cross']], ['line',['trend','ray','ext','hline','hray','vline']], ['fib',['fib']], ['shape',['rect']], ['pos',['pos','measure']], ['text',['text']], ['alert',['alert']]];
    this.groupPick = store.get('toolPick', {});
    const btn = ([g, list]) => { const k = this.groupPick[g] && list.includes(this.groupPick[g]) ? this.groupPick[g] : list[0], t = T[k];
      return `<div class="tg" data-g="${g}"><button data-tool="${k}" title="${t[1]}" aria-label="${t[1]}">${svg(t[2])}</button>${list.length > 1 ? `<button class="fly" data-fly="${g}" title="더 보기" aria-label="${t[1]} 묶음 펼치기"><svg viewBox="0 0 8 8"><path d="M2 1l3 3-3 3"/></svg></button>` : ''}</div>` };
    const draw = () => { $('tools').innerHTML = GROUPS.map(btn).join('')
      + '<span class="tsep"></span>' + EXTRA.map(([k,t,p]) => `<button data-x="${k}" title="${t}" aria-label="${t}">${svg(p)}</button>`).join(''); this.syncTools() };
    draw();
    $('tools').onclick = e => { const f = e.target.closest('[data-fly]');
      if(f){ const g = f.dataset.fly, list = GROUPS.find(x => x[0] === g)[1], r = f.closest('.tg').getBoundingClientRect();
        document.querySelectorAll('.tfly').forEach(m => m.remove());
        const m = document.createElement('div'); m.className = 'tfly'; m.style.left = (r.right + 4) + 'px'; m.style.top = r.top + 'px';
        m.innerHTML = list.map(k => `<button data-k="${k}" class="${k === this.tool ? 'on' : ''}">${svg(T[k][2])}<span>${T[k][1]}</span></button>`).join('');
        document.body.appendChild(m);
        const off = ev => { if(!m.contains(ev.target)){ m.remove(); document.removeEventListener('mousedown', off, true) } }; setTimeout(() => document.addEventListener('mousedown', off, true));
        m.onclick = ev => { const b = ev.target.closest('[data-k]'); if(!b) return; this.groupPick[g] = b.dataset.k; store.set('toolPick', this.groupPick); m.remove(); draw(); this.setTool(b.dataset.k) };
        return }
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.tool) return this.setTool(this.tool === b.dataset.tool && b.dataset.tool !== 'cross' ? 'cross' : b.dataset.tool);
      const x = b.dataset.x;
      if(x === 'undo') return this.v && this.v.drawings.undo();
      if(x === 'clear') return this.v && this.v.drawings.clear();
      this[x] = !this[x]; if(x === 'magnet') store.set('magnet', this.magnet); this.syncTools() };
  },
  syncTools(){ document.querySelectorAll('#tools [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === this.tool));
    document.querySelectorAll('#tools [data-x]').forEach(b => b.classList.toggle('on', !!this[b.dataset.x])) },
  setTool(t){
    const G = {trend:'line',ray:'line',ext:'line',hline:'line',hray:'line',vline:'line',pos:'pos',measure:'pos'};
    if(G[t] && this.groupPick && this.groupPick[G[t]] !== t && document.querySelector(`#tools .tg[data-g="${G[t]}"]`)){ this.groupPick[G[t]] = t; store.set('toolPick', this.groupPick); this.buildTools() }
    this.tool = t; this.views.forEach(v => { v.drawings.draft = null; v.box.classList.toggle('tool-on', t !== 'cross') }); this.syncTools() },

  onKey(e){
    const tag = (e.target.tagName || '').toLowerCase(); if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    const v = this.v;
    if(e.key === 'Escape'){ this.setTool('cross'); this.hint(''); if(v){ v.replayPick = false; v.drawings.sel = null; v.drawings.updateBar() } }
    else if((e.key === 'Delete' || e.key === 'Backspace') && v && v.drawings.sel){ v.drawings.remove(v.drawings.sel); e.preventDefault() }
    else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && v){ v.drawings.undo(); e.preventDefault() }
    else if(e.altKey && !e.ctrlKey){ const m = {t:'trend', h:'hline', v:'vline', f:'fib', a:'alert', r:'rect'}[e.key.toLowerCase()]; if(m){ this.setTool(m); e.preventDefault() } }
    else if(e.shiftKey && e.key === 'ArrowRight' && v && v.replay){ v.replayStep(); e.preventDefault() }
    else if(e.key === '/' && !e.ctrlKey){ this.symSearch(); e.preventDefault() }
  },

  /* 지표 고르기 */
  /* 지표 찾기 창: 검색, 분류, 즐겨찾기, 지금 차트에 있는 지표 */
  indModal(){
    const v = this.v; if(!v) return;
    const D = LC.IND.DEFS, CATS = ['전체','즐겨찾기','지금 차트','추세','모멘텀','변동성','거래량','선물 데이터','우호 전용'];
    let cat = store.get('indCat', '전체'), favs = store.get('indFav', []);
    const html = `<div class="ix"><div class="ix-cats">${CATS.map(c => `<button data-c="${c}">${c}</button>`).join('')}</div>
      <div class="ix-main"><input class="sr-in" id="ixQ" placeholder="지표 이름으로 찾기 (예: RSI, 일목, 볼린저, 펀딩)" autocomplete="off"><div class="ix-list" id="ixL"></div></div></div>
      <p class="muted" style="margin:10px 0 0">누르면 바로 차트에 들어가고 창은 열려 있어요. 들어간 지표는 범례에서 이름을 두 번 누르거나 ⚙를 눌러 모양을 바꿔요.</p>`;
    LC.modal('지표', html, (mb) => {
      const q = mb.querySelector('#ixQ'), L = mb.querySelector('#ixL'); let sel = 0, rows = [];
      const count = k => v.inds.filter(i => i.key === k).length;
      const draw = () => {
        mb.querySelectorAll('.ix-cats button').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
        if(cat === '지금 차트' && !q.value.trim()){
          L.innerHTML = v.inds.length ? v.inds.map(i => `<div class="ix-row cur" data-id="${i.id}"><span class="dotc" style="background:${LC.color.parseColor(i.color||'#888888').hex}"></span><b>${esc(i.def.title ? i.def.title(i.params) : i.def.label)}</b><span class="dim">${esc(i.def.cat||'')}</span>
            <span class="ix-act"><button data-a="eye" title="보이기/숨기기">${i.hidden ? '◌' : '◉'}</button><button data-a="set" title="설정">⚙</button><button data-a="del" title="지우기">✕</button></span></div>`).join('') : '<div class="empty">아직 넣은 지표가 없어요</div>';
          rows = []; return }
        const k = q.value.trim().toLowerCase();
        rows = Object.keys(D).filter(key => { const d = D[key];
          if(k) return (d.label + ' ' + key + ' ' + (d.desc||'') + ' ' + (d.cat||'')).toLowerCase().includes(k);
          return cat === '전체' || (cat === '즐겨찾기' ? favs.includes(key) : d.cat === cat) });
        sel = Math.max(0, Math.min(sel, rows.length - 1));
        L.innerHTML = rows.map((key, i) => { const d = D[key], n = count(key);
          return `<div class="ix-row ${i === sel ? 'on' : ''}" data-k="${key}"><button class="fav ${favs.includes(key) ? 'on' : ''}" data-fav="${key}" title="즐겨찾기">★</button>
            <b>${esc(d.label)}</b><span class="dim ix-desc">${esc(d.desc||'')}</span><span class="tag">${d.overlay ? '차트 위' : '아래 칸'}${d.futuresOnly ? ' · 선물' : ''}</span>${n ? `<span class="tag on">${n}개 있음</span>` : ''}</div>` }).join('')
          || '<div class="empty">' + (cat === '즐겨찾기' ? '★를 눌러 자주 쓰는 지표를 모아 두세요' : '찾는 지표가 없어요') + '</div>';
      };
      const add = key => { if(D[key].futuresOnly && v.market !== 'futures') return LC.toast('선물 차트에서만 쓸 수 있는 지표예요'); v.addInd(key); LC.toast(`${D[key].label} 넣었어요`); draw() };
      mb.querySelector('.ix-cats').onclick = e => { const b = e.target.closest('button'); if(!b) return; cat = b.dataset.c; store.set('indCat', cat); q.value = ''; sel = 0; draw() };
      q.oninput = () => { sel = 0; draw() };
      q.onkeydown = e => { if(e.key === 'ArrowDown'){ sel = Math.min(sel + 1, rows.length - 1); draw(); e.preventDefault() } else if(e.key === 'ArrowUp'){ sel = Math.max(sel - 1, 0); draw(); e.preventDefault() } else if(e.key === 'Enter' && rows[sel]) add(rows[sel]) };
      L.onclick = e => {
        const f = e.target.closest('[data-fav]'); if(f){ const k = f.dataset.fav; favs = favs.includes(k) ? favs.filter(x => x !== k) : [...favs, k]; store.set('indFav', favs); draw(); return }
        const cur = e.target.closest('.ix-row.cur'); if(cur){ const ind = v.inds.find(i => i.id === cur.dataset.id); const a = e.target.closest('[data-a]'); if(!ind || !a) return;
          if(a.dataset.a === 'set') return v.editInd(ind); v.onLegendClick({ target:v.q(`.lgr[data-id="${ind.id}"] [data-a="${a.dataset.a}"]`) }); draw(); return }
        const r = e.target.closest('[data-k]'); if(r) add(r.dataset.k) };
      draw(); q.focus();
    }, true);
  },

  /* 오른쪽 창 */
  buildAside(){
    this.panels.sort((a, b) => { const i = ORDER.indexOf(a.id), j = ORDER.indexOf(b.id); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) });
    const body = $('asideBody'), rail = $('rail'), svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
    rail.innerHTML = this.panels.map(p => { const r = RAIL[p.id] || [p.label, null]; return `<button data-p="${p.id}" title="${esc(p.label)}">${svg(p.icon || r[1] || '<circle cx="12" cy="12" r="6"/>')}<span>${esc(r[0])}</span></button>` }).join('')
      + '<span class="tsep"></span><button data-x="market" title="시장 자료">' + svg('<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="5"/><rect x="13" y="10" width="8" height="11"/><rect x="3" y="13" width="8" height="8"/>') + '<span>시장</span></button>';
    body.innerHTML = this.panels.map(p => `<div class="pn" data-p="${p.id}" hidden></div>`).join('');
    this.panels.forEach(p => p.mount(body.querySelector(`.pn[data-p="${p.id}"]`), this));
    rail.onclick = e => { const b = e.target.closest('button'); if(!b) return; if(b.dataset.x) return LC.market.open();
      if(b.dataset.p === this.panelId && !this.asideHidden) return this.toggleAside(true); this.toggleAside(false); this.showPanel(b.dataset.p) };
    /* 왼쪽 가장자리를 끌어 너비 조절 */
    const app = document.querySelector('.app'), grip = $('asideGrip');
    const setW = w => { w = Math.max(260, Math.min(720, w)); app.style.setProperty('--asideW', w + 'px'); return w };
    setW(store.get('asideW', 380));
    grip.onmousedown = e => { e.preventDefault(); grip.classList.add('on'); const x0 = e.clientX, w0 = $('asideBody').offsetWidth; let w = w0;
      const mv = ev => { w = setW(w0 + x0 - ev.clientX); this.views.forEach(v => v.resize && v.resize()) };
      const up = () => { grip.classList.remove('on'); store.set('asideW', w); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); window.dispatchEvent(new Event('resize')) };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up) };
    this.asideReady = true;
    this.showPanel(store.get('panel', this.panels[0] && this.panels[0].id));
    if(store.get('asideHidden', false)) this.toggleAside(true);
    if(this.v) this.panels.forEach(p => p.onSymbol && p.onSymbol(this.v));
    this.renderTabs();
  },
  toggleAside(hide){ this.asideHidden = hide; store.set('asideHidden', hide); document.querySelector('aside').style.display = hide ? 'none' : '';
    document.querySelector('.app').style.setProperty('--asideW', hide ? '0px' : store.get('asideW', 340) + 'px');
    document.querySelectorAll('#rail [data-p]').forEach(b => b.classList.toggle('on', !hide && b.dataset.p === this.panelId)); window.dispatchEvent(new Event('resize')) },
  showPanel(id){
    if(!this.panels.find(p => p.id === id)) id = this.panels[0].id;
    this.panelId = id; const P = this.panels.find(p => p.id === id);
    $('asideHead').innerHTML = `<span>${esc(P.label)}</span><button class="hb" title="창 접기" id="asideClose">›</button>`;
    $('asideClose').onclick = () => this.toggleAside(true);
    document.querySelectorAll('#rail [data-p]').forEach(b => b.classList.toggle('on', !this.asideHidden && b.dataset.p === id));
    document.querySelectorAll('#asideBody .pn').forEach(el => el.hidden = el.dataset.p !== id);
    this.panels.forEach(p => p.onShow && p.onShow(p.id === id)); store.set('panel', id);
  }
};
window.addEventListener('DOMContentLoaded', () => app.init());
})();

</script>
</body>
</html>
