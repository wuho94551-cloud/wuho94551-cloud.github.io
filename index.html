.views.l1{grid-template:minmax(0,1fr)/minmax(0,1fr)}
.views.l2h{grid-template:minmax(0,1fr)/repeat(2,minmax(0,1fr))}
.views.l2v{grid-template:repeat(2,minmax(0,1fr))/minmax(0,1fr)}
.views.l4{grid-template:repeat(2,minmax(0,1fr))/repeat(2,minmax(0,1fr))}
.cv{position:relative;background:var(--bg);min-height:0;overflow:hidden}
.views.multi .cv.active{box-shadow:inset 0 0 0 1px var(--accent)}
.cv-chart{position:absolute;inset:0}
.draw-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.cv.tool-on .cv-chart{cursor:crosshair}.cv.hover-draw .cv-chart{cursor:move}
.lg{position:absolute;left:8px;top:6px;z-index:4;font-size:12px;line-height:1.55;pointer-events:none;max-width:calc(100% - 90px)}
.lg1{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.lg1 b{font-weight:600}.lg1 i{font-style:normal;color:var(--dim);margin-right:2px}
.lgr{display:flex;gap:8px;align-items:center;pointer-events:auto;width:max-content;max-width:100%;padding:0 4px;margin-left:-4px;border-radius:4px}
.lgr:hover{background:rgba(24,32,43,.85)}
.lgr.off{opacity:.45}.lgr .vals{color:var(--ink)}
.lgr .act{display:none;gap:2px}.lgr:hover .act{display:flex}
.lgr .act button{width:20px;height:20px;border-radius:3px;color:var(--dim);font-size:12px}
.lgr .act button:hover{background:var(--line);color:var(--ink)}
.cv-cd{position:absolute;right:72px;bottom:32px;z-index:3;font-size:11px;color:var(--dim);pointer-events:none}
.cv-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);z-index:3;pointer-events:none}
.cv-load[hidden]{display:none}
.sel-bar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:4px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.sel-bar .sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent}
.sel-bar .sw.on{border-color:#fff}
.sel-bar button:not(.sw){padding:2px 6px;border-radius:4px}.sel-bar button:not(.sw):hover{background:var(--line)}
.cv-replay{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:5px 8px;font-size:12px}
.cv-replay[hidden]{display:none}
.cv-replay button{padding:3px 8px;border-radius:4px;background:var(--line)}
.cv-replay .rp-t{color:var(--accent);font-weight:600}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:6px 12px;border-radius:6px;font-size:12px;z-index:8;display:none}
#hint.show{display:block}

aside{grid-row:3/5;grid-column:3;position:relative;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#asideTabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#asideTabs button{flex:1 0 auto;padding:10px 10px;color:var(--dim);font-weight:500;border-bottom:2px solid transparent;font-size:13px}
#asideTabs button.on{color:var(--ink);border-color:var(--accent)}
#asideBody{flex:1;min-height:0;position:relative}
.pn{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.pn[hidden]{display:none}
.sub-tabs{display:flex;gap:2px;padding:6px 8px 0;flex:none;flex-wrap:wrap}
.sub-tabs button{padding:5px 9px;border-radius:4px;color:var(--dim);font-size:12px}
.sub-tabs button.on{background:var(--panel2);color:var(--ink)}
.search{padding:8px;flex:none}
.inp,.search input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font:inherit;font-size:13px}
.list{overflow-y:auto;flex:1;min-height:0}
.wrow:hover{background:var(--panel2)}.wrow.sel{background:#1d2633}
.flash-up{animation:fu .6s}.flash-down{animation:fd .6s}
@keyframes fu{from{background:rgba(22,199,132,.22)}to{background:transparent}}
@keyframes fd{from{background:rgba(234,57,67,.22)}to{background:transparent}}
.empty{padding:24px;color:var(--dim);text-align:center;font-size:13px}

.dim{color:var(--dim)}.pad{padding:0 10px;margin:8px 0}
.flow-ctl{display:flex;flex-wrap:wrap;gap:6px 10px;padding:8px 10px;font-size:12px;color:var(--dim);flex:none;border-bottom:1px solid var(--line)}
.flow-ctl label{display:flex;align-items:center;gap:4px}
.flow-ctl select,.flow-ctl input[type=number]{padding:2px 4px;font-size:12px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;width:auto}
.flow-ctl input[type=number]{width:56px}
.chk input{accent-color:var(--accent)}
.liq-chart{padding:6px 10px 4px;flex:none;border-bottom:1px solid var(--line)}
.liq-sum{font-size:11px;color:var(--dim);margin-top:2px}
.feed-head,.book-head{display:grid;grid-template-columns:1.3fr 1fr 64px;padding:6px 10px;font-size:11px;color:var(--dim);flex:none}
.feed-head span:nth-child(n+2),.book-head span:nth-child(n+2){text-align:right}
.feed{overflow-y:auto;flex:1;min-height:0;font-size:12px}
.frow{display:grid;grid-template-columns:1.3fr 1fr 64px;padding:3px 10px;gap:6px;align-items:center;border-bottom:1px solid #161d27}
.frow span:nth-child(n+2){text-align:right}
.frow.big{background:rgba(240,185,11,.08)}.frow.liq,.frow.mv{cursor:pointer}.frow.liq:hover,.frow.mv:hover{background:var(--panel2)}
.frow small{font-size:10px}
.book-ctl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12px;color:var(--dim);flex:none}
.book-head{grid-template-columns:1fr 1fr 1fr}
.book{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;font-size:12px}
.asks,.bids{flex:1;display:flex;flex-direction:column}.asks{justify-content:flex-end}
.brow{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;padding:1.5px 10px}
.brow i{position:absolute;right:0;top:0;bottom:0;opacity:.16}
.brow.ask i{background:var(--down)}.brow.bid i{background:var(--up)}
.brow.ask span:first-of-type{color:var(--down)}.brow.bid span:first-of-type{color:var(--up)}
.brow span{position:relative}.brow span:nth-of-type(n+2){text-align:right}
.mid{padding:6px 10px;border-block:1px solid var(--line);font-size:14px}.mid small{font-size:11px}
.imb{padding:8px 10px;flex:none}.imb-bar{height:6px;background:var(--down);border-radius:3px;overflow:hidden}.imb-bar i{display:block;height:100%;background:var(--up)}
.imb-t{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}
:root[data-theme=light]{--bg:#ffffff;--panel:#f4f6f9;--panel2:#e8ecf1;--line:#d6dce4;--ink:#18202c;--dim:#5d6878}
:root[data-theme=light] .wrow{border-color:#e3e7ec}:root[data-theme=light] .wrow.sel{background:#e2e8f0}:root[data-theme=light] .frow{border-color:#e6eaef}
.hchip{font-size:12px;color:var(--dim);padding:4px 8px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.hb.mk{color:var(--ink);border:1px solid var(--line)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--dim);font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--panel2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpis>div,.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpis small{display:block;color:var(--dim);font-size:12px}.kpis b{font-size:20px;font-weight:500}
.mk-tabs{padding:0 0 12px}
.heat-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.heat-ctl .muted{margin:0}
.heat{position:relative;height:min(62vh,560px)}
.tile{position:absolute;border-radius:3px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);line-height:1.2}
.tile:hover{outline:2px solid #fff;z-index:2}.tile b{font-weight:600}.tile span{font-size:11px}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.up{background:rgba(22,199,132,.18);color:var(--up)}.tag.down{background:rgba(234,57,67,.18);color:var(--down)}
.temp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card h4{margin:0 0 8px;font-size:14px}
.gauge{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.gauge b{font-size:34px;font-weight:500}
.bar-row{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.bar-row b{text-align:right;font-weight:500}
.spark{width:100%;height:70px;display:block}
.pp-scroll{overflow-y:auto;flex:1;min-height:0;padding-bottom:16px}
.pp-acc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px}
.pp-acc>div{background:var(--panel2);border-radius:6px;padding:6px 8px}.pp-acc small{display:block;font-size:11px;color:var(--dim)}.pp-acc b{font-size:13px;font-weight:500}
.pp-form{display:grid;gap:8px;padding:0 10px 10px;border-bottom:1px solid var(--line)}
.pp-form label{display:grid;gap:3px;font-size:12px;color:var(--dim)}.pp-form [hidden]{display:none}
.pp-form .seg button{flex:1;padding:7px}.pp-form .seg{display:flex}
.pp-side button.on[data-s=long]{background:rgba(22,199,132,.2);color:var(--up)}.pp-side button.on[data-s=short]{background:rgba(234,57,67,.2);color:var(--down)}
.pp-pcts{display:flex;gap:4px}.pp-pcts button{flex:1;padding:4px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--dim)}
.pp-two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
input[type=range]{accent-color:var(--accent);width:100%}
.pp-info{font-size:12px;margin:0;line-height:1.6}
.btn.buy{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}.btn.sell{background:var(--down);border-color:var(--down);color:#fff;font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.small{font-size:11px;margin:0}
.lnk{color:var(--blue);font-size:12px;padding:0}
#asideBody h5{margin:12px 10px 6px;font-size:12px;color:var(--dim);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.pp-row{padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px}
.pp-r1{display:flex;align-items:center;gap:6px}.pp-r1 .num{margin-left:auto}.pp-r2{margin-top:2px;font-size:11px;white-space:normal}
.pf-form{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px}.pf-form .btn{grid-column:span 2}
.empty.sm{padding:10px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(440px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{width:min(980px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.mh .x{width:32px;height:32px;border-radius:6px}.mh .x:hover{background:var(--panel2)}
.mb{padding:16px;overflow:auto}
.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:12px;color:var(--dim)}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{padding:8px 14px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ind-add{text-align:left;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.ind-add:hover{border-color:var(--accent)}
.ind-add small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
#toasts{position:fixed;right:356px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:6px;max-width:360px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);padding:9px 12px;border-radius:6px;font-size:13px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.alert{border-left-color:var(--accent)}.toast.up{border-left-color:var(--up)}.toast.down{border-left-color:var(--down)}

@media(max-width:1000px){
  .app{grid-template-columns:0 minmax(0,1fr) 44px;grid-template-rows:34px 42px minmax(0,1fr) 30px 42vh}
  #tools{display:none}#bbar{grid-column:1/3}#rail{grid-row:5;grid-column:3}
  aside{grid-row:5;grid-column:1/3;border-left:0;border-top:1px solid var(--line)}#asideGrip{display:none}
  .stat{display:none}#toasts{right:16px}
}

/* 목록 칸 */
.ls-top{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;flex:none}
.ls-tabs{display:flex;gap:4px}.ls-tabs button{padding:6px 11px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--dim)}
.ls-tabs button:hover{color:var(--ink)}.ls-tabs button.on{background:var(--panel2);color:var(--ink)}
.ls-n{margin-left:auto;font-size:12px;color:var(--dim)}
.ls-cats{display:flex;gap:2px;padding:4px 10px 0;border-bottom:1px solid var(--line);flex:none}
.ls-cats button{padding:7px 10px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}.ls-cats button:hover{color:var(--ink)}
.ls-cats button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.ls-subs{display:flex;gap:4px;padding:8px 10px 2px;flex-wrap:wrap;flex:none}
.ls-subs button{padding:4px 10px;border-radius:5px;font-size:12px;color:var(--dim);background:var(--panel2)}.ls-subs button:hover{color:var(--ink)}
.ls-subs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
[hidden].ls-cats,[hidden].ls-subs{display:none}
.pn[data-p=list] .search{position:relative;padding:8px 10px;flex:none}.pn[data-p=list] .search svg{position:absolute;left:20px;top:50%;width:15px;height:15px;transform:translateY(-50%);fill:none;stroke:var(--dim);stroke-width:2}
.pn[data-p=list] .search input{padding-left:32px;border-radius:7px;background:var(--panel2)}
.lhead,.wrow{display:grid;align-items:center;gap:6px;padding:0 10px}
.lhead{grid-template-columns:24px minmax(0,1fr) 76px 58px 48px;padding-left:16px;font-size:11.5px;color:var(--dim);height:28px;border-bottom:1px solid var(--line);flex:none}
.lhead [data-s]{cursor:pointer;white-space:nowrap}.lhead [data-s]:hover{color:var(--ink)}.lhead div:nth-child(n+3){text-align:right}
.wrow{position:relative;grid-template-columns:24px minmax(0,1fr) 76px 58px 48px;padding-left:16px;height:50px;cursor:pointer;border-bottom:1px solid rgba(35,45,59,.55)}
.wrow:hover{background:var(--panel2)}.wrow.sel{background:#1a2430;box-shadow:inset 2px 0 0 var(--accent)}
.wrow .nm{overflow:hidden;line-height:1.3}.wrow .nm b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .nm small{display:block;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .px{text-align:right;font-size:13px;font-weight:500;color:var(--ink)}.wrow .pc{text-align:right;font-size:12.5px}.wrow .mc{text-align:right;font-size:12px;color:var(--dim)}
.wrow .star{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:15px;height:22px;padding:0;font-size:11px;color:#4a5668;opacity:0}.wrow:hover .star,.wrow .star.on{opacity:1}.star.on{color:var(--accent)}.star:hover{color:var(--accent)}
.sr-cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.sr-cats button{padding:5px 11px;border-radius:14px;border:1px solid var(--line);font-size:12px;color:var(--dim)}.sr-cats button.on{border-color:var(--accent);color:var(--accent)}
.sr-nm{overflow:hidden;line-height:1.3}.sr-nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sr-nm small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sr-row .num{text-align:right}
.mk-b{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:500;white-space:nowrap;pointer-events:auto;cursor:default;vertical-align:1px}.mk-b i{width:6px;height:6px;border-radius:50%;background:currentColor}
.mk-b.open{color:var(--up);background:rgba(22,199,132,.12)}.mk-b.pre{color:#f0a33b;background:rgba(240,163,59,.12)}.mk-b.closed{color:var(--dim);background:var(--panel2)}
#hMk:empty{display:none}.lg-mk:empty{display:none}
.ls-more{display:block;width:100%;padding:12px;color:var(--dim);font-size:12px;text-align:center}.ls-more:hover{color:var(--accent)}.ls-note{padding:6px 12px;font-size:11px;color:var(--dim)}
.aicw{position:relative;display:inline-block;flex:none;border-radius:50%;overflow:hidden}.aicw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;border-radius:50%;background:var(--panel)}
.aic{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;line-height:1}.aic.bk{position:absolute;inset:0}
.d-h{display:flex;align-items:center;gap:8px}.d-h b{font-size:15px}

.tag{font-size:10px;padding:0 5px;border-radius:3px;background:var(--panel2);color:var(--dim)}
.x-add{display:flex;gap:6px;padding:8px 10px}

<script>

const TFMS = {'1m':6e4,'3m':18e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'2h':72e5,'4h':144e5,'12h':432e5,'1d':864e5,'1w':6048e5};

};
const autoPrec = v => { v = Math.abs(v); return v>=1000?1 : v>=100?2 : v>=1?3 : v>=0.01?5 : 7 };
const fmtN = (v, d) => (v==null || isNaN(v)) ? '-' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPx = v => fmtN(v, autoPrec(v));
const fmtBig = v => { v = Number(v); const a = Math.abs(v);
  return a>=1e9 ? (v/1e9).toFixed(2)+'B' : a>=1e6 ? (v/1e6).toFixed(2)+'M' : a>=1e3 ? (v/1e3).toFixed(1)+'K' : v.toFixed(a<10?2:0) };
const fmtPct = v => (v>=0?'+':'') + Number(v).toFixed(2) + '%';
const pad = n => String(n).padStart(2,'0');
const fmtClock = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` };
const fmtDur = ms => { ms = Math.max(0, ms); const h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4), s = Math.floor(ms%6e4/1e3);
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}` };
async function getJSON(u){ const r = await fetch(u); if(!r.ok) throw new Error(r.status); return r.json() }

/* 자동 재연결 웹소켓. onOpen(ws)에서 구독 메시지를 보낼 수 있어요 */
function openWS(url, onMsg, onState, onOpen){
  if(!/^wss?:\/\/[a-z]/i.test(url)) return { close(){}, send(){}, keepAlive(){} };   /* 하이퍼리퀴드 종목처럼 바이낸스 주소가 없는 경우 */
  let ws, closed = false, retry = 0, ping;
  const go = () => {
    ws = new WebSocket(url);
    ws.onopen = () => { retry = 0; onState && onState(true); onOpen && onOpen(ws) };
    ws.onmessage = e => { try{ onMsg(JSON.parse(e.data)) }catch(x){ console.error(x) } };
    ws.onclose = () => { if(closed) return; onState && onState(false); if(!closed) setTimeout(go, Math.min(1e4, 1000 * 2 ** retry++)) };
    ws.onerror = () => ws.close();
  };
  go();
  return { close(){ closed = true; clearInterval(ping); try{ ws.close() }catch(e){} },
           send(m){ try{ ws.readyState === 1 && ws.send(typeof m === 'string' ? m : JSON.stringify(m)) }catch(e){} },
           keepAlive(msg, ms){ ping = setInterval(() => this.send(msg), ms) } };
}

let actx;
function beep(freq = 880, dur = 0.12, vol = 0.15){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; g.gain.value = vol; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur); o.stop(actx.currentTime + dur);
  }catch(e){}
}
function toast(msg, cls = '', ms = 5000){
  let box = $('toasts');
  if(!box){ box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box) }
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg;
  t.onclick = () => t.remove();
  box.prepend(t); setTimeout(() => t.remove(), ms);
  while(box.children.length > 6) box.lastChild.remove();
}
function notify(title, body){
  toast(title + ' · ' + body, 'alert', 10000); beep(990, 0.18); setTimeout(() => beep(1320, 0.18), 200);
  try{ if('Notification' in window && Notification.permission === 'granted') new Notification(title, {body}) }catch(e){}
}
/* 공용 모달 */
function modal(title, html, onMount, wide, onClose){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide === true ? 'wide' : wide || ''}" role="dialog" aria-label="${esc(title)}"><div class="mh"><b>${esc(title)}</b><button class="x" aria-label="닫기">✕</button></div><div class="mb">${html}</div></div>`;
  let shut = false; const close = () => { if(shut) return; shut = true; bg.remove(); document.removeEventListener('keydown', onKey); onClose && onClose() };
  const onKey = e => { if(e.key === 'Escape') close() };
  bg.addEventListener('mousedown', e => { if(e.target === bg) close() });
  bg.querySelector('.x').onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  onMount && onMount(bg.querySelector('.mb'), close);
  return close;
}
function download(name, href){ const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove() }

const ic = p => `<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
LC.LG_ICON = { eye: ic('<path d="M1.5 9S4.3 4 9 4s7.5 5 7.5 5-2.8 5-7.5 5S1.5 9 1.5 9z"/><circle cx="9" cy="9" r="2.2"/>'),
  eyeOff: ic('<path d="M3 3l12 12M7.2 4.3A7 7 0 0 1 9 4c4.7 0 7.5 5 7.5 5a12 12 0 0 1-2 2.6M11 13.6a7 7 0 0 1-2 .4C4.3 14 1.5 9 1.5 9a12 12 0 0 1 2.6-3.1"/><path d="M7.5 7.6a2.2 2.2 0 0 0 3 3"/>'),
  gear: ic('<circle cx="9" cy="9" r="2.3"/><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M3.9 14.1l1.4-1.4M12.7 5.3l1.4-1.4"/>'),
  trash: ic('<path d="M3 5h12M7 5V3h4v2M4.5 5l.8 10h7.4l.8-10M7.5 8v4.5M10.5 8v4.5"/>'),
  more: ic('<circle cx="4" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="14" cy="9" r=".9" fill="currentColor"/>'),
  up: ic('<path d="M5 11l4-4 4 4"/>'), down: ic('<path d="M5 7l4 4 4-4"/>') };
Object.assign(LC, { $, esc, store, TF, TFMS, EP, autoPrec, fmtN, fmtPx, fmtBig, fmtPct, pad, fmtClock, fmtDur, getJSON, openWS, beep, toast, notify, modal, download });
})();

</script>
<script>
/* 차트 모양: 색 고르기 도구, 지표 띠 채우기, 차트 설정 창, 오른쪽 클릭 메뉴 */
(() => {
const { esc, store } = LC;
const L = LightweightCharts;

/* 색: '#rrggbb' 또는 'rgba(...)'를 {hex, a}로, 다시 문자열로 */
const parseColor = c => {
  c = (c || '#888888').trim(); let m;
  if((m = c.match(/^#([0-9a-f]{6})([0-9a-f]{2})?$/i))) return { hex:'#' + m[1], a: m[2] ? parseInt(m[2], 16)/255 : 1 };
  if((m = c.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i))) return { hex:'#' + m[1]+m[1]+m[2]+m[2]+m[3]+m[3], a:1 };
  if((m = c.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+))?\s*\)$/i)))
    return { hex:'#' + [m[1],m[2],m[3]].map(x => (+x).toString(16).padStart(2,'0')).join(''), a: m[4] == null ? 1 : +m[4] };
  return { hex:'#888888', a:1 };
};
const mkColor = (hex, a) => { if(a >= 0.999) return hex; const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${(+a).toFixed(2)})` };
/* 색 고르기: 네모 버튼을 누르면 팔레트 + 불투명도 창이 떠요 */
const colorField = (key, val) => `<button type="button" class="swatch" data-ck="${esc(key)}" data-v="${esc(val || '#888888')}"><i style="background:${esc(val || '#888888')}"></i></button>`;
const readColor = el => el.dataset.v;
const GRAYS = ['#ffffff','#d1d4dc','#b2b5be','#9598a1','#787b86','#5d606b','#434651','#2a2e39','#131722','#000000'];
const HUES = ['#f23645','#ff9800','#ffeb3b','#4caf50','#089981','#00bcd4','#2962ff','#673ab7','#9c27b0','#e91e63'];
const mix = (hex, to, k) => { const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
  return '#' + [16, 8, 0].map(sh => Math.round(((a >> sh) & 255) * (1 - k) + ((b >> sh) & 255) * k).toString(16).padStart(2, '0')).join('') };
const PALETTE = [GRAYS, HUES, ...[.8, .6, .4, .2].map(k => HUES.map(h => mix(h, '#ffffff', k))), ...[.25, .5].map(k => HUES.map(h => mix(h, '#000000', k)))];
const openPicker = sw => {
  document.querySelectorAll('.cpop').forEach(x => x.remove());
  const cur = parseColor(sw.dataset.v), custom = LC.store.get('customColors', []);
  const pop = document.createElement('div'); pop.className = 'cpop';
  pop.innerHTML = PALETTE.map((row, i) => `<div class="cp-row ${i === 2 ? 'gap' : ''}">${row.map(c => `<button data-c="${c}" class="${c === cur.hex ? 'on' : ''}" style="background:${c}"></button>`).join('')}</div>`).join('')
    + `<hr><div class="cp-row cp-cust">${custom.map(c => `<button data-c="${c}" style="background:${c}"></button>`).join('')}<label class="cp-add" title="직접 고르기">+<input type="color" value="${cur.hex}"></label></div>
      <div class="cp-op"><span>불투명도</span><div class="cp-opr"><input type="range" min="0" max="100" value="${Math.round(cur.a*100)}" style="--c:${cur.hex}"><input class="cp-pct" type="number" min="0" max="100" value="${Math.round(cur.a*100)}"><b>%</b></div></div>`;
  document.body.appendChild(pop);
  const r = sw.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  pop.style.left = Math.max(6, Math.min(r.left, innerWidth - pr.width - 6)) + 'px';
  pop.style.top = (r.bottom + pr.height + 6 < innerHeight ? r.bottom + 4 : Math.max(6, r.top - pr.height - 4)) + 'px';
  let hex = cur.hex, al = cur.a;
  const rng = pop.querySelector('[type=range]'), pct = pop.querySelector('.cp-pct');
  const set = () => { const v = mkColor(hex, al); sw.dataset.v = v; sw.querySelector('i').style.background = v; rng.style.setProperty('--c', hex);
    pop.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === hex)); sw.dispatchEvent(new Event('input', { bubbles:true })) };
  pop.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(b){ hex = b.dataset.c; set() } });
  pop.querySelector('.cp-add input').oninput = e => { hex = e.target.value; set() };
  pop.querySelector('.cp-add input').onchange = e => { const c = e.target.value, l = LC.store.get('customColors', []).filter(x => x !== c); l.unshift(c); LC.store.set('customColors', l.slice(0, 10)) };
  rng.oninput = () => { al = rng.value / 100; pct.value = rng.value; set() };
  pct.oninput = () => { const v = Math.max(0, Math.min(100, +pct.value || 0)); al = v / 100; rng.value = v; set() };
  const off = e => { if(!pop.contains(e.target) && e.target.closest('.swatch') !== sw){ pop.remove(); document.removeEventListener('mousedown', off, true) } };
  setTimeout(() => document.addEventListener('mousedown', off, true));
};
document.addEventListener('click', e => { const sw = e.target.closest('.swatch'); if(sw){ e.preventDefault(); document.querySelector('.cpop') && document.querySelector('.cpop').dataset.for === sw.dataset.ck ? document.querySelector('.cpop').remove() : (openPicker(sw), document.querySelector('.cpop').dataset.for = sw.dataset.ck) } });
LC.color = { parseColor, mkColor, colorField, readColor };
const DASH = [['0','실선'],['1','점선'],['2','파선'],['3','긴 파선']];
LC.DASH = DASH;

/* 지표 띠 채우기 (차트 안쪽, 봉 뒤에 그려요) */
class IndFill {
  constructor(v, ind){ this.v = v; this.ind = ind; const self = this;
    this.view = { zOrder(){ return ind.def.fill && ind.def.fill.kind === 'ew' ? 'top' : 'bottom' }, renderer(){ return { draw(t){ try{ self.draw(t) }catch(e){} } } } } }
  attached(p){ this.p = p } detached(){ this.p = null }
  updateAllViews(){} paneViews(){ return [this.view] }
  draw(target){
    const ind = this.ind, F = ind.def.fill, st = ind.style.fill; if(!F || !st || !st.show || ind.hidden || !this.p) return;
    const se = this.p.series, ts = this.v.chart.timeScale();
    target.useBitmapCoordinateSpace(sc => {
      const ctx = sc.context, hr = sc.horizontalPixelRatio, vr = sc.verticalPixelRatio, W = sc.bitmapSize.width;

<script>

  for(let i=0;i<vals.length;i++){ const v = vals[i]; if(v==null) continue; w.push(v); sum += v; if(w.length>p) sum -= w.shift(); if(w.length===p) out[i] = sum/p } return out };

const toSeries = (c, vals) => { const out = []; for(let i=0;i<c.length;i++) if(vals[i]!=null && isFinite(vals[i])) out.push({time:c[i].time, value:vals[i]}); return out };
const rsiCalc = (vals, p) => { const g = [null], l = [null];
  for(let i=1;i<vals.length;i++){ const d = vals[i]-vals[i-1]; g.push(Math.max(d,0)); l.push(Math.max(-d,0)) }
  const ag = rma(g.slice(1),p), al = rma(l.slice(1),p);
  return [null, ...ag.map((a,i) => a==null ? null : al[i]===0 ? 100 : 100 - 100/(1 + a/al[i]))] };
const trueRange = c => c.map((b,i) => i===0 ? b.high-b.low : Math.max(b.high-b.low, Math.abs(b.high-c[i-1].close), Math.abs(b.low-c[i-1].close)));

const wma = (vals, p) => vals.map((_, i) => { if(i < p-1) return null; let s = 0, w = 0; for(let j = 0; j < p; j++){ const v = vals[i-j]; if(v == null) return null; s += v*(p-j); w += p-j } return s/w });
const hma = (vals, p) => { const h = Math.max(1, Math.round(p/2)), q = Math.max(1, Math.round(Math.sqrt(p))); const a = wma(vals, h), b = wma(vals, p); return wma(a.map((x,i) => x == null || b[i] == null ? null : 2*x - b[i]), q) };
const maBy = (type, v, p) => type === 'EMA' ? ema(v,p) : type === 'WMA' ? wma(v,p) : type === 'HMA' ? hma(v,p) : type === 'RMA' ? rma(v,p) : sma(v,p);
const hiN = (c, i, n, k='high') => { let m = -Infinity; for(let j = Math.max(0, i-n+1); j <= i; j++) m = Math.max(m, c[j][k]); return m };
const loN = (c, i, n, k='low') => { let m = Infinity; for(let j = Math.max(0, i-n+1); j <= i; j++) m = Math.min(m, c[j][k]); return m };

  ICHI:{ label:'일목균형표', overlay:true, params:{conv:9, base:26, span:52, disp:26}, colors:['#4aa3ff',D(1),U(1),'#f0a33b','#b38cff'],

  PSAR:{ label:'파라볼릭 SAR', overlay:true, params:{start:0.02, inc:0.02, max:0.2}, colors:['#f0b90b'], series:[{key:'s',type:'dots',name:'SAR'}], title:p=>`SAR ${p.start} ${p.inc} ${p.max}`,

    calc:(c,p,st) => { const n = +p.period, atr = rma(trueRange(c), n), up = (st && st.fill.color) || U(0.5), dn = (st && st.fill.color2) || D(0.5);
      const solid = x => x.replace(/rgba\(([^,]+),([^,]+),([^,]+),[^)]+\)/, 'rgb($1,$2,$3)');

  EW:{ label:'엘리어트 파동', overlay:true, params:{len:5, fib:1}, colors:['rgba(140,150,165,0.55)'], series:[{key:'zz',type:'line',name:'지그재그'}], width:1,
    fill:{kind:'ew', key:'_ew', color:U(1), color2:D(1)}, title:p=>`엘리어트 파동 ${p.len}`,
    /* 고점·저점(앞뒤 len봉 중 가장 높고 낮은 봉)을 이어 지그재그를 만들고, 그 안에서 규칙에 맞는 5파(1~5)와 뒤따르는 조정파(a·b·c)를 찾아요.
       규칙: 2파는 1파 시작점 아래로 안 내려가고, 3파가 1·3·5파 중 가장 짧지 않고, 4파는 1파 끝과 겹치지 않아요 (하락 파동은 반대로) */
    calc:(c,p) => { const n = Math.max(2, Math.round(+p.len)), P = [];
      for(let i = n; i < c.length - n; i++){ let hi = true, lo = true;
        for(let k = i - n; k <= i + n; k++){ if(k === i) continue; if(c[k].high > c[i].high) hi = false; if(c[k].low < c[i].low) lo = false }
        const add = (t, price) => { const L = P[P.length - 1]; if(L && L.t === t){ if(t > 0 ? price > L.p : price < L.p){ L.p = price; L.i = i } return } P.push({ t, p:price, i }) };
        if(hi) add(1, c[i].high); if(lo) add(-1, c[i].low) }
      const zz = P.map(x => ({ time:c[x.i].time, value:x.p })), waves = [];
      for(let k = 0; k + 5 < P.length; k++){ const q = P.slice(k, k + 6), s = q[0].t < 0 ? 1 : -1, v = q.map(x => x.p * s);
        if(q[1].t !== s) continue;
        const w1 = v[1] - v[0], w3 = v[3] - v[2], w5 = v[5] - v[4];
        if(!(w1 > 0 && w3 > 0 && w5 > 0 && v[2] > v[0] && v[3] > v[1] && v[4] > v[1] && v[5] > v[3] && w3 >= Math.min(w1, w5))) continue;
        const pts = q.map((x, j) => ({ time:c[x.i].time, price:x.p, label: j ? String(j) : '' }));
        const r = P.slice(k + 6, k + 9), abc = [];
        if(r.length && r[0].p * s < v[5]) r.forEach((x, j) => { if(j === 1 && x.p * s > v[5]) return; abc.push({ time:c[x.i].time, price:x.p, label:'abc'[j] }) });
        waves.push({ bull: s > 0, pts, abc }); k += 4 + abc.length }
      const last = waves[waves.length - 1], fibs = [];
      if(last && +p.fib){ const a = last.pts[0].price, b = last.pts[5].price; [0.5, 0.618, 0.764, 0.854].forEach(f => fibs.push({ f, p: b - (b - a) * f })) }
      return { zz, _ew:{ waves, fibs, from: last ? last.pts[5].time : null } } } },

  ADX:{ label:'ADX / DMI', overlay:false, params:{period:14}, colors:['#f0b90b',U(1),D(1)], series:[{key:'a',type:'line',name:'ADX'},{key:'p',type:'line',name:'+DI'},{key:'m',type:'line',name:'−DI'}], levels:[25], title:p=>`ADX ${p.period}`,

      const tr = rma(trueRange(c), n), P = rma(pd, n), M = rma(md, n);
      const pi = P.map((x,i) => x==null||!tr[i] ? null : 100*x/tr[i]), mi = M.map((x,i) => x==null||!tr[i] ? null : 100*x/tr[i]);
      const dx = pi.map((x,i) => x==null||mi[i]==null||x+mi[i]===0 ? null : 100*Math.abs(x-mi[i])/(x+mi[i]));
      return { a:toSeries(c, rma(dx, n)), p:toSeries(c, pi), m:toSeries(c, mi) } } },
  STOCH:{ label:'스토캐스틱', overlay:false, params:{k:14, smooth:3, d:3}, colors:['#4aa3ff','#f0a33b'], series:[{key:'k',type:'line',name:'%K'},{key:'d',type:'line',name:'%D'}], levels:[80,20],
    fill:{kind:'levels', a:0, b:1, color:'rgba(74,163,255,0.07)'}, title:p=>`Stoch ${p.k} ${p.smooth} ${p.d}`,
    calc:(c,p) => { const raw = c.map((b,i) => { if(i < +p.k-1) return null; const h = hiN(c,i,+p.k), l = loN(c,i,+p.k); return h===l ? 50 : (b.close-l)/(h-l)*100 });
      const k = smaN(raw, +p.smooth), d = smaN(k, +p.d); return { k:toSeries(c,k), d:toSeries(c,d) } } },
  CCI:{ label:'CCI', overlay:false, params:{period:20}, colors:['#2ec4b6'], series:[{key:'c',type:'line'}], levels:[100,0,-100], fill:{kind:'levels', a:0, b:2, color:'rgba(46,196,182,0.07)'}, title:p=>`CCI ${p.period}`,
    calc:(c,p) => { const n = +p.period, tp = src(c,'hlc3'), m = sma(tp, n);
      return { c: toSeries(c, tp.map((x,i) => { if(m[i]==null) return null; let md = 0; for(let j=i-n+1;j<=i;j++) md += Math.abs(tp[j]-m[i]); md /= n; return md ? (x-m[i])/(0.015*md) : 0 })) } } },
  WR:{ label:'윌리엄스 %R', overlay:false, params:{period:14}, colors:['#b38cff'], series:[{key:'w',type:'line'}], levels:[-20,-50,-80], fill:{kind:'levels', a:0, b:2, color:'rgba(126,87,194,0.08)'}, title:p=>`%R ${p.period}`,
    calc:(c,p) => ({ w: toSeries(c, c.map((b,i) => { if(i < +p.period-1) return null; const h = hiN(c,i,+p.period), l = loN(c,i,+p.period); return h===l ? -50 : (h-b.close)/(h-l)*-100 })) }) },
  MFI:{ label:'MFI (자금 흐름 지수)', overlay:false, params:{period:14}, colors:['#ff7aa8'], series:[{key:'m',type:'line'}], levels:[80,20], fill:{kind:'levels', a:0, b:1, color:'rgba(255,122,168,0.07)'}, title:p=>`MFI ${p.period}`,
    calc:(c,p) => { const n = +p.period, tp = src(c,'hlc3');
      return { m: toSeries(c, c.map((b,i) => { if(i < n) return null; let po = 0, ne = 0; for(let j=i-n+1;j<=i;j++){ const f = tp[j]*c[j].volume; if(tp[j] > tp[j-1]) po += f; else if(tp[j] < tp[j-1]) ne += f } return ne ? 100 - 100/(1+po/ne) : 100 })) } } },
  ROC:{ label:'ROC (변화율 %)', overlay:false, params:{period:9}, colors:['#4aa3ff'], series:[{key:'r',type:'line'}], levels:[0], title:p=>`ROC ${p.period}`,
    calc:(c,p) => ({ r: toSeries(c, c.map((b,i) => i < +p.period ? null : (b.close/c[i-p.period].close - 1)*100)) }) },
  MOM:{ label:'모멘텀', overlay:false, params:{period:10}, colors:['#f0a33b'], series:[{key:'m',type:'line'}], levels:[0], title:p=>`MOM ${p.period}`,
    calc:(c,p) => ({ m: toSeries(c, c.map((b,i) => i < +p.period ? null : b.close - c[i-p.period].close)) }) },
  AO:{ label:'오썸 오실레이터', overlay:false, params:{}, colors:[U(1)], series:[{key:'a',type:'hist'}], levels:[0], title:()=>'AO',
    calc:c => { const m = src(c,'hl2'), f = sma(m,5), s = sma(m,34); return { a: colorBars(toSeries(c, f.map((x,i)=>x==null||s[i]==null?null:x-s[i])), (d,i,a) => !i || d.value >= a[i-1].value) } } },
  TRIX:{ label:'TRIX', overlay:false, params:{period:18}, colors:['#e05bd6'], series:[{key:'t',type:'line'}], levels:[0], title:p=>`TRIX ${p.period}`,
    calc:(c,p) => { const e = ema(ema(ema(src(c,'close'),+p.period),+p.period),+p.period); return { t: toSeries(c, e.map((x,i)=>x==null||!e[i-1]?null:(x/e[i-1]-1)*10000)) } } },
  AROON:{ label:'아룬', overlay:false, params:{period:14}, colors:[U(1),D(1)], series:[{key:'u',type:'line',name:'아룬 업'},{key:'d',type:'line',name:'아룬 다운'}], title:p=>`Aroon ${p.period}`,
    calc:(c,p) => { const n = +p.period, u = [], d = []; c.forEach((b,i) => { if(i < n) return; let hi = i, lo = i; for(let j=i-n;j<=i;j++){ if(c[j].high >= c[hi].high) hi = j; if(c[j].low <= c[lo].low) lo = j }
      u.push({time:b.time, value:100*(n-(i-hi))/n}); d.push({time:b.time, value:100*(n-(i-lo))/n}) }); return { u, d } } },
  CHOP:{ label:'초피니스 (횡보 지수)', overlay:false, params:{period:14}, colors:['#8aa0b8'], series:[{key:'c',type:'line'}], levels:[61.8,38.2], fill:{kind:'levels', a:0, b:1, color:'rgba(138,160,184,0.08)'}, title:p=>`CHOP ${p.period}`,
    calc:(c,p) => { const n = +p.period, tr = trueRange(c); return { c: toSeries(c, c.map((b,i) => { if(i < n) return null; let s = 0; for(let j=i-n+1;j<=i;j++) s += tr[j]; const r = hiN(c,i,n)-loN(c,i,n); return r ? 100*Math.log10(s/r)/Math.log10(n) : null })) } } },
  BBW:{ label:'볼린저 밴드 폭', overlay:false, params:{period:20, mult:2}, colors:['#4aa3ff'], series:[{key:'w',type:'line'}], title:p=>`BBW ${p.period}`,
    calc:(c,p) => { const v = src(c,'close'), m = sma(v,+p.period), sd = stdev(v,+p.period,m); return { w: toSeries(c, m.map((x,i)=>x==null?null:2*p.mult*sd[i]/x*100)) } } },
  BBP:{ label:'볼린저 %B', overlay:false, params:{period:20, mult:2}, colors:['#4aa3ff'], series:[{key:'b',type:'line'}], levels:[1,0.5,0], fill:{kind:'levels', a:0, b:2, color:'rgba(74,163,255,0.07)'}, title:p=>`%B ${p.period}`,
    calc:(c,p) => { const v = src(c,'close'), m = sma(v,+p.period), sd = stdev(v,+p.period,m); return { b: toSeries(c, m.map((x,i)=>x==null||!sd[i]?null:(v[i]-(x-p.mult*sd[i]))/(2*p.mult*sd[i]))) } } },
  HV:{ label:'역사적 변동성 (연율 %)', overlay:false, params:{period:20}, colors:['#ff9f43'], series:[{key:'h',type:'line'}], title:p=>`HV ${p.period}`,
    calc:(c,p) => { const r = c.map((b,i) => i ? Math.log(b.close/c[i-1].close) : 0), n = +p.period, per = c.length > 1 ? (c[1].time-c[0].time) : 86400, ann = Math.sqrt(365*86400/per);
      return { h: toSeries(c, r.map((x,i) => { if(i < n) return null; let m = 0; for(let j=i-n+1;j<=i;j++) m += r[j]; m /= n; let s = 0; for(let j=i-n+1;j<=i;j++) s += (r[j]-m)**2; return Math.sqrt(s/(n-1))*ann*100 })) } } },
  CMF:{ label:'차이킨 자금 흐름', overlay:false, params:{period:20}, colors:[U(1)], series:[{key:'c',type:'line'}], levels:[0], title:p=>`CMF ${p.period}`,
    calc:(c,p) => { const n = +p.period, mf = c.map(b => b.high===b.low ? 0 : ((b.close-b.low)-(b.high-b.close))/(b.high-b.low)*b.volume);
      return { c: toSeries(c, c.map((b,i) => { if(i < n-1) return null; let a = 0, v = 0; for(let j=i-n+1;j<=i;j++){ a += mf[j]; v += c[j].volume } return v ? a/v : 0 })) } } },
  VOLMA:{ label:'거래량 + 이동평균', overlay:false, params:{period:20}, colors:['#8aa0b8','#f0b90b'], series:[{key:'v',type:'hist',name:'거래량'},{key:'m',type:'line',name:'이동평균'}], title:p=>`거래량 MA ${p.period}`,

  DELTA:{ label:'봉별 체결 델타 (매수−매도)', overlay:false, params:{}, colors:[U(1)], series:[{key:'d',type:'hist'}], levels:[0], title:()=>'Delta',

    title:p => `CVD${p.reset === '일간' ? ' (일간)' : ''}`,

<script>

(() => {
